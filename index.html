                            <strong>ตรวจสอบกำลังรับน้ำหนัก:</strong> q<Sub text="max"/> ({calc.q_max.toFixed(0)}) {calc.q_max <= base.q_allow ? <span className="text-emerald-600 font-bold">&le; q<Sub text="allow"/> ({base.q_allow}) ผ่านเกณฑ์</span> : <span className="text-rose-600 font-bold">{">"} q<Sub text="allow"/> ({base.q_allow}) ไม่ผ่านเกณฑ์ ดินทรุดตัว!</span>}
                        </div>
                    </StepBox>
                </div>
            );

            const TabManual = () => (
                <div className="space-y-6">
                    {/* ส่วนรูปกราฟิก */}
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <h3 className="font-bold text-lg text-slate-700 mb-6 border-b pb-2">แผนภาพการกระจายแรง (Pressure Diagrams)</h3>
                        <div className="flex flex-col md:flex-row justify-around items-center space-y-8 md:space-y-0">
                            
                            {/* Lateral Pressure Diagram */}
                            <div className="text-center">
                                <h4 className="font-medium text-slate-600 mb-2">แรงดันดินด้านข้าง (Active Pressure)</h4>
                                <svg width="250" height="300" viewBox="0 0 250 300" className="border border-slate-100 rounded bg-slate-50">
                                    <line x1="200" y1="20" x2="200" y2="280" stroke="#475569" strokeWidth="4" />
                                    <polygon points="200,20 150,20 150,280 200,280" fill="rgba(14, 165, 233, 0.1)" stroke="#0ea5e9" strokeWidth="1" strokeDasharray="4" />
                                    <polygon points="200,20 50,280 200,280" fill="rgba(56, 189, 248, 0.3)" stroke="#0284c7" strokeWidth="2" />
                                    <g stroke="#0284c7" strokeWidth="1" markerEnd="url(#arrowhead)">
                                        <line x1="150" y1="100" x2="195" y2="100" />
                                        <line x1="100" y1="200" x2="195" y2="200" />
                                        <line x1="60" y1="260" x2="195" y2="260" />
                                    </g>
                                    <text x="120" y="295" fontSize="12" fill="#0f172a" textAnchor="middle">Pressure (p)</text>
                                    <text x="210" y="150" fontSize="12" fill="#0f172a" textAnchor="start" transform="rotate(90, 210, 150)">Depth (z)</text>
                                    <defs>
                                        <marker id="arrowhead" markerWidth="5" markerHeight="4" refX="0" refY="2" orient="auto">
                                            <polygon points="0 0, 5 2, 0 4" fill="#0284c7" />
                                        </marker>
                                    </defs>
                                </svg>
                            </div>

                            {/* Bearing Pressure Diagram */}
                            <div className="text-center">
                                <h4 className="font-medium text-slate-600 mb-2">แรงอัดใต้ฐานราก (Bearing Pressure)</h4>
                                <svg width="300" height="200" viewBox="0 0 300 200" className="border border-slate-100 rounded bg-slate-50">
                                    <rect x="30" y="50" width="240" height="20" fill="#cbd5e1" stroke="#475569" strokeWidth="2" />
                                    <polygon points="30,70 270,70 270,120 30,170" fill="rgba(244, 63, 94, 0.2)" stroke="#e11d48" strokeWidth="2" />
                                    <g stroke="#e11d48" strokeWidth="1" markerEnd="url(#arrowup)">
                                        <line x1="40" y1="165" x2="40" y2="75" />
                                        <line x1="150" y1="140" x2="150" y2="75" />
                                        <line x1="260" y1="115" x2="260" y2="75" />
                                    </g>
                                    <text x="40" y="185" fontSize="12" fill="#9f1239" textAnchor="middle" fontWeight="bold">q_max</text>
                                    <text x="260" y="135" fontSize="12" fill="#9f1239" textAnchor="middle" fontWeight="bold">q_min</text>
                                    <text x="30" y="40" fontSize="12" fill="#475569" textAnchor="middle">Toe</text>
                                    <text x="270" y="40" fontSize="12" fill="#475569" textAnchor="middle">Heel</text>
                                    <defs>
                                        <marker id="arrowup" markerWidth="5" markerHeight="4" refX="2.5" refY="0" orient="auto">
                                            <polygon points="0 4, 2.5 0, 5 4" fill="#e11d48" />
                                        </marker>
                                    </defs>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-sm text-slate-700 leading-relaxed space-y-4">
                        <h3 className="font-bold text-lg text-slate-800 border-b pb-2">ความหมายของตัวแปรที่ใช้ในการคำนวณ</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <h4 className="font-semibold text-slate-700 mb-2">มิติโครงสร้างกำแพงกันดิน</h4>
                                <ul className="list-disc pl-5 space-y-1 text-slate-600">
                                    <li><strong>H:</strong> ความสูงของกำแพงกันดินส่วนที่อยู่เหนือฐานราก (Stem)</li>
                                    <li><strong>T1:</strong> ความหนาของฐานราก (Base Footing)</li>
                                    <li><strong>C:</strong> ระยะยื่นของฐานรากด้านหน้า (Toe)</li>
                                    <li><strong>D:</strong> ความกว้างของโคนกำแพง (Stem Bottom)</li>
                                    <li><strong>G:</strong> ความกว้างของยอดกำแพง (Stem Top)</li>
                                    <li><strong>F:</strong> ระยะยื่นของฐานรากด้านหลัง (Heel)</li>
                                    <li><strong>B:</strong> ความกว้างของฐานรากรวม (B = C + D + F)</li>
                                    <li><strong>m:</strong> ระยะลาดเอียงของกำแพงด้านหน้า (m = D - G)</li>
                                    <li><strong>d2:</strong> ความลึกของชั้นดินแห้ง (อยู่เหนือระดับน้ำ)</li>
                                    <li><strong>d3:</strong> ความลึกของชั้นดินเปียก (อยู่ใต้ระดับน้ำ)</li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-semibold text-slate-700 mb-2">พารามิเตอร์ดินและวัสดุ</h4>
                                <ul className="list-disc pl-5 space-y-1 text-slate-600">
                                    <li><strong>&gamma;<Sub text="compact"/>:</strong> หน่วยน้ำหนักดินอัดแน่น (เหนือระดับน้ำ)</li>
                                    <li><strong>&gamma;<Sub text="sat"/>:</strong> หน่วยน้ำหนักดินอิ่มตัวด้วยน้ำ (ใต้ระดับน้ำ)</li>
                                    <li><strong>&gamma;<Sub text="w"/>:</strong> หน่วยน้ำหนักของน้ำ (1000 กก./ม.&sup3;)</li>
                                    <li><strong>&gamma;<Sub text="sub"/>:</strong> หน่วยน้ำหนักดินจมตัว (&gamma;<Sub text="sat"/> - &gamma;<Sub text="w"/>)</li>
                                    <li><strong>&phi; (Phi):</strong> มุมเสียดทานภายในของดิน</li>
                                    <li><strong>Ka:</strong> สัมประสิทธิ์แรงดันดินรุก (Active Earth Pressure)</li>
                                    <li><strong>f:</strong> สัมประสิทธิ์ความเสียดทานระหว่างดินกับก้นฐานราก</li>
                                    <li><strong>q<Sub text="allow"/>:</strong> กำลังรับน้ำหนักปลอดภัยของดิน</li>
                                    <li><strong>Surcharge:</strong> น้ำหนักบรรทุกจรที่กดทับบนผิวดิน</li>
                                </ul>
                            </div>
                            <div className="md:col-span-2">
                                <h4 className="font-semibold text-slate-700 mb-2 mt-4">แรงและผลการคำนวณ</h4>
                                <ul className="list-disc pl-5 space-y-1 text-slate-600 grid grid-cols-1 md:grid-cols-2 gap-x-4">
                                    <li><strong>P1 - P4:</strong> แรงผลักด้านข้างที่พยายามดันกำแพงให้ล้ม</li>
                                    <li><strong>W1 - W8:</strong> น้ำหนักของคอนกรีตและดินที่กดทับเพื่อต้านทานการล้ม</li>
                                    <li><strong>&Sigma;P:</strong> ผลรวมแรงผลักด้านข้างทั้งหมด (Driving Forces)</li>
                                    <li><strong>&Sigma;V:</strong> ผลรวมแรงต้านทานแนวดิ่งทั้งหมด (Resisting Forces)</li>
                                    <li><strong>&Sigma;M<Sub text="O"/>:</strong> โมเมนต์พลิกคว่ำรอบจุดหมุน (Toe)</li>
                                    <li><strong>&Sigma;M<Sub text="R"/>:</strong> โมเมนต์ต้านทานรอบจุดหมุน (Toe)</li>
                                    <li><strong>F.S.<Sub text="OT"/>:</strong> อัตราส่วนความปลอดภัยต่อการพลิกคว่ำ (Overturning)</li>
                                    <li><strong>F.S.<Sub text="Slide"/>:</strong> อัตราส่วนความปลอดภัยต่อการลื่นไถล (Sliding)</li>
                                    <li><strong>e:</strong> ระยะเยื้องศูนย์ของแรงลัพธ์ที่กระทำใต้ฐานราก</li>
                                    <li><strong>q<Sub text="max"/> / q<Sub text="min"/>:</strong> หน่วยแรงอัดสูงสุดและต่ำสุดใต้ฐานราก</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-sm text-slate-700 leading-relaxed space-y-4">
                        <h3 className="font-bold text-lg text-slate-800 border-b pb-2">คู่มือและอภิธานศัพท์เพิ่มเติม</h3>
                        <div>
                            <strong className="text-blue-700">กฎ Middle-Third:</strong><br/>
                            เพื่อป้องกันไม่ให้เกิดแรงดึง (Tension) ใต้ฐานราก ระยะเยื้องศูนย์ (e) ของแรงลัพธ์จะต้องไม่เกิน 1/6 ของความกว้างฐานรากรวม (B/6) หาก e {">"} B/6 ดินฝั่ง Heel จะไม่สัมผัสฐานราก ทำให้พื้นที่รับแรงลดลงและ q<Sub text="max"/> พุ่งสูงขึ้นมาก
                        </div>
                        <div>
                            <strong className="text-blue-700">แนวคิดน้ำหนักจมตัว (Submerged Unit Weight, &gamma;<Sub text="sub"/>):</strong><br/>
                            เมื่อดินอยู่ใต้ระดับน้ำใต้ดิน แรงลอยตัว (Buoyancy) ของน้ำจะพยุงเม็ดดินไว้ ทำให้แรงกดทับจากดินลดลง ค่า &gamma;<Sub text="sub"/> คำนวณจาก &gamma;<Sub text="sat"/> - &gamma;<Sub text="water"/> แต่ในขณะเดียวกัน แรงดันของน้ำ (Hydrostatic pressure) จะเข้ามากระทำเต็มที่ต่อกำแพงแทน
                        </div>
                        <div>
                            <strong className="text-blue-700">การแบ่งตัวแปรมิติใหม่ (อิงตามรูป):</strong><br/>
                            โปรแกรมได้ปรับให้รองรับการป้อนค่า <strong>C, D, G, F</strong> โดยเฉพาะ โดยหากกรอกให้ G = D ฐานรากจะกลายเป็นรูปสี่เหลี่ยมมุมฉากปกติ และรายการคำนวณ W3 และ W5 (ที่เป็นส่วนประกอบของรูปสามเหลี่ยม) จะมีค่าเป็นศูนย์ไปโดยอัตโนมัติ
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto pb-12 font-sans">
                    {GlobalNav()}
                    
                    <div className="p-4 md:p-6">
                        <header className="mb-6">
                            <h1 className="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">Retaining Wall Stability Analysis</h1>
                            <p className="text-slate-500 text-sm mt-1">โปรแกรมวิเคราะห์เสถียรภาพและแรงดันดินใต้ฐานรากกำแพงกันดิน (Metric Unit)</p>
                        </header>

                        {GlobalInputs()}

                        <div className="flex overflow-x-auto no-scrollbar border-b border-slate-300 mb-6 space-x-1">
                            {[
                                { id: 'dashboard', label: 'หน้าปัดสรุปผล' },
                                { id: 'driving', label: 'แรงผลัก (Driving)' },
                                { id: 'resisting', label: 'แรงต้าน (Resisting)' },
                                { id: 'stability', label: 'ตรวจสอบเสถียรภาพ' },
                                { id: 'bearing', label: 'แรงดันดินใต้ฐาน' },
                                { id: 'manual', label: 'คู่มือและรูปกราฟิก' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-4 py-3 text-sm whitespace-nowrap transition-colors ${activeTab === tab.id ? 'tab-active bg-white rounded-t-lg' : 'tab-inactive bg-slate-50 rounded-t-lg hover:bg-slate-100'}`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <main>
                            {activeTab === 'dashboard' && TabDashboard()}
                            {activeTab === 'driving' && TabDriving()}
                            {activeTab === 'resisting' && TabResisting()}
                            {activeTab === 'stability' && TabStability()}
                            {activeTab === 'bearing' && TabBearing()}
                            {activeTab === 'manual' && TabManual()}
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
