                                <span className="text-xs text-slate-600 font-medium bg-slate-100 print:bg-transparent px-3 py-1 rounded-full border border-slate-200 print:border-none">ความกว้างฐานรวม (B) = <span className="font-bold text-blue-600">{calc.B.toFixed(2)} ม.</span></span>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 print:grid-cols-2 gap-x-6 gap-y-2">
                                <InputRow label="สูง (H)" value={geom.H} onChange={handleNum(setGeom, 'H')} unit="ม." />
                                <InputRow label="ยื่นหน้า Toe (C)" value={geom.C} onChange={handleNum(setGeom, 'C')} unit="ม." />
                                <InputRow label="กว้างยอดกำแพง (G)" value={geom.G} onChange={handleNum(setGeom, 'G')} unit="ม." />
                                <InputRow label="ระดับน้ำจากผิวดิน" value={geom.waterDepth} onChange={handleNum(setGeom, 'waterDepth')} unit="ม." bgClass="bg-blue-50 border-blue-100 print:bg-transparent print:border-transparent" />
                                <InputRow label="หนาฐาน (T1)" value={geom.T1} onChange={handleNum(setGeom, 'T1')} unit="ม." />
                                <InputRow label="กว้างฐานล่าง (D)" value={geom.D} onChange={handleNum(setGeom, 'D')} unit="ม." />
                                <InputRow label="ยื่นหลัง Heel (F)" value={geom.F} onChange={handleNum(setGeom, 'F')} unit="ม." />
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 print:p-4 print:break-inside-avoid">
                            <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 border-b border-slate-100 pb-3 print:mb-3">พารามิเตอร์การออกแบบดินและน้ำหนัก (Soil & Load Parameters)</h3>
                            <div className="grid grid-cols-1 sm:grid-cols-2 print:grid-cols-2 gap-x-6 gap-y-2">
                                <InputRow label={<span>&gamma;<Sub text="c"/> (กดทับ)</span>} value={soil.gamma_c} onChange={handleNum(setSoil, 'gamma_c')} unit={<span>กก./ม.&sup3;</span>} />
                                <InputRow label={<span>&gamma;<Sub text="sat"/> (อิ่มตัว)</span>} value={soil.gamma_sat} onChange={handleNum(setSoil, 'gamma_sat')} unit={<span>กก./ม.&sup3;</span>} />
                                <InputRow label="ความยาวคำนวณ (L)" value={designLength} onChange={(e) => setDesignLength(parseFloat(e.target.value)||1)} unit="ม." />
                                
                                <InputRow label={<span>มุมเสียดทานดินถม &phi;<Sub text="backfill"/></span>} value={soil.phi_backfill} onChange={handleNum(setSoil, 'phi_backfill')} unit="องศา" warning={(soil.phi_backfill < 15 || soil.phi_backfill > 45) ? "ค่าแปลก" : null} />
                                <InputRow label={<span>มุมเสียดทานดินใต้ฐาน &phi;<Sub text="base"/></span>} value={soil.phi_base} onChange={handleNum(setSoil, 'phi_base')} unit="องศา" warning={(soil.phi_base < 15 || soil.phi_base > 45) ? "ค่าแปลก" : null} />
                                
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between py-2 px-3 rounded-md transition-colors border border-transparent bg-slate-50 print:flex-row print:items-center print:py-1 print:px-1">
                                    <span className="text-slate-700 text-sm mb-1 sm:mb-0 mr-2 flex-1 leading-tight whitespace-nowrap">สัมประสิทธิ์ไถล (f)</span>
                                    <div className="flex items-center flex-shrink-0 self-start sm:self-auto">
                                        <div className="w-20 sm:w-24 p-1.5 border border-slate-300 rounded text-right text-sm bg-slate-100 text-blue-700 font-bold shadow-sm print:shadow-none print:p-1 print:border-none print:bg-transparent">
                                            {calc.f_calc.toFixed(3)}
                                        </div>
                                        <span className="text-slate-500 ml-2 text-[10px] whitespace-nowrap min-w-[2.5rem] text-left leading-tight">หล่อในที่<br/>tan(&phi;<Sub text="base"/>)</span>
                                    </div>
                                </div>

                                <InputRow label="Surcharge (จร)" value={surcharge} onChange={(e) => setSurcharge(parseFloat(e.target.value)||0)} unit={<span>กก./ม.&sup2;</span>} bgClass="bg-amber-50 border-amber-100 print:bg-transparent print:border-transparent" />
                                <InputRow label={<span>q<Sub text="allow"/> ดินเดิม</span>} value={base.q_allow} onChange={handleNum(setBase, 'q_allow')} unit={<span>กก./ม.&sup2;</span>} />
                                <InputRow label={<span>&gamma;<Sub text="concrete"/></span>} value={gamma_conc} onChange={(e) => setGammaConc(parseFloat(e.target.value) || 0)} unit={<span>กก./ม.&sup3;</span>} />
                            </div>
                        </div>

                        {/* ═══ สมมติฐานการวิเคราะห์ (แก้ไขประเด็น C1, C4, C6 + เกณฑ์ F.S.) ═══ */}
                        <div className="bg-white rounded-xl shadow-sm border-t-4 border-rose-500 border-x border-b border-slate-200 p-5 print:p-4 print:break-inside-avoid">
                            <h3 className="text-sm font-bold text-rose-800 uppercase tracking-wider mb-4 border-b border-rose-100 pb-3 print:mb-3">สมมติฐานการวิเคราะห์ (Analysis Assumptions)</h3>

                            <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">

                                {/* ── แรงดันดิน ── */}
                                <div className="bg-slate-50 print:bg-transparent p-4 print:p-0 rounded-lg border border-slate-100 print:border-none">
                                    <h4 className="text-sm font-bold text-slate-700 mb-3 border-b border-slate-200 pb-2 print:pb-1">1. สัมประสิทธิ์แรงดันดิน</h4>
                                    <select
                                        className="w-full text-sm p-2 border border-slate-300 rounded bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-400 no-print"
                                        value={pressureMode}
                                        onChange={(e) => setPressureMode(e.target.value)}>
                                        <option value="auto">อัตโนมัติ (K&#8320; เมื่อใช้เสาเข็ม / K&#8336; เมื่อไม่ใช้)</option>
                                        <option value="ka">K&#8336; Active = tan&sup2;(45 - &phi;/2)</option>
                                        <option value="k0">K&#8320; At-rest = 1 - sin &phi;</option>
                                    </select>
                                    <div className="mt-3 grid grid-cols-3 gap-2 text-center text-xs">
                                        <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200">
                                            <div className="text-slate-500">K&#8336;</div>
                                            <div className="font-bold text-slate-700">{calc.K_active.toFixed(3)}</div>
                                        </div>
                                        <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200">
                                            <div className="text-slate-500">K&#8320;</div>
                                            <div className="font-bold text-slate-700">{calc.K_rest.toFixed(3)}</div>
                                        </div>
                                        <div className="bg-rose-50 print:bg-transparent p-2 rounded border border-rose-200">
                                            <div className="text-rose-500">ที่ใช้จริง</div>
                                            <div className="font-bold text-rose-700">{calc.Ka.toFixed(3)}</div>
                                        </div>
                                    </div>
                                    <div className="mt-2 text-[11px] leading-snug text-slate-500">
                                        กำลังใช้ <strong className="text-rose-700">{calc.K_mode === 'k0' ? 'K₀ (At-rest)' : 'Kₐ (Active)'}</strong>
                                        {calc.K_mode === 'k0'
                                            ? ' — กำแพงถูกยึดไม่ให้ขยับ จึงยังไม่เกิดสภาวะ Active'
                                            : ' — สมมติว่ากำแพงขยับได้ราว 0.001-0.004H'}
                                    </div>
                                    {pile.usePiles && calc.K_mode === 'ka' && (
                                        <div className="mt-2 text-[11px] leading-snug bg-rose-50 border border-rose-200 text-rose-700 rounded p-2 no-print">
                                            <strong>คำเตือน:</strong> เปิดใช้เสาเข็มอยู่แต่เลือก K&#8336; กำแพงบนเสาเข็มขยับไม่พอที่จะเกิดสภาวะ Active
                                            แรงผลักจะถูกประเมินต่ำไปราว {(100 * (calc.K_rest / Math.max(calc.K_active, 1e-9) - 1)).toFixed(0)}%
                                        </div>
                                    )}
                                </div>

                                {/* ── Uplift ── */}
                                <div className="bg-slate-50 print:bg-transparent p-4 print:p-0 rounded-lg border border-slate-100 print:border-none">
                                    <h4 className="text-sm font-bold text-slate-700 mb-3 border-b border-slate-200 pb-2 print:pb-1">2. แรงดันน้ำยกใต้ฐานราก (Uplift)</h4>
                                    <label className="flex items-center space-x-3 cursor-pointer mb-3">
                                        <input type="checkbox" className="w-5 h-5 accent-rose-600 rounded"
                                            checked={useUplift}
                                            onChange={(e) => setUseUplift(e.target.checked)} />
                                        <span className="text-sm text-slate-700 font-medium">คิดแรงดันน้ำยกใต้ฐานราก</span>
                                    </label>
                                    <select
                                        className="w-full text-sm p-2 border border-slate-300 rounded bg-white text-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-400 disabled:bg-slate-100 disabled:text-slate-400 no-print"
                                        value={upliftMode} disabled={!useUplift}
                                        onChange={(e) => setUpliftMode(e.target.value)}>
                                        <option value="full">เต็มค่า สม่ำเสมอ (ไม่มีระบบระบายน้ำ)</option>
                                        <option value="seepage">สามเหลี่ยม ลดเป็น 0 ที่ Toe (มีชั้นระบายน้ำ)</option>
                                    </select>
                                    <div className="mt-3 grid grid-cols-3 gap-2 text-center text-xs">
                                        <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200">
                                            <div className="text-slate-500">u ที่ Toe</div>
                                            <div className="font-bold text-slate-700">{calc.u_toe.toFixed(0)}</div>
                                        </div>
                                        <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200">
                                            <div className="text-slate-500">u ที่ Heel</div>
                                            <div className="font-bold text-slate-700">{calc.u_heel.toFixed(0)}</div>
                                        </div>
                                        <div className="bg-rose-50 print:bg-transparent p-2 rounded border border-rose-200">
                                            <div className="text-rose-500">U รวม</div>
                                            <div className="font-bold text-rose-700">{calc.U.toFixed(0)} กก.</div>
                                        </div>
                                    </div>
                                    {!useUplift && calc.h_w > 0 && (
                                        <div className="mt-2 text-[11px] leading-snug bg-rose-50 border border-rose-200 text-rose-700 rounded p-2 no-print">
                                            <strong>คำเตือน:</strong> มีน้ำสูง {calc.h_w.toFixed(2)} ม. เหนือก้นฐานราก แต่ปิดการคิด Uplift อยู่
                                            การใช้ &gamma;<Sub text="sat"/> คิดน้ำหนักดินโดยไม่ใส่ Uplift = นับน้ำหนักน้ำเป็นแรงต้าน ผลลัพธ์จะไม่ปลอดภัย
                                        </div>
                                    )}
                                    {useUplift && calc.U > 0 && (
                                        <div className="mt-2 text-[11px] leading-snug text-slate-500">
                                            U = {(100 * calc.U / Math.max(calc.sumV, 1e-9)).toFixed(0)}% ของ &Sigma;V &nbsp;|&nbsp; แขนโมเมนต์ x<Sub text="U"/> = {calc.x_U.toFixed(3)} ม.
                                        </div>
                                    )}
                                </div>

                                {/* ── เกณฑ์ F.S. ── */}
                                <div className="bg-slate-50 print:bg-transparent p-4 print:p-0 rounded-lg border border-slate-100 print:border-none">
                                    <h4 className="text-sm font-bold text-slate-700 mb-3 border-b border-slate-200 pb-2 print:pb-1">3. เกณฑ์อัตราส่วนความปลอดภัย</h4>
                                    <InputRow label="F.S. พลิกคว่ำ ขั้นต่ำ" value={fsOtReq} onChange={(e) => setFsOtReq(parseFloat(e.target.value) || 0)} unit="" />
                                    <InputRow label="F.S. ลื่นไถล ขั้นต่ำ" value={fsSlideReq} onChange={(e) => setFsSlideReq(parseFloat(e.target.value) || 0)} unit="" />
                                    <div className="mt-2 text-[11px] leading-snug text-slate-500">
                                        ตำราส่วนใหญ่ (Das, Bowles) ใช้ F.S. พลิกคว่ำ 2.0-3.0 สำหรับดินถมไม่มีแรงยึดเกาะ
                                        และ 1.5 สำหรับลื่นไถล โปรดยืนยันกับมาตรฐานที่ใช้บังคับในงานของท่าน
                                    </div>
                                </div>

                                {/* ── กรณีบรรทุก ── */}
                                <div className="bg-slate-50 print:bg-transparent p-4 print:p-0 rounded-lg border border-slate-100 print:border-none">
                                    <h4 className="text-sm font-bold text-slate-700 mb-3 border-b border-slate-200 pb-2 print:pb-1">4. กรณีบรรทุกที่ตรวจสอบ</h4>
                                    <div className="text-xs text-slate-600 space-y-2">
                                        <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200">
                                            <strong className="text-slate-700">LC1:</strong> คิด Surcharge จร ทั้งด้านผลักและด้านต้าน
                                        </div>
                                        <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200">
                                            <strong className="text-slate-700">LC2:</strong> คิด Surcharge จร เฉพาะด้านผลัก (ตัด W<Sub text="8"/> ออกจากแรงต้าน)
                                        </div>
                                    </div>
                                    <div className="mt-2 text-[11px] leading-snug text-slate-500">
                                        น้ำหนักจรหายไปเมื่อไหร่ก็ได้ จึงพึ่งเป็นแรงต้านไม่ได้ โปรแกรมคำนวณทั้งสองกรณี
                                        แล้วใช้ค่าที่วิกฤตที่สุดในการตัดสินทุกหัวข้อโดยอัตโนมัติ
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-sm border-t-4 border-indigo-500 border-x border-b border-slate-200 p-5 print:p-4 print:break-inside-avoid">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-indigo-100 pb-3 mb-4 print:mb-3">
                                <label className="flex items-center space-x-3 cursor-pointer">
                                    <input 
                                        type="checkbox" 
                                        className="w-5 h-5 accent-indigo-600 rounded text-indigo-600 focus:ring-indigo-500"
                                        checked={pile.usePiles} 
                                        onChange={(e) => setPile(prev => ({...prev, usePiles: e.target.checked}))} 
                                    />
                                    <h3 className="text-sm font-bold text-indigo-800 uppercase tracking-wider">ระบบฐานรากเสาเข็ม (Pile Foundation)</h3>
                                </label>
                                {pile.usePiles && <span className="text-xs text-slate-500 mt-2 sm:mt-0 no-print">*วิเคราะห์เสาเข็มแกน X แบบ Dynamic</span>}
                            </div>
                            
                            {pile.usePiles && (
                                <div className="grid grid-cols-1 xl:grid-cols-2 gap-8 print:gap-6 animate-[fadeIn_0.3s_ease-in-out]">
                                    <div className="bg-slate-50 print:bg-transparent p-4 print:p-0 rounded-lg border border-slate-100 print:border-none">
                                        <h4 className="text-sm font-bold text-slate-700 mb-4 print:mb-2 border-b pb-2 print:border-none print:pb-0">1. พิกัดจัดวางเสาเข็ม (Coordinates)</h4>
                                        <div className="space-y-2">
                                            <div className="flex flex-col sm:flex-row sm:items-center justify-between py-2 px-3 hover:bg-white rounded-md transition-colors border border-transparent hover:border-slate-200 shadow-sm hover:shadow">
                                                <span className="text-slate-700 text-sm mb-1 sm:mb-0 mr-3 flex-1 leading-tight">ระยะห่างตามแนวยาว (S<Sub text="L"/>)</span>
                                                <div className="flex items-center flex-shrink-0 self-start sm:self-auto">
                                                    <input type="number" step="0.01" className="w-20 sm:w-24 p-1.5 border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500 text-sm bg-white print:border-slate-300 print:shadow-none" value={pile.spacingL} onChange={handlePileNum('spacingL')} />
                                                    <span className="text-slate-500 mx-2 text-sm w-4">ม.</span>
                                                    <div className="w-[28px] h-[28px] no-print flex-shrink-0"></div>
                                                </div>
                                            </div>
                                            
                                            {pileRows.map((x, i) => (
                                                <div key={i} className="flex flex-col sm:flex-row sm:items-center justify-between py-2 px-3 hover:bg-white rounded-md transition-colors border border-transparent hover:border-slate-200 shadow-sm hover:shadow">
                                                    <span className="text-slate-700 text-sm mb-1 sm:mb-0 mr-3 flex-1 leading-tight">แถว {i+1} ห่างจาก Toe (x<Sub text={i+1}/>)</span>
                                                    <div className="flex items-center flex-shrink-0 self-start sm:self-auto">
                                                        <input type="number" step="0.01" className="w-20 sm:w-24 p-1.5 border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500 text-sm bg-white print:border-slate-300 print:shadow-none" value={x} onChange={(e) => updatePileRow(i, e.target.value)} />
                                                        <span className="text-slate-500 mx-2 text-sm w-4">ม.</span>
                                                        <button onClick={() => removePileRow(i)} className="text-rose-400 hover:text-rose-600 bg-rose-50 hover:bg-rose-100 p-1.5 rounded transition no-print flex-shrink-0" title="ลบแถวนี้">
                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                                                        </button>

                                                            ไม่มีการทรุดตัวของดินใต้ฐานตามหลัง ไม่มีการขุดเปิดฝั่ง Toe ภายหลัง)

                                                <div className="grid grid-cols-2 sm:grid-cols-4 print:grid-cols-4 gap-3">
                                                    <LatField label="ชนิดดิน" value={lat.soilType} onChange={handleLat('soilType')}

                                                    <div className="text-sm">
                                                        <span className="text-slate-600">กำลังรับแรงด้านข้างที่ใช้ได้ต่อเข็ม 1 ต้น:</span>{' '}
                                                        <strong className="text-lg text-slate-800">{lateral.H_allow_kg.toFixed(0)} กก.</strong>

                                                        เข็มสั้นจะวิบัติแบบหมุนทั้งต้นและรับได้น้อยกว่านี้ ต้องใช้สมการเข็มสั้นแทน

                    {/* ฝั่งขวา: พรีวิว Interactive แบบเกาะหน้าจอ (Sticky) และแสดงในหน้า Print */}
                    <div className="w-full lg:w-[320px] xl:w-[400px] flex-shrink-0 print:w-[80%] print:max-w-md print:mt-6 sticky top-6">
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 print:p-4 flex flex-col items-center print:break-inside-avoid">
                            <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-2 border-b border-slate-100 pb-3 w-full text-center">พรีวิวรูปตัด (Interactive Preview)</h3>
                            <InteractivePreview />
                            <div className="mt-4 text-[11px] text-slate-500 text-center w-full bg-slate-50 p-2 rounded border border-slate-100 print:bg-transparent print:border-none print:p-0">
                                * รูปตัดนี้จำลองสัดส่วนอัตโนมัติตามพารามิเตอร์ที่คุณกรอก
                            </div>
                        </div>

                </div>
            );

            const TabDashboard = () => {
                const scale = Math.min(300 / calc.B, 250 / (geom.H + geom.T1), 120);
                const scaleX = scale; 
                const scaleY = scale;    
                const x0 = (600 - (calc.B * scaleX)) / 2;   
                const y0 = 320; 

                const svgH = geom.H * scaleY;
                const svgT1 = geom.T1 * scaleY;
                const svgC = geom.C * scaleX;
                const svgD = geom.D * scaleX;
                const svgG = geom.G * scaleX;
                const svgF = geom.F * scaleX;
                const svgB = calc.B * scaleX;

                const p1 = `${x0},${y0}`; 
                const p2 = `${x0 + svgB},${y0}`; 
                const p3 = `${x0 + svgB},${y0 - svgT1}`; 
                const p4 = `${x0 + svgC + svgD},${y0 - svgT1}`; 
                const p5 = `${x0 + svgC + svgG},${y0 - svgT1 - svgH}`; 
                const p6 = `${x0 + svgC},${y0 - svgT1 - svgH}`; 
                const p7 = `${x0 + svgC},${y0 - svgT1}`; 
                const p8 = `${x0},${y0 - svgT1}`; 
                const wallPolygon = `${p1} ${p2} ${p3} ${p4} ${p5} ${p6} ${p7} ${p8}`;

                /* ═══ สลับผลสรุปเป็นของเสาเข็มเมื่อเปิดใช้ระบบฐานรากเสาเข็ม ═══ */
                const pileMode = pile.usePiles && calc.N_piles > 0 && calc.pile_results.length > 0;
                const comps    = pileMode ? calc.pile_results.map(p => p.p_comp) : [0];
                const maxComp  = Math.max.apply(null, comps.concat([0]));
                const maxTen   = pileMode ? Math.abs(Math.min.apply(null, calc.pile_results.map(p => p.p_ten).concat([0]))) : 0;
                const worstCompRow = pileMode ? (calc.pile_results[comps.indexOf(maxComp)] || {}).id || '-' : '-';
                const e_p      = (pileMode && calc.govPile) ? (calc.x_cg_pile - calc.govPile.X_bar) : 0;
                const minComp  = Math.min.apply(null, comps);
                const spreadNote = pileMode
                    ? (maxComp > 0 && minComp > 0
                        ? 'แรงต่างกันระหว่างแถว ' + (maxComp / minComp).toFixed(1) + ' เท่า'
                        : 'มีแถวที่รับแรงถอน')
                    : '';

                const soilCards = (muted) => (
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 print:grid-cols-4 gap-6 print:gap-4">
                        <StatCard muted={muted} label="Overturning (F.S.)" value={fmt(calc.FS_ot)}
                            cond={calc.okOT}
                            tTrue={`\u2265 ${fsOtReq.toFixed(2)} ผ่าน`} tFalse={`\u003C ${fsOtReq.toFixed(2)} ไม่ผ่าน`}
                            note={'กรณีวิกฤต ' + calc.govOT.label} />
                        <StatCard muted={muted} label="Sliding (F.S.)" value={fmt(calc.FS_slide)}
                            cond={calc.okSlide}
                            tTrue={`\u2265 ${fsSlideReq.toFixed(2)} ผ่าน`} tFalse={`\u003C ${fsSlideReq.toFixed(2)} ไม่ผ่าน`}
                            note={'กรณีวิกฤต ' + calc.govSL.label} />
                        <StatCard muted={muted} label="เยื้องศูนย์ |e| (ม.)" value={Math.abs(calc.e).toFixed(3)}
                            cond={calc.okEcc}
                            tTrue={`\u2264 B/6 (${calc.B6.toFixed(2)} ม.)`} tFalse={`\u003E B/6 (${calc.B6.toFixed(2)} ม.)`}
                            note={calc.bearingMode === 'triangle' ? 'กระจายแบบสามเหลี่ยม' : calc.bearingMode === 'outside' ? 'แรงลัพธ์นอกฐาน' : 'กระจายเต็มหน้าฐาน'} />
                        <StatCard muted={muted} label={<span>q<Sub text="max"/> (กก./ม.&sup2;)</span>} value={fmt(calc.q_max, 0)}
                            cond={calc.okBear}
                            tTrue={"\u2264 q_allow ผ่าน"} tFalse={"\u003E q_allow ไม่ผ่าน"}
                            note={'กรณีวิกฤต ' + calc.govQ.label + ' \u00B7 ที่ ' + (calc.peakAt === 'toe' ? 'Toe' : 'Heel')} />
                    </div>
                );

                /* [C2][C3] แผนภาพหน่วยแรงใต้ฐาน รองรับทั้งสี่เหลี่ยมคางหมูและสามเหลี่ยม */
                const q_peak = Number.isFinite(calc.q_max) ? calc.q_max : 0;
                const q_scale = 80 / Math.max(q_peak, 1);
                const q_at_toe  = calc.peakAt === 'toe'  ? q_peak : calc.q_min;
                const q_at_heel = calc.peakAt === 'heel' ? q_peak : calc.q_min;
                const h_toe  = q_at_toe  * q_scale;
                const h_heel = q_at_heel * q_scale;
                const svgBeff = calc.B_eff * scaleX;
                const qPoly = calc.bearingMode === 'triangle'
                    ? (calc.peakAt === 'toe'
                        ? `${x0},${y0} ${x0 + svgBeff},${y0} ${x0},${y0 + h_toe}`
                        : `${x0 + svgB - svgBeff},${y0} ${x0 + svgB},${y0} ${x0 + svgB},${y0 + h_heel}`)
                    : `${x0},${y0} ${x0 + svgB},${y0} ${x0 + svgB},${y0 + h_heel} ${x0},${y0 + h_toe}`;

                const x_v = x0 + (calc.X_bar * scaleX);
                const y_bar_P = calc.sumP > 0 ? calc.MO / calc.sumP : 0; 
                const y_p = y0 - (y_bar_P * scaleY);

                const planScale = Math.min(300 / calc.B, 120);
                const planW = calc.B * planScale;
                const planH = pile.spacingL * planScale;
                const planX0 = (600 - planW) / 2;
                const planY0 = 60 + (pileRows.length * 25);

                return (
                    <div className="space-y-6 animate-[fadeIn_0.3s_ease-in-out] print:break-inside-avoid print:mt-6 print:border-t print:border-slate-800 print:pt-4">
                        <h3 className="hidden print:block font-bold text-lg text-slate-800 mb-4 uppercase">สรุปผลและไดอะแกรม (Dashboard & Diagrams)</h3>
                        
                        {pileMode ? (
                            <div className="space-y-6">
                                {/* ═══ ผลหลัก: ระบบเสาเข็ม ═══ */}
                                <div>
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-3 gap-1">
                                        <h4 className="text-sm font-bold text-indigo-800 uppercase tracking-wider flex items-center">
                                            <span className="w-2 h-5 bg-indigo-600 rounded-sm mr-2"></span>
                                            ผลตรวจสอบหลัก &mdash; ระบบฐานรากเสาเข็ม
                                        </h4>
                                        <span className="text-xs text-slate-500">
                                            {pile.designMode === 'full' ? 'Full Load' : 'Piled Raft'} &middot; {calc.N_piles} แถว &middot; ช่วง {pile.spacingL} ม.
                                        </span>
                                    </div>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 print:grid-cols-4 gap-6 print:gap-4">
                                        <StatCard label="แรงกดสูงสุด / ต้น" value={maxComp.toFixed(0)} unit="กก."
                                            cond={calc.okPileComp}
                                            tTrue={`\u2264 ${pile.allowComp} ผ่าน`}
                                            tFalse={`\u003E ${pile.allowComp} เกินพิกัด`}
                                            note={`ใช้กำลัง ${pile.allowComp > 0 ? (100 * maxComp / pile.allowComp).toFixed(0) : '-'}% \u00B7 แถวที่ ${worstCompRow}`} />
                                        <StatCard label="แรงถอนสูงสุด / ต้น" value={maxTen.toFixed(0)} unit="กก."
                                            cond={calc.okPileTen}
                                            tTrue={maxTen < 1 ? 'ไม่มีแรงถอน' : `\u2264 ${pile.allowTen} ผ่าน`}
                                            tFalse={`\u003E ${pile.allowTen} เกินพิกัด`}
                                            note={maxTen < 1 ? 'เข็มรับแรงกดทุกแถว' : 'ต้องออกแบบเหล็กเดือยที่หัวเข็ม'} />
                                        <StatCard label="แรงเฉือน / ต้น" value={calc.V_shear_pile.toFixed(0)} unit="กก."
                                            cond={calc.okPileShear}
                                            tTrue={calc.shearCapValid ? `\u2264 ${calc.shearCap.toFixed(0)} ผ่าน` : 'ผ่าน'}
                                            tFalse={calc.shearCapValid ? `เกิน ${calc.shearRatio.toFixed(1)} เท่า` : 'ยังไม่ได้กำหนดกำลัง'}
                                            note={(calc.raftMode && calc.fricGov && calc.fricGov.H_fric_use > 0
                                                    ? 'เสียดทานก้นฐานช่วย ' + (100 * calc.fricGov.H_fric_use / Math.max(1, calc.fricGov.P_grp)).toFixed(0) + '% \u00B7 ทนทาน ' + calc.V_shear_pile_n.toFixed(0) + ' กก.'
                                                    : (calc.shearFromBroms ? 'กำลังจาก Broms ' + calc.shearCap.toFixed(0) + ' กก.' : 'กำลังจากค่าที่กรอกเอง'))} />
                                        <StatCard label={<span>เยื้องศูนย์จาก CG เข็ม (e<Sub text="p"/>)</span>}
                                            value={e_p >= 0 ? e_p.toFixed(3) : e_p.toFixed(3)} unit="ม."
                                            cond={null}
                                            tTrue={Math.abs(e_p) < 0.005 ? 'แรงลัพธ์ตรง CG' : (e_p > 0 ? 'เยื้องไปทาง Toe' : 'เยื้องไปทาง Heel')}
                                            note={spreadNote} />
                                    </div>
                                </div>

                                {/* ═══ ผลของดินเดิม: อ้างอิงหรือร่วมตรวจ แล้วแต่โหมด ═══ */}
                                <div>
                                    <h4 className={`text-sm font-bold uppercase tracking-wider mb-3 flex items-center ${pile.designMode === 'full' ? 'text-slate-500' : 'text-amber-700'}`}>
                                        <span className={`w-2 h-5 rounded-sm mr-2 ${pile.designMode === 'full' ? 'bg-slate-400' : 'bg-amber-500'}`}></span>
                                        {pile.designMode === 'full'
                                            ? 'อ้างอิงเท่านั้น \u2014 กรณีสมมติว่าวางบนดินเดิม'
                                            : 'ตรวจสอบร่วม \u2014 ส่วนที่ดินเดิมรับ'}
                                    </h4>
                                    {soilCards(pile.designMode === 'full')}
                                    <div className={`mt-3 p-3 rounded-lg border text-xs leading-relaxed print:break-inside-avoid ${pile.designMode === 'full' ? 'bg-slate-50 border-slate-200 text-slate-600' : 'bg-amber-50 border-amber-200 text-amber-900'}`}>
                                        {pile.designMode === 'full'
                                            ? <span>เมื่อเสาเข็มรับแรงทั้งหมด F.S. พลิกคว่ำ/ลื่นไถล และ q<Sub text="max"/> ข้างบน <strong>ไม่ใช่กลไกวิบัติที่ควบคุมการออกแบบ</strong> กำแพงบนเสาเข็มต้านการพลิกคว่ำด้วยคู่แรงกด-แรงถอนในเข็ม และต้านการลื่นไถลด้วยแรงด้านข้างของเข็ม ตัวเลขชุดนี้แสดงไว้เพื่อเปรียบเทียบเท่านั้น</span>
                                            : <span><strong>โหมด Piled Raft:</strong> ดินใต้ฐานรับแรงร่วมกับเสาเข็ม {calc.raftS ? (100 * calc.raftS.share).toFixed(0) + '%' : '-'} โดยแบ่งตามความแข็ง ค่า q<Sub text="max"/> ในการ์ดชุดนี้เป็นวิธีคลาสสิกที่ไม่คิดเสาเข็ม ค่าที่ใช้จริงดูในแท็บ "แรงเสาเข็ม"</span>}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            soilCards(false)
                        )}

                        <div className="grid grid-cols-1 lg:grid-cols-2 print:grid-cols-2 gap-6 print:gap-4 print:mt-4">
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-start overflow-visible print:break-inside-avoid">
                                <h4 className="text-lg font-bold text-slate-700 mb-6 w-full text-center border-b pb-2">ไดอะแกรมรูปด้าน (Elevation)</h4>
                                <svg viewBox="0 0 650 450" className="w-full max-w-lg h-auto drop-shadow-sm mx-auto">
                                    <defs>
                                        <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="8" height="8">
                                            <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#fb7185" strokeWidth="1" />
                                        </pattern>
                                        <pattern id="tensionHatch" patternUnits="userSpaceOnUse" width="8" height="8">
                                            <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#c084fc" strokeWidth="1" />
                                        </pattern>
                                    </defs>

                                    <line x1="20" y1={y0 - svgH - svgT1} x2="630" y2={y0 - svgH - svgT1} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                    <text x="610" y={y0 - svgH - svgT1 - 8} fill="#64748b" fontSize="13" textAnchor="end">ระดับดิน</text>

                                    <polygon points={wallPolygon} fill="#e2e8f0" stroke="#64748b" strokeWidth="2" strokeLinejoin="round" />

                                    <line x1={x0} y1={y0} x2={x0 + svgB} y2={y0} stroke="#475569" strokeWidth="2" />
                                    
                                    {!pile.usePiles && calc.bearingValid && (
                                        <g>
                                            <polygon points={qPoly}
                                                fill={calc.bearingMode === 'triangle' ? "url(#tensionHatch)" : "url(#diagonalHatch)"}
                                                stroke={calc.bearingMode === 'triangle' ? "#a855f7" : "#e11d48"} strokeWidth="1.5" />
                                            <text x={x0 - 8} y={y0 + h_toe + 15} fill="#be123c" fontSize="14" fontWeight="bold" textAnchor="end">
                                                q(Toe) = {q_at_toe.toFixed(0)}
                                            </text>
                                            <text x={x0 + svgB + 8} y={y0 + h_heel + 15} fill="#be123c" fontSize="14" fontWeight="bold" textAnchor="start">
                                                q(Heel) = {q_at_heel.toFixed(0)}
                                            </text>
                                            {calc.bearingMode === 'triangle' && (
                                                <g>
                                                    <line
                                                        x1={calc.peakAt === 'toe' ? x0 : x0 + svgB - svgBeff}
                                                        y1={y0 + 96}
                                                        x2={calc.peakAt === 'toe' ? x0 + svgBeff : x0 + svgB}
                                                        y2={y0 + 96}
                                                        stroke="#7e22ce" strokeWidth="2" />
                                                    <text
                                                        x={calc.peakAt === 'toe' ? x0 + svgBeff / 2 : x0 + svgB - svgBeff / 2}
                                                        y={y0 + 112} fill="#7e22ce" fontSize="12" fontWeight="bold" textAnchor="middle">
                                                        B_eff = {calc.B_eff.toFixed(2)} m (หน้าฐานเปิดบางส่วน)
                                                    </text>
                                                </g>
                                            )}
                                        </g>
                                    )}
                                    {!pile.usePiles && !calc.bearingValid && (
                                        <text x={x0 + svgB / 2} y={y0 + 45} fill="#be123c" fontSize="15" fontWeight="bold" textAnchor="middle">
                                            แรงลัพธ์ตกนอกหน้าฐานราก
                                        </text>
                                    )}

                                    {pile.usePiles && pileRows.map((x, i) => (
                                        <g key={i}>
                                            <rect x={x0 + x * scaleX - 10} y={y0} width="20" height="60" fill="#cbd5e1" stroke="#475569" strokeWidth="2" />
                                            <path d={`M ${x0 + x * scaleX - 10} ${y0 + 60} L ${x0 + x * scaleX} ${y0 + 80} L ${x0 + x * scaleX + 10} ${y0 + 60} Z`} fill="#cbd5e1" stroke="#475569" strokeWidth="2" />
                                        </g>
                                    ))}

                                    <line x1={x_v} y1={y0 - svgH - svgT1 - 60} x2={x_v} y2={y0 - 35} stroke="#10b981" strokeWidth="4" strokeDasharray="6,4" />
                                    <polygon points={`${x_v - 8},${y0 - 36} ${x_v + 8},${y0 - 36} ${x_v},${y0 - 20}`} fill="#10b981" />
                                    <circle cx={x_v} cy={y0} r="4" fill="#10b981" />
                                    <text x={x_v + 12} y={y0 - svgH - svgT1 - 45} fill="#047857" fontSize="16" fontWeight="bold">
                                        &#931;V = {calc.sumV.toFixed(0)} kg
                                    </text>
                                    <text x={x_v + 12} y={y0 - svgH - svgT1 - 25} fill="#047857" fontSize="14">
                                        (X&#772; = {calc.X_bar.toFixed(2)}m)
                                    </text>

                                    <line x1={x0 + svgB + 100} y1={y_p} x2={x0 + svgB + 15} y2={y_p} stroke="#0ea5e9" strokeWidth="4" />
                                    <polygon points={`${x0 + svgB + 16},${y_p - 8} ${x0 + svgB + 16},${y_p + 8} ${x0 + svgB},${y_p}`} fill="#0ea5e9" />
                                    <text x={x0 + svgB + 55} y={y_p - 12} fill="#0369a1" fontSize="16" fontWeight="bold" textAnchor="middle">
                                        &#931;P = {calc.sumP.toFixed(0)} kg
                                    </text>
                                    <text x={x0 + svgB + 55} y={y_p + 20} fill="#0369a1" fontSize="14" textAnchor="middle">
                                        (y&#772; = {y_bar_P.toFixed(2)}m)
                                    </text>

                                    <line x1={x_v} y1={y0} x2={x_v} y2={y0 + 105} stroke="#10b981" strokeWidth="1" strokeDasharray="3,3" opacity="0.6" />
                                </svg>
                            </div>

                            {pile.usePiles ? (
                                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-start overflow-visible print:break-inside-avoid">
                                    <h4 className="text-lg font-bold text-slate-700 mb-6 w-full text-center border-b pb-2">แปลนฐานราก (Plan View)</h4>
                                    <svg viewBox="0 0 600 450" className="w-full max-w-sm h-auto drop-shadow-sm mx-auto mt-4">
                                        <defs>
                                            <marker id="arrow-dim" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                                                <polygon points="0 0, 6 3, 0 6" fill="#64748b" />
                                            </marker>
                                        </defs>

                                        <rect x={planX0} y={planY0} width={planW} height={planH} fill="#f1f5f9" stroke="#475569" strokeWidth="2" rx="4" />
                                        
                                        <line x1={planX0 + geom.C * planScale} y1={planY0} x2={planX0 + geom.C * planScale} y2={planY0 + planH} stroke="#94a3b8" strokeWidth="2" strokeDasharray="4,4" />
                                        <line x1={planX0 + (geom.C + geom.D) * planScale} y1={planY0} x2={planX0 + (geom.C + geom.D) * planScale} y2={planY0 + planH} stroke="#94a3b8" strokeWidth="2" strokeDasharray="4,4" />

                                        {pileRows.map((x, i) => {
                                            const lineY = planY0 - 20 - (i * 25); 
                                            return (
                                                <g key={i}>
                                                    <circle cx={planX0 + x * planScale} cy={planY0 + planH / 2} r="12" fill="#818cf8" stroke="#1e3a8a" strokeWidth="2" />
                                                    <text x={planX0 + x * planScale} y={planY0 + planH / 2 - 20} fill="#1e3a8a" fontSize="12" fontWeight="bold" textAnchor="middle">Row {i+1}</text>
                                                    
                                                    <line x1={planX0} y1={lineY} x2={planX0 + x * planScale} y2={lineY} stroke="#64748b" strokeWidth="1" markerStart="url(#arrow-dim)" markerEnd="url(#arrow-dim)" />
                                                    <text x={planX0 + (x * planScale) / 2} y={lineY - 5} fill="#475569" fontSize="12" textAnchor="middle">x{i+1}={x}</text>
                                                    
                                                    <line x1={planX0 + x * planScale} y1={lineY} x2={planX0 + x * planScale} y2={planY0 + planH / 2} stroke="#64748b" strokeWidth="1" strokeDasharray="3,3" />
                                                </g>
                                            );
                                        })}
                                        
                                        {pileRows.length > 0 && <line x1={planX0} y1={planY0 - 20 - ((pileRows.length - 1) * 25)} x2={planX0} y2={planY0} stroke="#64748b" strokeWidth="1" strokeDasharray="3,3" />}

                                        <line x1={planX0 - 20} y1={planY0} x2={planX0 - 20} y2={planY0 + planH} stroke="#64748b" strokeWidth="1" markerStart="url(#arrow-dim)" markerEnd="url(#arrow-dim)" />
                                        <line x1={planX0 - 30} y1={planY0} x2={planX0 - 10} y2={planY0} stroke="#64748b" strokeWidth="1" />
                                        <line x1={planX0 - 30} y1={planY0 + planH} x2={planX0 - 10} y2={planY0 + planH} stroke="#64748b" strokeWidth="1" />
                                        <text x={planX0 - 35} y={planY0 + planH / 2} fill="#475569" fontSize="14" textAnchor="middle" transform={`rotate(-90, ${planX0 - 35}, ${planY0 + planH / 2})`}>S_L = {pile.spacingL} m</text>

                                        <line x1={planX0} y1={planY0 + planH + 20} x2={planX0 + planW} y2={planY0 + planH + 20} stroke="#64748b" strokeWidth="1" markerStart="url(#arrow-dim)" markerEnd="url(#arrow-dim)" />
                                        <line x1={planX0} y1={planY0 + planH + 10} x2={planX0} y2={planY0 + planH + 30} stroke="#64748b" strokeWidth="1" />
                                        <line x1={planX0 + planW} y1={planY0 + planH + 10} x2={planX0 + planW} y2={planY0 + planH + 30} stroke="#64748b" strokeWidth="1" />
                                        <text x={planX0 + planW / 2} y={planY0 + planH + 40} fill="#475569" fontSize="14" textAnchor="middle">B = {calc.B.toFixed(2)} m</text>
                                    </svg>
                                </div>
                            ) : (
                                <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 flex flex-col items-center justify-center text-slate-400 print:hidden">
                                    <svg className="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                                    <p>เปิดใช้ "ระบบฐานรากเสาเข็ม" เพื่อแสดงแปลนที่นี่</p>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            const TabDriving = () => {
                const scaleY = 280 / calc.H_tot; 
                const maxP = calc.p1 + calc.p2 + calc.p3 + calc.p4;
                const scaleX = maxP > 0 ? 250 / maxP : 1;
                
                const w1 = calc.p1 * scaleX;
                const w2 = calc.p2 * scaleX;
                const w3 = calc.p3 * scaleX;
                const w4 = calc.p4 * scaleX;

                const total_w = w1 + w2 + w3 + w4;
                const drawing_width = 40 + total_w + 150; 
                const x0 = (800 - drawing_width) / 2 + 40; 
                const y0 = 85; 

                const svgH = calc.H_tot * scaleY;
                const svgD2 = calc.h_dry * scaleY;
                const svgD3_T1 = calc.h_w * scaleY;

                const y_WT = y0 + svgD2;
                const y_Base = y0 + svgH;

                const max_x = x0 + w1 + w2 + w3 + w4;
                const arrow_x = max_x + 20;
                const dim_x = arrow_x + 50; 

                let y_P1 = y0 + svgH / 2;
                let y_P2Tri = y0 + svgD2 * 2 / 3;
                let y_P2Rect = y_WT + svgD3_T1 / 2;
                
                if (Math.abs(y_P1 - y_P2Tri) < 24) {
                    if (y_P1 > y_P2Tri) {
                        y_P1 += 12;
                        y_P2Tri -= 12;
                    } else {
                        y_P1 -= 12;
                        y_P2Tri += 12;
                    }
                }

                const y_center_P3P4 = y_WT + svgD3_T1 * 2 / 3;
                let y_P3 = y_center_P3P4 - 14;
                let y_P4 = y_center_P3P4 + 14;

                if (Math.abs(y_P2Rect - y_P3) < 24) {
                    if (y_P2Rect < y_P3) {
                        y_P2Rect -= 12;
                        y_P3 += 12;
                        y_P4 += 12; 
                    } else {
                        y_P2Rect += 12;
                        y_P3 -= 12;
                    }
                }
                
                if (Math.abs(y_P1 - y_P2Rect) < 24) {
                    if (y_P1 < y_P2Rect) { y_P1 -= 12; y_P2Rect += 12; }
                    else { y_P1 += 12; y_P2Rect -= 12; }
                }

                return (
                <div className="bg-white p-6 print:p-3 rounded-xl border border-slate-200 shadow-sm space-y-6 print:space-y-2 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                    <h3 className="font-bold text-lg print:text-base text-slate-700 border-b pb-2 print:pb-1">แรงผลักด้านข้าง (Driving Forces)</h3>
                    
                    <div className="bg-sky-50 print:bg-white text-sky-800 print:text-slate-800 p-4 print:p-2 rounded-lg text-sm print:text-xs font-medium grid grid-cols-2 md:grid-cols-5 print:grid-cols-5 gap-y-3 print:gap-y-1 gap-x-4 border border-sky-100 print:border-slate-300 shadow-sm">
                        <div>K<Sub text="a"/> = {calc.Ka.toFixed(3)}</div>
                        <div>Surcharge = {surcharge} กก./ม.&sup2;</div>
                        <div>&gamma;<Sub text="c"/> = {soil.gamma_c} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="sat"/> = {soil.gamma_sat} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="w"/> = {calc.gamma_w} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="sub"/> = {calc.gamma_sub} กก./ม.&sup3;</div>
                        <div>h<Sub text="dry"/> (ชั้นแห้ง) = {calc.h_dry.toFixed(2)} ม.</div>
                        <div>h<Sub text="w"/> (ชั้นจมน้ำ) = {calc.h_w.toFixed(2)} ม.</div>
                        <div>T<Sub text="1"/> (ฐานราก) = {geom.T1.toFixed(2)} ม.</div>
                        <div>H + T<Sub text="1"/> = {calc.H_tot.toFixed(2)} ม.</div>
                    </div>

                    <div className="flex flex-col gap-6 print:gap-2 mt-6 print:mt-2">
                        <div className="w-full flex flex-col items-center justify-start border border-slate-200 p-6 print:p-0 rounded-xl print:border-none">
                            <h4 className="text-base print:text-sm font-semibold text-slate-700 mb-6 print:mb-2 w-full text-center border-b pb-2 print:pb-1">แผนภาพแรงผลักด้านข้างและทิศทางของแรง</h4>
                            <svg viewBox="0 0 800 450" className="w-full max-w-4xl print:max-w-xl h-auto mx-auto block">
                                <defs>
                                    <marker id="arrow-force" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                                        <polygon points="0 0, 8 4, 0 8" fill="#dc2626" />
                                    </marker>
                                    <marker id="arrow-dim-y" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                                        <polygon points="0 0, 6 3, 0 6" fill="#64748b" />
                                    </marker>
                                </defs>

                                <line x1="20" y1={y0} x2={dim_x + 20} y2={y0} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                <text x={dim_x + 25} y={y0-8} fill="#64748b" fontSize="14" fontWeight="bold">ผิวดิน</text>
                                
                                {calc.h_w > 0 && (
                                    <g>
                                        <line x1="20" y1={y_WT} x2={dim_x + 20} y2={y_WT} stroke="#38bdf8" strokeWidth="2" strokeDasharray="5,5" />
                                        <text x={dim_x + 25} y={y_WT+18} fill="#0284c7" fontSize="14" fontWeight="bold">ระดับน้ำ</text>
                                    </g>
                                )}

                                <line x1="20" y1={y_Base} x2={dim_x + 20} y2={y_Base} stroke="#475569" strokeWidth="2" />
                                <text x={dim_x + 25} y={y_Base+4} fill="#475569" fontSize="14" fontWeight="bold">ก้นฐานราก</text>

                                <rect x={x0-40} y={y0} width="40" height={svgH} fill="#cbd5e1" stroke="#475569" strokeWidth="2" />
                                <text x={x0-20} y={y0+svgH/2} fill="#475569" fontSize="13" textAnchor="middle" transform={`rotate(-90, ${x0-20}, ${y0+svgH/2})`}>กำแพงกันดิน (Wall)</text>
                                
                                {showP1 && calc.P1 > 0 && (
                                    <g>
                                        <rect x={x0} y={y0} width={w1} height={svgH} fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" strokeDasharray="4" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P1} x2={x0+10} y2={y_P1} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P1+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P1</text>
                                    </g>
                                )}
                                
                                {showP2Tri && calc.P2_tri > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1},${y0} ${x0+w1+w2},${y_WT} ${x0+w1},${y_WT}`} fill="rgba(250, 204, 21, 0.4)" stroke="#ca8a04" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P2Tri} x2={x0+10} y2={y_P2Tri} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P2Tri+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P2</text>
                                    </g>
                                )}
                                
                                {showP2Rect && calc.P2_rect > 0 && (
                                    <g>
                                        <rect x={x0+w1} y={y_WT} width={w2} height={svgD3_T1} fill="rgba(251, 146, 60, 0.4)" stroke="#ea580c" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P2Rect} x2={x0+10} y2={y_P2Rect} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P2Rect+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P2</text>
                                    </g>
                                )}
                                
                                {showP3 && calc.P3 > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1+w2},${y_WT} ${x0+w1+w2+w3},${y_Base} ${x0+w1+w2},${y_Base}`} fill="rgba(96, 165, 250, 0.4)" stroke="#2563eb" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P3} x2={x0+10} y2={y_P3} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P3+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P3</text>
                                    </g>
                                )}
                                
                                {showP4 && calc.P4 > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1+w2+w3},${y_WT} ${x0+w1+w2+w3+w4},${y_Base} ${x0+w1+w2+w3},${y_Base}`} fill="rgba(30, 58, 138, 0.3)" stroke="#1e3a8a" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P4} x2={x0+10} y2={y_P4} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P4+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P4</text>
                                    </g>
                                )}

                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={dim_x - 10} y1={y0} x2={dim_x + 10} y2={y0} />
                                    {calc.h_dry > 0 && calc.h_w > 0 && <line x1={dim_x - 10} y1={y_WT} x2={dim_x + 10} y2={y_WT} />}
                                    <line x1={dim_x - 10} y1={y_Base} x2={dim_x + 10} y2={y_Base} />

                                    {calc.h_dry > 0 && <line x1={dim_x} y1={y0} x2={dim_x} y2={y_WT} markerStart="url(#arrow-dim-y)" markerEnd="url(#arrow-dim-y)" />}
                                    {calc.h_w > 0 && <line x1={dim_x} y1={y_WT} x2={dim_x} y2={y_Base} markerStart="url(#arrow-dim-y)" markerEnd="url(#arrow-dim-y)" />}
                                </g>
                                <g fill="#475569" fontSize="14" textAnchor="start" dominantBaseline="middle" fontFamily="sans-serif">
                                    {calc.h_dry > 0 && <text x={dim_x + 15} y={y0 + svgD2/2}>h_dry (แห้ง)</text>}
                                    {calc.h_w > 0 && <text x={dim_x + 15} y={y_WT + svgD3_T1/2}>h_w (จมน้ำ)</text>}
                                </g>

                                <circle cx={x0-40} cy={y_Base} r="5" fill="#dc2626" />
                                <text x={x0-48} y={y_Base+14} fill="#dc2626" fontSize="12" fontWeight="bold" textAnchor="end">จุดหมุน Toe</text>
                            </svg>
                        </div>
                        
                        <div className="w-full space-y-4 print:space-y-1 print:border-none">
                            <h4 className="text-base print:text-sm font-semibold text-slate-700 mb-4 print:mb-1 border-b pb-2 print:pb-1">เลเยอร์ของแรงดัน (Pressure Layers)</h4>
                            
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4 print:gap-1.5">
                                <label className="flex items-start space-x-3 p-3 print:p-1.5 bg-white border border-slate-100 hover:border-sky-300 rounded-lg cursor-pointer transition shadow-sm print:shadow-none">
                                    <input type="checkbox" className="mt-1 w-5 h-5 accent-sky-500 no-print" checked={showP1} onChange={e => setShowP1(e.target.checked)} />
                                    <div>
                                        <div className="font-bold print:text-xs text-sky-600">P1: Surcharge</div>
                                        <div className="text-xs print:text-[10px] print:leading-tight text-slate-500 mt-1 print:mt-0">น้ำหนักกดทับด้านบน (สม่ำเสมอ) จึงเป็น <strong className="text-sky-700">สี่เหลี่ยมผืนผ้า</strong> ตลอดความลึก แขนโมเมนต์ตกกึ่งกลางความสูงทั้งหมด</div>
                                    </div>
                                </label>

                                <label className={`flex items-start space-x-3 p-3 print:p-1.5 bg-white border border-slate-100 rounded-lg cursor-pointer transition shadow-sm print:shadow-none ${calc.h_dry === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:border-amber-300'}`}>
                                    <input type="checkbox" className="mt-1 w-5 h-5 accent-amber-500 no-print" checked={showP2Tri} onChange={e => setShowP2Tri(e.target.checked)} disabled={calc.h_dry === 0} />
                                    <div>
                                        <div className="font-bold print:text-xs text-amber-600">P2: ดินแห้ง (ส่วนสามเหลี่ยม)</div>
                                        <div className="text-xs print:text-[10px] print:leading-tight text-slate-500 mt-1 print:mt-0">น้ำหนักดินเพิ่มตามความลึกถึงระดับน้ำ กราฟเป็น <strong className="text-amber-700">สามเหลี่ยม</strong> แขนตกที่ 2/3 ของ h_dry</div>
                                    </div>
                                </label>

                                <label className={`flex items-start space-x-3 p-3 print:p-1.5 bg-white border border-slate-100 rounded-lg cursor-pointer transition shadow-sm print:shadow-none ${calc.h_dry === 0 || calc.h_w === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:border-orange-300'}`}>
                                    <input type="checkbox" className="mt-1 w-5 h-5 accent-orange-500 no-print" checked={showP2Rect} onChange={e => setShowP2Rect(e.target.checked)} disabled={calc.h_dry === 0 || calc.h_w === 0} />
                                    <div>
                                        <div className="font-bold print:text-xs text-orange-600">P2: ดินแห้ง (ส่วนสี่เหลี่ยม)</div>
                                        <div className="text-xs print:text-[10px] print:leading-tight text-slate-500 mt-1 print:mt-0">มวลดินแห้งข้างบนกดทับดินเปียกข้างล่าง ทำตัวเสมือน Surcharge อีกก้อน เป็น <strong className="text-orange-700">สี่เหลี่ยม</strong> ในโซนล่าง</div>
                                    </div>
                                </label>

                                <label className={`flex items-start space-x-3 p-3 print:p-1.5 bg-white border border-slate-100 rounded-lg cursor-pointer transition shadow-sm print:shadow-none ${calc.h_w === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:border-blue-300'}`}>
                                    <input type="checkbox" className="mt-1 w-5 h-5 accent-blue-500 no-print" checked={showP3} onChange={e => setShowP3(e.target.checked)} disabled={calc.h_w === 0} />
                                    <div>
                                        <div className="font-bold print:text-xs text-blue-600">P3: ดินเปียก/จมน้ำ</div>
                                        <div className="text-xs print:text-[10px] print:leading-tight text-slate-500 mt-1 print:mt-0">ดินใต้ระดับน้ำมีแรงลอยตัวพยุง เริ่มจาก 0 ที่ระดับน้ำ เป็น <strong className="text-blue-700">สามเหลี่ยม</strong> แขน 2/3 วัดจากผิวน้ำ</div>
                                    </div>
                                </label>

                                <label className={`flex items-start space-x-3 p-3 print:p-1.5 bg-white border border-slate-100 rounded-lg cursor-pointer transition shadow-sm print:shadow-none ${calc.h_w === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:border-indigo-300'}`}>
                                    <input type="checkbox" className="mt-1 w-5 h-5 accent-indigo-700 no-print" checked={showP4} onChange={e => setShowP4(e.target.checked)} disabled={calc.h_w === 0} />
                                    <div>
                                        <div className="font-bold print:text-xs text-indigo-800">P4: แรงดันน้ำ (Hydrostatic)</div>
                                        <div className="text-xs print:text-[10px] print:leading-tight text-slate-500 mt-1 print:mt-0">น้ำเป็นของไหล ไม่มีแรงเสียดทาน (Ka = 1) ใช้ &gamma;_w คูณตรงๆ เป็น <strong className="text-indigo-700">สามเหลี่ยม</strong></div>
                                    </div>
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
                );
            };

            const TabCalculations = () => {
                return (
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                        <h3 className="font-bold text-lg text-slate-700 border-b pb-2">รายการคำนวณ (Detailed Calculations)</h3>
                        
                        <StepBox title="1. สัมประสิทธิ์แรงดันดิน (Lateral Earth Pressure Coefficient)">
                            <div className="grid grid-cols-1 md:grid-cols-2 print:grid-cols-2 gap-4">
                                <div className={`p-3 border rounded shadow-sm ${calc.K_mode === 'ka' ? 'bg-blue-50 border-blue-300' : 'bg-white border-slate-200 opacity-60'}`}>
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">K<Sub text="a"/> (Active) {calc.K_mode === 'ka' && <span className="text-blue-600 text-xs">&larr; ใช้ค่านี้</span>}</div>
                                    <div className="text-slate-600">K<Sub text="a"/> = tan&sup2;(45 - &phi;/2) = tan&sup2;(45 - {soil.phi_backfill}/2)</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.K_active.toFixed(3)}</div>
                                </div>
                                <div className={`p-3 border rounded shadow-sm ${calc.K_mode === 'k0' ? 'bg-blue-50 border-blue-300' : 'bg-white border-slate-200 opacity-60'}`}>
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">K<Sub text="0"/> (At-rest) {calc.K_mode === 'k0' && <span className="text-blue-600 text-xs">&larr; ใช้ค่านี้</span>}</div>
                                    <div className="text-slate-600">K<Sub text="0"/> = 1 - sin &phi; = 1 - sin({soil.phi_backfill}&deg;)</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.K_rest.toFixed(3)}</div>
                                </div>
                            </div>
                            <div className="mt-3 text-xs text-slate-600 bg-slate-100 p-2 rounded border border-slate-200">
                                <strong>[C4]</strong> สภาวะ Active เกิดได้ต่อเมื่อกำแพงขยับออกจากดินราว 0.001-0.004H
                                กำแพงที่ยืนบนเสาเข็มถูกยึดไม่ให้ขยับ จึงต้องใช้ K<Sub text="0"/>
                                {pile.usePiles && calc.K_mode === 'ka' && <strong className="text-rose-600"> (ขณะนี้ใช้เสาเข็มแต่เลือก K_a อยู่)</strong>}
                            </div>
                        </StepBox>

                        <StepBox title="2. คำนวณหน่วยแรงดันดินด้านข้าง (Lateral Pressures, p)">
                            <div className="grid grid-cols-1 md:grid-cols-2 print:grid-cols-2 gap-4">
                                <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="1"/> (จาก Surcharge)</div>
                                    <div className="text-slate-600">p<Sub text="1"/> = K<Sub text="a"/> &times; Surcharge</div>
                                    <div className="text-slate-600">p<Sub text="1"/> = {calc.Ka.toFixed(3)} &times; {surcharge}</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.p1.toFixed(2)} กก./ม.&sup2;</div>
                                </div>
                                <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="2"/> (จากดินเหนือระดับน้ำ)</div>
                                    <div className="text-slate-600">p<Sub text="2"/> = K &times; &gamma;<Sub text="c"/> &times; h<Sub text="dry"/></div>
                                    <div className="text-slate-600">p<Sub text="2"/> = {calc.Ka.toFixed(3)} &times; {soil.gamma_c} &times; {calc.h_dry.toFixed(2)}</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.p2.toFixed(2)} กก./ม.&sup2;</div>
                                </div>
                                <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="3"/> (จากดินใต้ระดับน้ำ)</div>
                                    <div className="text-slate-600">p<Sub text="3"/> = K &times; (&gamma;<Sub text="sat"/> - &gamma;<Sub text="w"/>) &times; h<Sub text="w"/></div>
                                    <div className="text-slate-600">p<Sub text="3"/> = {calc.Ka.toFixed(3)} &times; {calc.gamma_sub} &times; {calc.h_w.toFixed(2)}</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.p3.toFixed(2)} กก./ม.&sup2;</div>
                                </div>
                                <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="4"/> (จากแรงดันน้ำสถิต)</div>
                                    <div className="text-slate-600">p<Sub text="4"/> = &gamma;<Sub text="w"/> &times; h<Sub text="w"/></div>
                                    <div className="text-slate-600">p<Sub text="4"/> = {calc.gamma_w} &times; {calc.h_w.toFixed(2)}</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.p4.toFixed(2)} กก./ม.&sup2;</div>
                                </div>
                            </div>
                        </StepBox>

                        <StepBox title="3. แรงลัพธ์และโมเมนต์พลิกคว่ำ (รอบจุด Toe)">
                            <table className="w-full text-left border-collapse mt-2 text-sm">
                                <thead>
                                    <tr className="border-b border-slate-300">
                                        <th className="py-2">รายการ</th>
                                        <th>สมการ P (กก.)</th>
                                        <th>แรง (P)</th>
                                        <th>แขน (y)</th>
                                        <th>โมเมนต์ (M<Sub text="O"/>)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2">P<Sub text="1"/> (Surcharge)</td>
                                        <td>p1 &times; (H+T1) &times; L</td>
                                        <td>{calc.P1.toFixed(2)}</td>
                                        <td>{calc.y1.toFixed(2)}</td>
                                        <td>{(calc.P1 * calc.y1).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2">P<Sub text="2"/> (ดินแห้ง-สามเหลี่ยม)</td>
                                        <td>&frac12; &times; p2 &times; h<Sub text="dry"/> &times; L</td>
                                        <td>{calc.P2_tri.toFixed(2)}</td>
                                        <td>{calc.y2_tri.toFixed(2)}</td>
                                        <td>{(calc.P2_tri * calc.y2_tri).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2">P<Sub text="2"/> (ดินแห้ง-สี่เหลี่ยม)</td>
                                        <td>p2 &times; h<Sub text="w"/> &times; L</td>
                                        <td>{calc.P2_rect.toFixed(2)}</td>
                                        <td>{calc.y2_rect.toFixed(2)}</td>
                                        <td>{(calc.P2_rect * calc.y2_rect).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2">P<Sub text="3"/> (ดินจมน้ำ)</td>
                                        <td>&frac12; &times; p3 &times; h<Sub text="w"/> &times; L</td>
                                        <td>{calc.P3.toFixed(2)}</td>
                                        <td>{calc.y3.toFixed(2)}</td>
                                        <td>{(calc.P3 * calc.y3).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="py-2">P<Sub text="4"/> (น้ำ)</td>
                                        <td>&frac12; &times; p4 &times; h<Sub text="w"/> &times; L</td>
                                        <td>{calc.P4.toFixed(2)}</td>
                                        <td>{calc.y4.toFixed(2)}</td>
                                        <td>{(calc.P4 * calc.y4).toFixed(2)}</td>
                                    </tr>
                                    <tr className="font-bold text-slate-800 bg-slate-100">
                                        <td colSpan="2" className="py-2 text-right pr-4">รวม (Total):</td>
                                        <td>&Sigma;P = {calc.sumP.toFixed(2)}</td>
                                        <td></td>
                                        <td className="text-rose-600">&Sigma;M<Sub text="O"/> = {calc.MO.toFixed(2)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </StepBox>

                    </div>
                );
            }

            const TabResisting = () => {
                const scale = Math.min(500 / calc.B, 250 / (geom.H + geom.T1), 150);
                const scaleX = scale; 
                const scaleY = scale;    
                const x0 = (750 - (calc.B * scaleX)) / 2;   
                const y0 = 350; 

                const svgH = geom.H * scaleY;
                const svgT1 = geom.T1 * scaleY;
                const svgC = geom.C * scaleX;
                const svgD = geom.D * scaleX;
                const svgG = geom.G * scaleX;
                const svgF = geom.F * scaleX;
                const svgB = calc.B * scaleX;
                const svgm = calc.m * scaleX;
                const svgd2 = calc.d2 * scaleY;
                const svgd3 = calc.d3 * scaleY;

                return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                    <h3 className="font-bold text-lg text-slate-700 mb-4 border-b pb-2">แรงต้านทานแนวดิ่ง (Resisting Forces)</h3>
                    
                    <div className="bg-emerald-50 print:bg-white text-emerald-800 print:text-slate-800 p-4 print:p-2 rounded-lg mb-6 print:mb-2 text-sm print:text-xs font-medium grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 print:grid-cols-5 gap-y-3 print:gap-y-1 gap-x-4 border border-emerald-100 print:border-slate-300 shadow-sm">
                        <div>C (Toe): {geom.C.toFixed(2)} ม.</div>
                        <div>D (Stem Bot): {geom.D.toFixed(2)} ม.</div>
                        <div>G (Stem Top): {geom.G.toFixed(2)} ม.</div>
                        <div>F (Heel): {geom.F.toFixed(2)} ม.</div>
                        <div>m (ระยะลาด D-G): {calc.m.toFixed(2)} ม.</div>
                        <div>H (Stem): {geom.H.toFixed(2)} ม.</div>
                        <div>T<Sub text="1"/> (Base): {geom.T1.toFixed(2)} ม.</div>
                        <div>d<Sub text="2"/> (ดินแห้ง): {calc.d2.toFixed(2)} ม.</div>
                        <div>d<Sub text="3"/> (ดินเปียก): {calc.d3.toFixed(2)} ม.</div>

                    <div className="flex flex-col gap-6 print:gap-2 mt-4 print:mt-0">
                        <div className="bg-slate-50 print:bg-transparent rounded-xl flex flex-col items-center justify-center p-6 print:p-0 border border-slate-200 print:border-none overflow-visible">
                            <h4 className="text-base print:text-sm font-semibold text-slate-700 mb-4 print:mb-2 w-full text-center">สัดส่วนพื้นที่หน้าตัด และ Dimensions (ไดอะแกรม)</h4>
                            <svg viewBox="0 0 750 450" className="w-full max-w-3xl print:max-w-xl h-auto drop-shadow-sm mx-auto">
                                <line x1="20" y1={y0 - svgH - svgT1} x2="730" y2={y0 - svgH - svgT1} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                
                                <rect x={x0} y={y0 - svgT1} width={svgC} height={svgT1} fill="#94a3b8" stroke="#475569" strokeWidth="1" />
                                {geom.C > 0 && <text x={x0 + svgC/2} y={y0 - svgT1/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W1</text>}

                                <rect x={x0 + svgC} y={y0 - svgT1} width={svgD + svgF} height={svgT1} fill="#cbd5e1" stroke="#475569" strokeWidth="1" />
                                <text x={x0 + svgC + (svgD+svgF)/2} y={y0 - svgT1/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W4</text>

                                <rect x={x0 + svgC} y={y0 - svgT1 - svgH} width={svgG} height={svgH} fill="#e2e8f0" stroke="#475569" strokeWidth="1" />
                                {geom.G > 0 && <text x={x0 + svgC + svgG/2} y={y0 - svgT1 - svgH/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W2</text>}

                                {calc.m > 0 && (
                                    <g>
                                        <polygon points={`${x0+svgC+svgG},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1} ${x0+svgC+svgG},${y0-svgT1}`} fill="#f1f5f9" stroke="#475569" strokeWidth="1" />
                                        <text x={x0 + svgC + svgG + svgm/3} y={y0 - svgT1 - svgH/3 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W3</text>
                                    </g>
                                )}

                                {calc.m > 0 && (
                                    <g>
                                        <polygon points={`${x0+svgC+svgG},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1}`} fill="#fde68a" stroke="#d97706" strokeWidth="1" />
                                        <text x={x0 + svgC + svgG + svgm*2/3} y={y0 - svgT1 - svgH*2/3 + 5} fill="#92400e" fontSize="14" textAnchor="middle" fontWeight="bold">W5</text>

                                    </g>

                                {calc.d3 > 0 && (
                                    <g>
                                        <rect x={x0 + svgC + svgD} y={y0 - svgT1 - svgH + svgd2} width={svgF} height={svgd3} fill="#93c5fd" stroke="#2563eb" strokeWidth="1" />
                                        <text x={x0 + svgC + svgD + svgF/2} y={y0 - svgT1 - svgH + svgd2 + svgd3/2 + 5} fill="#1e3a8a" fontSize="14" textAnchor="middle" fontWeight="bold">W7</text>
                                    </g>
                                )}
