<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retaining Wall Stability Analysis</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="โปรแกรมคำนวณเสถียรภาพและแรงอัดใต้ฐานรากกำแพงกันดิน">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><path d='M20 80h60v10H20zm10-50h15v50H30zm15 10l25 40H45z' fill='%2338bdf8'/></svg>">

    <!-- CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', 'Inter', sans-serif; background-color: #f1f5f9; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #64748b; hover:text-slate-900; }
        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const Fraction = ({ top, bottom }) => (
            <div className="inline-flex flex-col items-center justify-center align-middle mx-1" style={{ verticalAlign: 'middle' }}>
                <span className="border-b border-slate-400 pb-0.5 px-1 leading-none">{top}</span>
                <span className="pt-0.5 px-1 leading-none">{bottom}</span>
            </div>
        );

        const StepBox = ({ title, children }) => (
            <div className="bg-slate-50 border border-slate-200 rounded-lg p-4 mb-4">
                <h4 className="font-semibold text-slate-700 mb-2">{title}</h4>
                <div className="text-slate-600 text-sm overflow-x-auto overflow-y-hidden">{children}</div>
            </div>
        );

        const Badge = ({ condition, textTrue = "ผ่าน", textFalse = "ไม่ผ่าน" }) => (
            <span className={`px-2 py-1 rounded text-xs font-semibold ${condition ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                {condition ? textTrue : textFalse}
            </span>
        );

        const Sub = ({ text }) => <sub>{text}</sub>;

        const App = () => {
            const [activeTab, setActiveTab] = useState('dashboard');

            // Global Inputs State
            const [soil, setSoil] = useState({ gamma_c: 1900, gamma_sat: 2100, phi: 30 });
            const [base, setBase] = useState({ f: 0.5, q_allow: 8000 });
            const [surcharge, setSurcharge] = useState(500);
            
            // Geometry State
            const [geom, setGeom] = useState({ H: 4.0, C: 0.6, D: 0.5, G: 0.3, F: 1.4, T1: 0.4, waterDepth: 1.5 });

            // Layer Visibility State (ย้ายมาไว้บนสุดเพื่อป้องกัน Error Rule of Hooks)
            const [showP1, setShowP1] = useState(true);
            const [showP2Tri, setShowP2Tri] = useState(true);
            const [showP2Rect, setShowP2Rect] = useState(true);
            const [showP3, setShowP3] = useState(true);
            const [showP4, setShowP4] = useState(true);

            const calc = useMemo(() => {
                // Soil Mechanics
                const gamma_w = 1000;
                const gamma_sub = soil.gamma_sat - gamma_w;
                const Ka = Math.pow(Math.tan((45 - soil.phi/2) * Math.PI/180), 2);
                
                // Geometry logic
                const B = geom.C + geom.D + geom.F;
                const m = Math.max(0, geom.D - geom.G); // ระยะ slope แนวนอน
                const d2 = Math.max(0, Math.min(geom.waterDepth, geom.H)); // Dry depth
                const d3 = Math.max(0, geom.H - d2); // Submerged depth
                const H_tot = geom.H + geom.T1;

                // Driving Forces
                const p1 = Ka * surcharge;
                const P1 = p1 * H_tot;
                const y1 = H_tot / 2;
                
                const p2 = Ka * soil.gamma_c * d2;
                const P2_tri = 0.5 * p2 * d2;
                const y2_tri = d3 + geom.T1 + (d2 / 3);
                const P2_rect = p2 * (d3 + geom.T1);
                const y2_rect = (d3 + geom.T1) / 2;
                const P2 = P2_tri + P2_rect;
                
                const p3 = Ka * gamma_sub * (d3 + geom.T1);
                const P3 = 0.5 * p3 * (d3 + geom.T1);
                const y3 = (d3 + geom.T1) / 3;

                const p4 = gamma_w * (d3 + geom.T1);
                const P4 = 0.5 * p4 * (d3 + geom.T1);
                const y4 = (d3 + geom.T1) / 3;

                const sumP = P1 + P2 + P3 + P4;
                const MO = (P1*y1) + (P2_tri*y2_tri) + (P2_rect*y2_rect) + (P3*y3) + (P4*y4);

                // Resisting Forces
                const w1 = geom.C * geom.T1 * 2400; 
                const x1 = geom.C / 2;
                
                const w2 = geom.G * geom.H * 2400; 
                const x2 = geom.C + (geom.G / 2);

                const w3 = 0.5 * m * geom.H * 2400; 
                const x3 = geom.C + geom.G + (m / 3);

                const w4 = (geom.D + geom.F) * geom.T1 * 2400; 
                const x4 = geom.C + ((geom.D + geom.F) / 2);

                const Area_tot = 0.5 * m * geom.H;
                const m2 = geom.H > 0 ? m * (d3 / geom.H) : 0;
                const Area_wet = 0.5 * m2 * d3;
                const Area_dry = Area_tot - Area_wet;
                const W5_wet = Area_wet * soil.gamma_sat;
                const W5_dry = Area_dry * soil.gamma_c;
                const w5 = W5_wet + W5_dry;
                
                const x_tot = geom.C + geom.D - (m / 3);
                const x_wet = geom.C + geom.D - (m2 / 3);
                const x_dry = Area_dry > 0 ? ((Area_tot * x_tot) - (Area_wet * x_wet)) / Area_dry : 0;
                const x5 = w5 > 0 ? ((W5_dry * x_dry) + (W5_wet * x_wet)) / w5 : 0;

                const w6 = geom.F * d2 * soil.gamma_c; 
                const x6 = geom.C + geom.D + (geom.F / 2);

                const w7 = geom.F * d3 * soil.gamma_sat; 
                const x7 = geom.C + geom.D + (geom.F / 2);

                const w8 = surcharge * (m + geom.F); 
                const x8 = geom.C + geom.G + ((m + geom.F) / 2);

                const sumV = w1 + w2 + w3 + w4 + w5 + w6 + w7 + w8;
                const MR = (w1*x1) + (w2*x2) + (w3*x3) + (w4*x4) + (w5*x5) + (w6*x6) + (w7*x7) + (w8*x8);

                // Stability
                const FS_ot = MR / MO;
                const FS_slide = (base.f * sumV) / sumP;

                // Bearing
                const X_bar = (MR - MO) / sumV;
                const e = (B / 2) - X_bar;
                const B6 = B / 6;
                const isMiddleThird = Math.abs(e) <= B6;
                
                const q_max = (sumV / B) * (1 + (6 * e / B));
                const q_min = (sumV / B) * (1 - (6 * e / B));

                return {
                    B, m, Ka, gamma_w, gamma_sub, d2, d3, H_tot,
                    p1, P1, y1, p2, P2_tri, y2_tri, P2_rect, y2_rect, P2, p3, P3, y3, p4, P4, y4, sumP, MO,
                    w1, x1, w2, x2, w3, x3, w4, x4, w5, x5, w6, x6, w7, x7, w8, x8, sumV, MR,
                    FS_ot, FS_slide, X_bar, e, B6, isMiddleThird, q_max, q_min,
                    W5_dry, W5_wet
                };
            }, [soil, base, surcharge, geom]);

            const handleNum = (setter, field) => (e) => {
                setter(prev => ({ ...prev, [field]: parseFloat(e.target.value) || 0 }));
            };

            const GlobalNav = () => (
                <div className="bg-slate-900 text-slate-300 text-sm py-2 px-4 flex justify-between items-center shadow-md">
                    <div className="flex items-center space-x-2">
                        <svg className="w-5 h-5 text-sky-400" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002-2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                        <span className="font-semibold text-white tracking-wide">STRUCTURAL APPS</span>
                    </div>
                </div>
            );

            const GlobalInputs = () => (
                <div className="mb-6 space-y-4">
                    {/* Box 1: พารามิเตอร์การออกแบบ */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 border-b pb-2">พารามิเตอร์การออกแบบ (Design Parameters)</h3>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <h4 className="text-xs font-semibold text-slate-400 uppercase mb-3">พารามิเตอร์ดิน (Soil)</h4>
                                <div className="space-y-3 text-sm">
                                    <div className="flex justify-between items-center">
                                        <span>&gamma;<Sub text="compact"/> (กก./ม.&sup3;)</span>
                                        <input type="number" className="w-24 p-1.5 border border-slate-300 rounded-md text-right focus:outline-none focus:ring-2 focus:ring-blue-500" value={soil.gamma_c} onChange={handleNum(setSoil, 'gamma_c')} />
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span>&gamma;<Sub text="sat"/> (กก./ม.&sup3;)</span>
                                        <input type="number" className="w-24 p-1.5 border border-slate-300 rounded-md text-right focus:outline-none focus:ring-2 focus:ring-blue-500" value={soil.gamma_sat} onChange={handleNum(setSoil, 'gamma_sat')} />
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span>มุม &phi; (องศา)</span>
                                        <div className="flex items-center">
                                            {(soil.phi < 15 || soil.phi > 45) && <span className="text-rose-500 text-xs mr-2">เตือน: ค่าแปลก</span>}
                                            <input type="number" className="w-24 p-1.5 border border-slate-300 rounded-md text-right focus:outline-none focus:ring-2 focus:ring-blue-500" value={soil.phi} onChange={handleNum(setSoil, 'phi')} />
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <h4 className="text-xs font-semibold text-slate-400 uppercase mb-3">ฐานราก (Base)</h4>
                                <div className="space-y-3 text-sm">
                                    <div className="flex justify-between items-center">
                                        <span>สัมประสิทธิ์เสียดทาน (f)</span>
                                        <input type="number" step="0.1" className="w-24 p-1.5 border border-slate-300 rounded-md text-right focus:outline-none focus:ring-2 focus:ring-blue-500" value={base.f} onChange={handleNum(setBase, 'f')} />
                                    </div>
                                    <div className="flex justify-between items-center">
                                        <span>q<Sub text="allow"/> (กก./ม.&sup2;)</span>
                                        <input type="number" className="w-24 p-1.5 border border-slate-300 rounded-md text-right focus:outline-none focus:ring-2 focus:ring-blue-500" value={base.q_allow} onChange={handleNum(setBase, 'q_allow')} />
                                    </div>
                                </div>
                            </div>
                            <div>
                                <h4 className="text-xs font-semibold text-slate-400 uppercase mb-3">น้ำหนักบรรทุก (Load)</h4>
                                <div className="space-y-3 text-sm">
                                    <div className="flex justify-between items-center">
                                        <span className="font-medium text-slate-700">Surcharge (กก./ม.&sup2;)</span>
                                        <input type="number" className="w-24 p-1.5 border border-slate-300 rounded-md text-right bg-sky-50 focus:outline-none focus:ring-2 focus:ring-blue-500" value={surcharge} onChange={(e) => setSurcharge(parseFloat(e.target.value)||0)} />
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* Box 2: มิติโครงสร้าง */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b pb-2 mb-4">
                            <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-2 sm:mb-0">มิติโครงสร้างกำแพงกันดิน (Wall Dimensions)</h3>
                            <span className="text-xs text-slate-600 font-medium bg-slate-100 px-3 py-1 rounded-full">ความกว้างฐานรวม (B) = <span className="font-bold text-blue-600">{calc.B.toFixed(2)} ม.</span></span>
                        </div>
                        <div className="grid grid-cols-2 md:grid-cols-4 gap-6">
                            <div className="space-y-3 text-sm">
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-600">สูง (H)</span>
                                    <div className="flex items-center"><input type="number" step="0.1" className="w-16 p-1.5 border border-slate-300 rounded-md text-right mr-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value={geom.H} onChange={handleNum(setGeom, 'H')} /><span className="text-slate-400">ม.</span></div>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-600">หนาฐาน (T1)</span>
                                    <div className="flex items-center"><input type="number" step="0.1" className="w-16 p-1.5 border border-slate-300 rounded-md text-right mr-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value={geom.T1} onChange={handleNum(setGeom, 'T1')} /><span className="text-slate-400">ม.</span></div>
                                </div>
                            </div>
                            <div className="space-y-3 text-sm">
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-600">ยื่นหน้า Toe (C)</span>
                                    <div className="flex items-center"><input type="number" step="0.1" className="w-16 p-1.5 border border-slate-300 rounded-md text-right mr-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value={geom.C} onChange={handleNum(setGeom, 'C')} /><span className="text-slate-400">ม.</span></div>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-600">กว้างฐานล่าง (D)</span>
                                    <div className="flex items-center"><input type="number" step="0.1" className="w-16 p-1.5 border border-slate-300 rounded-md text-right mr-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value={geom.D} onChange={handleNum(setGeom, 'D')} /><span className="text-slate-400">ม.</span></div>
                                </div>
                            </div>
                            <div className="space-y-3 text-sm">
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-600">กว้างยอดกำแพง (G)</span>
                                    <div className="flex items-center"><input type="number" step="0.1" className="w-16 p-1.5 border border-slate-300 rounded-md text-right mr-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value={geom.G} onChange={handleNum(setGeom, 'G')} /><span className="text-slate-400">ม.</span></div>
                                </div>
                                <div className="flex justify-between items-center">
                                    <span className="text-slate-600">ยื่นหลัง Heel (F)</span>
                                    <div className="flex items-center"><input type="number" step="0.1" className="w-16 p-1.5 border border-slate-300 rounded-md text-right mr-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value={geom.F} onChange={handleNum(setGeom, 'F')} /><span className="text-slate-400">ม.</span></div>
                                </div>
                            </div>
                            <div className="space-y-3 text-sm">
                                <div className="flex justify-between items-center">
                                    <span className="font-medium text-slate-700">ระดับน้ำจากผิวดิน</span>
                                    <div className="flex items-center"><input type="number" step="0.1" className="w-16 p-1.5 border border-blue-300 rounded-md text-right bg-blue-50 mr-2 focus:outline-none focus:ring-2 focus:ring-blue-500" value={geom.waterDepth} onChange={handleNum(setGeom, 'waterDepth')} /><span className="text-slate-400">ม.</span></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );

            const TabDashboard = () => {
                // คำนวณ Scale และตำแหน่งสำหรับวาดรูป Dashboard ใหม่ (Overall Behavior)
                const scaleX = Math.min(300 / calc.B, 120); 
                const scaleY = Math.min(250 / (geom.H + geom.T1), 100);    
                const x0 = (600 - (calc.B * scaleX)) / 2;   
                const y0 = 320; 

                // มิติที่สเกลแล้ว
                const svgH = geom.H * scaleY;
                const svgT1 = geom.T1 * scaleY;
                const svgC = geom.C * scaleX;
                const svgD = geom.D * scaleX;
                const svgG = geom.G * scaleX;
                const svgF = geom.F * scaleX;
                const svgB = calc.B * scaleX;

                // พิกัดของรูปโพลีกอนกำแพงกันดิน (ภาพรวม)
                const p1 = `${x0},${y0}`; // Toe Bot-L
                const p2 = `${x0 + svgB},${y0}`; // Heel Bot-R
                const p3 = `${x0 + svgB},${y0 - svgT1}`; // Heel Top-R
                const p4 = `${x0 + svgC + svgD},${y0 - svgT1}`; // Stem Bot-R
                const p5 = `${x0 + svgC + svgG},${y0 - svgT1 - svgH}`; // Stem Top-R
                const p6 = `${x0 + svgC},${y0 - svgT1 - svgH}`; // Stem Top-L
                const p7 = `${x0 + svgC},${y0 - svgT1}`; // Toe Top-R
                const p8 = `${x0},${y0 - svgT1}`; // Toe Top-L
                const wallPolygon = `${p1} ${p2} ${p3} ${p4} ${p5} ${p6} ${p7} ${p8}`;

                // ตำแหน่งและสเกลกราฟแรงอัด
                const max_q_value = Math.max(Math.abs(calc.q_max), Math.abs(calc.q_min), 1);
                const q_scale = 80 / max_q_value; // จำกัดกราฟให้สูงไม่เกิน 80px
                const h_max = calc.q_max * q_scale;
                const h_min = calc.q_min * q_scale;

                // จุดเซนทรอยด์ของแรง (แขนโมเมนต์)
                const x_v = x0 + (calc.X_bar * scaleX);
                const y_bar_P = calc.sumP > 0 ? calc.MO / calc.sumP : 0; // หาจุดศูนย์รวมแรงดันด้านข้าง
                const y_p = y0 - (y_bar_P * scaleY);

                return (
                    <div className="space-y-6">
                        {/* Summary Cards */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                                <span className="text-slate-500 text-sm mb-1 font-medium">Overturning (F.S.)</span>
                                <div className="text-3xl font-bold text-slate-800 mb-2">{calc.FS_ot.toFixed(2)}</div>
                                <Badge condition={calc.FS_ot >= 1.5} textTrue={"\u2265 1.50 ผ่าน"} textFalse={"\u003C 1.50 ไม่ผ่าน"} />
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                                <span className="text-slate-500 text-sm mb-1 font-medium">Sliding (F.S.)</span>
                                <div className="text-3xl font-bold text-slate-800 mb-2">{calc.FS_slide.toFixed(2)}</div>
                                <Badge condition={calc.FS_slide >= 1.5} textTrue={"\u2265 1.50 ผ่าน"} textFalse={"\u003C 1.50 ไม่ผ่าน"} />
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                                <span className="text-slate-500 text-sm mb-1 font-medium">เยื้องศูนย์ e (ม.)</span>
                                <div className="text-3xl font-bold text-slate-800 mb-2">{Math.abs(calc.e).toFixed(3)}</div>
                                <Badge condition={calc.isMiddleThird} textTrue={`\u2264 B/6 (${calc.B6.toFixed(2)} ม.)`} textFalse={`\u003E B/6 (${calc.B6.toFixed(2)} ม.)`} />
                            </div>
                            <div className="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                                <span className="text-slate-500 text-sm mb-1 font-medium">q<Sub text="max"/> (กก./ม.&sup2;)</span>
                                <div className="text-3xl font-bold text-slate-800 mb-2">{calc.q_max.toFixed(0)}</div>
                                <Badge condition={calc.q_max <= base.q_allow} textTrue={"\u2264 q_allow ผ่าน"} textFalse={"\u003E q_allow ไม่ผ่าน"} />
                            </div>
                        </div>

                        {/* Overall Behavior Diagram */}
                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center overflow-visible">
                            <h4 className="text-lg font-bold text-slate-700 mb-6 w-full text-center border-b pb-2">ไดอะแกรมแรงลัพธ์และแรงอัดใต้ฐานราก (Overall Behavior)</h4>
                            {/* ปรับขยาย viewBox จาก 600 เป็น 650 เพื่อเพิ่มพื้นที่ฝั่งขวากันข้อความตกขอบ */}
                            <svg viewBox="0 0 650 450" className="w-full max-w-3xl h-auto drop-shadow-sm mx-auto">
                                <defs>
                                    <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="8" height="8">
                                        <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#fb7185" strokeWidth="1" />
                                    </pattern>
                                    <pattern id="tensionHatch" patternUnits="userSpaceOnUse" width="8" height="8">
                                        <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#c084fc" strokeWidth="1" />
                                    </pattern>
                                </defs>

                                {/* ผิวดินและเส้นฐาน (ปรับ x2 ให้ยาวขึ้นตามขนาดจอ 650) */}
                                <line x1="20" y1={y0 - svgH - svgT1} x2="630" y2={y0 - svgH - svgT1} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                <text x="610" y={y0 - svgH - svgT1 - 8} fill="#64748b" fontSize="12" textAnchor="end">ระดับดิน</text>

                                {/* รูปทรงกำแพงรวม */}
                                <polygon points={wallPolygon} fill="#e2e8f0" stroke="#64748b" strokeWidth="2" strokeLinejoin="round" />

                                {/* กราฟแรงอัดใต้ฐานราก (Bearing Pressure) */}
                                {/* แกนอ้างอิง 0 */}
                                <line x1={x0} y1={y0} x2={x0 + svgB} y2={y0} stroke="#475569" strokeWidth="2" />
                                
                                {/* พื้นที่ใต้กราฟ */}
                                <polygon 
                                    points={`${x0},${y0} ${x0 + svgB},${y0} ${x0 + svgB},${y0 + h_min} ${x0},${y0 + h_max}`}
                                    fill={calc.q_min < 0 ? "url(#tensionHatch)" : "url(#diagonalHatch)"}
                                    stroke={calc.q_min < 0 ? "#a855f7" : "#e11d48"} strokeWidth="1.5"
                                />
                                
                                {/* เส้นขอบกราฟแรงอัด */}
                                <line x1={x0} y1={y0 + h_max} x2={x0 + svgB} y2={y0 + h_min} stroke="#be123c" strokeWidth="2" />
                                <line x1={x0} y1={y0} x2={x0} y2={y0 + h_max} stroke="#be123c" strokeWidth="2" />
                                <line x1={x0 + svgB} y1={y0} x2={x0 + svgB} y2={y0 + h_min} stroke="#be123c" strokeWidth="2" />

                                {/* Text Label แรงอัด */}
                                <text x={x0 - 8} y={y0 + h_max + (calc.q_max > 0 ? 15 : -5)} fill="#be123c" fontSize="14" fontWeight="bold" textAnchor="end">
                                    q_max = {calc.q_max.toFixed(0)}
                                </text>
                                <text x={x0 + svgB + 8} y={y0 + h_min + (calc.q_min > 0 ? 15 : -5)} fill={calc.q_min < 0 ? "#7e22ce" : "#be123c"} fontSize="14" fontWeight="bold" textAnchor="start">
                                    q_min = {calc.q_min.toFixed(0)} {calc.q_min < 0 && '(Tension)'}
                                </text>

                                {/* ลูกศรแรงต้านแนวดิ่ง (V) วาดด้วย Polygon ป้องกันบัค */}
                                <line x1={x_v} y1={y0 - svgH - svgT1 - 60} x2={x_v} y2={y0 - 35} stroke="#10b981" strokeWidth="4" strokeDasharray="6,4" />
                                <polygon points={`${x_v - 8},${y0 - 36} ${x_v + 8},${y0 - 36} ${x_v},${y0 - 20}`} fill="#10b981" />
                                <circle cx={x_v} cy={y0} r="4" fill="#10b981" />
                                <text x={x_v + 12} y={y0 - svgH - svgT1 - 45} fill="#047857" fontSize="16" fontWeight="bold">
                                    &#931;V = {calc.sumV.toFixed(0)} kg
                                </text>
                                <text x={x_v + 12} y={y0 - svgH - svgT1 - 25} fill="#047857" fontSize="13">
                                    (X&#772; = {calc.X_bar.toFixed(2)}m)
                                </text>

                                {/* ลูกศรแรงผลักด้านข้าง (P) วาดด้วย Polygon ให้ปลายชนขอบกำแพงเป๊ะๆ */}
                                <line x1={x0 + svgB + 100} y1={y_p} x2={x0 + svgB + 15} y2={y_p} stroke="#0ea5e9" strokeWidth="4" />
                                <polygon points={`${x0 + svgB + 16},${y_p - 8} ${x0 + svgB + 16},${y_p + 8} ${x0 + svgB},${y_p}`} fill="#0ea5e9" />
                                <text x={x0 + svgB + 55} y={y_p - 12} fill="#0369a1" fontSize="16" fontWeight="bold" textAnchor="middle">
                                    &#931;P = {calc.sumP.toFixed(0)} kg
                                </text>
                                <text x={x0 + svgB + 55} y={y_p + 20} fill="#0369a1" fontSize="13" textAnchor="middle">
                                    (y&#772; = {y_bar_P.toFixed(2)}m)
                                </text>

                                {/* ระยะเยื้องศูนย์ e และกึ่งกลางฐาน เลื่อนลงมาใต้กราฟแรงอัดเพื่อไม่ให้ทับกับลายเส้น */}
                                <line x1={x0 + svgB/2} y1={y0} x2={x0 + svgB/2} y2={y0 + 105} stroke="#64748b" strokeWidth="1" strokeDasharray="3,3" />
                                <text x={x0 + svgB/2} y={y0 + 120} fill="#64748b" fontSize="12" textAnchor="middle">B/2 ({(calc.B/2).toFixed(2)}m)</text>

                                {/* ขีดเส้นประแนวแรง V ลงมาด้านล่าง */}
                                <line x1={x_v} y1={y0} x2={x_v} y2={y0 + 105} stroke="#10b981" strokeWidth="1" strokeDasharray="3,3" opacity="0.6" />
                                
                                {Math.abs(calc.e) > 0.05 && (
                                    <g>
                                        <line x1={x0 + svgB/2} y1={y0 + 95} x2={x_v} y2={y0 + 95} stroke="#f59e0b" strokeWidth="2" />
                                        {/* ขีดเส้นตั้งปิดหัวท้ายให้ดูเป็น Dimension ชัดเจน */}
                                        <line x1={x0 + svgB/2} y1={y0 + 90} x2={x0 + svgB/2} y2={y0 + 100} stroke="#f59e0b" strokeWidth="2" />
                                        <line x1={x_v} y1={y0 + 90} x2={x_v} y2={y0 + 100} stroke="#f59e0b" strokeWidth="2" />
                                        <text x={(x0 + svgB/2 + x_v)/2} y={y0 + 88} fill="#d97706" fontSize="13" fontWeight="bold" textAnchor="middle">e = {calc.e.toFixed(3)}</text>
                                    </g>
                                )}
                            </svg>
                        </div>
                    </div>
                );
            };

            const TabDriving = () => {
                const scaleY = 280 / calc.H_tot; 
                const maxP = calc.p1 + calc.p2 + calc.p3 + calc.p4;
                const scaleX = maxP > 0 ? 250 / maxP : 1;
                const x0 = 120; 
                const y0 = 60; 

                const svgH = calc.H_tot * scaleY;
                const svgD2 = calc.d2 * scaleY;
                const svgD3_T1 = (calc.d3 + geom.T1) * scaleY;

                const y_WT = y0 + svgD2;
                const y_Base = y0 + svgH;

                const w1 = calc.p1 * scaleX;
                const w2 = calc.p2 * scaleX;
                const w3 = calc.p3 * scaleX;
                const w4 = calc.p4 * scaleX;

                const max_x = x0 + w1 + w2 + w3 + w4;
                const arrow_x = max_x + 20;
                const dim_x = arrow_x + 50; 

                const y_P1 = y0 + svgH / 2;
                const y_P2Tri = y0 + svgD2 * 2 / 3;
                const y_P2Rect = y_WT + svgD3_T1 / 2;
                const y_P3 = y_WT + svgD3_T1 * 2 / 3 - (svgD3_T1 > 40 ? 15 : 0);
                const y_P4 = y_WT + svgD3_T1 * 2 / 3 + (svgD3_T1 > 40 ? 15 : 0);

                return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
                    <h3 className="font-bold text-lg text-slate-700 border-b pb-2">แรงผลักด้านข้าง (Driving Forces)</h3>
                    
                    <div className="bg-sky-50 text-sky-800 p-4 rounded text-sm font-medium grid grid-cols-2 md:grid-cols-5 gap-3 border border-sky-100 shadow-sm">
                        <div>K<Sub text="a"/> = {calc.Ka.toFixed(3)}</div>
                        <div>Surcharge = {surcharge} กก./ม.&sup2;</div>
                        <div>&gamma;<Sub text="c"/> = {soil.gamma_c} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="sat"/> = {soil.gamma_sat} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="w"/> = {calc.gamma_w} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="sub"/> = {calc.gamma_sub} กก./ม.&sup3;</div>
                        <div>d<Sub text="2"/> (ดินแห้ง) = {calc.d2.toFixed(2)} ม.</div>
                        <div>d<Sub text="3"/> (ดินเปียก) = {calc.d3.toFixed(2)} ม.</div>
                        <div>T<Sub text="1"/> (ฐานราก) = {geom.T1.toFixed(2)} ม.</div>
                        <div>H + T<Sub text="1"/> = {calc.H_tot.toFixed(2)} ม.</div>
                    </div>

                    <div className="grid lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-slate-50 rounded-xl flex flex-col items-center justify-center p-6 border border-slate-200 overflow-hidden">
                            <h4 className="text-base font-semibold text-slate-700 mb-4 w-full text-center">แผนภาพแรงผลักด้านข้างและทิศทางของแรง (Driving Pressure Distribution)</h4>
                            <svg viewBox="0 0 800 450" className="w-full h-auto max-w-full">
                                <defs>
                                    <marker id="arrow-force" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                                        <polygon points="0 0, 8 4, 0 8" fill="#dc2626" />
                                    </marker>
                                    <marker id="arrow-dim-y" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                                        <polygon points="0 0, 6 3, 0 6" fill="#64748b" />
                                    </marker>
                                </defs>

                                <line x1="20" y1={y0} x2={dim_x + 20} y2={y0} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                <text x={dim_x + 25} y={y0-8} fill="#64748b" fontSize="14" fontWeight="bold">ผิวดิน</text>
                                
                                {calc.d2 < calc.H_tot && (
                                    <g>
                                        <line x1="20" y1={y_WT} x2={dim_x + 20} y2={y_WT} stroke="#38bdf8" strokeWidth="2" strokeDasharray="5,5" />
                                        <text x={dim_x + 25} y={y_WT+18} fill="#0284c7" fontSize="14" fontWeight="bold">ระดับน้ำ</text>
                                    </g>
                                )}

                                <line x1="20" y1={y_Base} x2={dim_x + 20} y2={y_Base} stroke="#475569" strokeWidth="2" />
                                <text x={dim_x + 25} y={y_Base+4} fill="#475569" fontSize="14" fontWeight="bold">ก้นฐานราก</text>

                                <rect x={x0-40} y={y0} width="40" height={svgH} fill="#cbd5e1" stroke="#475569" strokeWidth="2" />
                                <text x={x0-20} y={y0+svgH/2} fill="#475569" fontSize="13" textAnchor="middle" transform={`rotate(-90, ${x0-20}, ${y0+svgH/2})`}>กำแพงกันดิน (Wall)</text>
                                
                                {showP1 && calc.P1 > 0 && (
                                    <g>
                                        <rect x={x0} y={y0} width={w1} height={svgH} fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" strokeDasharray="4" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P1} x2={x0+10} y2={y_P1} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P1+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P1</text>
                                    </g>
                                )}
                                
                                {showP2Tri && calc.P2_tri > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1},${y0} ${x0+w1+w2},${y_WT} ${x0+w1},${y_WT}`} fill="rgba(250, 204, 21, 0.4)" stroke="#ca8a04" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P2Tri} x2={x0+10} y2={y_P2Tri} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P2Tri+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P2</text>
                                    </g>
                                )}
                                
                                {showP2Rect && calc.P2_rect > 0 && (
                                    <g>
                                        <rect x={x0+w1} y={y_WT} width={w2} height={svgD3_T1} fill="rgba(251, 146, 60, 0.4)" stroke="#ea580c" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P2Rect} x2={x0+10} y2={y_P2Rect} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P2Rect+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P2</text>
                                    </g>
                                )}
                                
                                {showP3 && calc.P3 > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1+w2},${y_WT} ${x0+w1+w2+w3},${y_Base} ${x0+w1+w2},${y_Base}`} fill="rgba(96, 165, 250, 0.4)" stroke="#2563eb" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P3} x2={x0+10} y2={y_P3} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P3+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P3</text>
                                    </g>
                                )}
                                
                                {showP4 && calc.P4 > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1+w2+w3},${y_WT} ${x0+w1+w2+w3+w4},${y_Base} ${x0+w1+w2+w3},${y_Base}`} fill="rgba(30, 58, 138, 0.3)" stroke="#1e3a8a" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P4} x2={x0+10} y2={y_P4} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P4+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P4</text>
                                    </g>
                                )}

                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={dim_x - 10} y1={y0} x2={dim_x + 10} y2={y0} />
                                    {calc.d2 > 0 && calc.d2 < calc.H_tot && <line x1={dim_x - 10} y1={y_WT} x2={dim_x + 10} y2={y_WT} />}
                                    <line x1={dim_x - 10} y1={y_Base} x2={dim_x + 10} y2={y_Base} />

                                    {calc.d2 > 0 && <line x1={dim_x} y1={y0} x2={dim_x} y2={y_WT} markerStart="url(#arrow-dim-y)" markerEnd="url(#arrow-dim-y)" />}
                                    {calc.d3 + geom.T1 > 0 && <line x1={dim_x} y1={y_WT} x2={dim_x} y2={y_Base} markerStart="url(#arrow-dim-y)" markerEnd="url(#arrow-dim-y)" />}
                                </g>
                                <g fill="#475569" fontSize="14" textAnchor="start" dominantBaseline="middle" fontFamily="sans-serif">
                                    {calc.d2 > 0 && <text x={dim_x + 15} y={y0 + svgD2/2}>d2 (แห้ง)</text>}
                                    {calc.d3 + geom.T1 > 0 && <text x={dim_x + 15} y={y_WT + svgD3_T1/2}>d3+T1 (เปียก)</text>}
                                </g>

                                <circle cx={x0} cy={y_Base} r="5" fill="#dc2626" />
                            </svg>
                        </div>
                        
                        <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 space-y-4">
                            <h3 className="font-bold text-lg text-slate-800 border-b pb-2">เลเยอร์ของแรงดัน</h3>
                            
                            <label className="flex items-start space-x-3 p-2 hover:bg-sky-50 rounded cursor-pointer transition">
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-sky-500" checked={showP1} onChange={e => setShowP1(e.target.checked)} />
                                <div>
                                    <div className="font-bold text-sky-600">P1: Surcharge</div>
                                    <div className="text-xs text-slate-500 mt-1">น้ำหนักกดทับด้านบน (สม่ำเสมอ) จึงเป็น <strong className="text-sky-700">สี่เหลี่ยมผืนผ้า</strong> ตลอดความลึก แขนโมเมนต์ตกกึ่งกลางความสูงทั้งหมด</div>
                                </div>
                            </label>

                            <label className={`flex items-start space-x-3 p-2 rounded cursor-pointer transition ${calc.d2 === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:bg-amber-50'}`}>
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-amber-500" checked={showP2Tri} onChange={e => setShowP2Tri(e.target.checked)} disabled={calc.d2 === 0} />
                                <div>
                                    <div className="font-bold text-amber-600">P2: ดินแห้ง (ส่วนสามเหลี่ยม)</div>
                                    <div className="text-xs text-slate-500 mt-1">น้ำหนักดินเพิ่มตามความลึกถึงระดับน้ำ กราฟเป็น <strong className="text-amber-700">สามเหลี่ยม</strong> แขนตกที่ 2/3 ของ d2</div>
                                </div>
                            </label>

                            <label className={`flex items-start space-x-3 p-2 rounded cursor-pointer transition ${calc.d2 === 0 || (calc.d3 + geom.T1) === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:bg-orange-50'}`}>
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-orange-500" checked={showP2Rect} onChange={e => setShowP2Rect(e.target.checked)} disabled={calc.d2 === 0 || (calc.d3 + geom.T1) === 0} />
                                <div>
                                    <div className="font-bold text-orange-600">P2: ดินแห้ง (ส่วนสี่เหลี่ยม)</div>
                                    <div className="text-xs text-slate-500 mt-1">มวลดินแห้งข้างบนกดทับดินเปียกข้างล่าง ทำตัวเสมือน Surcharge อีกก้อน เป็น <strong className="text-orange-700">สี่เหลี่ยม</strong> ในโซนล่าง</div>
                                </div>
                            </label>

                            <label className={`flex items-start space-x-3 p-2 rounded cursor-pointer transition ${(calc.d3 + geom.T1) === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:bg-blue-50'}`}>
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-blue-500" checked={showP3} onChange={e => setShowP3(e.target.checked)} disabled={(calc.d3 + geom.T1) === 0} />
                                <div>
                                    <div className="font-bold text-blue-600">P3: ดินเปียก/จมน้ำ</div>
                                    <div className="text-xs text-slate-500 mt-1">ดินใต้ระดับน้ำมีแรงลอยตัวพยุง เริ่มจาก 0 ที่ระดับน้ำ เป็น <strong className="text-blue-700">สามเหลี่ยม</strong> แขน 2/3 วัดจากผิวน้ำ</div>
                                </div>
                            </label>

                            <label className={`flex items-start space-x-3 p-2 rounded cursor-pointer transition ${(calc.d3 + geom.T1) === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:bg-indigo-50'}`}>
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-indigo-700" checked={showP4} onChange={e => setShowP4(e.target.checked)} disabled={(calc.d3 + geom.T1) === 0} />
                                <div>
                                    <div className="font-bold text-indigo-800">P4: แรงดันน้ำ (Hydrostatic)</div>
                                    <div className="text-xs text-slate-500 mt-1">น้ำเป็นของไหล ไม่มีแรงเสียดทาน (Ka = 1) ใช้ &gamma;_w คูณตรงๆ เป็น <strong className="text-indigo-700">สามเหลี่ยม</strong></div>
                                </div>
                            </label>
                        </div>
                    </div>
                    
                    <StepBox title="1. สัมประสิทธิ์แรงดันดินรุก (Rankine)">
                        K<Sub text="a"/> = tan&sup2;(45 - &phi;/2) = tan&sup2;(45 - {soil.phi}/2) = <strong className="text-blue-600">{calc.Ka.toFixed(3)}</strong>
                    </StepBox>

                    <StepBox title="2. คำนวณหน่วยแรงดันดินด้านข้าง (Lateral Pressures, p)">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="1"/> (จาก Surcharge)</div>
                                <div className="text-slate-600">p<Sub text="1"/> = K<Sub text="a"/> &times; Surcharge</div>
                                <div className="text-slate-600">p<Sub text="1"/> = {calc.Ka.toFixed(3)} &times; {surcharge}</div>
                                <div className="font-bold text-blue-700 mt-1">= {calc.p1.toFixed(2)} กก./ม.&sup2;</div>
                            </div>
                            <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="2"/> (จากดินเหนือระดับน้ำ)</div>
                                <div className="text-slate-600">p<Sub text="2"/> = K<Sub text="a"/> &times; &gamma;<Sub text="c"/> &times; d<Sub text="2"/></div>
                                <div className="text-slate-600">p<Sub text="2"/> = {calc.Ka.toFixed(3)} &times; {soil.gamma_c} &times; {calc.d2.toFixed(2)}</div>
                                <div className="font-bold text-blue-700 mt-1">= {calc.p2.toFixed(2)} กก./ม.&sup2;</div>
                            </div>
                            <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="3"/> (จากดินใต้ระดับน้ำ)</div>
                                <div className="text-slate-600">p<Sub text="3"/> = K<Sub text="a"/> &times; (&gamma;<Sub text="sat"/> - &gamma;<Sub text="w"/>) &times; (d<Sub text="3"/> + T<Sub text="1"/>)</div>
                                <div className="text-slate-600">p<Sub text="3"/> = {calc.Ka.toFixed(3)} &times; {calc.gamma_sub} &times; ({calc.d3.toFixed(2)} + {geom.T1.toFixed(2)})</div>
                                <div className="font-bold text-blue-700 mt-1">= {calc.p3.toFixed(2)} กก./ม.&sup2;</div>
                            </div>
                            <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="4"/> (จากแรงดันน้ำสถิต)</div>
                                <div className="text-slate-600">p<Sub text="4"/> = &gamma;<Sub text="w"/> &times; (d<Sub text="3"/> + T<Sub text="1"/>)</div>
                                <div className="text-slate-600">p<Sub text="4"/> = {calc.gamma_w} &times; ({calc.d3.toFixed(2)} + {geom.T1.toFixed(2)})</div>
                                <div className="font-bold text-blue-700 mt-1">= {calc.p4.toFixed(2)} กก./ม.&sup2;</div>
                            </div>
                        </div>
                    </StepBox>
                    
                    <StepBox title="3. แรงลัพธ์และโมเมนต์พลิกคว่ำ (รอบจุด Toe)">
                        <table className="w-full text-left border-collapse mt-2 text-sm">
                            <thead>
                                <tr className="border-b border-slate-300">
                                    <th className="py-2">รายการ</th>
                                    <th>สมการ P (กก./ม.)</th>
                                    <th>แรง (P)</th>
                                    <th>แขน (y)</th>
                                    <th>โมเมนต์ (M<Sub text="O"/>)</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr className="border-b border-slate-100">
                                    <td className="py-2">P<Sub text="1"/> (Surcharge)</td>
                                    <td>p1 &times; (H+T1)</td>
                                    <td>{calc.P1.toFixed(2)}</td>
                                    <td>{calc.y1.toFixed(2)}</td>
                                    <td>{(calc.P1 * calc.y1).toFixed(2)}</td>
                                </tr>
                                <tr className="border-b border-slate-100">
                                    <td className="py-2">P<Sub text="2"/> (ดินแห้ง-สามเหลี่ยม)</td>
                                    <td>&frac12; &times; p2 &times; d2</td>
                                    <td>{calc.P2_tri.toFixed(2)}</td>
                                    <td>{calc.y2_tri.toFixed(2)}</td>
                                    <td>{(calc.P2_tri * calc.y2_tri).toFixed(2)}</td>
                                </tr>
                                <tr className="border-b border-slate-100">
                                    <td className="py-2">P<Sub text="2"/> (ดินแห้ง-สี่เหลี่ยม)</td>
                                    <td>p2 &times; (d3+T1)</td>
                                    <td>{calc.P2_rect.toFixed(2)}</td>
                                    <td>{calc.y2_rect.toFixed(2)}</td>
                                    <td>{(calc.P2_rect * calc.y2_rect).toFixed(2)}</td>
                                </tr>
                                <tr className="border-b border-slate-100">
                                    <td className="py-2">P<Sub text="3"/> (ดินจมน้ำ)</td>
                                    <td>&frac12; &times; p3 &times; (d3+T1)</td>
                                    <td>{calc.P3.toFixed(2)}</td>
                                    <td>{calc.y3.toFixed(2)}</td>
                                    <td>{(calc.P3 * calc.y3).toFixed(2)}</td>
                                </tr>
                                <tr className="border-b border-slate-200">
                                    <td className="py-2">P<Sub text="4"/> (น้ำ)</td>
                                    <td>&frac12; &times; p4 &times; (d3+T1)</td>
                                    <td>{calc.P4.toFixed(2)}</td>
                                    <td>{calc.y4.toFixed(2)}</td>
                                    <td>{(calc.P4 * calc.y4).toFixed(2)}</td>
                                </tr>
                                <tr className="font-bold text-slate-800 bg-slate-100">
                                    <td colSpan="2" className="py-2 text-right pr-4">รวม (Total):</td>
                                    <td>&Sigma;P = {calc.sumP.toFixed(2)}</td>
                                    <td></td>
                                    <td className="text-rose-600">&Sigma;M<Sub text="O"/> = {calc.MO.toFixed(2)}</td>
                                </tr>
                            </tbody>
                        </table>
                    </StepBox>
                </div>
                );
            };

            const TabResisting = () => {
                const scaleX = Math.min(450 / calc.B, 150); 
                const scaleY = 250 / (geom.H + geom.T1);    
                const x0 = (600 - (calc.B * scaleX)) / 2;   
                const y0 = 350; 

                const svgH = geom.H * scaleY;
                const svgT1 = geom.T1 * scaleY;
                const svgC = geom.C * scaleX;
                const svgD = geom.D * scaleX;
                const svgG = geom.G * scaleX;
                const svgF = geom.F * scaleX;
                const svgB = calc.B * scaleX;
                const svgm = calc.m * scaleX;
                const svgd2 = calc.d2 * scaleY;
                const svgd3 = calc.d3 * scaleY;

                return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                    <h3 className="font-bold text-lg text-slate-700 mb-4 border-b pb-2">แรงต้านทานแนวดิ่ง (Resisting Forces)</h3>
                    
                    <div className="bg-emerald-50 text-emerald-800 p-4 rounded mb-6 text-sm font-medium grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 gap-3 border border-emerald-100 shadow-sm">
                        <div>C (Toe): {geom.C.toFixed(2)} ม.</div>
                        <div>D (Stem Bot): {geom.D.toFixed(2)} ม.</div>
                        <div>G (Stem Top): {geom.G.toFixed(2)} ม.</div>
                        <div>F (Heel): {geom.F.toFixed(2)} ม.</div>
                        <div>m (ระยะลาด D-G): {calc.m.toFixed(2)} ม.</div>
                        <div>H (Stem): {geom.H.toFixed(2)} ม.</div>
                        <div>T<Sub text="1"/> (Base): {geom.T1.toFixed(2)} ม.</div>
                        <div>d<Sub text="2"/> (ดินแห้ง): {calc.d2.toFixed(2)} ม.</div>
                        <div>d<Sub text="3"/> (ดินเปียก): {calc.d3.toFixed(2)} ม.</div>
                        <div>Surcharge: {surcharge} กก./ม.&sup2;</div>
                        <div>&gamma;<Sub text="compact"/>: {soil.gamma_c} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="sat"/>: {soil.gamma_sat} กก./ม.&sup3;</div>
                        <div>น้ำหนักคอนกรีต: 2400 กก./ม.&sup3;</div>
                        <div>W<Sub text="dry"/> (ดินเหนือ Stem): {calc.W5_dry.toFixed(2)} กก.</div>
                        <div>W<Sub text="wet"/> (ดินเหนือ Stem): {calc.W5_wet.toFixed(2)} กก.</div>
                    </div>

                    <div className="flex flex-col gap-6 mt-4">
                        <div className="bg-slate-50 rounded-xl flex flex-col items-center justify-center p-6 border border-slate-200 overflow-visible">
                            <h4 className="text-base font-semibold text-slate-700 mb-4 w-full text-center">สัดส่วนพื้นที่หน้าตัด และ Dimensions (ไดอะแกรม)</h4>
                            <svg viewBox="0 0 600 450" className="w-full max-w-2xl h-auto drop-shadow-sm mx-auto">
                                <line x1="20" y1={y0 - svgH - svgT1} x2="580" y2={y0 - svgH - svgT1} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                
                                <rect x={x0} y={y0 - svgT1} width={svgC} height={svgT1} fill="#94a3b8" stroke="#475569" strokeWidth="1" />
                                {geom.C > 0 && <text x={x0 + svgC/2} y={y0 - svgT1/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W1</text>}

                                <rect x={x0 + svgC} y={y0 - svgT1} width={svgD + svgF} height={svgT1} fill="#cbd5e1" stroke="#475569" strokeWidth="1" />
                                <text x={x0 + svgC + (svgD+svgF)/2} y={y0 - svgT1/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W4</text>

                                <rect x={x0 + svgC} y={y0 - svgT1 - svgH} width={svgG} height={svgH} fill="#e2e8f0" stroke="#475569" strokeWidth="1" />
                                {geom.G > 0 && <text x={x0 + svgC + svgG/2} y={y0 - svgT1 - svgH/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W2</text>}

                                {calc.m > 0 && (
                                    <g>
                                        <polygon points={`${x0+svgC+svgG},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1} ${x0+svgC+svgG},${y0-svgT1}`} fill="#f1f5f9" stroke="#475569" strokeWidth="1" />
                                        <text x={x0 + svgC + svgG + svgm/3} y={y0 - svgT1 - svgH/3 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W3</text>
                                    </g>
                                )}

                                {calc.m > 0 && (
                                    <g>
                                        <polygon points={`${x0+svgC+svgG},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1}`} fill="#fde68a" stroke="#d97706" strokeWidth="1" />
                                        <text x={x0 + svgC + svgG + svgm*2/3} y={y0 - svgT1 - svgH*2/3 + 5} fill="#92400e" fontSize="14" textAnchor="middle" fontWeight="bold">W5</text>
                                    </g>
                                )}

                                {calc.d2 > 0 && (
                                    <g>
                                        <rect x={x0 + svgC + svgD} y={y0 - svgT1 - svgH} width={svgF} height={svgd2} fill="#fcd34d" stroke="#d97706" strokeWidth="1" />
                                        <text x={x0 + svgC + svgD + svgF/2} y={y0 - svgT1 - svgH + svgd2/2 + 5} fill="#92400e" fontSize="14" textAnchor="middle" fontWeight="bold">W6</text>
                                    </g>
                                )}

                                {calc.d3 > 0 && (
                                    <g>
                                        <rect x={x0 + svgC + svgD} y={y0 - svgT1 - svgH + svgd2} width={svgF} height={svgd3} fill="#93c5fd" stroke="#2563eb" strokeWidth="1" />
                                        <text x={x0 + svgC + svgD + svgF/2} y={y0 - svgT1 - svgH + svgd2 + svgd3/2 + 5} fill="#1e3a8a" fontSize="14" textAnchor="middle" fontWeight="bold">W7</text>
                                    </g>
                                )}

                                {surcharge > 0 && (
                                    <g>
                                        <rect x={x0 + svgC + svgG} y={y0 - svgT1 - svgH - 25} width={svgm + svgF} height={25} fill="rgba(14, 165, 233, 0.1)" stroke="#0ea5e9" strokeDasharray="4" strokeWidth="1" />
                                        <text x={x0 + svgC + svgG + (svgm+svgF)/2} y={y0 - svgT1 - svgH - 7} fill="#0369a1" fontSize="14" textAnchor="middle" fontWeight="bold">W8 (Surcharge)</text>
                                    </g>
                                )}

                                {/* Dimensions Bottom */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0} y1={y0 + 35} x2={x0 + svgB} y2={y0 + 35} />
                                    <line x1={x0} y1={y0 + 30} x2={x0} y2={y0 + 40} />
                                    {geom.C > 0 && <line x1={x0 + svgC} y1={y0 + 30} x2={x0 + svgC} y2={y0 + 40} />}
                                    <line x1={x0 + svgC + svgD} y1={y0 + 30} x2={x0 + svgC + svgD} y2={y0 + 40} />
                                    <line x1={x0 + svgB} y1={y0 + 30} x2={x0 + svgB} y2={y0 + 40} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="middle" fontFamily="sans-serif">
                                    {geom.C > 0 && <text x={x0 + svgC/2} y={y0 + 55}>C={geom.C}</text>}
                                    <text x={x0 + svgC + svgD/2} y={y0 + 55}>D={geom.D}</text>
                                    <text x={x0 + svgC + svgD + svgF/2} y={y0 + 55}>F={geom.F}</text>
                                </g>

                                {/* Dimensions Top */}
                                <g stroke="#64748b" strokeWidth="1">
                                    {geom.G > 0 && <line x1={x0 + svgC} y1={y0 - svgT1 - svgH - 40} x2={x0 + svgC + svgG} y2={y0 - svgT1 - svgH - 40} />}
                                    {calc.m > 0 && <line x1={x0 + svgC + svgG} y1={y0 - svgT1 - svgH - 40} x2={x0 + svgC + svgD} y2={y0 - svgT1 - svgH - 40} />}
                                    
                                    <line x1={x0 + svgC} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC} y2={y0 - svgT1 - svgH - 35} />
                                    {geom.G > 0 && <line x1={x0 + svgC + svgG} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC + svgG} y2={y0 - svgT1 - svgH - 35} />}
                                    {calc.m > 0 && <line x1={x0 + svgC + svgD} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC + svgD} y2={y0 - svgT1 - svgH - 35} />}
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="middle" fontFamily="sans-serif">
                                    {geom.G > 0 && <text x={x0 + svgC + svgG/2} y={y0 - svgT1 - svgH - 50}>G={geom.G}</text>}
                                    {calc.m > 0 && <text x={x0 + svgC + svgG + svgm/2} y={y0 - svgT1 - svgH - 50}>m={calc.m.toFixed(2)}</text>}
                                </g>

                                {/* Dimensions Left */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0 - 35} y1={y0} x2={x0 - 35} y2={y0 - svgT1 - svgH} />
                                    <line x1={x0 - 40} y1={y0} x2={x0 - 30} y2={y0} />
                                    <line x1={x0 - 40} y1={y0 - svgT1} x2={x0 - 30} y2={y0 - svgT1} />
                                    <line x1={x0 - 40} y1={y0 - svgT1 - svgH} x2={x0 - 30} y2={y0 - svgT1 - svgH} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="end" dominantBaseline="middle" fontFamily="sans-serif">
                                    <text x={x0 - 45} y={y0 - svgT1/2}>T1={geom.T1}</text>
                                    <text x={x0 - 45} y={y0 - svgT1 - svgH/2}>H={geom.H}</text>
                                </g>

                                {/* Dimensions Right */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0 + svgB + 20} y1={y0 - svgT1 - svgH} x2={x0 + svgB + 20} y2={y0 - svgT1} />
                                    <line x1={x0 + svgB + 15} y1={y0 - svgT1 - svgH} x2={x0 + svgB + 25} y2={y0 - svgT1 - svgH} />
                                    {calc.d3 > 0 && calc.d2 > 0 && <line x1={x0 + svgB + 15} y1={y0 - svgT1 - svgH + svgd2} x2={x0 + svgB + 25} y2={y0 - svgT1 - svgH + svgd2} />}
                                    <line x1={x0 + svgB + 15} y1={y0 - svgT1} x2={x0 + svgB + 25} y2={y0 - svgT1} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="start" dominantBaseline="middle" fontFamily="sans-serif">
                                    {calc.d2 > 0 && <text x={x0 + svgB + 30} y={y0 - svgT1 - svgH + svgd2/2}>d2={calc.d2.toFixed(2)}</text>}
                                    {calc.d3 > 0 && <text x={x0 + svgB + 30} y={y0 - svgT1 - svgH + svgd2 + svgd3/2}>d3={calc.d3.toFixed(2)}</text>}
                                </g>

                                <circle cx={x0} cy={y0} r="6" fill="#dc2626" />
                                <text x={x0 - 15} y={y0 + 15} fill="#dc2626" fontSize="14" fontWeight="bold" textAnchor="end">จุดหมุน Toe</text>
                            </svg>
                        </div>
                        
                        <div className="w-full">
                            <StepBox title="คำนวณน้ำหนักและโมเมนต์ต้านทาน (รอบจุด Toe หน้าสุด x = 0)">
                                <table className="w-full text-left border-collapse mt-2 text-sm">
                                    <thead>
                                        <tr className="border-b border-slate-300">
                                            <th className="py-2">รายการ</th>
                                            <th>สมการคำนวณน้ำหนัก</th>
                                            <th>น้ำหนัก (W)</th>
                                            <th>แขน (x)</th>
                                            <th>โมเมนต์ (M<Sub text="R"/>)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#94a3b8] mr-2 border border-[#475569]"></span>W<Sub text="1"/>: ฐานรากส่วน Toe</td>
                                            <td>C &times; T1 &times; 2400</td>
                                            <td>{calc.w1.toFixed(2)}</td>
                                            <td>{calc.x1.toFixed(2)}</td>
                                            <td>{(calc.w1 * calc.x1).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#e2e8f0] mr-2 border border-[#475569]"></span>W<Sub text="2"/>: กำแพงส่วนสี่เหลี่ยม</td>
                                            <td>G &times; H &times; 2400</td>
                                            <td>{calc.w2.toFixed(2)}</td>
                                            <td>{calc.x2.toFixed(2)}</td>
                                            <td>{(calc.w2 * calc.x2).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#f1f5f9] mr-2 border border-[#475569]"></span>W<Sub text="3"/>: กำแพงส่วนสามเหลี่ยม</td>
                                            <td>&frac12; &times; m &times; H &times; 2400</td>
                                            <td>{calc.w3.toFixed(2)}</td>
                                            <td>{calc.x3.toFixed(2)}</td>
                                            <td>{(calc.w3 * calc.x3).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#cbd5e1] mr-2 border border-[#475569]"></span>W<Sub text="4"/>: ฐานรากส่วน Stem+Heel</td>
                                            <td>(D + F) &times; T1 &times; 2400</td>
                                            <td>{calc.w4.toFixed(2)}</td>
                                            <td>{calc.x4.toFixed(2)}</td>
                                            <td>{(calc.w4 * calc.x4).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#fde68a] mr-2 border border-[#d97706]"></span>W<Sub text="5"/>: ดินบนกำแพงเหนือ Stem</td>
                                            <td>W<Sub text="dry"/> + W<Sub text="wet"/> บนระยะ m</td>
                                            <td>{calc.w5.toFixed(2)}</td>
                                            <td>{calc.x5.toFixed(2)}</td>
                                            <td>{(calc.w5 * calc.x5).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#fcd34d] mr-2 border border-[#d97706]"></span>W<Sub text="6"/>: ดินแห้งบน Heel</td>
                                            <td>F &times; d2 &times; &gamma;<Sub text="compact"/></td>
                                            <td>{calc.w6.toFixed(2)}</td>
                                            <td>{calc.x6.toFixed(2)}</td>
                                            <td>{(calc.w6 * calc.x6).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#93c5fd] mr-2 border border-[#2563eb]"></span>W<Sub text="7"/>: ดินเปียกบน Heel</td>
                                            <td>F &times; d3 &times; &gamma;<Sub text="sat"/></td>
                                            <td>{calc.w7.toFixed(2)}</td>
                                            <td>{calc.x7.toFixed(2)}</td>
                                            <td>{(calc.w7 * calc.x7).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-200">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#e0f2fe] mr-2 border border-[#0ea5e9]"></span>W<Sub text="8"/>: Surcharge บนดินถม</td>
                                            <td>Surcharge &times; (m + F)</td>
                                            <td>{calc.w8.toFixed(2)}</td>
                                            <td>{calc.x8.toFixed(2)}</td>
                                            <td>{(calc.w8 * calc.x8).toFixed(2)}</td>
                                        </tr>
                                        <tr className="font-bold text-slate-800 bg-slate-100">
                                            <td colSpan="2" className="py-2 text-right pr-4">รวม (Total):</td>
                                            <td className="text-blue-600">&Sigma;V = {calc.sumV.toFixed(2)}</td>
                                            <td></td>
                                            <td className="text-emerald-600">&Sigma;M<Sub text="R"/> = {calc.MR.toFixed(2)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </StepBox>
                        </div>
                    </div>
                </div>
                );
            };

            const TabStability = () => (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
                    <h3 className="font-bold text-lg text-slate-700 border-b pb-2">ตรวจสอบเสถียรภาพ (Stability Checks)</h3>
                    
                    <div className="bg-sky-50 text-sky-800 p-4 rounded mb-6 text-sm font-medium grid grid-cols-2 md:grid-cols-5 gap-3 border border-sky-100 shadow-sm">
                        <div>&Sigma;M<Sub text="R"/> = {calc.MR.toFixed(2)} กก.-ม.</div>
                        <div>&Sigma;M<Sub text="O"/> = {calc.MO.toFixed(2)} กก.-ม.</div>
                        <div>&Sigma;V = {calc.sumV.toFixed(2)} กก./ม.</div>
                        <div>&Sigma;P = {calc.sumP.toFixed(2)} กก./ม.</div>
                        <div>f (แรงเสียดทาน) = {base.f.toFixed(2)}</div>
                    </div>

                    <StepBox title="1. ตรวจสอบการพลิกคว่ำ (Overturning)">
                        <div className="flex items-center space-x-4 mb-2">
                            <span>F.S.<Sub text="OT"/> = </span>
                            <Fraction top={<span>&Sigma;M<Sub text="R"/></span>} bottom={<span>&Sigma;M<Sub text="O"/></span>} />
                            <span>=</span>
                            <Fraction top={calc.MR.toFixed(2)} bottom={calc.MO.toFixed(2)} />
                            <span className="font-bold text-lg">= {calc.FS_ot.toFixed(2)}</span>
                        </div>
                        <div className="mt-3">
                            สรุป: {calc.FS_ot.toFixed(2)} {calc.FS_ot >= 1.5 ? <span className="text-emerald-600 font-bold">&ge; 1.50 (ผ่านเกณฑ์)</span> : <span className="text-rose-600 font-bold">{"<"} 1.50 (ไม่ผ่านเกณฑ์)</span>}
                        </div>
                    </StepBox>

                    <StepBox title="2. ตรวจสอบการลื่นไถล (Sliding)">
                        <div className="flex items-center space-x-4 mb-2">
                            <span>F.S.<Sub text="Slide"/> = </span>
                            <Fraction top={<span>f &times; &Sigma;V</span>} bottom={<span>&Sigma;P</span>} />
                            <span>=</span>
                            <Fraction top={`${base.f} &times; ${calc.sumV.toFixed(2)}`} bottom={calc.sumP.toFixed(2)} />
                            <span className="font-bold text-lg">= {calc.FS_slide.toFixed(2)}</span>
                        </div>
                        <div className="mt-3">
                            สรุป: {calc.FS_slide.toFixed(2)} {calc.FS_slide >= 1.5 ? <span className="text-emerald-600 font-bold">&ge; 1.50 (ผ่านเกณฑ์)</span> : <span className="text-rose-600 font-bold">{"<"} 1.50 (ไม่ผ่านเกณฑ์)</span>}
                        </div>
                    </StepBox>
                </div>
            );

            const TabBearing = () => (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6">
                    <h3 className="font-bold text-lg text-slate-700 border-b pb-2">แรงอัดใต้ฐานราก (Bearing Pressure)</h3>
                    
                    <div className="bg-sky-50 text-sky-800 p-4 rounded mb-6 text-sm font-medium grid grid-cols-2 md:grid-cols-5 gap-3 border border-sky-100 shadow-sm">
                        <div>&Sigma;M<Sub text="R"/> = {calc.MR.toFixed(2)} กก.-ม.</div>
                        <div>&Sigma;M<Sub text="O"/> = {calc.MO.toFixed(2)} กก.-ม.</div>
                        <div>&Sigma;V = {calc.sumV.toFixed(2)} กก./ม.</div>
                        <div>B (กว้างฐาน) = {calc.B.toFixed(2)} ม.</div>
                        <div>q<Sub text="allow"/> = {base.q_allow} กก./ม.&sup2;</div>
                    </div>

                    <StepBox title="1. ตำแหน่งแรงลัพธ์และระยะเยื้องศูนย์">
                        <div className="grid md:grid-cols-2 gap-4">
                            <div>
                                <div className="flex items-center space-x-2 mb-2">
                                    <span className="overline text-lg leading-none">X</span>
                                    <span>=</span>
                                    <Fraction top={<span>&Sigma;M<Sub text="R"/> - &Sigma;M<Sub text="O"/></span>} bottom={<span>&Sigma;V</span>} />
                                    <span>=</span>
                                    <Fraction top={`${calc.MR.toFixed(2)} - ${calc.MO.toFixed(2)}`} bottom={calc.sumV.toFixed(2)} />
                                    <span className="font-bold">= {calc.X_bar.toFixed(3)} ม.</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <span>e = (B / 2) - <span className="overline">X</span></span>
                                    <span>= ({calc.B.toFixed(2)} / 2) - {calc.X_bar.toFixed(3)}</span>
                                    <span className="font-bold text-blue-600">= {calc.e.toFixed(3)} ม.</span>
                                </div>
                            </div>
                            <div className="bg-slate-100 p-3 rounded border border-slate-200">
                                <span className="font-semibold text-slate-700 block mb-1">กฎ Middle-Third (e &le; B/6):</span>
                                e = {Math.abs(calc.e).toFixed(3)} ม. เทียบกับ B/6 = {calc.B6.toFixed(3)} ม. <br/>
                                {calc.isMiddleThird 
                                    ? <span className="text-emerald-600 font-bold">ผ่าน (แรงลัพธ์อยู่ในช่วง Middle-third)</span> 
                                    : <span className="text-rose-600 font-bold">ไม่ผ่าน (เกิดแรงดึงใต้ฐานรากฝั่ง Heel)</span>}
                            </div>
                        </div>
                    </StepBox>

                    <StepBox title="2. หน่วยแรงอัดสูงสุดและต่ำสุด">
                        <div className="grid md:grid-cols-2 gap-6">
                            <div>
                                <div className="flex items-center space-x-2 mb-2 text-rose-700 font-semibold">
                                    <span>q<Sub text="max"/> =</span>
                                    <Fraction top={<span>&Sigma;V</span>} bottom={<span>B</span>} />
                                    <span>&times; (1 + </span>
                                    <Fraction top={<span>6e</span>} bottom={<span>B</span>} />
                                    <span>)</span>
                                </div>
                                <div>
                                    q<Sub text="max"/> = ({calc.sumV.toFixed(2)} / {calc.B.toFixed(2)}) &times; (1 + (6 &times; {Math.abs(calc.e).toFixed(3)} / {calc.B.toFixed(2)}))<br/>
                                    q<Sub text="max"/> = <strong className="text-lg text-rose-700">{calc.q_max.toFixed(2)} กก./ม.&sup2;</strong>
                                </div>
                            </div>
                            <div>
                                <div className="flex items-center space-x-2 mb-2 text-emerald-700 font-semibold">
                                    <span>q<Sub text="min"/> =</span>
                                    <Fraction top={<span>&Sigma;V</span>} bottom={<span>B</span>} />
                                    <span>&times; (1 - </span>
                                    <Fraction top={<span>6e</span>} bottom={<span>B</span>} />
                                    <span>)</span>
                                </div>
                                <div>
                                    q<Sub text="min"/> = ({calc.sumV.toFixed(2)} / {calc.B.toFixed(2)}) &times; (1 - (6 &times; {Math.abs(calc.e).toFixed(3)} / {calc.B.toFixed(2)}))<br/>
                                    q<Sub text="min"/> = <strong className="text-lg text-emerald-700">{calc.q_min.toFixed(2)} กก./ม.&sup2;</strong>
                                </div>
                            </div>
                        </div>
                        <div className="mt-4 p-3 bg-amber-50 text-amber-800 rounded border border-amber-200">
