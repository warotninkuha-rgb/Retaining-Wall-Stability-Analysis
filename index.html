                                    <tbody>
                                        {lateral.modes.map(m => (
                                            <tr key={m.key} className={`border-b border-slate-100 ${m === lateral.gov ? 'bg-amber-50 font-bold' : ''}`}>
                                                <td className="py-2">{m.label}</td>
                                                <td className="text-[11px] text-slate-500 font-mono">
                                                    {m.key === 'defl' && (lat.soilType === 'clay'
                                                        ? (lateral.isFixed ? 'y = Hβ/k' : 'y = 2Hβ/k')
                                                        : (lateral.isFixed ? 'y = 0.93HT³/EI' : 'y = 2.43HT³/EI'))}
                                                    {m.key === 'crack' && (lat.soilType === 'clay'
                                                        ? (lateral.isFixed ? 'M = H/2β' : 'M = 0.322H/β')
                                                        : (lateral.isFixed ? 'M = 0.93HT' : 'M = 0.77HT'))}
                                                    {m.key === 'broms' && (lat.soilType === 'clay'
                                                        ? `${lateral.nHinge}M_y = H(1.5D + 0.5f)`
                                                        : `${lateral.nHinge}M_y = 0.67Hf`)}
                                                </td>
                                                <td>{lateral.toKg(m.H).toFixed(0)}</td>
                                                <td>{(lateral.toKg(m.H) / 1000).toFixed(2)}</td>
                                                <td>{m === lateral.gov ? <span className="text-amber-700">← คุมค่า</span> : ''}</td>
                                            </tr>
                                        ))}
                                        <tr className="font-bold bg-slate-100">
                                            <td className="py-2" colSpan="2">
                                                ใช้ได้ต่อต้น {lateral.pMult < 1 && <span className="font-normal text-xs">(คูณ p-multiplier {lateral.pMult})</span>}
                                            </td>
                                            <td className="text-cyan-700">{lateral.H_allow_kg.toFixed(0)}</td>
                                            <td className="text-cyan-700">{(lateral.H_allow_kg / 1000).toFixed(2)}</td>
                                            <td></td>
                                        </tr>
                                    </tbody>
                                </table>

                                <div className={`p-3 rounded-lg border-2 ${calc.okPileShear ? 'bg-emerald-50 border-emerald-300' : 'bg-rose-50 border-rose-300'} print:bg-transparent`}>
                                    <div className="text-sm">
                                        <strong>เทียบกับแรงที่ต้องรับ:</strong> V<Sub text="shear"/> = {calc.V_shear_pile.toFixed(0)} กก./ต้น
                                        {' '}เทียบกับกำลังที่ใช้ได้ {calc.shearCapValid ? calc.shearCap.toFixed(0) + ' กก.' : '(ยังไม่ได้กำหนด)'}
                                        {' '}{calc.okPileShear
                                            ? <span className="text-emerald-700 font-bold">ผ่านเกณฑ์</span>
                                            : <span className="text-rose-700 font-bold">ไม่ผ่านเกณฑ์{calc.shearCapValid && ' \u2014 เกิน ' + calc.shearRatio.toFixed(1) + ' เท่า'}</span>}
                                        {!calc.shearFromBroms && <span className="text-slate-500 text-xs"> (ใช้ค่าที่กรอกเอง ไม่ใช่ค่าจาก Broms)</span>}
                                    </div>
                                    {!calc.okPileShear && (
                                        <div className="mt-2 text-xs text-rose-800 leading-snug">
                                            ทางแก้ตามลำดับความคุ้มค่า: (1) ใช้ <strong>เข็มเอียง (raker)</strong> แปลงแรงราบเป็นแรงตามแกน
                                            เอียง 1:4 ให้องค์ประกอบแนวราบราว {(0.242 * pile.allowComp).toFixed(0)} กก./ต้น หรือราว {(0.242 * pile.allowComp / Math.max(calc.V_shear_pile, 1)).toFixed(0)} เท่าของแรงด้านข้างที่ต้องรับ
                                            &nbsp;(2) เพิ่มจำนวนเข็ม &nbsp;(3) ขยายหน้าตัดเข็ม &nbsp;(4) ปรับปรุงดินชั้นบนหน้า Toe
                                        </div>
                                    )}
                                </div>

                                <div className="mt-3 text-xs text-slate-500 leading-relaxed">

                                    &middot; ใช้สมการเข็มยาว (long pile) &middot; ไม่คิดผลของแรงตามแกนต่อกำลังโมเมนต์ของหน้าตัด
                                    (เข็มที่รับแรงถอนจะรับโมเมนต์ได้น้อยลงมาก) &middot; p-multiplier ต้องกรอกเอง

                                    items={[

                                    ['I, Z', 'โมเมนต์ความเฉื่อย และโมดูลัสหน้าตัด'],

                                    [<span>f<Sub text="pe"/></span>, 'หน่วยแรงอัดคงค้างจากลวดอัดแรง หน่วย ksc ช่วยเพิ่มโมเมนต์แตกร้าว'],

                                    ['k', 'โมดูลัสปฏิกิริยาด้านข้างของดินเหนียว = 67 c_u คงที่ตามความลึก'],
                                    [<span>n<Sub text="h"/></span>, 'อัตราการเพิ่มของโมดูลัสตามความลึกในดินทราย เลือกจากความแน่นและสภาพจมน้ำ'],
                                    [<span>&beta;</span>, 'ค่าคงที่ของระบบเข็ม-ดินในดินเหนียว = (k \u00F7 4EI) ยกกำลัง 0.25'],
                                    ['1/\u03B2 และ T', 'ระยะยาวลักษณะ บอกว่าแรงด้านข้างถ่ายลงดินในช่วงกี่เมตรบนสุด ความยาวเข็มที่เกินจากนี้แทบไม่ช่วย'],
                                    [<span>L<Sub text="pile"/></span>, 'ความยาวเสาเข็ม ใช้ตรวจว่าเข้าเกณฑ์เข็มยาวหรือไม่ (\u03B2L \u2265 2.5 หรือ L/T \u2265 4)'],

                                    ['ส่งออก / นำเข้า JSON', 'เก็บพารามิเตอร์เป็นไฟล์ไว้กับแฟ้มโครงการ หรือส่งให้เพื่อนร่วมงานเปิดต่อ'],

                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-sm text-slate-700 leading-relaxed space-y-4 print:break-inside-avoid">
                        <h3 className="font-bold text-lg text-slate-800 border-b pb-2">คู่มือและอภิธานศัพท์เพิ่มเติม</h3>
                        <div>
                            <strong className="text-blue-700">กฎ Middle-Third:</strong><br/>
                            เพื่อป้องกันไม่ให้เกิดแรงดึง (Tension) ใต้ฐานราก ระยะเยื้องศูนย์ (e) ของแรงลัพธ์จะต้องไม่เกิน 1/6 ของความกว้างฐานรากรวม (B/6) หาก e {">"} B/6 ดินฝั่ง Heel จะไม่สัมผัสฐานราก ทำให้พื้นที่รับแรงลดลงและ q<Sub text="max"/> พุ่งสูงขึ้นมาก
                        </div>
                        <div>
                            <strong className="text-indigo-700">เสาเข็มรับแรงเฉือน (Pile Shear):</strong><br/>
                            ในกำแพงกันดินที่มีเสาเข็ม โดยทั่วไปจะสมมติให้เสาเข็มรับแรงผลักด้านข้างทั้งหมดโดยไม่คำนึงถึงแรงเสียดทานใต้ฐานราก เนื่องจากอาจเกิดการทรุดตัวของดินเดิมจนแยกออกจากฐานรากได้
                        </div>
                        <div>
                            <strong className="text-indigo-700">การจัดเรียงเสาเข็ม (Pile Arrangement):</strong><br/>
                            โปรแกรมวิเคราะห์เป็น 2D-Strip (ต่อความยาวกำแพง 1 ช่วง S<sub>L</sub>) 
                            การเพิ่มจำนวนต้นเสาเข็มในแนวแกน Y (ตามแนวยาวของกำแพง) ทำได้ง่ายๆ โดยการ <strong>"ลดระยะ S<sub>L</sub>"</strong> ลง เช่น หากต้องการให้เสาเข็มชิดกันมากขึ้น ก็ให้ลดระยะ S<sub>L</sub> แรงลัพธ์ V และ P จะลดลงตามสัดส่วน ทำให้แรงกระทำต่อเสาเข็ม 1 ต้นลดลง 
                            แต่ในแนวแกน X (ตั้งฉากกับกำแพง) คุณสามารถกดเพิ่มจำนวนแถวเสาเข็มได้ตามอิสระ โปรแกรมจะคำนวณตำแหน่ง CG ใหม่และหาแรงในเสาเข็มแต่ละแถวให้โดยอัตโนมัติ
                        </div>
                        <div>
                            <strong className="text-blue-700">การแบ่งตัวแปรมิติใหม่ (อิงตามรูป):</strong><br/>
                            โปรแกรมได้ปรับให้รองรับการป้อนค่า <strong>C, D, G, F</strong> โดยเฉพาะ โดยหากกรอกให้ G = D ฐานรากจะกลายเป็นรูปสี่เหลี่ยมมุมฉากปกติ และรายการคำนวณ W3 และ W5 (ที่เป็นส่วนประกอบของรูปสามเหลี่ยม) จะมีค่าเป็นศูนย์ไปโดยอัตโนมัติ
                        </div>
                    </div>
                </div>
            );

            return (
                <div id="report-root" className="max-w-6xl mx-auto pb-12 font-sans print:p-0 print:m-0 print:max-w-full">
                    <div className="no-print">
                        {GlobalNav()}
                    </div>
                    
                    <div className="p-4 md:p-6 print:p-0">
                        {storeMsg && (
                            <div className="mb-4 bg-slate-800 text-slate-100 text-sm rounded-lg px-4 py-2.5 shadow-lg no-print flex items-center">
                                <svg className="w-4 h-4 mr-2 text-emerald-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7" /></svg>
                                {storeMsg}
                            </div>
                        )}

                        {showRestored && (
                            <div className="mb-4 bg-emerald-50 border border-emerald-200 text-emerald-900 text-sm rounded-lg px-4 py-3 no-print flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                                <div className="flex items-start">
                                    <svg className="w-5 h-5 mr-2 text-emerald-600 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" /></svg>
                                    <span>โหลดพารามิเตอร์ที่บันทึกไว้ล่าสุด{savedAt ? ' (' + fmtTime(savedAt) + ')' : ''} มาใช้แล้ว</span>
                                </div>
                                <div className="flex gap-2 shrink-0">
                                    <button onClick={resetAll}
                                        className="text-xs bg-white hover:bg-slate-50 border border-emerald-300 text-emerald-800 px-3 py-1.5 rounded transition">
                                        ใช้ค่าเริ่มต้นแทน
                                    </button>
                                    <button onClick={() => setShowRestored(false)}
                                        className="text-xs bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded transition">
                                        รับทราบ
                                    </button>
                                </div>
                            </div>
                        )}

                        <header className="mb-6 print:mb-8 print:text-center no-print">
                            <h1 className="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">Retaining Wall Stability Analysis</h1>
                            <p className="text-slate-500 text-sm mt-1">โปรแกรมวิเคราะห์เสถียรภาพและแรงดันดินใต้ฐานรากกำแพงกันดิน (พร้อมระบบเสาเข็ม)</p>
                        </header>
                        
                        <div className="hidden print:block mb-6 border-b-2 border-slate-800 pb-3">
                            <div className="text-center">
                                <h1 className="text-2xl font-bold text-slate-800 uppercase tracking-wider">Calculation Report</h1>
                                <h2 className="text-lg font-semibold text-slate-600 mt-1">Retaining Wall Stability Analysis</h2>
                            </div>
                            <div className="mt-3 grid grid-cols-3 gap-3 text-[11px] text-slate-600 border-t border-slate-300 pt-2">
                                <div>โปรแกรมเวอร์ชัน: <strong>{APP_VERSION}</strong></div>
                                <div className="text-center">แรงดันดินที่ใช้: <strong>{calc.K_mode === 'k0' ? 'K\u2080 At-rest' : 'K\u2090 Active'} = {calc.Ka.toFixed(3)}</strong></div>
                                <div className="text-right">Uplift: <strong>{useUplift ? (upliftMode === 'seepage' ? 'สามเหลี่ยม' : 'เต็มค่า') : 'ไม่คิด'}</strong></div>
                            </div>
                            <div className="mt-1 text-[10px] text-slate-500 leading-snug">
                                ตรวจสอบ 2 กรณีบรรทุก (LC1 มี Surcharge จรในแรงต้าน / LC2 ไม่มี) และรายงานค่าที่วิกฤตที่สุด
                                &middot; เกณฑ์ F.S. พลิกคว่ำ {fsOtReq.toFixed(2)} / ลื่นไถล {fsSlideReq.toFixed(2)}
                                &middot; ไม่คิดแรงดันดินด้านรับ (Passive), แรงยึดเกาะ (c), การทรุดตัว, เสถียรภาพลาดดินรวม และการออกแบบเหล็กเสริม
                            </div>
                        </div>

                        {/* เมนูแท็บ ควบคุมการสลับหน้าเฉพาะบนหน้าจอ ไม่ปรินท์ */}
                        <div className="flex overflow-x-auto custom-scrollbar border-b border-slate-300 mb-6 space-x-1 pb-1 no-print">
                            {[
                                { id: 'inputs', label: 'พารามิเตอร์ (Inputs)' },
                                { id: 'summary', label: 'สรุปผลและแปลน (Dashboard)' },
                                { id: 'driving', label: 'แรงผลัก (Driving)' },
                                { id: 'calculations', label: 'รายการคำนวณ' },
                                { id: 'resisting', label: 'แรงต้าน (Resisting)' },
                                { id: 'stability', label: 'ตรวจสอบเสถียรภาพ' },
                                { id: 'bearing', label: 'แรงอัดดินเดิม' },
                                { id: 'piles', label: 'แรงเสาเข็ม (Piles)' },
                                { id: 'manual', label: 'คู่มือ' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-4 py-3 text-sm whitespace-nowrap flex-shrink-0 transition-colors ${activeTab === tab.id ? 'tab-active bg-white rounded-t-lg' : 'tab-inactive bg-slate-50 rounded-t-lg hover:bg-slate-100'}`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <main className="print:flex print:flex-col print:gap-8">
                            <div className={`print:block ${activeTab === 'inputs' ? 'block' : 'hidden'}`}>{TabInputs()}</div>
                            <div className={`print:block ${activeTab === 'summary' ? 'block' : 'hidden'}`}>{TabDashboard()}</div>
                            <div className={`print:block ${activeTab === 'driving' ? 'block' : 'hidden'}`}>{TabDriving()}</div>
                            <div className={`print:block ${activeTab === 'calculations' ? 'block' : 'hidden'}`}>{TabCalculations()}</div>
                            <div className={`print:block ${activeTab === 'resisting' ? 'block' : 'hidden'}`}>{TabResisting()}</div>
                            <div className={`print:block ${activeTab === 'stability' ? 'block' : 'hidden'}`}>{TabStability()}</div>
                            <div className={`print:block ${activeTab === 'bearing' ? 'block' : 'hidden'}`}>{TabBearing()}</div>
                            <div className={`print:block ${activeTab === 'piles' ? 'block' : 'hidden'}`}>{TabPiles()}</div>
                            <div className={`print:hidden ${activeTab === 'manual' ? 'block' : 'hidden'}`}>{TabManual()}</div>
                        </main>
                    </div>
                </div>
            );
        };

        const rootEl = document.getElementById('root');
        rootEl.innerHTML = '';                       // ล้างข้อความ "กำลังโหลด" ก่อน mount
        const root = ReactDOM.createRoot(rootEl);
        root.render(<App />);
    </script>
</body>
</html>
