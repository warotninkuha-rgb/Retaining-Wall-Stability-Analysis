                                        <text x={x0 + svgC + svgG + (svgm+svgF)/2} y={y0 - svgT1 - svgH - 7} fill="#0369a1" fontSize="14" textAnchor="middle" fontWeight="bold">W8 (Surcharge)</text>
                                    </g>
                                )}

                                {/* Dimensions Bottom */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0} y1={y0 + 35} x2={x0 + svgB} y2={y0 + 35} />
                                    <line x1={x0} y1={y0 + 30} x2={x0} y2={y0 + 40} />
                                    {geom.C > 0 && <line x1={x0 + svgC} y1={y0 + 30} x2={x0 + svgC} y2={y0 + 40} />}
                                    <line x1={x0 + svgC + svgD} y1={y0 + 30} x2={x0 + svgC + svgD} y2={y0 + 40} />
                                    <line x1={x0 + svgB} y1={y0 + 30} x2={x0 + svgB} y2={y0 + 40} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="middle" fontFamily="sans-serif">
                                    {geom.C > 0 && <text x={x0 + svgC/2} y={y0 + 55}>C={geom.C}</text>}
                                    <text x={x0 + svgC + svgD/2} y={y0 + 55}>D={geom.D}</text>
                                    <text x={x0 + svgC + svgD + svgF/2} y={y0 + 55}>F={geom.F}</text>
                                </g>

                                {/* Dimensions Top */}
                                <g stroke="#64748b" strokeWidth="1">
                                    {geom.G > 0 && <line x1={x0 + svgC} y1={y0 - svgT1 - svgH - 40} x2={x0 + svgC + svgG} y2={y0 - svgT1 - svgH - 40} />}
                                    {calc.m > 0 && <line x1={x0 + svgC + svgG} y1={y0 - svgT1 - svgH - 40} x2={x0 + svgC + svgD} y2={y0 - svgT1 - svgH - 40} />}
                                    
                                    <line x1={x0 + svgC} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC} y2={y0 - svgT1 - svgH - 35} />
                                    {geom.G > 0 && <line x1={x0 + svgC + svgG} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC + svgG} y2={y0 - svgT1 - svgH - 35} />}
                                    {calc.m > 0 && <line x1={x0 + svgC + svgD} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC + svgD} y2={y0 - svgT1 - svgH - 35} />}
                                </g>
                                <g fill="#475569" fontSize="13" fontFamily="sans-serif">
                                    {geom.G > 0 && <text x={calc.m > 0 ? (x0 + svgC + svgG - 5) : (x0 + svgC + svgG/2)} y={y0 - svgT1 - svgH - 50} textAnchor={calc.m > 0 ? "end" : "middle"}>G={geom.G}</text>}
                                    {calc.m > 0 && <text x={geom.G > 0 ? (x0 + svgC + svgG + 5) : (x0 + svgC + svgD/2)} y={y0 - svgT1 - svgH - 50} textAnchor={geom.G > 0 ? "start" : "middle"}>m={calc.m.toFixed(2)}</text>}
                                </g>

                                {/* Dimensions Left */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0 - 35} y1={y0} x2={x0 - 35} y2={y0 - svgT1 - svgH} />
                                    <line x1={x0 - 40} y1={y0} x2={x0 - 30} y2={y0} />
                                    <line x1={x0 - 40} y1={y0 - svgT1} x2={x0 - 30} y2={y0 - svgT1} />
                                    <line x1={x0 - 40} y1={y0 - svgT1 - svgH} x2={x0 - 30} y2={y0 - svgT1 - svgH} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="end" dominantBaseline="middle" fontFamily="sans-serif">
                                    <text x={x0 - 45} y={y0 - svgT1/2}>T1={geom.T1}</text>
                                    <text x={x0 - 45} y={y0 - svgT1 - svgH/2}>H={geom.H}</text>
                                </g>

                                {/* Dimensions Right */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0 + svgB + 20} y1={y0 - svgT1 - svgH} x2={x0 + svgB + 20} y2={y0 - svgT1} />
                                    <line x1={x0 + svgB + 15} y1={y0 - svgT1 - svgH} x2={x0 + svgB + 25} y2={y0 - svgT1 - svgH} />
                                    {calc.d3 > 0 && calc.d2 > 0 && <line x1={x0 + svgB + 15} y1={y0 - svgT1 - svgH + svgd2} x2={x0 + svgB + 25} y2={y0 - svgT1 - svgH + svgd2} />}
                                    <line x1={x0 + svgB + 15} y1={y0 - svgT1} x2={x0 + svgB + 25} y2={y0 - svgT1} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="start" dominantBaseline="middle" fontFamily="sans-serif">
                                    {calc.d2 > 0 && <text x={x0 + svgB + 30} y={y0 - svgT1 - svgH + svgd2/2}>d2={calc.d2.toFixed(2)}</text>}

                                </g>

                                <circle cx={x0} cy={y0} r="6" fill="#dc2626" />
                                <text x={x0 - 15} y={y0 + 15} fill="#dc2626" fontSize="14" fontWeight="bold" textAnchor="end">จุดหมุน Toe</text>
                            </svg>
                        </div>
                        
                        <div className="w-full">
                            <StepBox title="คำนวณน้ำหนักและโมเมนต์ต้านทาน (รอบจุด Toe หน้าสุด x = 0)">
                                <div className="mb-3 text-xs bg-sky-50 print:bg-transparent border border-sky-200 text-sky-900 rounded p-2 leading-snug">
                                    <strong>[C1]</strong> W<Sub text="5"/>, W<Sub text="7"/> ใช้ &gamma;<Sub text="sat"/> (น้ำหนักรวม) จึงต้องหักแรงดันน้ำยกใต้ฐาน (U) ออก มิฉะนั้นจะเป็นการนับน้ำหนักน้ำเป็นแรงต้าน
                                    &nbsp;|&nbsp; <strong>[C6]</strong> W<Sub text="8"/> เป็นน้ำหนักจร จึงคำนวณทั้งกรณีที่มีและไม่มีในฝั่งแรงต้าน
                                </div>
                                <table className="w-full text-left border-collapse mt-2 print:mt-0 text-sm print:text-xs [&_td]:print:py-1 [&_th]:print:py-1">
                                    <thead>
                                        <tr className="border-b border-slate-300">
                                            <th className="py-2">รายการ</th>
                                            <th>สมการคำนวณน้ำหนัก</th>
                                            <th>น้ำหนัก (W) กก.</th>
                                            <th>แขน (x)</th>
                                            <th>โมเมนต์ (M<Sub text="R"/>)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#94a3b8] mr-2 border border-[#475569]"></span>W<Sub text="1"/>: ฐานรากส่วน Toe</td>
                                            <td>C &times; T1 &times; &gamma;<Sub text="c"/> &times; L</td>
                                            <td>{calc.w1.toFixed(2)}</td>
                                            <td>{calc.x1.toFixed(2)}</td>
                                            <td>{(calc.w1 * calc.x1).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#e2e8f0] mr-2 border border-[#475569]"></span>W<Sub text="2"/>: กำแพงส่วนสี่เหลี่ยม</td>
                                            <td>G &times; H &times; &gamma;<Sub text="c"/> &times; L</td>
                                            <td>{calc.w2.toFixed(2)}</td>
                                            <td>{calc.x2.toFixed(2)}</td>
                                            <td>{(calc.w2 * calc.x2).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#f1f5f9] mr-2 border border-[#475569]"></span>W<Sub text="3"/>: กำแพงส่วนสามเหลี่ยม</td>
                                            <td>&frac12; &times; m &times; H &times; &gamma;<Sub text="c"/> &times; L</td>
                                            <td>{calc.w3.toFixed(2)}</td>
                                            <td>{calc.x3.toFixed(2)}</td>
                                            <td>{(calc.w3 * calc.x3).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#cbd5e1] mr-2 border border-[#475569]"></span>W<Sub text="4"/>: ฐานรากส่วน Stem+Heel</td>
                                            <td>(D + F) &times; T1 &times; &gamma;<Sub text="c"/> &times; L</td>
                                            <td>{calc.w4.toFixed(2)}</td>
                                            <td>{calc.x4.toFixed(2)}</td>
                                            <td>{(calc.w4 * calc.x4).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#fde68a] mr-2 border border-[#d97706]"></span>W<Sub text="5"/>: ดินบนกำแพงเหนือ Stem</td>
                                            <td>(W<Sub text="dry"/> + W<Sub text="wet"/>) &times; L</td>
                                            <td>{calc.w5.toFixed(2)}</td>
                                            <td>{calc.x5.toFixed(2)}</td>
                                            <td>{(calc.w5 * calc.x5).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#fcd34d] mr-2 border border-[#d97706]"></span>W<Sub text="6"/>: ดินแห้งบน Heel</td>
                                            <td>F &times; d2 &times; &gamma;<Sub text="compact"/> &times; L</td>
                                            <td>{calc.w6.toFixed(2)}</td>
                                            <td>{calc.x6.toFixed(2)}</td>
                                            <td>{(calc.w6 * calc.x6).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-100">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#93c5fd] mr-2 border border-[#2563eb]"></span>W<Sub text="7"/>: ดินเปียกบน Heel</td>
                                            <td>F &times; d3 &times; &gamma;<Sub text="sat"/> &times; L</td>
                                            <td>{calc.w7.toFixed(2)}</td>
                                            <td>{calc.x7.toFixed(2)}</td>
                                            <td>{(calc.w7 * calc.x7).toFixed(2)}</td>
                                        </tr>
                                        <tr className="border-b border-slate-200">
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#e0f2fe] mr-2 border border-[#0ea5e9]"></span>W<Sub text="8"/>: Surcharge บนดินถม</td>
                                            <td>Surcharge &times; (m + F) &times; L</td>
                                            <td>{calc.w8.toFixed(2)}</td>
                                            <td>{calc.x8.toFixed(2)}</td>
                                            <td>{(calc.w8 * calc.x8).toFixed(2)}</td>
                                        </tr>
                                        <tr className="font-semibold text-slate-700 bg-slate-50">
                                            <td colSpan="2" className="py-2 text-right pr-4">รวมน้ำหนักลง (W<Sub text="1"/>..W<Sub text="8"/>):</td>
                                            <td>{calc.sumV.toFixed(2)}</td>
                                            <td></td>
                                            <td>{calc.MR.toFixed(2)}</td>
                                        </tr>
                                        {/* ═══ [C1] แรงดันน้ำยกใต้ฐานราก ═══ */}
                                        <tr className={`border-b border-slate-200 ${calc.U > 0 ? 'bg-rose-50' : 'opacity-50'}`}>
                                            <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#bae6fd] mr-2 border border-[#0284c7]"></span>U: แรงดันน้ำยกใต้ฐาน <span className="text-rose-600 font-bold">(ลบ)</span></td>
                                            <td>&frac12; &times; (u<Sub text="toe"/> + u<Sub text="heel"/>) &times; B &times; L</td>
                                            <td className="text-rose-600">{calc.U > 0 ? '-' : ''}{calc.U.toFixed(2)}</td>
                                            <td>{calc.x_U.toFixed(2)}</td>
                                            <td className="text-rose-600">{calc.M_U > 0 ? '-' : ''}{calc.M_U.toFixed(2)}</td>
                                        </tr>
                                        <tr className="font-bold text-slate-800 bg-slate-100">
                                            <td colSpan="2" className="py-2 text-right pr-4">สุทธิ LC1 (รวม Surcharge จร):</td>
                                            <td className="text-blue-600">&Sigma;V = {calc.LC1.V.toFixed(2)}</td>
                                            <td></td>
                                            <td className="text-emerald-600">&Sigma;M<Sub text="R"/> = {calc.LC1.Mr.toFixed(2)}</td>
                                        </tr>
                                        <tr className="font-bold text-slate-800 bg-amber-50">
                                            <td colSpan="2" className="py-2 text-right pr-4">สุทธิ LC2 (ตัด W<Sub text="8"/> ออกจากแรงต้าน):</td>
                                            <td className="text-blue-600">&Sigma;V = {calc.LC2.V.toFixed(2)}</td>
                                            <td></td>
                                            <td className="text-emerald-600">&Sigma;M<Sub text="R"/> = {calc.LC2.Mr.toFixed(2)}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </StepBox>
                        </div>
                    </div>
                </div>
                );
            };

            const fmt = (v, d = 2) => (Number.isFinite(v) ? v.toFixed(d) : (v > 0 ? '\u221E' : '-'));

            /* ตารางเปรียบเทียบกรณีบรรทุก LC1 / LC2  [C6] */
            const LoadCaseTable = () => (
                <StepBox title="กรณีบรรทุกที่ตรวจสอบ (Load Cases)">
                    <div className="text-xs bg-amber-50 print:bg-transparent border border-amber-200 text-amber-900 rounded p-2 mb-3 leading-snug">
                        <strong>[C6]</strong> Surcharge จร (W<Sub text="8"/>) หายไปเมื่อไหร่ก็ได้ จึงพึ่งเป็นแรงต้านไม่ได้
                        โปรแกรมคำนวณทั้งสองกรณีแล้วใช้ค่าที่วิกฤตที่สุดตัดสินทุกหัวข้อ
                        {calc.U > 0 && <span> &nbsp;|&nbsp; <strong>[C1]</strong> ทั้งสองกรณีหักแรงดันน้ำยกใต้ฐาน U = {calc.U.toFixed(0)} กก. แล้ว</span>}
                    </div>
                    <table className="w-full text-left border-collapse text-sm print:text-xs">
                        <thead>
                            <tr className="border-b border-slate-300 text-slate-600">
                                <th className="py-2">กรณี</th>
                                <th>&Sigma;V สุทธิ</th>
                                <th>&Sigma;M<Sub text="R"/> สุทธิ</th>
                                <th>F.S.<Sub text="OT"/></th>
                                <th>F.S.<Sub text="Slide"/></th>
                                <th><span className="overline">X</span></th>
                                <th>e</th>
                                <th>q<Sub text="max"/></th>
                            </tr>
                        </thead>
                        <tbody>
                            {calc.cases.map(c => (
                                <tr key={c.label} className="border-b border-slate-100">
                                    <td className="py-2 font-semibold whitespace-nowrap">
                                        {c.label}
                                        <span className="block text-[10px] text-slate-500 font-normal">
                                            {c.withSurchargeV ? 'Surcharge ทั้งสองด้าน' : 'Surcharge เฉพาะด้านผลัก'}
                                        </span>
                                    </td>
                                    <td>{c.V.toFixed(0)}</td>
                                    <td>{c.Mr.toFixed(0)}</td>
                                    <td className={c.FS_ot < fsOtReq ? 'text-rose-600 font-bold' : ''}>{fmt(c.FS_ot)}</td>
                                    <td className={c.FS_slide < fsSlideReq ? 'text-rose-600 font-bold' : ''}>{fmt(c.FS_slide)}</td>
                                    <td>{c.X_bar.toFixed(3)}</td>
                                    <td className={!c.inMid ? 'text-rose-600 font-bold' : ''}>{c.e.toFixed(3)}</td>
                                    <td className={c.q_max > base.q_allow ? 'text-rose-600 font-bold' : ''}>{fmt(c.q_max, 0)}</td>
                                </tr>
                            ))}
                            <tr className="font-bold bg-slate-100 text-slate-800">
                                <td className="py-2">ค่าที่ใช้ตัดสิน</td>
                                <td colSpan="2" className="text-slate-500 font-normal text-xs">วิกฤตสุดของแต่ละหัวข้อ</td>
                                <td className={calc.okOT ? 'text-emerald-600' : 'text-rose-600'}>{fmt(calc.FS_ot)}</td>
                                <td className={calc.okSlide ? 'text-emerald-600' : 'text-rose-600'}>{fmt(calc.FS_slide)}</td>
                                <td>{calc.X_bar.toFixed(3)}</td>
                                <td className={calc.okEcc ? '' : 'text-rose-600'}>{calc.e.toFixed(3)}</td>
                                <td className={calc.okBear ? 'text-emerald-600' : 'text-rose-600'}>{fmt(calc.q_max, 0)}</td>
                            </tr>
                        </tbody>
                    </table>
                </StepBox>
            );

            const TabStability = () => (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                    <h3 className="font-bold text-lg text-slate-700 border-b pb-2">ตรวจสอบเสถียรภาพ (Stability Checks)</h3>

                    <div className="bg-sky-50 print:bg-white text-sky-800 print:text-slate-800 p-4 rounded-lg mb-6 text-sm font-medium grid grid-cols-2 md:grid-cols-4 print:grid-cols-4 gap-y-3 gap-x-4 border border-sky-100 print:border-slate-300 shadow-sm">
                        <div>&Sigma;M<Sub text="R"/> (W1..W8) = {calc.MR.toFixed(2)}</div>
                        <div>&Sigma;M<Sub text="O"/> = {calc.MO.toFixed(2)}</div>
                        <div>&Sigma;V (W1..W8) = {calc.sumV.toFixed(2)}</div>
                        <div>&Sigma;P = {calc.sumP.toFixed(2)}</div>
                        <div>f = tan&phi;<Sub text="base"/> = {calc.f_calc.toFixed(3)}</div>
                        <div>K ที่ใช้ = {calc.Ka.toFixed(3)} ({calc.K_mode === 'k0' ? 'K\u2080' : 'K\u2090'})</div>
                        <div className={calc.U > 0 ? 'text-rose-700 font-bold' : ''}>U (uplift) = {calc.U.toFixed(2)}</div>
                        <div>M<Sub text="U"/> = {calc.M_U.toFixed(2)}</div>
                    </div>

                    <LoadCaseTable />

                    <StepBox title="1. ตรวจสอบการพลิกคว่ำ (Overturning)">
                        <div className="flex items-center flex-wrap gap-x-4 gap-y-2 mb-2">
                            <span>F.S.<Sub text="OT"/> = </span>
                            <Fraction top={<span>&Sigma;M<Sub text="R"/> - M<Sub text="U"/></span>} bottom={<span>&Sigma;M<Sub text="O"/></span>} />
                            <span>=</span>
                            <Fraction top={calc.govOT.Mr.toFixed(2)} bottom={calc.MO.toFixed(2)} />
                            <span className="font-bold text-lg">= {fmt(calc.FS_ot)}</span>
                            <span className="text-xs text-slate-500">(กรณีวิกฤต: {calc.govOT.label})</span>
                        </div>
                        <div className="mt-3">
                            สรุป: {fmt(calc.FS_ot)} {calc.okOT
                                ? <span className="text-emerald-600 font-bold">&ge; {fsOtReq.toFixed(2)} (ผ่านเกณฑ์)</span>
                                : <span className="text-rose-600 font-bold">{"<"} {fsOtReq.toFixed(2)} (ไม่ผ่านเกณฑ์)</span>}
                        </div>
                    </StepBox>

                    <StepBox title="2. ตรวจสอบการลื่นไถล (Sliding)">
                        <div className="flex items-center flex-wrap gap-x-4 gap-y-2 mb-2">
                            <span>F.S.<Sub text="Slide"/> = </span>
                            <Fraction top={<span>f &times; (&Sigma;V - U)</span>} bottom={<span>&Sigma;P</span>} />
                            <span>=</span>
                            <Fraction top={`${calc.f_calc.toFixed(3)} \u00D7 ${calc.govSL.V.toFixed(2)}`} bottom={calc.sumP.toFixed(2)} />
                            <span className="font-bold text-lg">= {fmt(calc.FS_slide)}</span>
                            <span className="text-xs text-slate-500">(กรณีวิกฤต: {calc.govSL.label})</span>
                        </div>
                        <div className="mt-3">
                            สรุป: {fmt(calc.FS_slide)} {calc.okSlide
                                ? <span className="text-emerald-600 font-bold">&ge; {fsSlideReq.toFixed(2)} (ผ่านเกณฑ์)</span>
                                : <span className="text-rose-600 font-bold">{"<"} {fsSlideReq.toFixed(2)} (ไม่ผ่านเกณฑ์)</span>}
                        </div>
                        <div className="mt-2 text-xs text-slate-500">
                            * ไม่คิดแรงดันดินด้านรับ (Passive) และไม่คิดแรงยึดเกาะ (cohesion) ที่ก้นฐาน &mdash; เป็นการคิดแบบปลอดภัย
                        </div>
                        {pile.usePiles && (
                            <div className="mt-3 p-3 bg-indigo-50 print:bg-transparent border border-indigo-200 rounded text-sm text-indigo-900 leading-snug print:break-inside-avoid">
                                <strong>เมื่อใช้ฐานรากเสาเข็ม ค่า F.S. ข้างบนไม่ใช่กลไกที่ควบคุมการออกแบบ</strong> เพราะคิดจากสมมติว่าน้ำหนักทั้งหมดกดลงบนดิน
                                {pile.designMode === 'full'
                                    ? <span> โหมด Full Load สมมติว่าดินไม่รับแรงกดเลย จึงไม่มีแรงเสียดทานที่ก้นฐาน แรงผลักทั้งหมด {calc.P_grp_gov.toFixed(0)} กก./ช่วง ถูกส่งไปเป็นแรงเฉือนในเสาเข็ม</span>
                                    : <span> โหมด Piled Raft ดินรับแรงกดจริง จึงมีแรงเสียดทานช่วย {calc.H_fric_sys.toFixed(0)} กก. และเสาเข็มรับส่วนที่เหลือ</span>}
                                <div className="mt-2 pt-2 border-t border-indigo-200 grid grid-cols-1 sm:grid-cols-3 print:grid-cols-3 gap-2 text-xs">
                                    <div>แรงผลักต่อช่วง: <strong>{calc.P_grp_gov.toFixed(0)}</strong> กก.</div>
                                    <div>กำลังต้านรวม: <strong>{calc.R_slide_sys.toFixed(0)}</strong> กก.
                                        <span className="text-indigo-600"> ({calc.H_fric_sys.toFixed(0)} เสียดทาน + {(calc.N_piles * (calc.shearCapValid ? calc.shearCap : 0)).toFixed(0)} เข็ม)</span></div>
                                    <div>ใช้กำลัง: <strong className={calc.util_slide_sys <= 1 ? 'text-emerald-700' : 'text-rose-700'}>
                                        {Number.isFinite(calc.util_slide_sys) ? (100 * calc.util_slide_sys).toFixed(0) + '%' : '-'}</strong>
                                        {' '}{calc.util_slide_sys <= 1 ? '(ผ่าน)' : '(เกิน)'}</div>
                                </div>
                                <div className="mt-1 text-[11px] text-indigo-700">
                                    ดูรายละเอียดการแบ่งแรงและการตรวจกำลังด้านข้างของเข็มในแท็บ &quot;แรงเสาเข็ม&quot;
                                </div>
                            </div>
                        )}
                    </StepBox>
                </div>
            );
            const TabBearing = () => (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                    <h3 className="font-bold text-lg text-slate-700 border-b pb-2">แรงอัดดินใต้ฐานราก (Soil Bearing Pressure)</h3>

                    <div className="bg-amber-50 text-amber-800 p-4 rounded-lg mb-6 text-sm font-medium border border-amber-200 shadow-sm flex items-start space-x-3 print:break-inside-avoid">
                        <svg className="w-6 h-6 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        <div>
                            หากออกแบบโดยใช้ <strong>"ระบบเสาเข็ม"</strong> น้ำหนักและโมเมนต์ทั้งหมดควรถ่ายลงสู่เสาเข็ม การคำนวณหน้านี้ใช้ตรวจสอบกรณีวางบนดินเดิม
                        </div>
                    </div>

                    <div className="bg-sky-50 print:bg-white text-sky-800 print:text-slate-800 p-4 rounded-lg mb-6 text-sm font-medium grid grid-cols-2 md:grid-cols-4 print:grid-cols-4 gap-y-3 gap-x-4 border border-sky-100 print:border-slate-300 shadow-sm">
                        <div>B (กว้างฐาน) = {calc.B.toFixed(2)} ม.</div>
                        <div>L (ความยาวคิด) = {calc.L.toFixed(2)} ม.</div>
                        <div>q<Sub text="allow"/> = {base.q_allow} กก./ม.&sup2;</div>
                        <div className={calc.U > 0 ? 'text-rose-700 font-bold' : ''}>U (uplift) = {calc.U.toFixed(2)} กก.</div>
                    </div>

                    <LoadCaseTable />

                    <StepBox title={`1. ตำแหน่งแรงลัพธ์และระยะเยื้องศูนย์ (กรณีวิกฤต: ${calc.govQ.label})`}>
                        <div className="grid md:grid-cols-2 gap-4">
                            <div>
                                <div className="flex items-center flex-wrap gap-x-2 gap-y-1 mb-2">
                                    <span className="overline text-lg leading-none">X</span>
                                    <span>=</span>
                                    <Fraction top={<span>(&Sigma;M<Sub text="R"/> - M<Sub text="U"/>) - &Sigma;M<Sub text="O"/></span>} bottom={<span>&Sigma;V - U</span>} />
                                    <span>=</span>
                                    <Fraction top={`${calc.govQ.Mr.toFixed(2)} - ${calc.MO.toFixed(2)}`} bottom={calc.govQ.V.toFixed(2)} />
                                    <span className="font-bold">= {calc.X_bar.toFixed(3)} ม.</span>
                                </div>
                                <div className="flex items-center flex-wrap gap-x-2">
                                    <span>e = (B / 2) - <span className="overline">X</span></span>
                                    <span>= ({calc.B.toFixed(2)} / 2) - {calc.X_bar.toFixed(3)}</span>
                                    <span className="font-bold text-blue-600">= {calc.e.toFixed(3)} ม.</span>
                                </div>
                                <div className="mt-2 text-xs text-slate-500">
                                    e {calc.e >= 0 ? 'เป็นบวก \u2192 แรงลัพธ์ตกฝั่ง Toe หน่วยแรงสูงสุดอยู่ที่ Toe' : 'เป็นลบ \u2192 แรงลัพธ์ตกฝั่ง Heel หน่วยแรงสูงสุดอยู่ที่ Heel'}
                                </div>
                            </div>
                            <div className="bg-slate-100 p-3 rounded border border-slate-200">
                                <span className="font-semibold text-slate-700 block mb-1">กฎ Middle-Third (|e| &le; B/6):</span>
                                |e| = {calc.e === 0 ? '0.000' : Math.abs(calc.e).toFixed(3)} ม. เทียบกับ B/6 = {calc.B6.toFixed(3)} ม. <br/>
                                {calc.isMiddleThird
                                    ? <span className="text-emerald-600 font-bold">ผ่าน (หน่วยแรงกระจายเต็มหน้าฐาน)</span>
                                    : <span className="text-rose-600 font-bold">ไม่ผ่าน (หน้าฐานสัมผัสดินเพียงบางส่วน)</span>}
                                <div className="mt-2 text-xs text-slate-600 border-t border-slate-300 pt-2">
                                    ความยาวสัมผัสจริง B<Sub text="eff"/> = <strong>{calc.B_eff.toFixed(3)} ม.</strong>
                                    {' '}({calc.B > 0 ? (100 * calc.B_eff / calc.B).toFixed(0) : 0}% ของ B)
                                </div>
                            </div>
                        </div>
                    </StepBox>

                    <StepBox title="2. หน่วยแรงอัดใต้ฐานราก">
                        {!calc.bearingValid ? (
                            <div className="bg-rose-50 border-2 border-rose-300 text-rose-800 p-4 rounded font-semibold">
                                แรงลัพธ์ตกนอกหน้าฐานราก (<span className="overline">X</span> = {calc.X_bar.toFixed(3)} ม. ไม่อยู่ในช่วง 0 ถึง {calc.B.toFixed(2)} ม.)
                                <div className="font-normal text-sm mt-1">ไม่มีการกระจายแรงที่สมดุลได้ ฐานรากพลิกคว่ำ ต้องแก้ไขขนาดฐานหรือใช้เสาเข็ม</div>
                            </div>
                        ) : calc.bearingMode === 'trapezoid' ? (
                            <div>
                                <div className="text-xs bg-emerald-50 print:bg-transparent border border-emerald-200 text-emerald-900 rounded p-2 mb-3 leading-snug">
                                    <strong>[C3]</strong> แรงลัพธ์อยู่ใน Middle-third หน้าฐานสัมผัสดินเต็มความกว้าง ใช้การกระจายแบบสี่เหลี่ยมคางหมู
                                    และต้องใช้ <strong>|e|</strong> ในสูตร มิฉะนั้น q<Sub text="max"/>/q<Sub text="min"/> จะสลับกันเมื่อ e เป็นลบ
                                </div>
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div>
                                        <div className="flex items-center flex-wrap gap-x-2 mb-2 text-rose-700 font-semibold">
                                            <span>q<Sub text="max"/> =</span>
                                            <Fraction top={<span>&Sigma;V - U</span>} bottom={<span>B &times; L</span>} />
                                            <span>&times; (1 +</span>
                                            <Fraction top={<span>6|e|</span>} bottom={<span>B</span>} />
                                            <span>)</span>
                                        </div>
                                        <div>
                                            = ({calc.govQ.V.toFixed(2)} / ({calc.B.toFixed(2)} &times; {calc.L.toFixed(2)})) &times; (1 + (6 &times; {Math.abs(calc.e).toFixed(3)} / {calc.B.toFixed(2)}))<br/>
                                            q<Sub text="max"/> = <strong className="text-lg text-rose-700">{calc.q_max.toFixed(2)} กก./ม.&sup2;</strong>
                                            <span className="text-xs text-slate-500"> (ที่ {calc.peakAt === 'toe' ? 'Toe' : 'Heel'})</span>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex items-center flex-wrap gap-x-2 mb-2 text-emerald-700 font-semibold">
                                            <span>q<Sub text="min"/> =</span>
                                            <Fraction top={<span>&Sigma;V - U</span>} bottom={<span>B &times; L</span>} />
                                            <span>&times; (1 -</span>
                                            <Fraction top={<span>6|e|</span>} bottom={<span>B</span>} />
                                            <span>)</span>
                                        </div>
                                        <div>
                                            = ({calc.govQ.V.toFixed(2)} / ({calc.B.toFixed(2)} &times; {calc.L.toFixed(2)})) &times; (1 - (6 &times; {Math.abs(calc.e).toFixed(3)} / {calc.B.toFixed(2)}))<br/>
                                            q<Sub text="min"/> = <strong className="text-lg text-emerald-700">{calc.q_min.toFixed(2)} กก./ม.&sup2;</strong>
                                            <span className="text-xs text-slate-500"> (ที่ {calc.peakAt === 'toe' ? 'Heel' : 'Toe'})</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div>
                                <div className="text-xs bg-rose-50 print:bg-transparent border border-rose-300 text-rose-900 rounded p-2 mb-3 leading-snug">
                                    <strong>[C2] หลุด Middle-third</strong> ดินรับแรงดึงไม่ได้ หน้าฐานจึงเปิดออกบางส่วน
                                    ต้องเปลี่ยนไปใช้การกระจายแบบ <strong>สามเหลี่ยม</strong> สูตรเชิงเส้นเดิม (1 &plusmn; 6e/B)
                                    จะให้ q<Sub text="max"/> ต่ำกว่าความจริงและให้ q<Sub text="min"/> ติดลบซึ่งเป็นไปไม่ได้
                                </div>
                                <div className="grid md:grid-cols-2 gap-6">
                                    <div>
                                        <div className="mb-2 text-slate-700">
                                            ระยะจากขอบที่รับแรงสูงสุดถึงแนวแรงลัพธ์:<br/>
                                            a = {calc.peakAt === 'toe' ? <span><span className="overline">X</span> = {calc.X_bar.toFixed(3)}</span> : <span>B - <span className="overline">X</span> = {(calc.B - calc.X_bar).toFixed(3)}</span>} ม.
                                        </div>
                                        <div className="mb-2 text-slate-700">
                                            ความยาวสัมผัส B<Sub text="eff"/> = 3a = <strong>{calc.B_eff.toFixed(3)} ม.</strong>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="flex items-center flex-wrap gap-x-2 mb-2 text-rose-700 font-semibold">
                                            <span>q<Sub text="max"/> =</span>
                                            <Fraction top={<span>2 &times; (&Sigma;V - U)</span>} bottom={<span>3 &times; a &times; L</span>} />
                                        </div>
                                        <div>
                                            = (2 &times; {calc.govQ.V.toFixed(2)}) / (3 &times; {(calc.B_eff / 3).toFixed(3)} &times; {calc.L.toFixed(2)})<br/>
                                            q<Sub text="max"/> = <strong className="text-lg text-rose-700">{calc.q_max.toFixed(2)} กก./ม.&sup2;</strong>
                                            <span className="text-xs text-slate-500"> (ที่ {calc.peakAt === 'toe' ? 'Toe' : 'Heel'})</span>
                                        </div>
                                        <div className="mt-2">q<Sub text="min"/> = <strong className="text-emerald-700">0</strong> (หน้าฐานเปิด ไม่สัมผัสดิน)</div>
                                    </div>
                                </div>
                            </div>
                        )}
                        <div className="mt-4 p-3 bg-slate-50 text-slate-700 rounded border border-slate-200">
                            <strong>ตรวจสอบกำลังรับน้ำหนักดินเดิม:</strong> q<Sub text="max"/> ({fmt(calc.q_max, 0)}) {calc.okBear
                                ? <span className="text-emerald-600 font-bold">&le; q<Sub text="allow"/> ({base.q_allow}) ผ่านเกณฑ์</span>
                                : <span className="text-rose-600 font-bold">{">"} q<Sub text="allow"/> ({base.q_allow}) ไม่ผ่านเกณฑ์! ควรขยายฐานหรือใช้เสาเข็ม</span>}
                        </div>
                        {!calc.isMiddleThird && (
                            <div className="mt-2 text-xs text-slate-500">
                                * มาตรฐานส่วนใหญ่ยังกำหนดให้ตรวจสอบกำลังแบกทานด้วยความกว้างประสิทธิผล B' = B - 2|e| = {Math.max(0, calc.B - 2 * Math.abs(calc.e)).toFixed(3)} ม. (ยังไม่ได้รวมในโปรแกรมนี้)
                            </div>
                        )}
                    </StepBox>
                </div>
            );
            const TabPiles = () => {
                if (!pile.usePiles) {
                    return (
                        <div className="bg-white p-12 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center print:hidden">
                            <svg className="w-20 h-20 text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                            <h3 className="text-xl font-bold text-slate-600 mb-2">ยังไม่ได้เปิดใช้งานระบบเสาเข็ม</h3>
                            <p className="text-slate-500">กรุณาไปที่แท็บ "พารามิเตอร์ (Inputs)" และติ๊กเลือก "ระบบฐานรากเสาเข็ม"</p>
                        </div>
                    );
                }
                if (calc.N_piles === 0 || !calc.pc1) {
                    return (
                        <div className="bg-white p-12 rounded-xl border border-slate-200 shadow-sm text-center text-slate-500 print:break-inside-avoid">
                            ยังไม่ได้กำหนดตำแหน่งแถวเสาเข็ม กรุณาเพิ่มอย่างน้อย 1 แถวในแท็บพารามิเตอร์
                        </div>
                    );
                }
                const pcs = [calc.pc1, calc.pc2];
                const stabilityFails = !calc.okOT || !calc.okSlide;

                return (
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                        <h3 className="font-bold text-lg text-indigo-800 border-b border-indigo-100 pb-2">คำนวณแรงปฏิกิริยาในเสาเข็ม (Pile Reactions)</h3>

                        {/* ═══ [PR] แผงสรุปโหมด Piled Raft ═══ */}
                        {pile.designMode === 'raft' && (
                            <div className={`p-4 rounded-lg text-sm print:break-inside-avoid border-2 ${calc.okRaftContact && calc.okRaftSolve ? 'bg-indigo-50 border-indigo-300 text-indigo-900' : 'bg-rose-50 border-rose-300 text-rose-900'}`}>
                                <div className="font-bold mb-2">โหมด Piled Raft &mdash; แบ่งแรงด้วยความแข็ง ไม่ใช่กำลัง</div>
                                <div className="text-[13px] leading-snug">
                                    ฐานรากถือเป็นแผ่นแกร่ง การเคลื่อนตัว w(x) = w<Sub text="0"/> + &theta;&middot;x
                                    แก้ระบบสมการ 2&times;2 จากสมดุลแรงและโมเมนต์ พร้อมวนซ้ำตัดช่วงที่ดินจะต้องรับแรงดึงออก
                                    ส่วนแบ่งแรงจึงเป็นผลลัพธ์ ไม่ใช่สมมติฐาน
                                </div>
                                {!calc.okRaftContact && (
                                    <div className="mt-3 bg-rose-100 border border-rose-400 rounded p-2 font-bold text-[13px]">
                                        ยังไม่ได้ยืนยันว่าฐานรากสัมผัสดินตลอดอายุใช้งาน &mdash; ผลการตรวจสอบยังถือว่าไม่ผ่าน
                                        ให้ติ๊กยืนยันในแท็บพารามิเตอร์ หรือเปลี่ยนไปใช้โหมด Full Load
                                    </div>
                                )}
                                {!calc.okRaftSolve && (
                                    <div className="mt-3 bg-rose-100 border border-rose-400 rounded p-2 font-bold text-[13px]">
                                        แก้สมการไม่สำเร็จ ตรวจว่ากรอกการทรุดตัวของเข็มและของดินเป็นค่าที่มากกว่าศูนย์
                                    </div>
                                )}
                                {stabilityFails && (
                                    <div className="mt-3 bg-amber-100 border border-amber-400 text-amber-900 rounded p-2 text-[13px]">
                                        หมายเหตุ: F.S. พลิกคว่ำ/ลื่นไถล ของกรณีวางบนดินเดิมไม่ผ่าน แต่ค่าเหล่านั้นไม่ใช่กลไกวิบัติของฐานรากเสาเข็ม
                                        ให้ดูผลของเสาเข็มด้านล่างเป็นเกณฑ์แทน
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="bg-indigo-50 print:bg-white text-indigo-900 print:text-slate-800 p-4 rounded-lg text-sm font-medium border border-indigo-100 print:border-slate-300 shadow-sm">
                            <div className="mb-2 font-bold">สมมติฐาน: {pile.designMode === 'full' ? 'Full Load (Elastic Center)' : 'Piled Raft (ดิน+เสาเข็มร่วมกัน)'} &nbsp;|&nbsp; ช่วงเสาเข็ม S<Sub text="L"/> = {pile.spacingL} ม. &nbsp;|&nbsp; N = {calc.N_piles} แถว</div>
                            <div className="grid grid-cols-1 md:grid-cols-3 print:grid-cols-3 gap-3">
                                <div>X<Sub text="CG เสาเข็ม"/> = {calc.x_cg_pile.toFixed(3)} ม.</div>
                                <div>&Sigma;d&sup2; = {calc.sum_d2.toFixed(4)} ม.&sup2;</div>
                                <div>&Sigma;P ต่อช่วง = {((calc.sumP / calc.L) * pile.spacingL).toFixed(0)} กก.</div>
                            </div>
                        </div>

                        {/* ═══════════ ขั้นที่ 1 ═══════════ */}
                        <StepBox title="ขั้นที่ 1 — แรงลัพธ์ที่ฐานรากต้องรองรับ">
                            <div className="text-xs bg-slate-100 print:bg-transparent border border-slate-200 rounded p-2 mb-3 leading-snug">
                                แปลงแรงต่อความยาว 1 เมตร ให้เป็นแรงต่อ 1 ช่วงเสาเข็ม โดยคูณด้วย S<Sub text="L"/> = {pile.spacingL} ม.
                                {calc.U > 0 && <span> &nbsp;ค่า &Sigma;V นี้หักแรงดันน้ำยกใต้ฐาน U = {calc.U.toFixed(0)} กก./ม. ไปแล้ว</span>}
                                &nbsp;โมเมนต์ M<Sub text="toe"/> = V &times; <span className="overline">X</span> เพราะแนวแรงลัพธ์ตัดผ่านระดับก้นฐานที่ระยะ <span className="overline">X</span> จาก Toe
                            </div>
                            <table className="w-full text-left border-collapse text-sm print:text-xs">
                                <thead>
                                    <tr className="border-b border-slate-300 text-slate-600">
                                        <th className="py-2">กรณี</th>
                                        <th>&Sigma;V สุทธิ (กก./ม.)</th>
                                        <th>V<Sub text="กลุ่ม"/> (กก.)</th>
                                        <th><span className="overline">X</span> (ม.)</th>
                                        <th>M<Sub text="toe"/> (กก.-ม.)</th>
                                        <th>P<Sub text="กลุ่ม"/> (กก.)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {[calc.pc1, calc.pc2].map((pc, k) => (
                                        <tr key={pc.label} className="border-b border-slate-100">
                                            <td className="py-2 font-semibold">{pc.label}</td>
                                            <td>{(k === 0 ? calc.LC1.V : calc.LC2.V).toFixed(0)}</td>
                                            <td className="font-semibold">{pc.V_grp.toFixed(0)}</td>
                                            <td>{pc.X_bar.toFixed(3)}</td>
                                            <td>{(pc.V_grp * pc.X_bar).toFixed(0)}</td>
                                            <td>{pc.P_grp.toFixed(0)}</td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </StepBox>

                        {/* ═══════════ ขั้นที่ 2 ═══════════ */}
                        {calc.raftMode ? (
                            <StepBox title="ขั้นที่ 2 — ความแข็งของดินและเสาเข็ม">
                                <div className="text-xs bg-indigo-50 print:bg-transparent border border-indigo-200 text-indigo-900 rounded p-2 mb-3 leading-snug">
                                    ส่วนแบ่งแรงถูกกำหนดโดย <strong>ความแข็ง</strong> ไม่ใช่กำลัง จึงต้องแปลงการทรุดตัวที่กรอกไว้ให้เป็นค่าความแข็งก่อน
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 print:grid-cols-2 gap-4">
                                    <div className="bg-white print:bg-transparent p-3 rounded border border-slate-200">
                                        <div className="font-semibold text-slate-700 border-b pb-1 mb-2">ดินใต้ฐานราก</div>
                                        <div className="text-slate-600">k<Sub text="s"/> = q<Sub text="allow"/> &divide; s<Sub text="soil"/></div>
                                        <div className="text-slate-600">= {base.q_allow} &divide; {(raft.sSoil / 1000).toFixed(4)} ม.</div>
                                        <div className="font-bold text-indigo-700 mt-1">= {calc.ks_raft.toLocaleString(undefined, { maximumFractionDigits: 0 })} กก./ม.&sup3;</div>
                                    </div>
                                    <div className="bg-white print:bg-transparent p-3 rounded border border-slate-200">
                                        <div className="font-semibold text-slate-700 border-b pb-1 mb-2">เสาเข็ม 1 ต้น</div>
                                        <div className="text-slate-600">K<Sub text="pile"/> = P<Sub text="ใช้งาน"/> &divide; s<Sub text="pile"/></div>
                                        <div className="text-slate-600">= {pile.allowComp} &divide; {(raft.sPile / 1000).toFixed(4)} ม.</div>
                                        <div className="font-bold text-indigo-700 mt-1">= {calc.Kp_raft.toLocaleString(undefined, { maximumFractionDigits: 0 })} กก./ม.</div>
                                    </div>
                                </div>
                                <div className="mt-3 text-xs text-slate-600 bg-slate-100 print:bg-transparent p-2 rounded">
                                    เทียบต่อความกว้างฐานเท่ากัน: กลุ่มเสาเข็ม {calc.N_piles} ต้น มีความแข็งรวม {(calc.N_piles * calc.Kp_raft).toLocaleString(undefined, { maximumFractionDigits: 0 })} กก./ม.
                                    ส่วนดินใต้ฐานทั้งผืน {(calc.ks_raft * calc.B * pile.spacingL).toLocaleString(undefined, { maximumFractionDigits: 0 })} กก./ม.
                                    &nbsp;&rarr; เสาเข็มแข็งกว่า <strong>{((calc.N_piles * calc.Kp_raft) / Math.max(1, calc.ks_raft * calc.B * pile.spacingL)).toFixed(1)} เท่า</strong>
                                    &nbsp;นี่คือเหตุผลที่เสาเข็มดึงแรงไปเกือบทั้งหมด
                                </div>
                            </StepBox>
                        ) : (
                            <StepBox title="ขั้นที่ 2 — โมเมนต์รอบจุดศูนย์ถ่วงกลุ่มเสาเข็ม">
                                <div className="text-xs bg-slate-100 print:bg-transparent border border-slate-200 rounded p-2 mb-3 leading-snug">
                                    สูตรกระจายแรง P = V/N &plusmn; M&middot;d/&Sigma;d&sup2; ต้องใช้โมเมนต์ที่อ้างอิง <strong>CG กลุ่มเสาเข็ม</strong> เท่านั้น
                                    จึงต้องย้ายจุดอ้างอิงจาก Toe มาที่ CG ก่อน
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 print:grid-cols-4 gap-3 text-sm mb-3">
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-xs text-slate-500">X<Sub text="CG"/></div>
                                        <div className="font-bold">{calc.x_cg_pile.toFixed(3)} ม.</div>
                                    </div>
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-xs text-slate-500">&Sigma;d&sup2;</div>
                                        <div className="font-bold">{calc.sum_d2.toFixed(4)} ม.&sup2;</div>
                                    </div>
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-xs text-slate-500">e<Sub text="p"/> = X<Sub text="CG"/> - <span className="overline">X</span></div>
                                        <div className="font-bold">{(calc.x_cg_pile - calc.govPile.X_bar).toFixed(3)} ม.</div>
                                    </div>
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-xs text-slate-500">M<Sub text="CG"/> = V &times; e<Sub text="p"/></div>
                                        <div className="font-bold">{calc.govPile.M_grp.toFixed(0)}</div>
                                    </div>
                                </div>
                                <div className="text-xs text-slate-500">
                                    M<Sub text="CG"/> เป็นบวก แปลว่าแรงลัพธ์ตกฝั่ง Toe ของ CG เสาเข็ม แถวหน้าจึงรับแรงกดมากกว่าแถวหลัง
                                </div>
                            </StepBox>
                        )}

                        {/* ═══════════ ขั้นที่ 3 ═══════════ */}
                        {calc.raftMode && calc.raftS ? (
                            <StepBox title="ขั้นที่ 3 — แก้สมการความเข้ากันได้ของการเคลื่อนตัว">
                                <div className="text-xs bg-slate-100 print:bg-transparent border border-slate-200 rounded p-2 mb-3 leading-snug font-mono">
                                    w(x) = w<Sub text="0"/> + &theta;&middot;x &nbsp;&nbsp;|&nbsp;&nbsp;
                                    V = k<Sub text="s"/>&middot;S<Sub text="L"/>&middot;&int;w dx + &Sigma;(K<Sub text="p"/>&middot;w(x<Sub text="i"/>)) &nbsp;&nbsp;|&nbsp;&nbsp;
                                    M = k<Sub text="s"/>&middot;S<Sub text="L"/>&middot;&int;w&middot;x dx + &Sigma;(K<Sub text="p"/>&middot;w(x<Sub text="i"/>)&middot;x<Sub text="i"/>)
                                </div>
                                <div className="text-xs text-slate-600 mb-3 leading-snug">
                                    ระบบสมการ 2 ตัวแปร 2 สมการ แก้แล้ววนซ้ำตัดช่วงที่ w ติดลบออก เพราะดินรับแรงดึงไม่ได้
                                    &nbsp;ผลลัพธ์ของกรณีวิกฤต ({calc.raftGov.label}):
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 print:grid-cols-4 gap-3 text-sm">
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-xs text-slate-500">w<Sub text="0"/> (ที่ Toe)</div>
                                        <div className="font-bold">{(calc.raftS.wAt(0) * 1000).toFixed(3)} มม.</div>
                                    </div>
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-xs text-slate-500">w ที่ Heel</div>
                                        <div className="font-bold">{(calc.raftS.wAt(calc.B) * 1000).toFixed(3)} มม.</div>
                                    </div>
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-xs text-slate-500">&theta;</div>
                                        <div className="font-bold">{Math.abs(calc.raftS.th) > 1e-9 ? '1/' + Math.round(1 / Math.abs(calc.raftS.th)).toLocaleString() : '0'}</div>
                                    </div>
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-xs text-slate-500">ดินสัมผัสฐาน</div>
                                        <div className="font-bold">{(100 * calc.raftS.contact).toFixed(0)}%</div>
                                        <div className="text-[10px] text-slate-400">x = {calc.raftS.a.toFixed(2)}-{calc.raftS.b.toFixed(2)} ม.</div>
                                    </div>
                                </div>
                            </StepBox>
                        ) : (
                            <StepBox title="ขั้นที่ 3 — สูตรกระจายแรง (Elastic Center)">
                                <div className="bg-slate-50 print:bg-transparent p-3 rounded-lg border border-slate-200 text-sm print:border-none print:p-0">
                                    <span className="font-mono bg-white print:bg-transparent px-2 py-1 rounded border border-slate-200 inline-block">
                                        P<Sub text="i"/> = (V<Sub text="กลุ่ม"/> / N) + (M<Sub text="CG"/> &times; d<Sub text="i"/>) / &Sigma;d&sup2; &nbsp;;&nbsp; d<Sub text="i"/> = X<Sub text="CG"/> - x<Sub text="i"/>
                                    </span>
                                </div>
                                <div className="mt-2 text-xs text-slate-500">
                                    ถือว่าฐานรากแกร่งและเสาเข็มทุกต้นมีความแข็งเท่ากัน ดินใต้ฐานไม่รับแรงกดเลย
                                </div>
                            </StepBox>
                        )}

                        {/* ═══════════ ขั้นที่ 4 ═══════════ */}
                        <StepBox title="ขั้นที่ 4 — ที่มาของแรงในเสาเข็มแต่ละแถว">
                            {calc.raftMode && calc.raftS ? (
                                <div>
                                    <div className="text-xs bg-emerald-50 print:bg-transparent border border-emerald-200 text-emerald-900 rounded p-2 mb-3 leading-snug">
                                        แรงในเข็มได้จาก <strong>P<Sub text="i"/> = K<Sub text="pile"/> &times; w(x<Sub text="i"/>)</strong> โดยตรง
                                        ไม่ได้เอา V ลบส่วนที่ดินรับแล้วหารเฉลี่ย เพราะสปริงดินเปลี่ยนการหมุน &theta; ของฐานด้วย
                                        สัดส่วนแรงระหว่างแถวจึงเปลี่ยนไปด้วย ไม่ใช่แค่ลดลงเท่า ๆ กัน
                                    </div>
                                    <table className="w-full text-left border-collapse text-sm print:text-xs">
                                        <thead>
                                            <tr className="border-b border-slate-300 text-slate-600">
                                                <th className="py-2">กรณี</th>
                                                <th>แถว</th>
                                                <th>x (ม.)</th>
                                                <th>w(x) (มม.)</th>
                                                <th>P = K<Sub text="pile"/> &times; w (กก.)</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {[calc.pc1, calc.pc2].map(pc => pc.soil.rows.map((r, k) => (
                                                <tr key={pc.label + r.id} className="border-b border-slate-100">
                                                    <td className="py-1.5">{k === 0 ? pc.label : ''}</td>
                                                    <td>{r.id}</td>
                                                    <td>{r.x.toFixed(2)}</td>
                                                    <td>{(r.w * 1000).toFixed(4)}</td>
                                                    <td className="font-semibold">{r.P.toFixed(0)}</td>
                                                </tr>
                                            )))}
                                        </tbody>
                                    </table>
                                    <div className="mt-3 p-3 bg-slate-100 print:bg-transparent rounded border border-slate-200 text-sm">
                                        <strong>ตรวจสมดุลแรง</strong> (กรณี {calc.raftGov.label}) &mdash; ผลรวมต้องเท่ากับแรงลัพธ์ที่รับมาจากขั้นที่ 1:
                                        <div className="mt-1 font-mono text-xs">
                                            เสาเข็ม {calc.raftS.rows.reduce((a, r) => a + r.P, 0).toFixed(1)}
                                            &nbsp;+&nbsp; ดินใต้ฐาน {calc.raftS.Fs.toFixed(1)}
                                            &nbsp;=&nbsp; {(calc.raftS.rows.reduce((a, r) => a + r.P, 0) + calc.raftS.Fs).toFixed(1)} กก.
                                            &nbsp;เทียบกับ V<Sub text="กลุ่ม"/> = {calc.raftGov.V_grp.toFixed(1)} กก.
                                        </div>
                                        <div className="mt-1 text-xs text-slate-600">
                                            ดินรับ <strong className="text-emerald-700">{(100 * calc.raftS.share).toFixed(1)}%</strong> เสาเข็มรับ <strong className="text-indigo-700">{(100 * (1 - calc.raftS.share)).toFixed(1)}%</strong>
                                            &nbsp;|&nbsp; แรงกดใต้ฐานสูงสุด {calc.raftS.q_max.toFixed(0)} กก./ม.&sup2; ({(100 * calc.raftS.q_max / Math.max(1, base.q_allow)).toFixed(0)}% ของ q<Sub text="allow"/>)
                                            {' '}{calc.okRaftQ ? <span className="text-emerald-700">ผ่าน</span> : <span className="text-rose-700 font-bold">ไม่ผ่าน</span>}
                                            &nbsp;|&nbsp; ทรุดตัวสูงสุด {(calc.raftS.w_max * 1000).toFixed(2)} มม. (จำกัด {raft.sLimit})
                                            {' '}{calc.okRaftSettle ? <span className="text-emerald-700">ผ่าน</span> : <span className="text-rose-700 font-bold">ไม่ผ่าน</span>}
                                        </div>
                                    </div>
                                </div>
                            ) : (
                                <table className="w-full text-left border-collapse text-sm print:text-xs">
                                    <thead>
                                        <tr className="border-b border-slate-300 text-slate-600">
                                            <th className="py-2">กรณี</th>
                                            <th>แถว</th>
                                            <th>d<Sub text="i"/> (ม.)</th>
                                            <th>V/N (กก.)</th>
                                            <th>M&middot;d/&Sigma;d&sup2; (กก.)</th>
                                            <th>P<Sub text="i"/> (กก.)</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {[calc.pc1, calc.pc2].map(pc => pc.rows.map((r, k) => (
                                            <tr key={pc.label + r.id} className="border-b border-slate-100">
                                                <td className="py-1.5">{k === 0 ? pc.label : ''}</td>
                                                <td>{r.id}</td>
                                                <td>{r.d.toFixed(3)}</td>
                                                <td>{(pc.V_grp / calc.N_piles).toFixed(0)}</td>
                                                <td>{calc.sum_d2 > 0 ? (pc.M_grp * r.d / calc.sum_d2).toFixed(0) : '0'}</td>
                                                <td className="font-semibold">{r.p_axial.toFixed(0)}</td>
                                            </tr>
                                        )))}
                                    </tbody>
                                </table>
                            )}
                        </StepBox>

                        {/* ═══════════ ขั้นที่ 5 ═══════════ */}
                        <StepBox title="ขั้นที่ 5 — สรุปแรงออกแบบและตรวจสอบกำลัง">
                            <div className="text-xs bg-slate-100 print:bg-transparent border border-slate-200 rounded p-2 mb-3 leading-snug">
                                รวมผลจากทั้งสองกรณีบรรทุกเป็นค่าครอบคลุม (envelope)
                                {calc.raftMode && <span> พร้อมกรณีทนทานที่สมมติว่าดินไม่ช่วย (k<Sub text="s"/> = 0)</span>}
                            </div>
                            <table className="w-full text-left border-collapse text-sm print:text-xs mb-6">
                                <thead>
                                    <tr className="border-b border-slate-300 text-slate-600">
                                        <th className="py-2">แถว</th>
                                        <th>x (ม.)</th>
                                        <th>LC1</th>
                                        <th>LC2</th>
                                        <th>{calc.raftMode ? 'ออกแบบ' : 'แรงกดสูงสุด'}</th>
                                        <th>ตรวจแรงกด</th>
                                        {calc.raftMode && <th>ทนทาน</th>}
                                        {calc.raftMode && <th>ตรวจทนทาน</th>}
                                        <th>แรงถอน</th>
                                        <th>ตรวจแรงถอน</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {calc.pile_results.map(p => (
                                        <tr key={p.id} className="border-b border-slate-100">
                                            <td className="py-2 font-semibold">{p.id}</td>
                                            <td>{p.x.toFixed(2)}</td>
                                            <td>{p.lc1.toFixed(0)}</td>
                                            <td>{p.lc2.toFixed(0)}</td>
                                            <td className="font-bold text-rose-600">{p.p_comp.toFixed(0)}</td>
                                            <td><Badge condition={p.p_comp <= pile.allowComp} textTrue={`\u2264 ${pile.allowComp}`} textFalse={`\u003E ${pile.allowComp}`} /></td>
                                            {calc.raftMode && <td className="font-bold text-slate-700">{p.n_comp.toFixed(0)}</td>}
                                            {calc.raftMode && <td><Badge condition={p.n_comp <= pile.allowComp * calc.robustF}
                                                textTrue={`\u2264 ${(pile.allowComp * calc.robustF).toFixed(0)}`}
                                                textFalse={`\u003E ${(pile.allowComp * calc.robustF).toFixed(0)}`} /></td>}
                                            <td className="font-bold text-blue-600">{Math.abs(p.p_ten).toFixed(0)}</td>

                                        </tr>

                            </table>

                                    <div className="text-2xl font-bold text-rose-600 mb-2">{Math.max(0, ...calc.pile_results.map(p => p.p_comp)).toFixed(0)} <span className="text-sm text-slate-600">kg</span></div>
                                    <Badge condition={calc.okPileComp} textTrue={`\u2264 ${pile.allowComp} (ผ่าน)`} textFalse={`\u003E ${pile.allowComp} (เกินพิกัด)`} />

                                </div>
                                <div className="bg-white p-4 rounded-lg border border-slate-200 text-center shadow-sm">

                                        เทียบกับ {calc.shearFromBroms ? 'ค่าที่คำนวณจาก Broms' : 'ค่าที่กรอกเอง'}

                                </div>
                            </div>

                            <div className="mt-4 text-xs text-slate-500 leading-relaxed border-t border-slate-200 pt-3">

                                &middot; ไม่คิด Group efficiency &middot; ไม่คิด Negative skin friction
                                &middot; ไม่ตรวจ Punching shear ที่ฐานราก &middot; ไม่ตรวจการโก่งตัวด้านข้างของเสาเข็ม
                                &middot; วิเคราะห์เฉพาะแกน X (2 มิติ)
                            </div>
                        </StepBox>

                        {/* ═══════════ ขั้นที่ 6 ═══════════ */}

                                        แรงตั้งฉากที่ใช้คือ <strong>F<Sub text="soil"/> จากขั้นที่ 4</strong> ไม่ใช่ &Sigma;V ทั้งก้อน เพราะส่วนที่ถ่ายลงเสาเข็มไม่ได้กดที่ก้นฐาน
                                    </div>
                                    <table className="w-full text-left border-collapse text-sm print:text-xs">
                                        <tbody>
                                            <tr className="border-b border-slate-200">
                                                <td className="py-1.5">แรงผลักด้านข้าง P<Sub text="กลุ่ม"/> (กรณีวิกฤต {calc.fricGov.label})</td>

                                            <tr className="border-b border-slate-200 text-emerald-700">

                                                <td className="text-right font-bold">{calc.fricGov.H_fric_use.toFixed(0)} กก. ({(100 * calc.fricGov.H_fric_use / Math.max(1, calc.fricGov.P_grp)).toFixed(0)}%)</td>
                                            </tr>
                                            <tr className="border-b border-slate-200 bg-white print:bg-transparent">
                                                <td className="py-1.5 font-semibold">เสาเข็มรับส่วนที่เหลือ</td>
                                                <td className="text-right font-bold text-indigo-700">{calc.fricGov.H_pile_d.toFixed(0)} กก. = {calc.V_shear_pile.toFixed(0)} กก./ต้น</td>
                                            </tr>
                                            <tr>
                                                <td className="py-1.5 text-slate-500">กรณีทนทาน ไม่มีแรงเสียดทาน เข็มรับทั้งหมด</td>
                                                <td className="text-right text-slate-700">{calc.fricGov.H_pile_n.toFixed(0)} กก. = {calc.V_shear_pile_n.toFixed(0)} กก./ต้น</td>
                                            </tr>
                                        </tbody>
                                    </table>
                                    <div className="mt-2 text-[11px] text-slate-500 leading-snug">
                                        แนวราบต่างจากแนวดิ่ง: แรงเสียดทานทำงานเต็มที่ตั้งแต่เคลื่อน 2-5 มม. แล้วคงที่แบบพลาสติก
                                        ส่วนเสาเข็มต้องเคลื่อน 6-12 มม. จึงถึงพิกัด ที่ระยะเคลื่อนตัวออกแบบ แรงเสียดทานจึงทำงานเต็มที่แล้ว การนำมาบวกกันจึงมีเหตุผลรองรับ
                                        &nbsp;|&nbsp; ยังไม่คิดแรงดันดินด้านรับ (Passive) หน้า Toe ซึ่งเป็นการคิดแบบปลอดภัย
                                    </div>
                                </div>
                            ) : (
                                <div className="text-sm text-slate-700 leading-snug">
                                    โหมด <strong>Full Load</strong> สมมติว่าดินใต้ฐานไม่รับแรงกดเลย เมื่อไม่มีแรงตั้งฉากที่ก้นฐาน จึงไม่มีแรงเสียดทานมาช่วย
                                    ซึ่งสอดคล้องกับสมมติฐานในแนวดิ่ง แรงผลักทั้งหมด <strong>{calc.P_grp_gov.toFixed(0)} กก./ช่วง</strong> จึงถูกส่งไปเป็นแรงเฉือนในเสาเข็ม
                                    = {calc.V_shear_pile.toFixed(0)} กก./ต้น
                                    <div className="mt-2 text-xs text-slate-500">
                                        หากต้องการให้แรงเสียดทานก้นฐานมาช่วย ต้องเปลี่ยนไปใช้โหมด Piled Raft และยืนยันว่าฐานสัมผัสดินจริง
                                    </div>
                                </div>
                            )}
                            <div className="mt-3 p-3 bg-indigo-50 print:bg-transparent border border-indigo-200 rounded text-sm">
                                <strong>กำลังต้านการลื่นไถลของทั้งระบบ:</strong>

                                {' '}= <strong>{calc.R_slide_sys.toFixed(0)} กก.</strong>

                            </div>

                        {/* ═══════════ ขั้นที่ 7 ═══════════ */}

                                    <div className="text-[13px] leading-snug text-slate-700">
                                        รันซ้ำด้วย k<Sub text="s"/> = 0 ซึ่งให้ผลเท่ากับโหมด Full Load พอดี
                                    </div>
                                    <table className="w-full text-left border-collapse text-sm print:text-xs mt-2">
                                        <tbody>
                                            <tr className="border-b border-slate-300">
                                                <td className="py-1.5">แรงกดสูงสุดในเข็ม</td>
                                                <td className="text-right">{Math.max.apply(null, calc.pile_results.map(p => p.p_comp)).toFixed(0)} &rarr; <strong>{Math.max.apply(null, calc.pile_results.map(p => p.n_comp)).toFixed(0)}</strong> กก.</td>
                                                <td className="text-right">พิกัด {(pile.allowComp * calc.robustF).toFixed(0)}</td>

                                                <td className="py-1.5">แรงเฉือนต่อเข็ม</td>

                                            </tr>
                                        </tbody>
                                    </table>
                                    <div className="mt-2 text-xs text-slate-600 leading-relaxed border-t border-slate-300 pt-2">
                                        <strong>หลักการ:</strong> ให้ดินเป็นตัวช่วยเรื่องการใช้งาน (ลดการทรุดตัวและแรงในเข็ม)
                                        แต่ความปลอดภัยขั้นสุดท้ายต้องไม่ฝากไว้กับมัน ทั้งสองกรณีจึงต้องผ่านพร้อมกัน
                                        {calc.robustF > 1 && <span className="text-amber-700"> &mdash; การตั้งตัวคูณ {calc.robustF.toFixed(2)} คือการยอมกินเข้าไปในส่วนความปลอดภัยของเข็ม ต้องมีเหตุผลรองรับตามมาตรฐานที่ใช้</span>}
                                    </div>
                                </div>
                                <div className="mt-3 text-xs text-slate-500 leading-relaxed">
                                    <strong>เงื่อนไขที่ต้องเป็นจริง:</strong> ฐานหล่อบนดินเดิมที่เตรียมพื้นดี &middot; ดินใต้ฐานไม่อัดตัวคายน้ำหรือทรุดตามหลัง
                                    &middot; ไม่มีการขุดเปิดหรือกัดเซาะฝั่ง Toe ภายหลัง &middot; ยอมรับการทรุดตัวที่คำนวณได้
                                    &middot; K<Sub text="pile"/> ควรมาจากผลทดสอบ static load test ไม่ใช่การประมาณ
                                    &middot; ออกแบบตัวฐานรากด้วยค่าครอบคลุมทั้งสองกรณี (แรงกระจายใต้ฐาน กับ แรงกระจุกที่หัวเข็ม)
                                </div>
                            </StepBox>
                        )}

                        {lat.enabled && (
                            <StepBox title={`ขั้นที่ ${calc.raftMode ? 8 : 7} — กำลังรับแรงด้านข้างของเสาเข็ม (Broms)`}>
                                <div className="text-xs bg-cyan-50 print:bg-transparent border border-cyan-200 text-cyan-900 rounded p-2 mb-4 leading-snug">
                                    แรงด้านข้างเกือบทั้งหมดถ่ายลงดินในช่วง <strong>{lateral.charLen.toFixed(1)} ม. บนสุด</strong> ({lat.soilType === 'clay' ? '1/β' : 'T'} = ระยะยาวลักษณะ)
                                    ความยาวเข็มที่เกินจากนี้แทบไม่ช่วยเพิ่มกำลังด้านข้าง จึงต้องใช้ค่าดินของชั้นบนสุด ไม่ใช่ค่าเฉลี่ยตลอดความลึก
                                </div>

                                <div className="grid grid-cols-2 sm:grid-cols-4 print:grid-cols-4 gap-3 mb-4 text-xs">
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-slate-500">EI (แตกร้าว)</div>

                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-slate-500">M<Sub text="cr"/> / M<Sub text="u"/></div>
                                        <div className="font-bold text-slate-700">{lateral.Mcr_tm.toFixed(2)} / {lateral.My_tm.toFixed(2)} ต.·ม.</div>

                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-slate-500">{lat.soilType === 'clay' ? 'k = 67c_u' : 'n_h'}</div>
                                        <div className="font-bold text-slate-700">{lat.soilType === 'clay' ? lateral.k.toFixed(0) + ' kN/m²' : 'T = ' + lateral.T.toFixed(2) + ' ม.'}</div>
                                    </div>
                                    <div className="bg-white print:bg-transparent p-2 rounded border border-slate-200 text-center">
                                        <div className="text-slate-500">ระยะยาวลักษณะ</div>

                                        <tr className="border-b border-slate-300 text-slate-600">

                                            <th>H (กก.)</th>

                                            <th>สถานะ</th>
