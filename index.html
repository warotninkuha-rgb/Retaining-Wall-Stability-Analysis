                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                    <h3 className="font-bold text-lg text-slate-700 border-b pb-2">แรงอัดดินใต้ฐานราก (Soil Bearing Pressure)</h3>
                    
                    <div className="bg-amber-50 text-amber-800 p-4 rounded-lg mb-6 text-sm font-medium border border-amber-200 shadow-sm flex items-start space-x-3">
                        <svg className="w-6 h-6 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                        <div>
                            หากออกแบบโดยใช้ <strong>"ระบบเสาเข็ม"</strong> น้ำหนักและโมเมนต์ทั้งหมดควรถ่ายลงสู่เสาเข็ม การคำนวณหน้าแรงอัดดินนี้มีไว้เพื่อตรวจสอบกรณีไม่ใช้เสาเข็มเท่านั้น
                        </div>
                    </div>

                    <div className="bg-sky-50 print:bg-white text-sky-800 print:text-slate-800 p-4 rounded-lg mb-6 text-sm font-medium grid grid-cols-2 md:grid-cols-5 print:grid-cols-5 gap-y-3 gap-x-4 border border-sky-100 print:border-slate-300 shadow-sm">
                        <div>&Sigma;M<Sub text="R"/> = {calc.MR.toFixed(2)} กก.-ม.</div>
                        <div>&Sigma;M<Sub text="O"/> = {calc.MO.toFixed(2)} กก.-ม.</div>
                        <div>&Sigma;V = {calc.sumV.toFixed(2)} กก.</div>
                        <div>B (กว้างฐาน) = {calc.B.toFixed(2)} ม.</div>
                        <div>q<Sub text="allow"/> = {base.q_allow} กก./ม.&sup2;</div>
                    </div>

                    <StepBox title="1. ตำแหน่งแรงลัพธ์และระยะเยื้องศูนย์">
                        <div className="grid md:grid-cols-2 gap-4">
                            <div>
                                <div className="flex items-center space-x-2 mb-2">
                                    <span className="overline text-lg leading-none">X</span>
                                    <span>=</span>
                                    <Fraction top={<span>&Sigma;M<Sub text="R"/> - &Sigma;M<Sub text="O"/></span>} bottom={<span>&Sigma;V</span>} />
                                    <span>=</span>
                                    <Fraction top={`${calc.MR.toFixed(2)} - ${calc.MO.toFixed(2)}`} bottom={calc.sumV.toFixed(2)} />
                                    <span className="font-bold">= {calc.X_bar.toFixed(3)} ม.</span>
                                </div>
                                <div className="flex items-center space-x-2">
                                    <span>e = (B / 2) - <span className="overline">X</span></span>
                                    <span>= ({calc.B.toFixed(2)} / 2) - {calc.X_bar.toFixed(3)}</span>
                                    <span className="font-bold text-blue-600">= {calc.e.toFixed(3)} ม.</span>
                                </div>
                            </div>
                            <div className="bg-slate-100 p-3 rounded border border-slate-200">
                                <span className="font-semibold text-slate-700 block mb-1">กฎ Middle-Third (e &le; B/6):</span>
                                e = {Math.abs(calc.e).toFixed(3)} ม. เทียบกับ B/6 = {calc.B6.toFixed(3)} ม. <br/>
                                {calc.isMiddleThird 
                                    ? <span className="text-emerald-600 font-bold">ผ่าน (แรงลัพธ์อยู่ในช่วง Middle-third)</span> 
                                    : <span className="text-rose-600 font-bold">ไม่ผ่าน (เกิดแรงดึงใต้ฐานรากฝั่ง Heel)</span>}
                            </div>
                        </div>
                    </StepBox>

                    <StepBox title="2. หน่วยแรงอัดสูงสุดและต่ำสุด">
                        <div className="grid md:grid-cols-2 gap-6">
                            <div>
                                <div className="flex items-center space-x-2 mb-2 text-rose-700 font-semibold">
                                    <span>q<Sub text="max"/> =</span>
                                    <Fraction top={<span>&Sigma;V</span>} bottom={<span>B &times; L</span>} />
                                    <span>&times; (1 + </span>
                                    <Fraction top={<span>6e</span>} bottom={<span>B</span>} />
                                    <span>)</span>
                                </div>
                                <div>
                                    q<Sub text="max"/> = ({calc.sumV.toFixed(2)} / ({calc.B.toFixed(2)} &times; {calc.L.toFixed(2)})) &times; (1 + (6 &times; {Math.abs(calc.e).toFixed(3)} / {calc.B.toFixed(2)}))<br/>
                                    q<Sub text="max"/> = <strong className="text-lg text-rose-700">{calc.q_max.toFixed(2)} กก./ม.&sup2;</strong>
                                </div>
                            </div>
                            <div>
                                <div className="flex items-center space-x-2 mb-2 text-emerald-700 font-semibold">
                                    <span>q<Sub text="min"/> =</span>
                                    <Fraction top={<span>&Sigma;V</span>} bottom={<span>B &times; L</span>} />
                                    <span>&times; (1 - </span>
                                    <Fraction top={<span>6e</span>} bottom={<span>B</span>} />
                                    <span>)</span>
                                </div>
                                <div>
                                    q<Sub text="min"/> = ({calc.sumV.toFixed(2)} / ({calc.B.toFixed(2)} &times; {calc.L.toFixed(2)})) &times; (1 - (6 &times; {Math.abs(calc.e).toFixed(3)} / {calc.B.toFixed(2)}))<br/>
                                    q<Sub text="min"/> = <strong className="text-lg text-emerald-700">{calc.q_min.toFixed(2)} กก./ม.&sup2;</strong>
                                </div>
                            </div>
                        </div>
                        <div className="mt-4 p-3 bg-slate-50 text-slate-700 rounded border border-slate-200">
                            <strong>ตรวจสอบกำลังรับน้ำหนักดินเดิม:</strong> q<Sub text="max"/> ({calc.q_max.toFixed(0)}) {calc.q_max <= base.q_allow ? <span className="text-emerald-600 font-bold">&le; q<Sub text="allow"/> ({base.q_allow}) ผ่านเกณฑ์</span> : <span className="text-rose-600 font-bold">{">"} q<Sub text="allow"/> ({base.q_allow}) ไม่ผ่านเกณฑ์! ควรใช้เสาเข็ม</span>}
                        </div>
                    </StepBox>
                </div>
            );

            const TabPiles = () => {
                if (!pile.usePiles) {
                    return (
                        <div className="bg-white p-12 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center print:hidden">
                            <svg className="w-20 h-20 text-slate-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                            <h3 className="text-xl font-bold text-slate-600 mb-2">ยังไม่ได้เปิดใช้งานระบบเสาเข็ม</h3>
                            <p className="text-slate-500">กรุณาไปที่แท็บ "พารามิเตอร์ (Inputs)" และติ๊กเลือก "ระบบฐานรากเสาเข็ม" เพื่อดูผลการคำนวณหน้านี้</p>
                        </div>
                    );
                }

                return (
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                        <h3 className="font-bold text-lg text-indigo-800 border-b border-indigo-100 pb-2">คำนวณแรงปฏิกิริยาในเสาเข็ม (Pile Reactions)</h3>
                        
                        <div className="bg-indigo-50 print:bg-white text-indigo-900 print:text-slate-800 p-4 rounded-lg mb-6 text-sm font-medium border border-indigo-100 print:border-slate-300 shadow-sm">
                            <div className="mb-2 font-bold flex items-center space-x-2">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                                <span>สรุปแรงลัพธ์ที่กระทำต่อช่วงเสาเข็ม 1 ช่วง (S<Sub text="L"/> = {pile.spacingL} ม.)</span>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-3 print:grid-cols-3 gap-3 pl-7">
                                <div>&Sigma;V (ต่อ S<Sub text="L"/>) = {(calc.V_pile || 0).toFixed(0)} กก.</div>
                                <div>&Sigma;P (ต่อ S<Sub text="L"/>) = {(calc.P_pile || 0).toFixed(0)} กก.</div>
                                <div>จำนวนแถวเสาเข็ม (N) = {calc.N_piles} แถว</div>
                            </div>
                        </div>

                        {pile.designMode === 'excess' ? (
                            <StepBox title="1. คำนวณแรงและโมเมนต์ส่วนเกิน (Excess Forces)">
                                <div className="grid md:grid-cols-3 print:grid-cols-3 gap-6 mb-4">
                                    <div>
                                        <div className="text-slate-600 mb-1">แรงอัดแนวดิ่งส่วนเกิน (V<Sub text="excess"/>)</div>
                                        <div className="font-mono bg-slate-100 p-2 rounded text-sm">
                                            V<Sub text="allow"/> = (q<Sub text="allow"/>&times;B&times;L) / (1+6e/B)<br/>
                                            V<Sub text="excess"/> = max(0, &Sigma;V - V<Sub text="allow"/>)<br/>
                                            V<Sub text="excess"/> = {calc.V_excess > 0 ? <span className="font-bold text-rose-600">{(calc.V_excess || 0).toFixed(0)} กก.</span> : '0 กก. (รับได้)'}
                                        </div>
                                    </div>
                                    <div>
                                        <div className="text-slate-600 mb-1">โมเมนต์พลิกคว่ำส่วนเกิน (M<Sub text="excess"/>)</div>
                                        <div className="font-mono bg-slate-100 p-2 rounded text-sm">
                                            M<Sub text="excess"/> = max(0, 1.5&times;M<Sub text="O"/> - M<Sub text="R"/>)<br/>
                                            M<Sub text="excess"/> = {calc.M_excess > 0 ? <span className="font-bold text-indigo-600">{(calc.M_excess || 0).toFixed(0)} กก.-ม.</span> : '0 กก.-ม. (F.S. \u2265 1.50)'}
                                        </div>
                                    </div>
                                    <div>
                                        <div className="text-slate-600 mb-1">แรงลื่นไถลส่วนเกิน (P<Sub text="excess"/>)</div>
                                        <div className="font-mono bg-slate-100 p-2 rounded text-sm">
                                            P<Sub text="excess"/> = max(0, 1.5&times;&Sigma;P - f&times;&Sigma;V)<br/>
                                            P<Sub text="excess"/> = {calc.P_excess > 0 ? <span className="font-bold text-amber-600">{(calc.P_excess || 0).toFixed(0)} กก.</span> : '0 กก. (F.S. \u2265 1.50)'}
                                        </div>
                                    </div>
                                </div>
                                <div className="text-sm text-slate-500 italic">
                                    *เนื่องจากเลือกสมมติฐานให้เสาเข็มรับเฉพาะแรงส่วนเกิน เสาเข็มจะออกแรงต้านทานเฉพาะในกรณีที่เสถียรภาพของฐานรากดินเดิมไม่ผ่านเกณฑ์
                                </div>
                            </StepBox>
                        ) : (
                            <StepBox title="1. คำนวณคุณสมบัติกลุ่มเสาเข็มรอบ CG">
                                <div className="flex flex-col md:flex-row md:items-center space-y-3 md:space-y-0 md:space-x-8 mb-4">
                                    <div>
                                        <div className="text-slate-600 mb-1">ตำแหน่ง CG กลุ่มเสาเข็ม</div>
                                        <div className="font-mono bg-slate-100 p-2 rounded text-sm">
                                            X<Sub text="CG_pile"/> = &Sigma;x / N<br/>
                                            X<Sub text="CG_pile"/> = {calc.N_piles > 0 ? (pileRows.reduce((a,b)=>a+b,0) / calc.N_piles).toFixed(3) : 0} ม.
                                        </div>
                                    </div>
                                    <div>
                                        <div className="text-slate-600 mb-1">ระยะเยื้องศูนย์ของแรงลัพธ์ (e<Sub text="p"/>)</div>
                                        <div className="font-mono bg-slate-100 p-2 rounded text-sm">
                                            e<Sub text="p"/> = X<Sub text="CG_pile"/> - X&#772;<Sub text="applied"/><br/>
                                            e<Sub text="p"/> = {(calc.x_cg_pile || 0).toFixed(3)} - {(calc.X_bar || 0).toFixed(3)} = <span className="font-bold text-indigo-600">{((calc.x_cg_pile || 0) - (calc.X_bar || 0)).toFixed(3)} ม.</span>
                                        </div>
                                    </div>
                                    <div>
                                        <div className="text-slate-600 mb-1">โมเมนต์ลัพธ์รอบ CG เสาเข็ม (M<Sub text="CG"/>)</div>
                                        <div className="font-mono bg-slate-100 p-2 rounded text-sm">
                                            M<Sub text="CG"/> = &Sigma;V<Sub text="pile"/> &times; e<Sub text="p"/><br/>
                                            M<Sub text="CG"/> = {(calc.V_pile || 0).toFixed(0)} &times; {((calc.x_cg_pile || 0) - (calc.X_bar || 0)).toFixed(3)} = <span className="font-bold text-indigo-600">{(calc.M_cg_pile || 0).toFixed(0)} กก.-ม.</span>
                                        </div>
                                    </div>
                                </div>
                                <div className="text-sm text-slate-500 italic">
                                    * หาก M<Sub text="CG"/> เป็นบวก แปลว่าแรงลัพธ์ตกหน้า CG (ค่อนไปทาง Toe) ทำให้เสาเข็มแถวหน้าต้องรับแรงกดเพิ่มขึ้น
                                </div>
                            </StepBox>
                        )}

                        <StepBox title="2. คำนวณแรงปฏิกิริยาในเสาเข็ม (Pile Axial & Shear Forces)">
                            <div className="mb-6 bg-slate-50 print:bg-transparent p-4 rounded-lg border border-slate-200 text-sm print:border-none print:p-0">
                                <div className="flex flex-col xl:flex-row justify-between xl:items-center border-b border-slate-200 pb-3 mb-3 print:border-none print:pb-0 gap-4">
                                     <div className="font-semibold text-slate-700 flex items-center flex-wrap gap-2">
                                        <span>สมการ (Axial):</span> 
                                        <span className="font-mono font-normal bg-white print:bg-slate-50 px-2 py-1 rounded border border-slate-200 inline-block">
                                            P<Sub text="i"/> = (V<Sub text="design"/> / N) &plusmn; (M<Sub text="design"/> &times; d<Sub text="i"/>) / &Sigma;d&sup2;
                                        </span>
                                    </div>
                                    <div className="font-semibold text-slate-700 flex items-center flex-wrap gap-2">
                                        <span>สมการ (Shear):</span> 
                                        <span className="font-mono font-normal bg-white print:bg-slate-50 px-2 py-1 rounded border border-slate-200 inline-block">
                                            V<Sub text="shear"/> = {pile.designMode === 'full' ? 'P\u209A\u2092\u2097\u2091' : 'P\u2091\u2093\u2093\u2091\u209B\u209B'} / {calc.N_piles}
                                        </span>
                                    </div>
                                </div>
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mt-2">
                                    {(calc.pile_results || []).map(p => (
                                        <div key={p.id} className="bg-white p-2 rounded border border-slate-200 text-center shadow-sm">d<Sub text={p.id}/> = {p.d.toFixed(3)} ม.</div>
                                    ))}
                                    <div className="bg-white p-2 rounded border border-slate-200 text-center font-bold shadow-sm">&Sigma;d&sup2; = {(calc.sum_d2 || 0).toFixed(4)} ม.&sup2;</div>
                                </div>
                                <div className="mt-3 flex flex-col sm:flex-row justify-between items-start sm:items-center text-slate-500 text-xs">
                                    <span>* ใช้ V<Sub text="design"/> = {(calc.V_design_sp || 0).toFixed(0)} กก., M<Sub text="design"/> = {(calc.M_design_sp || 0).toFixed(0)} กก.-ม., P<Sub text="design"/> = {(calc.P_design_sp || 0).toFixed(0)} กก.</span>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 print:grid-cols-3 gap-6">
                                {(calc.pile_results || []).map(p => (
                                    <div key={p.id} className="border border-indigo-200 rounded-xl overflow-hidden print:break-inside-avoid shadow-sm hover:shadow transition-shadow">
                                        <div className="bg-indigo-50 font-bold text-indigo-800 p-3 text-center border-b border-indigo-200 flex justify-between px-4 items-center">
                                            <span>แถวที่ {p.id}</span>
                                            <span className="text-xs bg-white px-2 py-1 rounded text-indigo-600 border border-indigo-100 shadow-sm">x = {p.x.toFixed(2)}m</span>
                                        </div>
                                        <div className="p-5 bg-white flex flex-col items-center">
                                            {/* Axial */}
                                            <div className="w-full mb-4 border-b border-slate-100 pb-4 text-center">
                                                <span className="text-xs text-slate-500 uppercase tracking-wider font-semibold block mb-1">Axial Force (P<Sub text={p.id}/>)</span>
                                                <div className="text-3xl font-bold mb-2">
                                                    {p.p_axial > 0 ? (
                                                        <span className="text-rose-600">{p.p_axial.toFixed(0)}</span>
                                                    ) : p.p_axial < 0 ? (
                                                        <span className="text-blue-600">{Math.abs(p.p_axial).toFixed(0)}</span>
                                                    ) : (
                                                        <span className="text-slate-400">0</span>
                                                    )}
                                                    <span className="text-lg ml-1">kg</span>
                                                </div>
                                                <div className="text-xs text-slate-500 mb-2">
                                                    {p.p_axial > 0 ? '(Compression)' : p.p_axial < 0 ? '(Tension)' : '(No Force)'}
                                                </div>
                                                <div>
                                                    {p.p_axial === 0 ? (
                                                        <Badge condition={true} textTrue="ปลอดภัย" />
                                                    ) : p.p_axial > 0 ? (
                                                        <Badge condition={p.p_axial <= pile.allowComp} textTrue={`\u2264 ${pile.allowComp} (ผ่าน)`} textFalse={`\u003E ${pile.allowComp} (เกินพิกัด)`} />
                                                    ) : (
                                                        <Badge condition={Math.abs(p.p_axial) <= pile.allowTen} textTrue={`\u2264 ${pile.allowTen} (ผ่าน)`} textFalse={`\u003E ${pile.allowTen} (เกินพิกัด)`} />
                                                    )}
                                                </div>
                                            </div>
                                            
                                            {/* Shear */}
                                            <div className="w-full text-center">
                                                <span className="text-xs text-slate-500 uppercase tracking-wider font-semibold block mb-1">Shear Force (V<Sub text="shear"/>)</span>
                                                <div className="text-2xl font-bold text-amber-600 mb-2">{(calc.V_shear_pile || 0).toFixed(0)} <span className="text-base text-slate-600">kg</span></div>
                                                <div>
                                                    {calc.P_excess === 0 && pile.designMode === 'excess' ? (
                                                        <Badge condition={true} textTrue="ปลอดภัย (ไม่มีแรงเฉือน)" />
                                                    ) : (
                                                        <Badge condition={(calc.V_shear_pile || 0) <= pile.allowShear} textTrue={`\u2264 ${pile.allowShear} (ผ่าน)`} textFalse={`\u003E ${pile.allowShear} (เกินพิกัด)`} />
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </StepBox>

                    </div>
                );
            };

            const TabCalculations = () => {
                return (
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                        <h3 className="font-bold text-lg text-slate-700 border-b pb-2">รายการคำนวณ (Detailed Calculations)</h3>
                        
                        <StepBox title="1. สัมประสิทธิ์แรงดันดินรุก (Rankine)">
                            K<Sub text="a"/> = tan&sup2;(45 - &phi;/2) = tan&sup2;(45 - {soil.phi}/2) = <strong className="text-blue-600">{calc.Ka.toFixed(3)}</strong>
                        </StepBox>

                        <StepBox title="2. คำนวณหน่วยแรงดันดินด้านข้าง (Lateral Pressures, p)">
                            <div className="grid grid-cols-1 md:grid-cols-2 print:grid-cols-2 gap-4">
                                <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="1"/> (จาก Surcharge)</div>
                                    <div className="text-slate-600">p<Sub text="1"/> = K<Sub text="a"/> &times; Surcharge</div>
                                    <div className="text-slate-600">p<Sub text="1"/> = {calc.Ka.toFixed(3)} &times; {surcharge}</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.p1.toFixed(2)} กก./ม.&sup2;</div>
                                </div>
                                <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="2"/> (จากดินเหนือระดับน้ำ)</div>
                                    <div className="text-slate-600">p<Sub text="2"/> = K<Sub text="a"/> &times; &gamma;<Sub text="c"/> &times; d<Sub text="2"/></div>
                                    <div className="text-slate-600">p<Sub text="2"/> = {calc.Ka.toFixed(3)} &times; {soil.gamma_c} &times; {calc.d2.toFixed(2)}</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.p2.toFixed(2)} กก./ม.&sup2;</div>
                                </div>
                                <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="3"/> (จากดินใต้ระดับน้ำ)</div>
                                    <div className="text-slate-600">p<Sub text="3"/> = K<Sub text="a"/> &times; (&gamma;<Sub text="sat"/> - &gamma;<Sub text="w"/>) &times; (d<Sub text="3"/> + T<Sub text="1"/>)</div>
                                    <div className="text-slate-600">p<Sub text="3"/> = {calc.Ka.toFixed(3)} &times; {calc.gamma_sub} &times; ({calc.d3.toFixed(2)} + {geom.T1.toFixed(2)})</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.p3.toFixed(2)} กก./ม.&sup2;</div>
                                </div>
                                <div className="bg-white p-3 border border-slate-200 rounded shadow-sm">
                                    <div className="font-semibold text-slate-700 border-b pb-1 mb-2">p<Sub text="4"/> (จากแรงดันน้ำสถิต)</div>
                                    <div className="text-slate-600">p<Sub text="4"/> = &gamma;<Sub text="w"/> &times; (d<Sub text="3"/> + T<Sub text="1"/>)</div>
                                    <div className="text-slate-600">p<Sub text="4"/> = {calc.gamma_w} &times; ({calc.d3.toFixed(2)} + {geom.T1.toFixed(2)})</div>
                                    <div className="font-bold text-blue-700 mt-1">= {calc.p4.toFixed(2)} กก./ม.&sup2;</div>
                                </div>
                            </div>
                        </StepBox>

                        <StepBox title="3. แรงลัพธ์และโมเมนต์พลิกคว่ำ (รอบจุด Toe)">
                            <table className="w-full text-left border-collapse mt-2 text-sm">
                                <thead>
                                    <tr className="border-b border-slate-300">
                                        <th className="py-2">รายการ</th>
                                        <th>สมการ P (กก.)</th>
                                        <th>แรง (P)</th>
                                        <th>แขน (y)</th>
                                        <th>โมเมนต์ (M<Sub text="O"/>)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2">P<Sub text="1"/> (Surcharge)</td>
                                        <td>p1 &times; (H+T1) &times; L</td>
                                        <td>{calc.P1.toFixed(2)}</td>
                                        <td>{calc.y1.toFixed(2)}</td>
                                        <td>{(calc.P1 * calc.y1).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2">P<Sub text="2"/> (ดินแห้ง-สามเหลี่ยม)</td>
                                        <td>&frac12; &times; p2 &times; d2 &times; L</td>
                                        <td>{calc.P2_tri.toFixed(2)}</td>
                                        <td>{calc.y2_tri.toFixed(2)}</td>
                                        <td>{(calc.P2_tri * calc.y2_tri).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2">P<Sub text="2"/> (ดินแห้ง-สี่เหลี่ยม)</td>
                                        <td>p2 &times; (d3+T1) &times; L</td>
                                        <td>{calc.P2_rect.toFixed(2)}</td>
                                        <td>{calc.y2_rect.toFixed(2)}</td>
                                        <td>{(calc.P2_rect * calc.y2_rect).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2">P<Sub text="3"/> (ดินจมน้ำ)</td>
                                        <td>&frac12; &times; p3 &times; (d3+T1) &times; L</td>
                                        <td>{calc.P3.toFixed(2)}</td>
                                        <td>{calc.y3.toFixed(2)}</td>
                                        <td>{(calc.P3 * calc.y3).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="py-2">P<Sub text="4"/> (น้ำ)</td>
                                        <td>&frac12; &times; p4 &times; (d3+T1) &times; L</td>
                                        <td>{calc.P4.toFixed(2)}</td>
                                        <td>{calc.y4.toFixed(2)}</td>
                                        <td>{(calc.P4 * calc.y4).toFixed(2)}</td>
                                    </tr>
                                    <tr className="font-bold text-slate-800 bg-slate-100">
                                        <td colSpan="2" className="py-2 text-right pr-4">รวม (Total):</td>
                                        <td>&Sigma;P = {calc.sumP.toFixed(2)}</td>
                                        <td></td>
                                        <td className="text-rose-600">&Sigma;M<Sub text="O"/> = {calc.MO.toFixed(2)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </StepBox>

                        <StepBox title="4. คำนวณน้ำหนักและโมเมนต์ต้านทาน (รอบจุด Toe หน้าสุด x = 0)">
                            <table className="w-full text-left border-collapse mt-2 text-sm">
                                <thead>
                                    <tr className="border-b border-slate-300">
                                        <th className="py-2">รายการ</th>
                                        <th>สมการคำนวณน้ำหนัก</th>
                                        <th>น้ำหนัก (W) กก.</th>
                                        <th>แขน (x)</th>
                                        <th>โมเมนต์ (M<Sub text="R"/>)</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#94a3b8] mr-2 border border-[#475569]"></span>W<Sub text="1"/>: ฐานรากส่วน Toe</td>
                                        <td>C &times; T1 &times; 2400 &times; L</td>
                                        <td>{calc.w1.toFixed(2)}</td>
                                        <td>{calc.x1.toFixed(2)}</td>
                                        <td>{(calc.w1 * calc.x1).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#e2e8f0] mr-2 border border-[#475569]"></span>W<Sub text="2"/>: กำแพงส่วนสี่เหลี่ยม</td>
                                        <td>G &times; H &times; 2400 &times; L</td>
                                        <td>{calc.w2.toFixed(2)}</td>
                                        <td>{calc.x2.toFixed(2)}</td>
                                        <td>{(calc.w2 * calc.x2).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#f1f5f9] mr-2 border border-[#475569]"></span>W<Sub text="3"/>: กำแพงส่วนสามเหลี่ยม</td>
                                        <td>&frac12; &times; m &times; H &times; 2400 &times; L</td>
                                        <td>{calc.w3.toFixed(2)}</td>
                                        <td>{calc.x3.toFixed(2)}</td>
                                        <td>{(calc.w3 * calc.x3).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#cbd5e1] mr-2 border border-[#475569]"></span>W<Sub text="4"/>: ฐานรากส่วน Stem+Heel</td>
                                        <td>(D + F) &times; T1 &times; 2400 &times; L</td>
                                        <td>{calc.w4.toFixed(2)}</td>
                                        <td>{calc.x4.toFixed(2)}</td>
                                        <td>{(calc.w4 * calc.x4).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#fde68a] mr-2 border border-[#d97706]"></span>W<Sub text="5"/>: ดินบนกำแพงเหนือ Stem</td>
                                        <td>(W<Sub text="dry"/> + W<Sub text="wet"/>) &times; L</td>
                                        <td>{calc.w5.toFixed(2)}</td>
                                        <td>{calc.x5.toFixed(2)}</td>
                                        <td>{(calc.w5 * calc.x5).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#fcd34d] mr-2 border border-[#d97706]"></span>W<Sub text="6"/>: ดินแห้งบน Heel</td>
                                        <td>F &times; d2 &times; &gamma;<Sub text="compact"/> &times; L</td>
                                        <td>{calc.w6.toFixed(2)}</td>
                                        <td>{calc.x6.toFixed(2)}</td>
                                        <td>{(calc.w6 * calc.x6).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-100">
                                        <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#93c5fd] mr-2 border border-[#2563eb]"></span>W<Sub text="7"/>: ดินเปียกบน Heel</td>
                                        <td>F &times; d3 &times; &gamma;<Sub text="sat"/> &times; L</td>
                                        <td>{calc.w7.toFixed(2)}</td>
                                        <td>{calc.x7.toFixed(2)}</td>
                                        <td>{(calc.w7 * calc.x7).toFixed(2)}</td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="py-2 whitespace-nowrap"><span className="inline-block w-3 h-3 bg-[#e0f2fe] mr-2 border border-[#0ea5e9]"></span>W<Sub text="8"/>: Surcharge บนดินถม</td>
                                        <td>Surcharge &times; (m + F) &times; L</td>
                                        <td>{calc.w8.toFixed(2)}</td>
                                        <td>{calc.x8.toFixed(2)}</td>
                                        <td>{(calc.w8 * calc.x8).toFixed(2)}</td>
                                    </tr>
                                    <tr className="font-bold text-slate-800 bg-slate-100">
                                        <td colSpan="2" className="py-2 text-right pr-4">รวม (Total):</td>
                                        <td className="text-blue-600">&Sigma;V = {calc.sumV.toFixed(2)}</td>
                                        <td></td>
                                        <td className="text-emerald-600">&Sigma;M<Sub text="R"/> = {calc.MR.toFixed(2)}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </StepBox>
                    </div>
                );
            }

            const TabManual = () => (
                <div className="space-y-6">
                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-sm text-slate-700 leading-relaxed space-y-4 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                        <h3 className="font-bold text-lg text-slate-800 border-b pb-2">ความหมายของตัวแปรที่ใช้ในการคำนวณ</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <h4 className="font-semibold text-slate-700 mb-2">มิติโครงสร้างกำแพงกันดิน</h4>
                                <ul className="list-disc pl-5 space-y-1 text-slate-600">
                                    <li><strong>H:</strong> ความสูงของกำแพงกันดินส่วนที่อยู่เหนือฐานราก (Stem)</li>
                                    <li><strong>T1:</strong> ความหนาของฐานราก (Base Footing)</li>
                                    <li><strong>C:</strong> ระยะยื่นของฐานรากด้านหน้า (Toe)</li>
                                    <li><strong>D:</strong> ความกว้างของโคนกำแพง (Stem Bottom)</li>
                                    <li><strong>G:</strong> ความกว้างของยอดกำแพง (Stem Top)</li>
                                    <li><strong>F:</strong> ระยะยื่นของฐานรากด้านหลัง (Heel)</li>
                                    <li><strong>B:</strong> ความกว้างของฐานรากรวม (B = C + D + F)</li>
                                    <li><strong>m:</strong> ระยะลาดเอียงของกำแพงด้านหน้า (m = D - G)</li>
                                    <li><strong>d2:</strong> ความลึกของชั้นดินแห้ง (อยู่เหนือระดับน้ำ)</li>
                                    <li><strong>d3:</strong> ความลึกของชั้นดินเปียก (อยู่ใต้ระดับน้ำ)</li>
                                </ul>
                            </div>
                            <div>
                                <h4 className="font-semibold text-slate-700 mb-2">พารามิเตอร์ดินและวัสดุ</h4>
                                <ul className="list-disc pl-5 space-y-1 text-slate-600">
                                    <li><strong>&gamma;<Sub text="compact"/>:</strong> หน่วยน้ำหนักดินอัดแน่น (เหนือระดับน้ำ)</li>
                                    <li><strong>&gamma;<Sub text="sat"/>:</strong> หน่วยน้ำหนักดินอิ่มตัวด้วยน้ำ (ใต้ระดับน้ำ)</li>
                                    <li><strong>&gamma;<Sub text="w"/>:</strong> หน่วยน้ำหนักของน้ำ (1000 กก./ม.&sup3;)</li>
                                    <li><strong>&gamma;<Sub text="sub"/>:</strong> หน่วยน้ำหนักดินจมตัว (&gamma;<Sub text="sat"/> - &gamma;<Sub text="w"/>)</li>
                                    <li><strong>&phi; (Phi):</strong> มุมเสียดทานภายในของดิน</li>
                                    <li><strong>Ka:</strong> สัมประสิทธิ์แรงดันดินรุก (Active Earth Pressure)</li>
                                    <li><strong>f:</strong> สัมประสิทธิ์ความเสียดทานระหว่างดินกับก้นฐานราก</li>
                                    <li><strong>q<Sub text="allow"/>:</strong> กำลังรับน้ำหนักปลอดภัยของดิน</li>
                                    <li><strong>Surcharge:</strong> น้ำหนักบรรทุกจรที่กดทับบนผิวดิน</li>
                                </ul>
                            </div>
                            <div className="md:col-span-2 print:col-span-2">
                                <h4 className="font-semibold text-slate-700 mb-2 mt-4">แรงและผลการคำนวณ</h4>
                                <ul className="list-disc pl-5 space-y-1 text-slate-600 grid grid-cols-1 md:grid-cols-2 print:grid-cols-2 gap-x-4">
                                    <li><strong>P1 - P4:</strong> แรงผลักด้านข้างที่พยายามดันกำแพงให้ล้ม</li>
                                    <li><strong>W1 - W8:</strong> น้ำหนักของคอนกรีตและดินที่กดทับเพื่อต้านทานการล้ม</li>
                                    <li><strong>&Sigma;P:</strong> ผลรวมแรงผลักด้านข้างทั้งหมด (Driving Forces)</li>
                                    <li><strong>&Sigma;V:</strong> ผลรวมแรงต้านทานแนวดิ่งทั้งหมด (Resisting Forces)</li>
                                    <li><strong>&Sigma;M<Sub text="O"/>:</strong> โมเมนต์พลิกคว่ำรอบจุดหมุน (Toe)</li>
                                    <li><strong>&Sigma;M<Sub text="R"/>:</strong> โมเมนต์ต้านทานรอบจุดหมุน (Toe)</li>
                                    <li><strong>F.S.<Sub text="OT"/>:</strong> อัตราส่วนความปลอดภัยต่อการพลิกคว่ำ (Overturning)</li>
                                    <li><strong>F.S.<Sub text="Slide"/>:</strong> อัตราส่วนความปลอดภัยต่อการลื่นไถล (Sliding)</li>
                                    <li><strong>e:</strong> ระยะเยื้องศูนย์ของแรงลัพธ์ที่กระทำใต้ฐานราก</li>
                                    <li><strong>q<Sub text="max"/> / q<Sub text="min"/>:</strong> หน่วยแรงอัดสูงสุดและต่ำสุดใต้ฐานราก</li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm text-sm text-slate-700 leading-relaxed space-y-4 print:break-inside-avoid">
                        <h3 className="font-bold text-lg text-slate-800 border-b pb-2">คู่มือและอภิธานศัพท์เพิ่มเติม</h3>
                        <div>
                            <strong className="text-blue-700">กฎ Middle-Third:</strong><br/>
                            เพื่อป้องกันไม่ให้เกิดแรงดึง (Tension) ใต้ฐานราก ระยะเยื้องศูนย์ (e) ของแรงลัพธ์จะต้องไม่เกิน 1/6 ของความกว้างฐานรากรวม (B/6) หาก e {">"} B/6 ดินฝั่ง Heel จะไม่สัมผัสฐานราก ทำให้พื้นที่รับแรงลดลงและ q<Sub text="max"/> พุ่งสูงขึ้นมาก
                        </div>
                        <div>
                            <strong className="text-indigo-700">เสาเข็มรับแรงเฉือน (Pile Shear):</strong><br/>
                            ในกำแพงกันดินที่มีเสาเข็ม โดยทั่วไปจะสมมติให้เสาเข็มรับแรงผลักด้านข้างทั้งหมดโดยไม่คำนึงถึงแรงเสียดทานใต้ฐานราก เนื่องจากอาจเกิดการทรุดตัวของดินเดิมจนแยกออกจากฐานรากได้
                        </div>
                        <div>
                            <strong className="text-indigo-700">การจัดเรียงเสาเข็ม (Pile Arrangement):</strong><br/>
                            โปรแกรมวิเคราะห์เป็น 2D-Strip (ต่อความยาวกำแพง 1 ช่วง S<sub>L</sub>) 
                            การเพิ่มจำนวนต้นเสาเข็มในแนวแกน Y (ตามแนวยาวของกำแพง) ทำได้ง่ายๆ โดยการ <strong>"ลดระยะ S<sub>L</sub>"</strong> ลง เช่น หากต้องการให้เสาเข็มชิดกันมากขึ้น ก็ให้ลดระยะ S<sub>L</sub> แรงลัพธ์ V และ P จะลดลงตามสัดส่วน ทำให้แรงกระทำต่อเสาเข็ม 1 ต้นลดลง 
                            แต่ในแนวแกน X (ตั้งฉากกับกำแพง) คุณสามารถกดเพิ่มจำนวนแถวเสาเข็มได้ตามอิสระ โปรแกรมจะคำนวณตำแหน่ง CG ใหม่และหาแรงในเสาเข็มแต่ละแถวให้โดยอัตโนมัติ
                        </div>
                        <div>
                            <strong className="text-blue-700">การแบ่งตัวแปรมิติใหม่ (อิงตามรูป):</strong><br/>
                            โปรแกรมได้ปรับให้รองรับการป้อนค่า <strong>C, D, G, F</strong> โดยเฉพาะ โดยหากกรอกให้ G = D ฐานรากจะกลายเป็นรูปสี่เหลี่ยมมุมฉากปกติ และรายการคำนวณ W3 และ W5 (ที่เป็นส่วนประกอบของรูปสามเหลี่ยม) จะมีค่าเป็นศูนย์ไปโดยอัตโนมัติ
                        </div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-6xl mx-auto pb-12 font-sans print:p-0 print:m-0 print:max-w-full">
                    <div className="no-print">
                        {GlobalNav()}
                    </div>
                    
                    <div className="p-4 md:p-6 print:p-0">
                        <header className="mb-6 print:mb-8 print:text-center no-print">
                            <h1 className="text-2xl md:text-3xl font-bold text-slate-800 tracking-tight">Retaining Wall Stability Analysis</h1>
                            <p className="text-slate-500 text-sm mt-1">โปรแกรมวิเคราะห์เสถียรภาพและแรงดันดินใต้ฐานรากกำแพงกันดิน (พร้อมระบบเสาเข็ม)</p>
                        </header>
                        
                        <div className="hidden print:block mb-8 text-center border-b-2 border-slate-800 pb-4">
                            <h1 className="text-2xl font-bold text-slate-800 uppercase tracking-wider">Calculation Report</h1>
                            <h2 className="text-lg font-semibold text-slate-600 mt-1">Retaining Wall Stability Analysis</h2>
                        </div>

                        <div className="flex overflow-x-auto no-scrollbar border-b border-slate-300 mb-6 space-x-1 no-print">
                            {[
                                { id: 'inputs', label: 'พารามิเตอร์ (Inputs)' },
                                { id: 'summary', label: 'สรุปผล (Summary)' },
                                { id: 'drawings', label: 'แปลนและรูปด้าน' },
                                { id: 'driving', label: 'แรงผลัก (Driving)' },
                                { id: 'resisting', label: 'แรงต้าน (Resisting)' },
                                { id: 'stability', label: 'ตรวจสอบเสถียรภาพ' },
                                { id: 'bearing', label: 'แรงอัดดินเดิม' },
                                { id: 'piles', label: 'แรงเสาเข็ม (Piles)' },
                                { id: 'calculations', label: 'รายการคำนวณ' },
                                { id: 'manual', label: 'คู่มือ' }
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => setActiveTab(tab.id)}
                                    className={`px-4 py-3 text-sm whitespace-nowrap transition-colors ${activeTab === tab.id ? 'tab-active bg-white rounded-t-lg' : 'tab-inactive bg-slate-50 rounded-t-lg hover:bg-slate-100'}`}
                                >
                                    {tab.label}
                                </button>
                            ))}
                        </div>

                        <main className="print:flex print:flex-col print:gap-8">
                            <div className={activeTab === 'inputs' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabInputs()}</div>
                            <div className={activeTab === 'summary' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabSummary()}</div>
                            <div className={activeTab === 'drawings' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabDrawings()}</div>
                            <div className={activeTab === 'driving' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabDriving()}</div>
                            <div className={activeTab === 'resisting' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabResisting()}</div>
                            <div className={activeTab === 'stability' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabStability()}</div>
                            <div className={activeTab === 'bearing' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabBearing()}</div>
                            <div className={activeTab === 'piles' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabPiles()}</div>
                            <div className={activeTab === 'calculations' ? 'block' : 'hidden print:block print:break-inside-avoid'}>{TabCalculations()}</div>
                            <div className={activeTab === 'manual' ? 'block print:hidden' : 'hidden'}>{TabManual()}</div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
