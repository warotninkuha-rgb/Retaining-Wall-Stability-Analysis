<body>
    <noscript>

            <strong>เบราว์เซอร์ปิดการใช้งาน JavaScript อยู่</strong><br>โปรแกรมนี้ต้องใช้ JavaScript ในการคำนวณ กรุณาเปิดใช้งานแล้วโหลดหน้าใหม่

    <div id="root">
        <div id="boot-status" style="max-width:640px;margin:60px auto;padding:24px;text-align:center;color:#64748b;font-family:sans-serif;">

    <script>
    /* ═══ ตัวดักข้อผิดพลาด — กันหน้าขาวเงียบๆ ═══════════════════════════════
       ถ้า CDN โหลดไม่ได้ หรือโค้ดมีไวยากรณ์ที่ Babel แปลไม่ได้ จะแสดงสาเหตุแทนหน้าว่าง */
    (function () {
        var shown = false;
        function panel(title, detail, hint) {
            if (shown) return; shown = true;
            var r = document.getElementById('root');
            if (!r) return;
            r.innerHTML =
                '<div style="max-width:720px;margin:48px auto;padding:24px;border:1px solid #fecaca;' +
                'background:#fef2f2;color:#7f1d1d;border-radius:12px;font-family:sans-serif;line-height:1.6">' +
                '<div style="font-size:18px;font-weight:700;margin-bottom:8px">' + title + '</div>' +
                '<div style="font-size:13px;font-family:monospace;background:#fff;border:1px solid #fecaca;' +
                'padding:10px;border-radius:6px;margin-bottom:12px;white-space:pre-wrap;word-break:break-word">' +
                String(detail).replace(/[<>&]/g, function (c) { return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[c]; }) +
                '</div><div style="font-size:13px">' + hint + '</div></div>';
        }
        window.addEventListener('error', function (e) {
            panel('โปรแกรมทำงานไม่สำเร็จ', (e.message || 'unknown error') + (e.filename ? '\n' + e.filename + ':' + e.lineno : ''),
                'หากขึ้น "Unexpected token" แปลว่ามีไวยากรณ์ที่ babel-standalone@6 แปลไม่ได้ ' +
                '(เช่น JSX Fragment แบบย่อ &lt;&gt;, optional chaining ?. หรือ ??) ต้องเขียนด้วยไวยากรณ์เดิมแทน');
        });
        window.addEventListener('DOMContentLoaded', function () {
            setTimeout(function () {
                if (shown) return;
                var missing = [];
                if (typeof window.React === 'undefined') missing.push('react');
                if (typeof window.ReactDOM === 'undefined') missing.push('react-dom');
                if (typeof window.Babel === 'undefined') missing.push('babel-standalone');
                if (missing.length) {
                    panel('โหลดไลบรารีจาก CDN ไม่สำเร็จ', 'ไลบรารีที่หายไป: ' + missing.join(', '),
                        'โปรแกรมนี้ต้องต่ออินเทอร์เน็ตเพื่อโหลด unpkg.com และ cdn.tailwindcss.com ' +
                        'ตรวจสอบการเชื่อมต่อ ไฟร์วอลล์ หรือ Ad-blocker แล้วโหลดหน้าใหม่');
                    return;
                }
                var bs = document.getElementById('boot-status');
                if (bs) panel('โปรแกรมโหลดไลบรารีครบแล้ว แต่ยังไม่แสดงผล', 'React ไม่ได้ mount ลงใน #root',
                    'ลองกด Ctrl+F5 เพื่อล้างแคช หากยังไม่ได้ให้เปิด Console (F12) เพื่อดูข้อความผิดพลาด');
            }, 8000);
        });
    })();
    </script>

    <script type="text/babel">
        const { useState, useMemo, useEffect } = React;

        /* ═══════════════════════════════════════════════════════════════════
           ระบบบันทึกพารามิเตอร์ล่าสุด
           - ห่อ localStorage ด้วย try/catch ทุกจุด บางเบราว์เซอร์/โหมดส่วนตัว
             จะ throw SecurityError ซึ่งจะทำให้ทั้งหน้าขาวถ้าไม่ดัก
           - มี SCHEMA version กันข้อมูลเก่าที่โครงสร้างไม่ตรงทำให้โปรแกรมพัง
           ═══════════════════════════════════════════════════════════════════ */
        const STORE_KEY = 'rw-stability-params';
        const SCHEMA = 1;

        const store = (function () {
            var ok = false;
            try {
                window.localStorage.setItem('__rwtest', '1');
                window.localStorage.removeItem('__rwtest');
                ok = true;
            } catch (e) { ok = false; }
            return {
                available: ok,
                read: function () {
                    if (!ok) return null;
                    try { return JSON.parse(window.localStorage.getItem(STORE_KEY)); }
                    catch (e) { return null; }
                },
                write: function (o) {
                    if (!ok) return false;
                    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(o)); return true; }
                    catch (e) { return false; }
                },
                clear: function () {
                    if (!ok) return;
                    try { window.localStorage.removeItem(STORE_KEY); } catch (e) {}
                }
            };
        })();

        /* ค่าเริ่มต้นจากโรงงาน — ต้องตรงกับที่ประกาศไว้ใน useState เดิม */
        const DEFAULTS = {
            soil: { gamma_c: 1900, gamma_sat: 2100, phi_backfill: 30, phi_base: 35 },
            base: { q_allow: 8000 },
            surcharge: 500,
            designLength: 1.0,
            geom: { H: 2.0, C: 0.0, D: 0.6, G: 0.25, F: 2.0, T1: 0.3, waterDepth: 1.5 },
            pressureMode: 'auto',
            useUplift: true,
            upliftMode: 'full',
            fsOtReq: 1.5,
            fsSlideReq: 1.5,
            gamma_conc: 2400,
            pile: { usePiles: true, designMode: 'full', spacingL: 2.0,
                    allowComp: 35000, allowTen: 10500, allowShear: 2500 },
            pileRows: [0.4, 2.1],
            pileType: 'sq26',
            /* [PR] พารามิเตอร์โหมด Piled Raft — ป้อนเป็น "การทรุดตัว" ซึ่งวัดได้จริง
               แล้วโปรแกรมแปลงเป็นความแข็ง (stiffness) ให้เอง */
            raft: {
                sSoil: 25,        // มม. การทรุดตัวของดินเมื่อรับ q_allow เต็ม
                sPile: 6,         // มม. การทรุดตัวของเข็มที่แรงใช้งาน (จาก static load test)
                sLimit: 25,       // มม. ขีดจำกัดการทรุดตัวที่ยอมรับได้
                robust: 1.0,      // ตัวคูณกำลังที่ยอมให้ในกรณีดินไม่ช่วย
                contactOK: false  // ยืนยันว่าฐานสัมผัสดินจริงตลอดอายุใช้งาน
            },
            lat: { enabled: true, useForCheck: true, soilType: 'clay', cu: 2.5,
                   sandDensity: 'medium', phiLat: 30, fixity: 'fixed', yLimit: 6,
                   fsBroms: 2.5, pMult: 1.0, D: 0.26, di: 0, shape: 'square',
                   Lpile: 20, fcPile: 350, fpe: 50, eiFactor: 0.5, muFactor: 1.6 }
        };

        /* อ่านค่าที่บันทึกไว้ ตรวจความถูกต้องทีละ field
           field ที่หายหรือชนิดผิด จะถอยไปใช้ค่าเริ่มต้นเสมอ ไม่ทำให้โปรแกรมพัง */
        const SAVED = (function () {
            var raw = store.read();
            if (!raw || raw.v !== SCHEMA || !raw.d || typeof raw.d !== 'object') return null;
            return raw;
        })();

        const pick = function (key) {
            var def = DEFAULTS[key];
            if (!SAVED) return def;
            var v = SAVED.d[key];
            if (v === undefined || v === null) return def;
            if (Array.isArray(def)) {
                if (!Array.isArray(v)) return def;
                var arr = v.filter(function (x) { return typeof x === 'number' && isFinite(x); });
                return arr.length ? arr : def;
            }
            if (typeof def === 'object') {
                if (typeof v !== 'object' || Array.isArray(v)) return def;
                return Object.assign({}, def, v);   // เติม field ใหม่ที่เพิ่มมาทีหลัง
            }
            if (typeof def === 'number') return (typeof v === 'number' && isFinite(v)) ? v : def;
            if (typeof def === 'boolean') return typeof v === 'boolean' ? v : def;
            return typeof v === 'string' ? v : def;
        };

        /* ═══════════════════════════════════════════════════════════════════
           ส่งออกรายงานเป็นไฟล์ Word (.doc)
           ใช้วิธี HTML-in-Word ซึ่ง Word เปิดและแก้ไขต่อได้ ไม่ต้องพึ่ง library ภายนอก
           สามเรื่องที่ต้องแปลงก่อน มิฉะนั้นไฟล์จะออกมาว่างเปล่า:
             1) SVG  -> PNG      Word นำเข้า SVG ในไฟล์ HTML ไม่ได้
             2) class ของ Tailwind -> inline style   เพราะ CSS จาก CDN ไม่ได้ไปด้วย
             3) input/select -> ข้อความ   ไม่งั้นจะกลายเป็นช่องกรอกเปล่าใน Word
           ═══════════════════════════════════════════════════════════════════ */
        const WORD_COLORS = {
            emerald: ['#047857', '#d1fae5'], rose: ['#be123c', '#ffe4e6'],
            amber:   ['#b45309', '#fef3c7'], sky:  ['#0369a1', '#e0f2fe'],
            cyan:    ['#0e7490', '#cffafe'], indigo: ['#4338ca', '#eef2ff'],
            blue:    ['#1d4ed8', '#dbeafe'], slate: ['#334155', '#f1f5f9'],
            purple:  ['#7e22ce', '#f3e8ff'], violet: ['#6d28d9', '#ede9fe'],
            orange:  ['#c2410c', '#ffedd5'], red:  ['#b91c1c', '#fee2e2'],
            green:   ['#15803d', '#dcfce7'], teal: ['#0f766e', '#ccfbf1']
        };
        const WORD_SIZES = { 'text-4xl': '22pt', 'text-3xl': '19pt', 'text-2xl': '16pt',
                             'text-xl': '14pt', 'text-lg': '13pt', 'text-base': '11pt',
                             'text-sm': '10pt', 'text-xs': '9pt' };

        const WORD_CSS =
            '@page WordSection1 { size:21.0cm 29.7cm; margin:1.4cm 1.4cm 1.6cm 1.4cm; }' +
            'div.WordSection1 { page:WordSection1; }' +
            "body,div,span,td,th,li,p,h1,h2,h3,h4 { font-family:'TH Sarabun New','Sarabun','Leelawadee UI','Tahoma',sans-serif; }" +
            'body { font-size:11pt; color:#1e293b; line-height:1.3; }' +
            'h1 { font-size:18pt; margin:0 0 4pt; } h2 { font-size:14pt; margin:0 0 4pt; }' +
            'h3 { font-size:13pt; margin:10pt 0 4pt; } h4 { font-size:12pt; margin:8pt 0 3pt; }' +
            'table { border-collapse:collapse; width:100%; margin:5pt 0; font-size:10pt; }' +
            'th,td { border:0.5pt solid #94a3b8; padding:3pt 5pt; vertical-align:top; }' +
            'th { background:#e2e8f0; font-weight:bold; }' +
            'img { max-width:17cm; height:auto; }' +
            'ul { margin:3pt 0; padding-left:16pt; } li { margin:1pt 0; }' +
            'sub { font-size:8pt; } hr { border:none; border-top:0.5pt solid #cbd5e1; }';

        /* แปลง SVG หนึ่งตัวเป็นรูป PNG (คืน null ถ้าทำไม่ได้ จะได้ข้ามไปโดยไม่พังทั้งไฟล์) */
        const svgToPng = function (svg, w, h) {
            return new Promise(function (resolve) {
                try {
                    var c2 = svg.cloneNode(true);
                    c2.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
                    c2.setAttribute('width', w);
                    c2.setAttribute('height', h);
                    c2.setAttribute('font-family', "'Sarabun','Leelawadee UI','Tahoma',sans-serif");
                    var xml = new XMLSerializer().serializeToString(c2);
                    var img = new Image();
                    img.onload = function () {
                        try {
                            var cv = document.createElement('canvas');
                            cv.width = w * 2; cv.height = h * 2;
                            var ctx = cv.getContext('2d');
                            ctx.fillStyle = '#ffffff';
                            ctx.fillRect(0, 0, cv.width, cv.height);
                            ctx.drawImage(img, 0, 0, cv.width, cv.height);
                            resolve(cv.toDataURL('image/png'));
                        } catch (e) { resolve(null); }
                    };
                    img.onerror = function () { resolve(null); };
                    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
                } catch (e) { resolve(null); }
            });
        };

        /* แปลง class ของ Tailwind ที่มีความหมายเป็น inline style แล้วทิ้ง class */
        const wordStyle = function (root) {
            var list = Array.prototype.slice.call(root.querySelectorAll('*'));
            list.forEach(function (el) {
                var c = el.getAttribute('class');
                if (c === null) return;
                var st = [];
                var mT = c.match(/(?:^|\s)text-([a-z]+)-\d{3}/);
                if (mT && WORD_COLORS[mT[1]]) st.push('color:' + WORD_COLORS[mT[1]][0]);
                var mB = c.match(/(?:^|\s)bg-([a-z]+)-\d{2,3}/);
                if (mB && WORD_COLORS[mB[1]]) st.push('background:' + WORD_COLORS[mB[1]][1]);
                for (var k in WORD_SIZES) {
                    if (new RegExp('(?:^|\\s)' + k + '(?:\\s|$)').test(c)) { st.push('font-size:' + WORD_SIZES[k]); break; }
                }
                if (/font-bold|font-semibold/.test(c)) st.push('font-weight:bold');
                if (/(?:^|\s)text-center(?:\s|$)/.test(c)) st.push('text-align:center');
                if (/(?:^|\s)text-right(?:\s|$)/.test(c)) st.push('text-align:right');
                if (/(?:^|\s)border(?:\s|$)|border-[0-9]/.test(c)) st.push('border:0.5pt solid #cbd5e1;padding:3pt');
                if (st.length) el.setAttribute('style', (el.getAttribute('style') || '') + ';' + st.join(';'));
                el.removeAttribute('class');
            });
        };

        const fmtTime = function (ms) {
            try {
                var d = new Date(ms);
                var p = function (n) { return (n < 10 ? '0' : '') + n; };
                return p(d.getDate()) + '/' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
            } catch (e) { return '-'; }
        };

        /* ⚠ ข้อจำกัดสำคัญ: หน้านี้แปล JSX ด้วย babel-standalone@6 ในเบราว์เซอร์
           ห้ามใช้ไวยากรณ์เหล่านี้ มิฉะนั้นจะได้หน้าขาวทันที (Unexpected token):
             - JSX Fragment แบบย่อ  <> ... </>     ให้ใช้ <span> หรือ <React.Fragment> แทน
             - Optional chaining  a?.b             ให้ใช้ a && a.b
             - Nullish coalescing  a ?? b          ให้ใช้ a != null ? a : b
             - async / await, exponent **, optional catch binding
           ทดสอบก่อน deploy ทุกครั้งด้วย babel-standalone@6 ไม่ใช่ Babel 7 */

        /* ═══ บันทึกการแก้ไข ═══════════════════════════════════════════════════
           v2.0 — แก้ไขประเด็นวิกฤตทางวิศวกรรม 6 ข้อ
             [C1] เพิ่มแรงดันน้ำยกใต้ฐานราก (Uplift) ซึ่งเดิมไม่ได้คิดเลย
             [C2] เปลี่ยนเป็นการกระจายแรงแบบสามเหลี่ยมเมื่อ |e| > B/6
             [C3] ใช้ |e| ในสูตร q_max ป้องกัน q_max/q_min สลับกันเมื่อ e เป็นลบ
             [C4] เพิ่มตัวเลือก K0 (At-rest) และสลับอัตโนมัติเมื่อใช้เสาเข็ม
             [C5] เปลี่ยน default เป็น Full Load และแก้จุดอ้างอิงโมเมนต์ของโหมด Excess
             [C6] ตรวจสอบ 2 กรณีบรรทุก (Surcharge จรเป็น/ไม่เป็นแรงต้าน)
           พ่วง: [M2] ปิดระดับน้ำได้จริง  [M3] gamma_concrete เป็นค่ากรอกได้
           v2.1 — เพิ่มโมดูลตรวจแรงด้านข้างของเสาเข็ม (Broms + เกณฑ์ระยะโก่ง + M_cr)
                  พร้อมช่องกรอก c_u และให้ค่าที่คำนวณได้คุม allowShear อัตโนมัติ
           v2.2 — แก้บั๊ก: ป้ายตรวจแรงเฉือนอ่าน pile.allowShear แต่เงื่อนไขใช้ shearCap
                  ทำให้ขึ้นข้อความขัดแย้งเช่น "<= 0 (ผ่าน)" ตอนนี้ทุกจุดอ้าง calc.shearCap
                  และกำลัง <= 0 ถือว่าไม่ผ่าน (เดิมเป็น 0 <= 0 = ผ่าน)
           v2.3 — บันทึกพารามิเตอร์ล่าสุดลง localStorage อัตโนมัติ + ส่งออก/นำเข้าไฟล์ JSON
                  + ปุ่มกลับไปใช้ค่าเริ่มต้น ทุกจุดที่อ่านค่าเก่ามีการตรวจชนิดข้อมูลทีละ field
                  ข้อมูลเสียหรือ schema ไม่ตรงจะถอยไปใช้ค่าเริ่มต้นแทนที่จะทำให้โปรแกรมพัง
           v2.4 — หน้าสรุปสลับไปแสดงผลของเสาเข็มเป็นหลักเมื่อเปิดใช้ระบบฐานรากเสาเข็ม
                  โดยผลของดินเดิมถูกลดระดับเป็นข้อมูลอ้างอิง (โหมด Full Load)
                + ปุ่มส่งออกรายงานเป็นไฟล์ Word (.doc) แปลง SVG เป็น PNG และแปลง
                  class ของ Tailwind เป็น inline style เพื่อให้ Word แสดงผลได้
           v3.0 — ยกเลิกโหมด Excess Forces เปลี่ยนเป็นโหมด Piled Raft ที่ถูกต้อง
                  แบ่งแรงด้วยความแข็ง (displacement compatibility) แทนการลบกำลังกัน
                  แก้ระบบสมการ 2x2 ของแผ่นแกร่งบนสปริง พร้อมวนซ้ำเงื่อนไขดินไม่รับแรงดึง
                  รันคู่กับกรณี ks = 0 (ดินหลุดจากใต้ฐาน) เสมอ ต้องผ่านทั้งสองกรณี
                  ตรวจสอบแล้วว่า solveRaft(ks=0) ให้ผลตรงกับสูตร elastic center เดิมทุกหลัก
           v3.1 — เขียนอภิธานศัพท์ในแท็บคู่มือใหม่ทั้งหมด 13 หมวด 115 รายการ
                  ครอบคลุมตัวแปรและพารามิเตอร์ทุกตัวที่โปรแกรมใช้จริง
           v3.2 — [PR-H] แก้ความไม่สอดคล้อง: โหมด Piled Raft แบ่งแรงแนวดิ่งให้ดินช่วยรับ
                  แต่แนวราบยังให้เสาเข็มรับ 100% ทั้งที่ก้นฐานมีแรงกด F_soil อยู่จริง
                  จึงต้องมีแรงเสียดทาน f x F_soil ช่วยด้วย (ใช้ F_soil ไม่ใช่ SumV)
                  หารด้วย F.S. ลื่นไถลก่อนใช้ เพราะเป็นค่าประลัย และรันกรณีทนทาน
                  (ไม่มีเสียดทาน เข็มรับทั้งหมด) คู่กันเสมอ ต้องผ่านทั้งสองกรณี
                  โหมด Full Load ไม่คิดเสียดทานเหมือนเดิม เพราะสมมติว่าดินไม่รับแรงกด
           v3.3 — เรียงลำดับรายการคำนวณเสาเข็มใหม่เป็น 7-8 ขั้น ตามลำดับที่มาของผลลัพธ์
                  แก้ปัญหาเดิมที่แสดงผลลัพธ์ก่อนแล้วค่อยอธิบายวิธีได้มา และแก้จุดที่
                  โหมด Piled Raft แสดงสูตร elastic center ทั้งที่ไม่ได้ใช้สูตรนั้น
                  เพิ่มตารางแสดง w(x) ของแต่ละแถว และการตรวจสมดุล เสาเข็ม + ดิน = V
        ════════════════════════════════════════════════════════════════════ */
        const APP_VERSION = 'v3.3 (Piled Raft + ลำดับคำนวณใหม่)';

        const Fraction = ({ top, bottom }) => (
            <div className="inline-flex flex-col items-center justify-center align-middle mx-1" style={{ verticalAlign: 'middle' }}>
                <span className="border-b border-slate-400 pb-0.5 px-1 leading-none">{top}</span>
                <span className="pt-0.5 px-1 leading-none">{bottom}</span>
            </div>
        );

        const StepBox = ({ title, children, className="" }) => (
            <div className={`bg-slate-50 border border-slate-200 rounded-lg p-5 print:p-3 mb-5 print:mb-3 print:break-inside-avoid shadow-sm ${className}`}>
                <h4 className="font-bold text-slate-700 mb-3 print:mb-1 border-b border-slate-200 pb-2 print:pb-1 print:text-sm">{title}</h4>
                <div className="text-slate-600 text-sm print:text-[13px] overflow-x-auto overflow-y-hidden">{children}</div>
            </div>
        );

        const Badge = ({ condition, textTrue = "ผ่าน", textFalse = "ไม่ผ่าน" }) => (
            <span className={`px-2 py-1 rounded text-xs font-semibold ${condition ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                {condition ? textTrue : textFalse}
            </span>
        );

        const Sub = ({ text }) => <sub>{text}</sub>;

        // Custom Input Component for standardizing layout
        const InputRow = ({ label, value, onChange, unit, warning, bgClass = "" }) => (
            <div className={`flex flex-col sm:flex-row sm:items-center justify-between py-2 px-3 rounded-md transition-colors border border-transparent hover:border-slate-200 hover:bg-slate-50 print:flex-row print:items-center print:py-1 print:px-1 ${bgClass}`}>
                <span className="text-slate-700 text-sm mb-1 sm:mb-0 mr-2 flex-1 leading-tight">{label}</span>
                <div className="flex items-center flex-shrink-0 self-start sm:self-auto">
                    {warning && <span className="text-rose-500 text-xs mr-2 whitespace-nowrap no-print">{warning}</span>}
                    <input 
                        type="number" step="0.01" 
                        className="w-20 sm:w-24 p-1.5 border border-slate-300 rounded text-right focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm bg-white shadow-sm print:shadow-none print:p-1" 
                        value={value} onChange={onChange} 
                    />
                    <span className="text-slate-500 ml-2 text-sm whitespace-nowrap min-w-[2.5rem] text-left">{unit}</span>
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('inputs');

            // Global Inputs State
            const [soil, setSoil] = useState(pick('soil'));
            const [base, setBase] = useState(pick('base'));
            const [surcharge, setSurcharge] = useState(pick('surcharge'));
            const [designLength, setDesignLength] = useState(pick('designLength'));

            // [C4] สัมประสิทธิ์แรงดันดิน: 'auto' | 'ka' (Active) | 'k0' (At-rest)
            const [pressureMode, setPressureMode] = useState(pick('pressureMode'));
            // [C1] แรงดันน้ำยกใต้ฐานราก
            const [useUplift, setUseUplift]   = useState(pick('useUplift'));
            const [upliftMode, setUpliftMode] = useState(pick('upliftMode'));   // 'full' = ไม่ระบายน้ำ | 'seepage' = ระบายที่ Toe
            // เกณฑ์ F.S. ที่ผู้ใช้กำหนดเองได้
            const [fsOtReq, setFsOtReq]       = useState(pick('fsOtReq'));
            const [fsSlideReq, setFsSlideReq] = useState(pick('fsSlideReq'));
            // หน่วยน้ำหนักคอนกรีต (เดิม hardcode 2400 อยู่ 4 จุด)
            const [gamma_conc, setGammaConc]  = useState(pick('gamma_conc'));
            
            // Geometry State
            const [geom, setGeom] = useState(pick('geom'));
            // มีน้ำอยู่เหนือระดับก้นฐานรากหรือไม่ (ใช้เลือกค่า n_h แบบจมน้ำของดินทราย)
            const calcWaterAtBase = geom.waterDepth < (geom.H + geom.T1);

            // Pile Foundation State
            const [pile, setPile] = useState(function () {
                var p = pick('pile');
                /* ข้อมูลเก่าที่บันทึกโหมด 'excess' ไว้ ให้ย้ายมาเป็น 'full' ซึ่งปลอดภัยกว่า */
                if (p.designMode !== 'full' && p.designMode !== 'raft') p.designMode = 'full';
                return p;
            });
            const [raft, setRaft] = useState(pick('raft'));
            const [pileRows, setPileRows] = useState(pick('pileRows'));

            const [pileType, setPileType] = useState(pick('pileType'));
            const pileProfiles = {
                'sq22':   { name: 'สี่เหลี่ยมตัน 0.22x0.22 ม.', comp: 25000, ten: 7500,  shear: 1500, D: 0.22, di: 0, shape: 'square' },
                'sq26':   { name: 'สี่เหลี่ยมตัน 0.26x0.26 ม.', comp: 35000, ten: 10500, shear: 2500, D: 0.26, di: 0, shape: 'square' },
                'sq30':   { name: 'สี่เหลี่ยมตัน 0.30x0.30 ม.', comp: 50000, ten: 15000, shear: 3500, D: 0.30, di: 0, shape: 'square' },
                'sq40':   { name: 'สี่เหลี่ยมตัน 0.40x0.40 ม.', comp: 100000, ten: 30000, shear: 4000, D: 0.40, di: 0, shape: 'square' },
                'spun30': { name: 'กลมกลวง (Spun) D0.30 ม.',    comp: 45000, ten: 13500, shear: 3000, D: 0.30, di: 0.18, shape: 'circle' },
                'custom': { name: 'กำหนดค่าเอง (Custom)' }
            };

            /* ═══ พารามิเตอร์วิเคราะห์แรงด้านข้าง (Broms + เกณฑ์ระยะโก่ง) ═══ */
            const [lat, setLat] = useState(pick('lat'));

            /* ═══ บันทึก / โหลด / ส่งออก พารามิเตอร์ ═══ */
            const [autoSave, setAutoSave] = useState(true);
            const [savedAt, setSavedAt]   = useState(SAVED ? SAVED.t : 0);
            const [storeMsg, setStoreMsg] = useState('');
            const [showRestored, setShowRestored] = useState(!!SAVED);

            const snapshot = () => ({
                soil: soil, base: base, surcharge: surcharge, designLength: designLength,
                geom: geom, pressureMode: pressureMode, useUplift: useUplift, upliftMode: upliftMode,
                fsOtReq: fsOtReq, fsSlideReq: fsSlideReq, gamma_conc: gamma_conc,
                pile: pile, pileRows: pileRows, pileType: pileType, lat: lat, raft: raft
            });

            const applyData = (d) => {
                const g = (k) => {
                    const def = DEFAULTS[k], v = d ? d[k] : undefined;
                    if (v === undefined || v === null) return def;
                    if (Array.isArray(def)) return Array.isArray(v)
                        ? v.filter(x => typeof x === 'number' && isFinite(x)) : def;
                    if (typeof def === 'object') return (typeof v === 'object' && !Array.isArray(v))
                        ? Object.assign({}, def, v) : def;
                    if (typeof def === 'number') return (typeof v === 'number' && isFinite(v)) ? v : def;
                    if (typeof def === 'boolean') return typeof v === 'boolean' ? v : def;
                    return typeof v === 'string' ? v : def;
                };
                setSoil(g('soil')); setBase(g('base')); setSurcharge(g('surcharge'));
                setDesignLength(g('designLength')); setGeom(g('geom'));
                setPressureMode(g('pressureMode')); setUseUplift(g('useUplift')); setUpliftMode(g('upliftMode'));
                setFsOtReq(g('fsOtReq')); setFsSlideReq(g('fsSlideReq')); setGammaConc(g('gamma_conc'));
                var np = g('pile');
                if (np.designMode !== 'full' && np.designMode !== 'raft') np.designMode = 'full';
                setPile(np); setPileRows(g('pileRows')); setPileType(g('pileType'));
                setLat(g('lat')); setRaft(g('raft'));
            };

            /* บันทึกอัตโนมัติแบบหน่วงเวลา กันไม่ให้เขียนทุกครั้งที่กดแป้น */
            useEffect(() => {
                if (!autoSave || !store.available) return;
                const t = setTimeout(() => {
                    const now = Date.now();
                    if (store.write({ v: SCHEMA, t: now, d: snapshot() })) setSavedAt(now);
                }, 700);
                return () => clearTimeout(t);
            }, [soil, base, surcharge, designLength, geom, pressureMode, useUplift, upliftMode,
                fsOtReq, fsSlideReq, gamma_conc, pile, pileRows, pileType, lat, raft, autoSave]);

            const flash = (m) => { setStoreMsg(m); setTimeout(() => setStoreMsg(''), 3000); };

            const exportJSON = () => {
                try {
                    const txt = JSON.stringify({ v: SCHEMA, t: Date.now(), app: APP_VERSION, d: snapshot() }, null, 2);
                    const blob = new Blob([txt], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const dt = new Date();
                    a.href = url;
                    a.download = 'retaining-wall-' + dt.getFullYear() + ('0' + (dt.getMonth() + 1)).slice(-2)
                                 + ('0' + dt.getDate()).slice(-2) + '.json';
                    document.body.appendChild(a); a.click(); document.body.removeChild(a);
                    setTimeout(() => { try { URL.revokeObjectURL(url); } catch (e) {} }, 1000);
                    flash('ส่งออกไฟล์แล้ว');
                } catch (e) { flash('ส่งออกไม่สำเร็จ: ' + e.message); }
            };

            const importJSON = (ev) => {
                const f = ev.target.files && ev.target.files[0];
                ev.target.value = '';
                if (!f) return;
                const rd = new FileReader();
                rd.onload = () => {
                    try {
                        const o = JSON.parse(rd.result);
                        const d = (o && o.d && typeof o.d === 'object') ? o.d : o;
                        if (!d || typeof d !== 'object') throw new Error('โครงสร้างไฟล์ไม่ถูกต้อง');
                        applyData(d);
                        setShowRestored(false);
                        flash('นำเข้าพารามิเตอร์จาก ' + f.name + ' แล้ว');
                    } catch (e) { flash('อ่านไฟล์ไม่สำเร็จ: ' + e.message); }
                };
                rd.onerror = () => flash('อ่านไฟล์ไม่สำเร็จ');
                rd.readAsText(f);
            };

            const [busyWord, setBusyWord] = useState(false);

            const exportWord = () => {
                var src = document.getElementById('report-root');
                if (!src) { flash('ไม่พบเนื้อหารายงาน'); return; }
                setBusyWord(true);
                try {
                    var clone = src.cloneNode(true);

                    /* cloneNode ไม่คัดลอกค่าที่ React ตั้งไว้ในระดับ property จึงต้องคัดมาเอง */
                    var si = src.querySelectorAll('input'), ci = clone.querySelectorAll('input');
                    for (var i = 0; i < si.length && i < ci.length; i++) {
                        ci[i].setAttribute('data-val', si[i].value);
                        ci[i].setAttribute('data-chk', si[i].checked ? '1' : '0');
                    }
                    var ss = src.querySelectorAll('select'), cs = clone.querySelectorAll('select');
                    for (var j = 0; j < ss.length && j < cs.length; j++) {
                        var op = ss[j].options[ss[j].selectedIndex];
                        cs[j].setAttribute('data-val', op ? op.text : '');
                    }

                    /* ตัดสิ่งที่ไม่ต้องอยู่ในรายงานออก */
                    Array.prototype.slice.call(clone.querySelectorAll('*')).forEach(function (el) {
                        if (!el.parentNode) return;
                        var c = el.getAttribute('class') || '';
                        if (/(^|\s)no-print(\s|$)/.test(c) || c.indexOf('print:hidden') !== -1) el.parentNode.removeChild(el);
                    });
                    Array.prototype.slice.call(clone.querySelectorAll('button')).forEach(function (el) {
                        if (el.parentNode) el.parentNode.removeChild(el);
                    });

                    /* ช่องกรอกกลายเป็นข้อความ */
                    Array.prototype.slice.call(clone.querySelectorAll('input,select,textarea')).forEach(function (el) {
                        if (!el.parentNode) return;
                        var t = el.tagName.toLowerCase(), txt;
                        if (t === 'select') txt = el.getAttribute('data-val') || '';
                        else if (el.type === 'checkbox' || el.type === 'radio') txt = el.getAttribute('data-chk') === '1' ? '\u2611' : '\u2610';
                        else txt = el.getAttribute('data-val') || '';
                        var sp = document.createElement('span');
                        sp.textContent = txt;
                        sp.setAttribute('style', 'font-weight:bold;border-bottom:0.75pt solid #64748b;padding:0 4pt;');
                        el.parentNode.replaceChild(sp, el);
                    });

                    /* SVG -> PNG  (ไอคอนเล็กกว่า 200px ตัดทิ้ง ไม่งั้นจะได้รูปจิ๋วเต็มไฟล์) */
                    var jobs = Array.prototype.slice.call(clone.querySelectorAll('svg')).map(function (svg) {
                        var vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
                        var w = vb[2] || 0, h = vb[3] || 0;
                        if (!(w >= 200) || !(h > 0)) {
                            if (svg.parentNode) svg.parentNode.removeChild(svg);
                            return Promise.resolve();
                        }
                        return svgToPng(svg, w, h).then(function (png) {
                            if (!svg.parentNode) return;
                            if (!png) { svg.parentNode.removeChild(svg); return; }
                            var im = document.createElement('img');
                            im.setAttribute('src', png);
                            im.setAttribute('style', 'width:' + Math.min(16.5, w / 40).toFixed(1) + 'cm;height:auto;');
                            svg.parentNode.replaceChild(im, svg);
                        });
                    });

                    Promise.all(jobs).then(function () {
                        wordStyle(clone);
                        var head = '<html xmlns:o="urn:schemas-microsoft-com:office:office"'
                            + ' xmlns:w="urn:schemas-microsoft-com:office:word"'
                            + ' xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8">'
                            + '<title>Retaining Wall Calculation Report</title>'
                            + '<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View>'
                            + '<w:Zoom>100</w:Zoom><w:DoNotOptimizeForBrowser/></w:WordDocument></xml><![endif]-->'
                            + '<style>' + WORD_CSS + '</style></head><body>';
                        var html = head + '<div class="WordSection1">' + clone.innerHTML + '</div></body></html>';
                        var blob = new Blob(['\ufeff', html], { type: 'application/msword;charset=utf-8' });
                        var url = URL.createObjectURL(blob);
                        var a = document.createElement('a');
                        var dt = new Date();
                        a.href = url;
                        a.download = 'retaining-wall-report-' + dt.getFullYear()
                            + ('0' + (dt.getMonth() + 1)).slice(-2) + ('0' + dt.getDate()).slice(-2) + '.doc';
                        document.body.appendChild(a); a.click(); document.body.removeChild(a);
                        setTimeout(function () { try { URL.revokeObjectURL(url); } catch (e) {} }, 1500);
                        setBusyWord(false);
                        flash('สร้างไฟล์ Word แล้ว (' + Math.round(html.length / 1024) + ' KB)');
                    })['catch'](function (e) {
                        setBusyWord(false);
                        flash('สร้างไฟล์ไม่สำเร็จ: ' + e.message);
                    });
                } catch (e) {
                    setBusyWord(false);
                    flash('สร้างไฟล์ไม่สำเร็จ: ' + e.message);
                }
            };

            const resetAll = () => {
                if (!window.confirm('ล้างค่าที่บันทึกไว้ แล้วกลับไปใช้ค่าเริ่มต้นทั้งหมด?\n(ควรกด "ส่งออก" เก็บไว้ก่อนถ้ายังต้องใช้)')) return;
                store.clear();
                applyData(DEFAULTS);
                setSavedAt(0); setShowRestored(false);
                flash('กลับไปใช้ค่าเริ่มต้นแล้ว');
            };

            // Layer Visibility State 
            const [showP1, setShowP1] = useState(true);
            const [showP2Tri, setShowP2Tri] = useState(true);
            const [showP2Rect, setShowP2Rect] = useState(true);
            const [showP3, setShowP3] = useState(true);
            const [showP4, setShowP4] = useState(true);

            /* ═══════════════════════════════════════════════════════════════════
               โมดูลตรวจแรงด้านข้างของเสาเข็ม
               หน่วยภายใน: kN, m  แล้วแปลงเป็น kgf ตอนแสดงผล
               ตรวจ 3 กลไก แล้วใช้ค่าที่ต่ำสุด:
                 (1) เกณฑ์ระยะโก่งหัวเข็ม  - คานบนฐานยืดหยุ่น (Hetenyi / Reese-Matlock)
                 (2) หน้าตัดเริ่มแตกร้าว    - M_cr จากคุณสมบัติหน้าตัด
                 (3) กำลังประลัยของดิน      - Broms หาร F.S.
               ═══════════════════════════════════════════════════════════════════ */
            const lateral = useMemo(() => {
                const KGF = 0.00980665;                 // kN ต่อ 1 kgf
                const toKg = (kN) => kN / KGF;
                const D = Math.max(0.01, lat.D);
                const di = Math.max(0, Math.min(lat.di, D * 0.95));

                /* คุณสมบัติหน้าตัด */
                const I = lat.shape === 'circle'
                    ? Math.PI * (Math.pow(D, 4) - Math.pow(di, 4)) / 64
                    : Math.pow(D, 4) / 12;
                const Zs = lat.shape === 'circle' ? (2 * I / D) : Math.pow(D, 3) / 6;

                const fc_MPa  = Math.max(1, lat.fcPile) * 0.0980665;
                const fpe_MPa = Math.max(0, lat.fpe) * 0.0980665;
                const Ec_MPa  = 4700 * Math.sqrt(fc_MPa);
                const EI      = Math.max(1e-6, lat.eiFactor) * Ec_MPa * 1000 * I;   // kN.m2
                const fr_MPa  = 0.62 * Math.sqrt(fc_MPa);
                const Mcr     = (fr_MPa + fpe_MPa) * 1000 * Zs;                     // kN.m
                const My      = Math.max(lat.muFactor, 1.0) * Mcr;                  // kN.m
                const isFixed = lat.fixity === 'fixed';
                const nHinge  = isFixed ? 2 : 1;

                let k = 0, beta = 0, T = 0, charLen = 0;
                let y_per_H = 0, M_per_H = 0, H_ult = 0, longOK = true, longCrit = '';
                const cu_kPa = Math.max(0.1, lat.cu) * 9.80665;                     // ตัน/ม.2 -> kPa

                if (lat.soilType === 'clay') {
                    /* ดินเหนียว: โมดูลัสคงที่ตามความลึก  k = 67 c_u (Davisson) */
                    k = 67 * cu_kPa;                                                // kN/m2
                    beta = Math.pow(k / (4 * EI), 0.25);                            // 1/m
                    charLen = 1 / beta;
                    y_per_H = isFixed ? (beta / k) : (2 * beta / k);                // m ต่อ kN
                    M_per_H = isFixed ? (1 / (2 * beta)) : (0.322 / beta);          // kN.m ต่อ kN
                    /* Broms ดินเหนียว: p_u = 9 c_u D ที่ z > 1.5D
                       n*M_y = H(1.5D + 0.5f) , f = H/(9 c_u D)  ->  aH^2 + bH - n*M_y = 0 */
                    const a = 1 / (18 * cu_kPa * D), b = 1.5 * D;
                    H_ult = (-b + Math.sqrt(b * b + 4 * a * nHinge * My)) / (2 * a);
                    longOK = beta * lat.Lpile >= 2.5;
                    longCrit = '\u03B2L = ' + (beta * lat.Lpile).toFixed(2) + ' (ต้อง \u2265 2.5)';
                } else {
                    /* ดินทราย: โมดูลัสเพิ่มตามความลึก  k = n_h z  (Reese-Matlock) */
                    const submerged = calcWaterAtBase;
                    const NH = { loose: [2200, 1300], medium: [6600, 4400], dense: [17600, 10900] };
                    const nh = (NH[lat.sandDensity] || NH.medium)[submerged ? 1 : 0];  // kN/m3
                    T = Math.pow(EI / nh, 0.2);
                    charLen = T;
                    y_per_H = (isFixed ? 0.93 : 2.43) * Math.pow(T, 3) / EI;
                    M_per_H = (isFixed ? 0.93 : 0.77) * T;
                    /* Broms ดินทราย: p_u = 3 K_p gamma' D z
                       n*M_y = 0.5467 H^1.5 / sqrt(K_p gamma' D) */
                    const Kp = Math.pow(Math.tan((45 + lat.phiLat / 2) * Math.PI / 180), 2);
                    const g_eff = (submerged ? 1100 : 1800) * 0.00980665;              // kN/m3
                    const denom = Math.sqrt(Math.max(1e-9, Kp * g_eff * D));
                    H_ult = Math.pow(nHinge * My * denom / 0.5467, 2 / 3);
                    longOK = lat.Lpile / T >= 4;
                    longCrit = 'L/T = ' + (lat.Lpile / T).toFixed(2) + ' (ต้อง \u2265 4)';
                }

                const H_defl  = y_per_H > 0 ? (Math.max(0, lat.yLimit) / 1000) / y_per_H : 0;
                const H_crack = M_per_H > 0 ? Mcr / M_per_H : 0;
                const H_broms = H_ult / Math.max(0.1, lat.fsBroms);

                const modes = [
                    { key: 'defl',  label: 'เกณฑ์ระยะโก่ง ' + lat.yLimit + ' มม.', H: H_defl },
                    { key: 'crack', label: 'หน้าตัดเริ่มแตกร้าว (M_cr)',            H: H_crack },
                    { key: 'broms', label: 'Broms ประลัย / F.S. ' + lat.fsBroms,   H: H_broms }
                ];
                let gov = modes[0];
                modes.forEach(m => { if (m.H < gov.H) gov = m; });

                const pMult = Math.max(0.1, Math.min(1, lat.pMult));
                const H_allow = gov.H * pMult;
                const M_at_allow = H_allow / pMult * M_per_H;

                return {
                    I, Zs, Ec_MPa, EI, Mcr, My, isFixed, nHinge,
                    k, beta, T, charLen, y_per_H, M_per_H,
                    H_defl, H_crack, H_ult, H_broms, modes, gov,
                    pMult, H_allow, M_at_allow, longOK, longCrit, cu_kPa,
                    H_allow_kg: toKg(H_allow), Mcr_tm: Mcr / 9.80665, My_tm: My / 9.80665,
                    toKg
                };
            }, [lat, calcWaterAtBase]);

            const calc = useMemo(() => {
                const gamma_w = 1000;
                const gamma_sub = soil.gamma_sat - gamma_w;

                /* ── [C4] สัมประสิทธิ์แรงดันดิน ─────────────────────────────────────
                   กำแพงที่ยืนบนเสาเข็มขยับ/หมุนไม่ได้ถึง 0.001-0.004H จึงไม่เกิดสภาวะ
                   Active ต้องใช้ K0 = 1 - sin(phi)  (ที่ phi=30 องศา สูงกว่า Ka ราว 50%) */
                const K_active = Math.pow(Math.tan((45 - soil.phi_backfill / 2) * Math.PI / 180), 2);
                const K_rest   = Math.max(0, 1 - Math.sin(soil.phi_backfill * Math.PI / 180));
                const K_mode   = pressureMode === 'auto' ? (pile.usePiles ? 'k0' : 'ka') : pressureMode;
                const Ka       = K_mode === 'k0' ? K_rest : K_active;

                const f_calc = Math.tan(soil.phi_base * Math.PI / 180);
                const L = designLength > 0 ? designLength : 1;

                const B = geom.C + geom.D + geom.F;
                const m = Math.max(0, geom.D - geom.G);
                const H_tot = geom.H + geom.T1;

                /* ── ระดับน้ำ ─────────────────────────────────────────────────────
                   h_w   = ความสูงน้ำเหนือระดับก้นฐานราก (ใช้กับแรงดันด้านข้าง+uplift)
                   h_dry = ความหนาชั้นดินแห้งทั้งหมด (กินเข้าช่วง T1 ได้ถ้าน้ำอยู่ลึก)
                   [M2] เดิมบังคับให้มีน้ำสูง T1 เสมอ ทำให้ปิดน้ำไม่ได้ */
                const d_w   = Math.max(0, Math.min(geom.waterDepth, H_tot));
                const h_w   = Math.max(0, H_tot - d_w);
                const h_dry = Math.max(0, H_tot - h_w);

                /* d2/d3 = ส่วนแห้ง/ส่วนจมน้ำ เฉพาะช่วงความสูงตัวกำแพง H (ใช้คิดน้ำหนักดิน) */
                const d2 = Math.max(0, Math.min(d_w, geom.H));
                const d3 = Math.max(0, geom.H - d2);

                /* ── แรงผลักด้านข้าง ────────────────────────────────────────────── */
                const p1 = Ka * surcharge;
                const P1 = p1 * H_tot * L;
                const y1 = H_tot / 2;

                const p2 = Ka * soil.gamma_c * h_dry;
                const P2_tri  = 0.5 * p2 * h_dry * L;
                const y2_tri  = h_w + (h_dry / 3);
                const P2_rect = p2 * h_w * L;
                const y2_rect = h_w / 2;
                const P2 = P2_tri + P2_rect;

                const p3 = Ka * gamma_sub * h_w;
                const P3 = 0.5 * p3 * h_w * L;
                const y3 = h_w / 3;

                const p4 = gamma_w * h_w;
                const P4 = 0.5 * p4 * h_w * L;
                const y4 = h_w / 3;

                const sumP = P1 + P2 + P3 + P4;
                const MO = (P1*y1) + (P2_tri*y2_tri) + (P2_rect*y2_rect) + (P3*y3) + (P4*y4);

                /* ── น้ำหนักแนวดิ่ง (โมเมนต์รอบ Toe ที่ x = 0) ──────────────────── */
                const w1 = geom.C * geom.T1 * gamma_conc * L;
                const x1 = geom.C / 2;

                const w2 = geom.G * geom.H * gamma_conc * L;
                const x2 = geom.C + (geom.G / 2);

                const w3 = 0.5 * m * geom.H * gamma_conc * L;
                const x3 = geom.C + geom.G + (m / 3);

                const w4 = (geom.D + geom.F) * geom.T1 * gamma_conc * L;
                const x4 = geom.C + ((geom.D + geom.F) / 2);

                const Area_tot = 0.5 * m * geom.H;
                const m2 = geom.H > 0 ? m * (d3 / geom.H) : 0;
                const Area_wet = 0.5 * m2 * d3;
                const Area_dry = Area_tot - Area_wet;
                const W5_wet = Area_wet * soil.gamma_sat * L;
                const W5_dry = Area_dry * soil.gamma_c * L;
                const w5 = W5_wet + W5_dry;

                const x_tot = geom.C + geom.D - (m / 3);
                const x_wet = geom.C + geom.D - (m2 / 3);
                const x_dry = Area_dry > 0 ? ((Area_tot * x_tot) - (Area_wet * x_wet)) / Area_dry : 0;
                const x5 = w5 > 0 ? ((W5_dry * x_dry) + (W5_wet * x_wet)) / w5 : 0;

                const w6 = geom.F * d2 * soil.gamma_c * L;
                const x6 = geom.C + geom.D + (geom.F / 2);

                const w7 = geom.F * d3 * soil.gamma_sat * L;
                const x7 = geom.C + geom.D + (geom.F / 2);

                const w8 = surcharge * (m + geom.F) * L;
                const x8 = geom.C + geom.G + ((m + geom.F) / 2);

                /* น้ำหนักถาวร (ไม่รวม surcharge จร) และน้ำหนักรวม */
                const sumV_perm = w1 + w2 + w3 + w4 + w5 + w6 + w7;
                const MR_perm   = (w1*x1)+(w2*x2)+(w3*x3)+(w4*x4)+(w5*x5)+(w6*x6)+(w7*x7);
                const sumV = sumV_perm + w8;
                const MR   = MR_perm + (w8 * x8);

                /* ── [C1] แรงดันน้ำยกใต้ฐานราก (Uplift / Buoyancy) ────────────────
                   เดิมใช้ gamma_sat คิดน้ำหนักดินจมน้ำ (total weight) แต่ไม่ใส่ uplift
                   = นับน้ำหนักน้ำเป็นแรงต้าน แล้วยังคิดแรงดันน้ำด้านข้าง (P4) ซ้ำอีก
                   'full'    : แรงดันสม่ำเสมอเต็มค่า = ไม่มีระบบระบายน้ำ (conservative)
                   'seepage' : ลดเป็นสามเหลี่ยม 0 ที่ Toe = มีชั้นระบายน้ำ/weep hole ที่ Toe */
                const u_heel = gamma_w * h_w;
                const u_toe  = upliftMode === 'seepage' ? 0 : u_heel;
                const U   = useUplift ? 0.5 * (u_toe + u_heel) * B * L : 0;
                const x_U = (u_toe + u_heel) > 0
                            ? (B / 3) * (u_toe + 2 * u_heel) / (u_toe + u_heel)
                            : B / 2;
                const M_U = U * x_U;

                /* ── [C2][C3] คำนวณแรงแบกทานใต้ฐานอย่างถูกต้อง ───────────────────── */
                const bearingOf = (V, X_bar) => {
                    const e = (B / 2) - X_bar;
                    const absE = Math.abs(e);
                    const inMid = B > 0 && absE <= B / 6;
                    const peakAt = X_bar <= B / 2 ? 'toe' : 'heel';
                    if (!(V > 0) || !(B > 0) || !(L > 0)) {
                        return { e, absE, inMid, peakAt, q_max: 0, q_min: 0, B_eff: 0, mode: 'none', valid: false };
                    }
                    if (X_bar <= 0 || X_bar >= B) {
                        /* แรงลัพธ์ตกนอกฐานราก - ไม่มีการกระจายแรงที่สมดุลได้ */
                        return { e, absE, inMid: false, peakAt, q_max: Infinity, q_min: 0, B_eff: 0, mode: 'outside', valid: false };
                    }
                    if (inMid) {
                        /* [C3] ต้องใช้ |e| ไม่งั้น q_max/q_min สลับกันเมื่อแรงลัพธ์ตกฝั่ง Heel */
                        return { e, absE, inMid, peakAt,
                                 q_max: (V / (B * L)) * (1 + 6 * absE / B),
                                 q_min: (V / (B * L)) * (1 - 6 * absE / B),
                                 B_eff: B, mode: 'trapezoid', valid: true };
                    }
                    /* [C2] หลุด middle-third: ดินรับแรงดึงไม่ได้ ต้องกระจายแบบสามเหลี่ยม
                       a = ระยะจากขอบที่รับแรงสูงสุด ถึงแนวแรงลัพธ์ ; ความยาวสัมผัส = 3a */
                    const a = Math.min(X_bar, B - X_bar);
                    return { e, absE, inMid, peakAt,
                             q_max: (2 * V) / (3 * a * L), q_min: 0,
                             B_eff: 3 * a, mode: 'triangle', valid: true };
                };

                /* ── [C6] สองกรณีบรรทุก ────────────────────────────────────────────
                   LC1: คิด surcharge จร ทั้งด้านผลักและด้านต้าน
                   LC2: คิด surcharge จร เฉพาะด้านผลัก (ตัด W8 ออกจากแรงต้าน)
                   น้ำหนักจรจะหายไปเมื่อไหร่ก็ได้ จึงพึ่งเป็นแรงต้านไม่ได้ */
                const evalCase = (label, withSurchargeV) => {
                    const V  = (withSurchargeV ? sumV : sumV_perm) - U;
                    const Mr = (withSurchargeV ? MR   : MR_perm)   - M_U;
                    const FS_ot    = MO > 0    ? Mr / MO            : Infinity;
                    const FS_slide = sumP > 0  ? (f_calc * V) / sumP : Infinity;
                    const X_bar    = V > 0     ? (Mr - MO) / V       : 0;
                    const b = bearingOf(V, X_bar);
                    return Object.assign({ label, withSurchargeV, V, Mr, FS_ot, FS_slide, X_bar }, b);
                };
                const LC1 = evalCase('LC1', true);
                const LC2 = evalCase('LC2', false);
                const cases = [LC1, LC2];

                /* ค่าที่ใช้ตัดสิน = กรณีที่วิกฤตที่สุดของแต่ละหัวข้อ */
                const FS_ot    = Math.min(LC1.FS_ot, LC2.FS_ot);
                const FS_slide = Math.min(LC1.FS_slide, LC2.FS_slide);
                const govOT    = LC1.FS_ot    <= LC2.FS_ot    ? LC1 : LC2;
                const govSL    = LC1.FS_slide <= LC2.FS_slide ? LC1 : LC2;
                const govQ     = LC1.q_max    >= LC2.q_max    ? LC1 : LC2;

                const X_bar = govQ.X_bar, e = govQ.e, q_max = govQ.q_max, q_min = govQ.q_min;
                const B_eff = govQ.B_eff, bearingMode = govQ.mode, isMiddleThird = govQ.inMid;
                const peakAt = govQ.peakAt, bearingValid = govQ.valid;
                const B6 = B / 6;
                const sumV_net = govQ.V, MR_net = govQ.Mr;

                const okOT    = FS_ot    >= fsOtReq;
                const okSlide = FS_slide >= fsSlideReq;
                const okBear  = bearingValid && q_max <= base.q_allow;
                const okEcc   = cases.every(c => c.inMid);

                /* ── [C5] แรงในเสาเข็ม ────────────────────────────────────────────── */
                const robustF = (pile.usePiles && pile.designMode === 'raft')
                    ? Math.max(1, raft.robust) : 1;
                const N_piles = pileRows.length;
                const x_cg_pile = N_piles > 0 ? pileRows.reduce((sum, x) => sum + x, 0) / N_piles : 0;
                let sum_d2 = 0;
                pileRows.forEach(x => { const d = x_cg_pile - x; sum_d2 += (d * d); });

                /* ═══ [PR] แบบจำลอง Piled Raft ═══════════════════════════════════
                   เลิกแบ่งแรงด้วย "กำลัง" เปลี่ยนมาแบ่งด้วย "การเคลื่อนตัวที่ต้องเท่ากัน"
                   ฐานรากถือเป็นแผ่นแกร่ง  w(x) = w0 + theta*x  เหลือตัวแปร 2 ตัว
                     SumV = ks*Ly*Int(w dx) + Sum(Kp*w(xi))
                     SumM = ks*Ly*Int(w*x dx) + Sum(Kp*w(xi)*xi)
                   แก้ระบบ 2x2 แล้ววนซ้ำตัดช่วงที่ w < 0 ออก เพราะดินรับแรงดึงไม่ได้
                   ใส่ ks = 0 จะได้ผลเท่าโหมด Full Load พอดี ใช้เป็นกรณีตรวจความทนทาน */
                const ks_raft = (raft.sSoil > 0 && base.q_allow > 0)
                    ? base.q_allow / (raft.sSoil / 1000) : 0;          /* กก./ม.³ */
                const Kp_raft = (raft.sPile > 0 && pile.allowComp > 0)
                    ? pile.allowComp / (raft.sPile / 1000) : 0;        /* กก./ม. ต่อเข็ม 1 ต้น */

                const solveRaft = (Vg, Mg, ks, Kp) => {
                    if (!(Vg > 0) || !(B > 0) || N_piles === 0 || !(Kp > 0)) return null;
                    let SKp = 0, SKx = 0, SKx2 = 0;
                    pileRows.forEach(x => { SKp += Kp; SKx += Kp * x; SKx2 += Kp * x * x; });
                    let a = 0, b = (ks > 0 ? B : 0), w0 = 0, th = 0, conv = false;
                    for (let it = 0; it < 40; it++) {
                        const c0 = ks * pile.spacingL;
                        const S0 = c0 * (b - a);
                        const S1 = c0 * (b * b - a * a) / 2;
                        const S2 = c0 * (b * b * b - a * a * a) / 3;
                        const A11 = S0 + SKp, A12 = S1 + SKx, A22 = S2 + SKx2;
                        const det = (A11 * A22) - (A12 * A12);
                        if (!(Math.abs(det) > 1e-9)) return null;
                        w0 = ((Vg * A22) - (A12 * Mg)) / det;
                        th = ((A11 * Mg) - (A12 * Vg)) / det;
                        if (!(ks > 0)) { conv = true; break; }
                        let na = a, nb = b;
                        if (th < 0 && (w0 + th * b) < 0) nb = Math.max(a, Math.min(b, -w0 / th));
                        if (th > 0 && (w0 + th * a) < 0) na = Math.min(b, Math.max(a, -w0 / th));
                        if (Math.abs(na - a) < 1e-9 && Math.abs(nb - b) < 1e-9) { conv = true; break; }
                        a = na; b = nb;
                        if (b - a < 1e-6) { a = 0; b = 0; }
                    }
                    const wAt = (x) => w0 + th * x;
                    const c0 = ks * pile.spacingL;
                    const Fs = (b > a) ? c0 * ((w0 * (b - a)) + (th * (b * b - a * a) / 2)) : 0;
                    const rows = pileRows.map((x, i) => ({ id: i + 1, x, w: wAt(x), P: Kp * wAt(x) }));
                    const qA = (b > a) ? ks * wAt(a) : 0;
                    const qB = (b > a) ? ks * wAt(b) : 0;
                    return { w0, th, a, b, conv, contact: B > 0 ? (b - a) / B : 0,
                             Fs, share: Vg > 0 ? Fs / Vg : 0, rows,
                             q_a: qA, q_b: qB, q_max: Math.max(qA, qB, 0),
                             w_max: Math.max(wAt(0), wAt(B)), wAt };
                };

                const pileCaseOf = (c) => {
                    if (N_piles === 0 || !pile.usePiles) return null;
                    const V_grp = (c.V / L) * pile.spacingL;
                    const P_grp = (sumP / L) * pile.spacingL;
                    /* [C5] โมเมนต์ต้องอ้างอิงจุดเดียวกับสูตรที่ใช้เสมอ */
                    const M_grp = V_grp * (x_cg_pile - c.X_bar);
                    const M_toe = V_grp * c.X_bar;

                    if (pile.designMode === 'raft') {
                        const S = solveRaft(V_grp, M_toe, ks_raft, Kp_raft);  /* ออกแบบ: ดินช่วยรับ */
                        const N = solveRaft(V_grp, M_toe, 0, Kp_raft);        /* ทนทาน: ดินไม่ช่วย */
                        const rows = pileRows.map((x, i) => ({
                            id: i + 1, x, d: x_cg_pile - x,
                            p_axial: S ? S.rows[i].P : 0,
                            n_axial: N ? N.rows[i].P : 0
                        }));
                        /* ═══ [PR-H] แรงราบ: ก้นฐานมีแรงกดจริง จึงมีแรงเสียดทานช่วยรับ ═══
                           แรงตั้งฉากที่ใช้ = F_soil ที่ได้จากการแก้สมการ (หักแรงยกใต้ฐานไปแล้ว)
                           ไม่ใช่ SumV ทั้งก้อน เพราะส่วนที่เหลือถ่ายลงเสาเข็มไม่ได้กดที่ก้นฐาน
                           แรงเสียดทานเป็นค่าประลัย จึงหารด้วย F.S. ลื่นไถลก่อนนำมาใช้
                           ส่วนกำลังด้านข้างของเข็มเป็นค่าใช้งานอยู่แล้ว จึงไม่หารซ้ำ */
                        const Fs_soil = S ? Math.max(0, S.Fs) : 0;
                        const H_fric_ult = f_calc * Fs_soil;
                        const H_fric_use = H_fric_ult / Math.max(1, fsSlideReq);
                        const H_pile_d = Math.max(0, P_grp - H_fric_use);   /* เข็มรับส่วนที่เหลือ */
                        return { label: c.label, mode: 'raft', V_grp, M_grp, P_grp, rows,
                                 Fs_soil, H_fric_ult, H_fric_use,
                                 H_pile_d, H_pile_n: P_grp,
                                 V_shear: H_pile_d / N_piles,      /* กรณีออกแบบ */
                                 V_shear_n: P_grp / N_piles,       /* กรณีทนทาน ดินไม่ช่วย */
                                 X_bar: c.X_bar, soil: S, nosoil: N };
                    }
                    const rows = pileRows.map((x, i) => {
                        const d = x_cg_pile - x;
                        const p = (V_grp / N_piles) + (sum_d2 > 0 ? (M_grp * d / sum_d2) : 0);
                        return { id: i + 1, x, d, p_axial: p, n_axial: p };
                    });
                    /* โหมด Full Load: สมมติว่าดินไม่รับแรงกดเลย จึงไม่มีแรงตั้งฉากที่ก้นฐาน
                       และไม่มีแรงเสียดทานมาช่วย ซึ่งสอดคล้องกันในตัวเอง */
                    return { label: c.label, mode: 'full', V_grp, M_grp, P_grp, rows,
                             Fs_soil: 0, H_fric_ult: 0, H_fric_use: 0,
                             H_pile_d: P_grp, H_pile_n: P_grp,
                             V_shear: P_grp / N_piles, V_shear_n: P_grp / N_piles,
                             X_bar: c.X_bar, soil: null, nosoil: null };
                };
                const pc1 = pileCaseOf(LC1);
                const pc2 = pileCaseOf(LC2);

                /* envelope จากทั้งสองกรณีบรรทุก แยกกรณีออกแบบ (ดินช่วย) กับกรณีทนทาน (ดินไม่ช่วย) */
                const pile_results = (!pc1 || !pc2) ? [] : pileRows.map((x, i) => {
                    const a1 = pc1.rows[i].p_axial, a2 = pc2.rows[i].p_axial;
                    const n1 = pc1.rows[i].n_axial, n2 = pc2.rows[i].n_axial;
                    return { id: i + 1, x, d: x_cg_pile - x,
                             lc1: a1, lc2: a2, n_lc1: n1, n_lc2: n2,
                             p_comp: Math.max(a1, a2, 0), p_ten: Math.min(a1, a2, 0),
                             n_comp: Math.max(n1, n2, 0), n_ten: Math.min(n1, n2, 0),
                             p_axial: Math.abs(a1) >= Math.abs(a2) ? a1 : a2 };
                });
                const V_shear_pile   = (!pc1 || !pc2) ? 0 : Math.max(pc1.V_shear, pc2.V_shear);
                const V_shear_pile_n = (!pc1 || !pc2) ? 0 : Math.max(pc1.V_shear_n, pc2.V_shear_n);
                /* กรณีวิกฤตของแรงเสียดทาน = กรณีที่ดินรับแรงกดน้อยที่สุด */
                const fricGov = (!pc1 || !pc2) ? null : (pc1.H_fric_use <= pc2.H_fric_use ? pc1 : pc2);
                const govPile = (!pc1 || !pc2) ? null : (pc1.V_grp >= pc2.V_grp ? pc1 : pc2);

                /* ═══ [PR] ผลเฉพาะโหมด Piled Raft ═══ */
                const raftMode = pile.usePiles && pile.designMode === 'raft' && N_piles > 0;
                const raftCases = (raftMode && pc1 && pc2 && pc1.soil && pc2.soil) ? [pc1, pc2] : [];
                /* กรณีวิกฤตของ raft = ที่ทรุดตัวมากที่สุด */
                const raftGov = raftCases.length
                    ? (pc1.soil.w_max >= pc2.soil.w_max ? pc1 : pc2) : null;
                const raftS   = raftGov ? raftGov.soil : null;
                const raftN   = raftGov ? raftGov.nosoil : null;
                const okRaftSettle  = !raftMode || !raftS || ((raftS.w_max * 1000) <= raft.sLimit);
                const okRaftQ       = !raftMode || !raftS || (raftS.q_max <= base.q_allow);
                const okRaftContact = !raftMode || !!raft.contactOK;
                const okRaftSolve   = !raftMode || (!!raftS && !!raftN && raftS.conv);

                /* กรณีออกแบบต้อง <= พิกัดใช้งาน  และกรณีทนทาน (ดินไม่ช่วย) ต้อง <= พิกัด x robust */
                /* ถ้าแก้สมการ raft ไม่สำเร็จ (เช่น ความแข็งเป็นศูนย์) ต้องไม่ขึ้นว่าผ่าน */
                const okPileComp  = okRaftSolve
                                 && pile_results.every(p => p.p_comp <= pile.allowComp)
                                 && pile_results.every(p => p.n_comp <= pile.allowComp * robustF);
                const okPileTen   = okRaftSolve
                                 && pile_results.every(p => Math.abs(p.p_ten) <= pile.allowTen)
                                 && pile_results.every(p => Math.abs(p.n_ten) <= pile.allowTen * robustF);
                /* ═══ กำลังรับแรงเฉือนของเสาเข็ม — แหล่งความจริงเดียว ═══
                   ทุกจุดที่แสดงผลต้องอ้าง shearCap ตัวนี้ ห้ามอ่าน pile.allowShear ตรงๆ
                   มิฉะนั้นป้ายกับเงื่อนไขจะไม่ตรงกัน */
                const shearFromBroms = lat.enabled && lat.useForCheck;
                const shearCap       = shearFromBroms ? lateral.H_allow_kg : pile.allowShear;
                /* กำลัง <= 0 ไม่ใช่ "ผ่าน" แต่แปลว่ายังไม่ได้กำหนดกำลัง จึงต้องไม่ผ่าน */
                const shearCapValid  = shearCap > 0;
                /* กรณีออกแบบต้อง <= พิกัด และกรณีทนทาน (ไม่มีแรงเสียดทาน) ต้อง <= พิกัด x robust
                   หลักการเดียวกับแนวดิ่ง: ให้ดินช่วยเรื่องการใช้งาน แต่ห้ามฝากความปลอดภัยไว้กับมัน */
                const okPileShear    = shearCapValid
                                    && V_shear_pile <= shearCap
                                    && V_shear_pile_n <= shearCap * robustF;
                const shearRatio     = shearCapValid ? V_shear_pile / shearCap : Infinity;
                const shearRatioN    = shearCapValid ? V_shear_pile_n / (shearCap * robustF) : Infinity;
                /* กำลังต้านการลื่นไถลของทั้งระบบ (เสียดทานก้นฐาน + กำลังด้านข้างของเข็มทุกต้น) */
                const P_grp_gov      = govPile ? govPile.P_grp : 0;
                const H_fric_sys     = fricGov ? fricGov.H_fric_use : 0;
                const R_slide_sys    = H_fric_sys + (N_piles * (shearCapValid ? shearCap : 0));
                const util_slide_sys = R_slide_sys > 0 ? P_grp_gov / R_slide_sys : Infinity;

                /* ค่าที่คงชื่อเดิมไว้เพื่อความเข้ากันได้กับส่วนแสดงผล */
                const V_pile = govPile ? govPile.V_grp : 0;
                const P_pile = govPile ? govPile.P_grp : 0;
                const M_cg_pile = govPile ? govPile.M_grp : 0;
                const V_design_sp = V_pile, M_design_sp = M_cg_pile, P_design_sp = P_pile;

                return {
                    f_calc, gamma_conc,
                    K_active, K_rest, K_mode, Ka,
                    B, m, gamma_w, gamma_sub, d2, d3, d_w, h_w, h_dry, H_tot, L,
                    p1, P1, y1, p2, P2_tri, y2_tri, P2_rect, y2_rect, P2, p3, P3, y3, p4, P4, y4, sumP, MO,
                    w1, x1, w2, x2, w3, x3, w4, x4, w5, x5, w6, x6, w7, x7, w8, x8,
                    sumV, MR, sumV_perm, MR_perm, sumV_net, MR_net,
                    u_toe, u_heel, U, x_U, M_U,
                    cases, LC1, LC2, govOT, govSL, govQ,
                    FS_ot, FS_slide, X_bar, e, B6, isMiddleThird, q_max, q_min,
                    B_eff, bearingMode, peakAt, bearingValid,
                    okOT, okSlide, okBear, okEcc,
                    W5_dry, W5_wet,
                    N_piles, x_cg_pile, sum_d2, pile_results, V_shear_pile, V_shear_pile_n,
                    shearCap, shearFromBroms, shearCapValid, shearRatio, shearRatioN,
                    fricGov, H_fric_sys, R_slide_sys, util_slide_sys, P_grp_gov,
                    pc1, pc2, govPile, okPileComp, okPileTen, okPileShear,
                    ks_raft, Kp_raft, raftMode, robustF, raftGov, raftS, raftN,
                    okRaftSettle, okRaftQ, okRaftContact, okRaftSolve,
                    V_pile, P_pile, M_cg_pile, V_design_sp, M_design_sp, P_design_sp
                };
            }, [soil, base, surcharge, geom, designLength, pile, pileRows,
                pressureMode, useUplift, upliftMode, fsOtReq, fsSlideReq, gamma_conc, lat, lateral, raft]);

            const handleNum = (setter, field) => (e) => {
                setter(prev => ({ ...prev, [field]: parseFloat(e.target.value) || 0 }));
            };

            const handlePileNum = (field) => (e) => {
                setPileType('custom');
                setPile(prev => ({ ...prev, [field]: parseFloat(e.target.value) || 0 }));
            };

            const handlePileTypeChange = (e) => {
                const val = e.target.value;
                setPileType(val);
                if (val !== 'custom') {
                    setPile(prev => ({
                        ...prev,
                        allowComp: pileProfiles[val].comp,
                        allowTen: pileProfiles[val].ten,
                        allowShear: pileProfiles[val].shear
                    }));
                    setLat(prev => ({
                        ...prev,
                        D: pileProfiles[val].D,
                        di: pileProfiles[val].di,
                        shape: pileProfiles[val].shape
                    }));
                }
            };

            const handleRaft = (field) => (e) =>
                setRaft(prev => Object.assign({}, prev, { [field]: parseFloat(e.target.value) || 0 }));

            const handleLat = (field) => (e) => {
                const v = e.target.value;
                setLat(prev => Object.assign({}, prev, { [field]: (v === 'clay' || v === 'sand' || v === 'fixed' ||
                    v === 'free' || v === 'loose' || v === 'medium' || v === 'dense' || v === 'square' || v === 'circle')
                    ? v : (parseFloat(v) || 0) }));
            };

            /* ช่องกรอกขนาดเล็กสำหรับโมดูลแรงด้านข้าง */
            const LatField = ({ label, value, onChange, unit, opts }) => (
                <div className="flex flex-col">
                    <span className="text-[11px] text-slate-500 leading-tight mb-1">{label}</span>
                    {opts ? (
                        <select className="w-full text-xs p-1.5 border border-slate-300 rounded bg-white text-slate-700 focus:outline-none focus:ring-1 focus:ring-cyan-500"
                            value={value} onChange={onChange}>
                            {opts.map(o => <option key={o[0]} value={o[0]}>{o[1]}</option>)}
                        </select>
                    ) : (
                        <div className="flex items-center">
                            <input type="number" step="0.01" className="w-full p-1.5 border border-slate-300 rounded text-right text-xs bg-white focus:outline-none focus:ring-1 focus:ring-cyan-500 print:shadow-none"
                                value={value} onChange={onChange} />
                            {unit && <span className="text-slate-500 ml-1 text-[10px] whitespace-nowrap">{unit}</span>}
                        </div>
                    )}
                </div>
            );

            /* การ์ดตัวเลขสรุปในหน้า Dashboard */
            const StatCard = ({ label, value, unit, cond, tTrue, tFalse, note, muted }) => (
                <div className={`print:p-4 rounded-xl border shadow-sm flex flex-col items-center justify-center text-center ${muted ? 'bg-slate-50 border-slate-200 p-4' : 'bg-white border-slate-200 p-6'}`}>
                    <span className={`font-medium mb-3 ${muted ? 'text-slate-400 text-xs' : 'text-slate-500 text-sm'}`}>{label}</span>
                    <div className={`font-bold mb-3 ${muted ? 'text-2xl text-slate-600' : 'text-4xl text-slate-800 print:text-3xl mb-4'}`}>
                        {value}{unit && <span className="text-sm text-slate-500 ml-1 font-normal">{unit}</span>}
                    </div>
                    {cond !== null && cond !== undefined
                        ? <Badge condition={cond} textTrue={tTrue} textFalse={tFalse} />
                        : <span className="text-xs text-slate-500 bg-slate-100 px-2 py-1 rounded">{tTrue}</span>}
                    {note && <span className="text-[10px] text-slate-400 mt-2 leading-tight">{note}</span>}
                </div>
            );

            const addPileRow = () => setPileRows([...pileRows, parseFloat(((geom.C + geom.D + geom.F)/2).toFixed(2))]);
            const removePileRow = (index) => setPileRows(pileRows.filter((_, i) => i !== index));
            const updatePileRow = (index, value) => {
                const newRows = [...pileRows];
                newRows[index] = parseFloat(value) || 0;
                setPileRows(newRows);
            };

            const GlobalNav = () => (
                <div className="bg-slate-900 text-slate-300 text-sm py-2 px-4 flex justify-between items-center shadow-md no-print">
                    <div className="flex items-center space-x-2">
                        <svg className="w-5 h-5 text-sky-400" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                        <span className="font-semibold text-white tracking-wide">STRUCTURAL APPS</span>
                    </div>
                    <div className="flex items-center gap-1.5 sm:gap-2 flex-wrap justify-end">

                        {/* สถานะการบันทึก */}
                        {store.available ? (
                            <label className="flex items-center gap-1.5 cursor-pointer bg-slate-800 hover:bg-slate-700 rounded px-2 py-1.5 transition"
                                   title="บันทึกพารามิเตอร์ล่าสุดไว้ในเครื่องนี้ เปิดหน้าใหม่จะได้ค่าเดิม">
                                <input type="checkbox" className="w-3.5 h-3.5 accent-emerald-500 rounded"
                                       checked={autoSave} onChange={(e) => setAutoSave(e.target.checked)} />
                                <span className="text-[11px] sm:text-xs whitespace-nowrap">
                                    {autoSave
                                        ? <span className="text-emerald-400">บันทึกอัตโนมัติ{savedAt ? ' \u00B7 ' + fmtTime(savedAt) : ''}</span>
                                        : <span className="text-slate-400">ปิดการบันทึก</span>}
                                </span>
                            </label>
                        ) : (
                            <span className="text-[11px] text-amber-400 px-2" title="เบราว์เซอร์ปิดการเก็บข้อมูล หรืออยู่ในโหมดส่วนตัว">
                                บันทึกไม่ได้ในเบราว์เซอร์นี้
                            </span>
                        )}

                        <button onClick={exportJSON} title="ส่งออกพารามิเตอร์เป็นไฟล์ .json เก็บไว้กับแฟ้มโครงการ"
                            className="bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium py-1.5 px-2.5 rounded flex items-center transition">
                            <svg className="w-4 h-4 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                            <span className="hidden sm:inline text-xs">ส่งออก</span>
                        </button>

                        <input id="rw-import-file" type="file" accept=".json,application/json" className="hidden" onChange={importJSON} />
                        <label htmlFor="rw-import-file" title="นำเข้าพารามิเตอร์จากไฟล์ .json ที่เคยส่งออกไว้"
                            className="bg-slate-700 hover:bg-slate-600 text-slate-100 font-medium py-1.5 px-2.5 rounded flex items-center transition cursor-pointer">
                            <svg className="w-4 h-4 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>
                            <span className="hidden sm:inline text-xs">นำเข้า</span>
                        </label>

                        <button onClick={resetAll} title="ล้างค่าที่บันทึกไว้ กลับไปใช้ค่าเริ่มต้นทั้งหมด"
                            className="bg-slate-700 hover:bg-rose-700 text-slate-100 font-medium py-1.5 px-2.5 rounded flex items-center transition">
                            <svg className="w-4 h-4 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                            <span className="hidden sm:inline text-xs">ค่าเริ่มต้น</span>
                        </button>

                        <button onClick={exportWord} disabled={busyWord} title="ดาวน์โหลดรายงานทั้งหมดเป็นไฟล์ Word แก้ไขต่อได้"
                            className="bg-sky-700 hover:bg-sky-600 disabled:bg-slate-600 disabled:cursor-wait text-white font-medium py-1.5 px-2.5 rounded flex items-center transition shadow-sm">
                            <svg className="w-4 h-4 sm:mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                            <span className="hidden sm:inline text-xs">{busyWord ? 'กำลังสร้าง...' : 'Word'}</span>
                        </button>

                        <button onClick={() => window.print()} className="bg-blue-500 hover:bg-blue-600 text-white font-medium py-1.5 px-3 rounded flex items-center transition shadow-sm">
                            <svg className="w-4 h-4 sm:mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                            <span className="hidden sm:inline">พิมพ์รายงาน (A4)</span>
                        </button>
                    </div>
                </div>
            );

            const InteractivePreview = () => {
                const B = geom.C + geom.D + geom.F;
                const H_tot = geom.H + geom.T1;
                const svgW = 350;
                const svgH_total = 380;
                
                const scale = Math.min(240 / Math.max(B, 0.1), 220 / Math.max(H_tot, 0.1));
                
                const svgC = geom.C * scale;
                const svgD = geom.D * scale;
                const svgG = geom.G * scale;
                const svgF = geom.F * scale;
                const svgH = geom.H * scale;
                const svgT1 = geom.T1 * scale;
                const svgB = B * scale;

                const x0 = (svgW - svgB) / 2;
                const y0 = 260;

                const p1 = `${x0},${y0}`; 
                const p2 = `${x0 + svgB},${y0}`; 
                const p3 = `${x0 + svgB},${y0 - svgT1}`; 
                const p4 = `${x0 + svgC + svgD},${y0 - svgT1}`; 
                const p5 = `${x0 + svgC + svgG},${y0 - svgT1 - svgH}`; 
                const p6 = `${x0 + svgC},${y0 - svgT1 - svgH}`; 
                const p7 = `${x0 + svgC},${y0 - svgT1}`; 
                const p8 = `${x0},${y0 - svgT1}`; 
                const wallPolygon = `${p1} ${p2} ${p3} ${p4} ${p5} ${p6} ${p7} ${p8}`;

                return (
                    <svg viewBox={`0 0 ${svgW} ${svgH_total}`} className="w-full h-auto mt-2 drop-shadow-sm">
                        <line x1="20" y1={y0 - svgT1 - svgH} x2={svgW - 20} y2={y0 - svgT1 - svgH} stroke="#94a3b8" strokeWidth="1.5" strokeDasharray="4,4" />
                        <text x={svgW - 20} y={y0 - svgT1 - svgH - 6} fill="#64748b" fontSize="11" textAnchor="end">ระดับผิวดิน</text>

                        <line x1="20" y1={y0} x2={svgW - 20} y2={y0} stroke="#475569" strokeWidth="1.5" />
                        
                        {geom.waterDepth < geom.H && (
                            <g>
                                <line x1={x0 - 15} y1={y0 - svgT1 - svgH + (geom.waterDepth * scale)} x2={x0 + svgB + 15} y2={y0 - svgT1 - svgH + (geom.waterDepth * scale)} stroke="#0ea5e9" strokeWidth="1.5" strokeDasharray="3,3" />
                                <text x={x0 + svgB + 20} y={y0 - svgT1 - svgH + (geom.waterDepth * scale)} fill="#0ea5e9" fontSize="10" dominantBaseline="middle">น้ำ</text>
                            </g>
                        )}

                        {pile.usePiles && pileRows.map((x, i) => (
                            <g key={`pile-${i}`}>
                                <rect x={x0 + x * scale - 6} y={y0} width="12" height="50" fill="#cbd5e1" stroke="#64748b" strokeWidth="1.5" />
                                <path d={`M ${x0 + x * scale - 6} ${y0 + 50} L ${x0 + x * scale} ${y0 + 65} L ${x0 + x * scale + 6} ${y0 + 50} Z`} fill="#cbd5e1" stroke="#64748b" strokeWidth="1.5" />
                            </g>
                        ))}

                        <polygon points={wallPolygon} fill="#e2e8f0" stroke="#334155" strokeWidth="2" strokeLinejoin="round" />

                        <g stroke="#64748b" strokeWidth="1" fill="#475569" fontSize="11" fontFamily="sans-serif" textAnchor="middle">
                            <line x1={x0} y1={y0 + 25} x2={x0 + svgB} y2={y0 + 25} />
                            <line x1={x0} y1={y0 + 20} x2={x0} y2={y0 + 30} />
                            <line x1={x0 + svgB} y1={y0 + 20} x2={x0 + svgB} y2={y0 + 30} />
                            <text x={x0 + svgB/2} y={y0 + 40}>B = {B.toFixed(2)}</text>

                            <line x1={x0} y1={y0 + 10} x2={x0 + svgB} y2={y0 + 10} />
                            <line x1={x0} y1={y0 + 6} x2={x0} y2={y0 + 14} />
                            {geom.C > 0 && <line x1={x0 + svgC} y1={y0 + 6} x2={x0 + svgC} y2={y0 + 14} />}
                            <line x1={x0 + svgC + svgD} y1={y0 + 6} x2={x0 + svgC + svgD} y2={y0 + 14} />
                            <line x1={x0 + svgB} y1={y0 + 6} x2={x0 + svgB} y2={y0 + 14} />
                            {geom.C > 0 && <text x={x0 + svgC/2} y={y0 - 4} fill="#0f172a">C={geom.C}</text>}
                            <text x={x0 + svgC + svgD/2} y={y0 - 4} fill="#0f172a">D={geom.D}</text>
                            <text x={x0 + svgC + svgD + svgF/2} y={y0 - 4} fill="#0f172a">F={geom.F}</text>

                            <line x1={x0 + svgC} y1={y0 - svgT1 - svgH - 10} x2={x0 + svgC + svgG} y2={y0 - svgT1 - svgH - 10} />
                            <line x1={x0 + svgC} y1={y0 - svgT1 - svgH - 14} x2={x0 + svgC} y2={y0 - svgT1 - svgH - 6} />
                            <line x1={x0 + svgC + svgG} y1={y0 - svgT1 - svgH - 14} x2={x0 + svgC + svgG} y2={y0 - svgT1 - svgH - 6} />
                            <text x={x0 + svgC + svgG/2} y={y0 - svgT1 - svgH - 16}>G={geom.G}</text>

                            <line x1={x0 - 15} y1={y0 - svgT1} x2={x0 - 15} y2={y0 - svgT1 - svgH} />
                            <line x1={x0 - 19} y1={y0 - svgT1} x2={x0 - 11} y2={y0 - svgT1} />
                            <line x1={x0 - 19} y1={y0 - svgT1 - svgH} x2={x0 - 11} y2={y0 - svgT1 - svgH} />
                            <text x={x0 - 20} y={y0 - svgT1 - svgH/2} textAnchor="end" dominantBaseline="middle">H = {geom.H}</text>

                            <line x1={x0 - 15} y1={y0} x2={x0 - 15} y2={y0 - svgT1} />
                            <line x1={x0 - 19} y1={y0} x2={x0 - 11} y2={y0} />
                            <text x={x0 - 20} y={y0 - svgT1/2} textAnchor="end" dominantBaseline="middle">T1={geom.T1}</text>
                        </g>
                    </svg>
                );
            };

            const TabInputs = () => (
                <div className="flex flex-col lg:flex-row items-start gap-6 print:flex print:flex-col print:items-center mb-6 animate-[fadeIn_0.3s_ease-in-out]">
                    <div className="flex-1 w-full space-y-4 print:space-y-3">
                        <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 print:p-4 print:break-inside-avoid">
                            <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-3 mb-4 print:mb-3">
                                <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-2 sm:mb-0">มิติโครงสร้างกำแพงกันดิน (Wall Dimensions)</h3>
