<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retaining Wall Stability Analysis</title>
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#1e293b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="โปรแกรมคำนวณเสถียรภาพและแรงอัดใต้ฐานรากกำแพงกันดิน">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231e293b'/><path d='M20 80h60v10H20zm10-50h15v50H30zm15 10l25 40H45z' fill='%2338bdf8'/></svg>">

    <!-- CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', 'Inter', sans-serif; background-color: #f1f5f9; }
        .tab-active { border-bottom: 2px solid #2563eb; color: #2563eb; font-weight: 600; }
        .tab-inactive { border-bottom: 2px solid transparent; color: #64748b; hover:text-slate-900; }
        /* Hide scrollbar for tabs */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Styles for A4 Printing */
        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            body { 
                -webkit-print-color-adjust: exact; 
                print-color-adjust: exact; 
                background-color: white !important; 
            }
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            .shadow-sm, .drop-shadow-sm { box-shadow: none !important; border-color: #cbd5e1 !important; filter: none !important; }
            .bg-slate-50 { background-color: #f8fafc !important; }
            .bg-sky-50 { background-color: #f0f9ff !important; }
            .bg-emerald-50 { background-color: #ecfdf5 !important; }
            .bg-indigo-50 { background-color: #eef2ff !important; }
            .bg-amber-50 { background-color: #fffbeb !important; }
            .print\:break-inside-avoid { break-inside: avoid; }
            /* Make sure inputs print correctly */
            input[type="number"] { border: 1px solid #cbd5e1 !important; background-color: white !important; -webkit-appearance: none; -moz-appearance: none; appearance: none;}
        }
        .print-only { display: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        const Fraction = ({ top, bottom }) => (
            <div className="inline-flex flex-col items-center justify-center align-middle mx-1" style={{ verticalAlign: 'middle' }}>
                <span className="border-b border-slate-400 pb-0.5 px-1 leading-none">{top}</span>
                <span className="pt-0.5 px-1 leading-none">{bottom}</span>
            </div>
        );

        const StepBox = ({ title, children, className="" }) => (
            <div className={`bg-slate-50 border border-slate-200 rounded-lg p-5 mb-5 print:break-inside-avoid shadow-sm ${className}`}>
                <h4 className="font-bold text-slate-700 mb-3 border-b border-slate-200 pb-2">{title}</h4>
                <div className="text-slate-600 text-sm overflow-x-auto overflow-y-hidden">{children}</div>
            </div>
        );

        const Badge = ({ condition, textTrue = "ผ่าน", textFalse = "ไม่ผ่าน" }) => (
            <span className={`px-2 py-1 rounded text-xs font-semibold ${condition ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                {condition ? textTrue : textFalse}
            </span>
        );

        const Sub = ({ text }) => <sub>{text}</sub>;

        // Custom Input Component for standardizing layout (Flex-col on mobile, Flex-row on larger screens)
        const InputRow = ({ label, value, onChange, unit, warning, bgClass = "" }) => (
            <div className={`flex flex-col sm:flex-row sm:items-center justify-between py-2 px-3 rounded-md transition-colors border border-transparent hover:border-slate-200 hover:bg-slate-50 print:flex-row print:py-1 print:px-1 ${bgClass}`}>
                <span className="text-slate-700 text-sm mb-1 sm:mb-0 mr-2 flex-1 leading-tight">{label}</span>
                <div className="flex items-center flex-shrink-0 self-start sm:self-auto">
                    {warning && <span className="text-rose-500 text-xs mr-2 whitespace-nowrap no-print">{warning}</span>}
                    <input 
                        type="number" step="0.01" 
                        className="w-20 sm:w-24 p-1.5 border border-slate-300 rounded text-right focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 text-sm bg-white shadow-sm print:shadow-none print:p-1" 
                        value={value} onChange={onChange} 
                    />
                    <span className="text-slate-500 ml-2 text-sm w-8 text-left">{unit}</span>
                </div>
            </div>
        );

        const App = () => {
            const [activeTab, setActiveTab] = useState('inputs'); // Default tab is now Inputs

            // Global Inputs State
            const [soil, setSoil] = useState({ gamma_c: 1900, gamma_sat: 2100, phi: 30 });
            const [base, setBase] = useState({ f: 0.5, q_allow: 8000 });
            const [surcharge, setSurcharge] = useState(500);
            const [designLength, setDesignLength] = useState(1.0);
            
            // Geometry State
            const [geom, setGeom] = useState({ H: 2.0, C: 0.0, D: 0.6, G: 0.25, F: 2.0, T1: 0.3, waterDepth: 1.5 });

            // Pile Foundation State
            const [pile, setPile] = useState({
                usePiles: true,
                designMode: 'excess', // 'full' or 'excess'
                spacingL: 2.0,       
                allowComp: 35000,    
                allowTen: 10500,     
                allowShear: 2500     
            });
            const [pileRows, setPileRows] = useState([0.4, 2.1]); 

            const [pileType, setPileType] = useState('sq26');
            const pileProfiles = {
                'sq22': { name: 'สี่เหลี่ยมตัน 0.22x0.22 ม.', comp: 25000, ten: 7500, shear: 1500 },
                'sq26': { name: 'สี่เหลี่ยมตัน 0.26x0.26 ม.', comp: 35000, ten: 10500, shear: 2500 },
                'sq30': { name: 'สี่เหลี่ยมตัน 0.30x0.30 ม.', comp: 50000, ten: 15000, shear: 3500 },
                'spun30': { name: 'กลมกลวง (Spun) D0.30 ม.', comp: 45000, ten: 13500, shear: 3000 },
                'custom': { name: 'กำหนดค่าเอง (Custom)' }
            };

            // Layer Visibility State 
            const [showP1, setShowP1] = useState(true);
            const [showP2Tri, setShowP2Tri] = useState(true);
            const [showP2Rect, setShowP2Rect] = useState(true);
            const [showP3, setShowP3] = useState(true);
            const [showP4, setShowP4] = useState(true);

            const calc = useMemo(() => {
                // Soil Mechanics
                const gamma_w = 1000;
                const gamma_sub = soil.gamma_sat - gamma_w;
                const Ka = Math.pow(Math.tan((45 - soil.phi/2) * Math.PI/180), 2);
                const L = designLength;
                
                // Geometry logic
                const B = geom.C + geom.D + geom.F;
                const m = Math.max(0, geom.D - geom.G); // ระยะ slope แนวนอน
                const d2 = Math.max(0, Math.min(geom.waterDepth, geom.H)); // Dry depth
                const d3 = Math.max(0, geom.H - d2); // Submerged depth
                const H_tot = geom.H + geom.T1;

                // Driving Forces
                const p1 = Ka * surcharge;
                const P1 = p1 * H_tot * L;
                const y1 = H_tot / 2;
                
                const p2 = Ka * soil.gamma_c * d2;
                const P2_tri = 0.5 * p2 * d2 * L;
                const y2_tri = d3 + geom.T1 + (d2 / 3);
                const P2_rect = p2 * (d3 + geom.T1) * L;
                const y2_rect = (d3 + geom.T1) / 2;
                const P2 = P2_tri + P2_rect;
                
                const p3 = Ka * gamma_sub * (d3 + geom.T1);
                const P3 = 0.5 * p3 * (d3 + geom.T1) * L;
                const y3 = (d3 + geom.T1) / 3;

                const p4 = gamma_w * (d3 + geom.T1);
                const P4 = 0.5 * p4 * (d3 + geom.T1) * L;
                const y4 = (d3 + geom.T1) / 3;

                const sumP = P1 + P2 + P3 + P4;
                const MO = (P1*y1) + (P2_tri*y2_tri) + (P2_rect*y2_rect) + (P3*y3) + (P4*y4);

                // Resisting Forces
                const w1 = geom.C * geom.T1 * 2400 * L; 
                const x1 = geom.C / 2;
                
                const w2 = geom.G * geom.H * 2400 * L; 
                const x2 = geom.C + (geom.G / 2);

                const w3 = 0.5 * m * geom.H * 2400 * L; 
                const x3 = geom.C + geom.G + (m / 3);

                const w4 = (geom.D + geom.F) * geom.T1 * 2400 * L; 
                const x4 = geom.C + ((geom.D + geom.F) / 2);

                const Area_tot = 0.5 * m * geom.H;
                const m2 = geom.H > 0 ? m * (d3 / geom.H) : 0;
                const Area_wet = 0.5 * m2 * d3;
                const Area_dry = Area_tot - Area_wet;
                const W5_wet = Area_wet * soil.gamma_sat * L;
                const W5_dry = Area_dry * soil.gamma_c * L;
                const w5 = W5_wet + W5_dry;
                
                const x_tot = geom.C + geom.D - (m / 3);
                const x_wet = geom.C + geom.D - (m2 / 3);
                const x_dry = Area_dry > 0 ? ((Area_tot * x_tot) - (Area_wet * x_wet)) / Area_dry : 0;
                const x5 = w5 > 0 ? ((W5_dry * x_dry) + (W5_wet * x_wet)) / w5 : 0;

                const w6 = geom.F * d2 * soil.gamma_c * L; 
                const x6 = geom.C + geom.D + (geom.F / 2);

                const w7 = geom.F * d3 * soil.gamma_sat * L; 
                const x7 = geom.C + geom.D + (geom.F / 2);

                const w8 = surcharge * (m + geom.F) * L; 
                const x8 = geom.C + geom.G + ((m + geom.F) / 2);

                const sumV = w1 + w2 + w3 + w4 + w5 + w6 + w7 + w8;
                const MR = (w1*x1) + (w2*x2) + (w3*x3) + (w4*x4) + (w5*x5) + (w6*x6) + (w7*x7) + (w8*x8);

                // Stability
                const FS_ot = MR / MO;
                const FS_slide = (base.f * sumV) / sumP;

                // Bearing
                const X_bar = (MR - MO) / sumV;
                const e = (B / 2) - X_bar;
                const B6 = B / 6;
                const isMiddleThird = Math.abs(e) <= B6;
                
                const q_max = (sumV / (B * L)) * (1 + (6 * e / B));
                const q_min = (sumV / (B * L)) * (1 - (6 * e / B));

                // --- PILE CALCULATION ---
                const V_pile = (sumV / L) * pile.spacingL; 
                const P_pile = (sumP / L) * pile.spacingL;

                const N_piles = pileRows.length;
                let x_cg_pile = 0;
                let M_cg_pile = 0;
                let sum_d2 = 0;
                let pile_results = [];
                let V_shear_pile = 0;
                let V_design_sp = 0;
                let M_design_sp = 0;
                let P_design_sp = 0;
                
                const P_excess = Math.max(0, 1.5 * sumP - base.f * sumV);
                const M_excess = Math.max(0, 1.5 * MO - MR);
                const V_allow_soil = base.q_allow > 0 ? (base.q_allow * B * L) / (1 + 6 * Math.abs(e) / B) : 0;
                const V_excess = Math.max(0, sumV - V_allow_soil);

                if (N_piles > 0) {
                    x_cg_pile = pileRows.reduce((sum, x) => sum + x, 0) / N_piles;

                    if (pile.designMode === 'full') {
                        P_design_sp = P_pile;
                        V_design_sp = V_pile;
                        M_design_sp = V_pile * (x_cg_pile - X_bar); 
                        M_cg_pile = M_design_sp; 
                    } else {
                        P_design_sp = (P_excess / L) * pile.spacingL;
                        V_design_sp = (V_excess / L) * pile.spacingL;
                        M_design_sp = (M_excess / L) * pile.spacingL;
                        M_cg_pile = M_design_sp; 
                    }

                    pileRows.forEach(x => {
                        const d = x_cg_pile - x;
                        sum_d2 += (d * d);
                    });

                    pile_results = pileRows.map((x, i) => {
                        const d = x_cg_pile - x;
                        let p_axial = (V_design_sp / N_piles) + (sum_d2 > 0 ? (M_design_sp * d / sum_d2) : 0);
                        return { id: i + 1, x, d, p_axial };
                    });

                    V_shear_pile = P_design_sp / N_piles;
                }

                return {
                    B, m, Ka, gamma_w, gamma_sub, d2, d3, H_tot, L,
                    p1, P1, y1, p2, P2_tri, y2_tri, P2_rect, y2_rect, P2, p3, P3, y3, p4, P4, y4, sumP, MO,
                    w1, x1, w2, x2, w3, x3, w4, x4, w5, x5, w6, x6, w7, x7, w8, x8, sumV, MR,
                    FS_ot, FS_slide, X_bar, e, B6, isMiddleThird, q_max, q_min,
                    W5_dry, W5_wet,
                    V_pile, P_pile, x_cg_pile, M_cg_pile, sum_d2, pile_results, V_shear_pile, N_piles, 
                    P_excess, M_excess, V_excess, V_design_sp, M_design_sp, P_design_sp
                };
            }, [soil, base, surcharge, geom, designLength, pile, pileRows]);

            const handleNum = (setter, field) => (e) => {
                setter(prev => ({ ...prev, [field]: parseFloat(e.target.value) || 0 }));
            };

            const handlePileNum = (field) => (e) => {
                setPileType('custom');
                setPile(prev => ({ ...prev, [field]: parseFloat(e.target.value) || 0 }));
            };

            const handlePileTypeChange = (e) => {
                const val = e.target.value;
                setPileType(val);
                if (val !== 'custom') {
                    setPile(prev => ({
                        ...prev,
                        allowComp: pileProfiles[val].comp,
                        allowTen: pileProfiles[val].ten,
                        allowShear: pileProfiles[val].shear
                    }));
                }
            };

            const addPileRow = () => setPileRows([...pileRows, parseFloat(((geom.C + geom.D + geom.F)/2).toFixed(2))]);
            const removePileRow = (index) => setPileRows(pileRows.filter((_, i) => i !== index));
            const updatePileRow = (index, value) => {
                const newRows = [...pileRows];
                newRows[index] = parseFloat(value) || 0;
                setPileRows(newRows);
            };

            const GlobalNav = () => (
                <div className="bg-slate-900 text-slate-300 text-sm py-2 px-4 flex justify-between items-center shadow-md no-print">
                    <div className="flex items-center space-x-2">
                        <svg className="w-5 h-5 text-sky-400" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                        <span className="font-semibold text-white tracking-wide">STRUCTURAL APPS</span>
                    </div>
                    <button onClick={() => window.print()} className="bg-blue-500 hover:bg-blue-600 text-white font-medium py-1.5 px-3 rounded flex items-center transition shadow-sm">
                        <svg className="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
                        พิมพ์รายงาน (A4)
                    </button>
                </div>
            );

            const TabInputs = () => (
                <div className="mb-6 space-y-4 print:mb-4 print:space-y-3 animate-[fadeIn_0.3s_ease-in-out]">
                    {/* Box 1: มิติโครงสร้าง */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 print:p-4 print:break-inside-avoid">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-100 pb-3 mb-4 print:mb-3">
                            <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-2 sm:mb-0">มิติโครงสร้างกำแพงกันดิน (Wall Dimensions)</h3>
                            <span className="text-xs text-slate-600 font-medium bg-slate-100 print:bg-transparent px-3 py-1 rounded-full border border-slate-200 print:border-none">ความกว้างฐานรวม (B) = <span className="font-bold text-blue-600">{calc.B.toFixed(2)} ม.</span></span>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 print:grid-cols-3 gap-x-6 gap-y-2">
                            <InputRow label="สูง (H)" value={geom.H} onChange={handleNum(setGeom, 'H')} unit="ม." />
                            <InputRow label="ยื่นหน้า Toe (C)" value={geom.C} onChange={handleNum(setGeom, 'C')} unit="ม." />
                            <InputRow label="กว้างยอดกำแพง (G)" value={geom.G} onChange={handleNum(setGeom, 'G')} unit="ม." />
                            <InputRow label="ระดับน้ำจากผิวดิน" value={geom.waterDepth} onChange={handleNum(setGeom, 'waterDepth')} unit="ม." bgClass="bg-blue-50 border-blue-100 print:bg-transparent print:border-transparent" />
                            <InputRow label="หนาฐาน (T1)" value={geom.T1} onChange={handleNum(setGeom, 'T1')} unit="ม." />
                            <InputRow label="กว้างฐานล่าง (D)" value={geom.D} onChange={handleNum(setGeom, 'D')} unit="ม." />
                            <InputRow label="ยื่นหลัง Heel (F)" value={geom.F} onChange={handleNum(setGeom, 'F')} unit="ม." />
                        </div>
                    </div>

                    {/* Box 2: พารามิเตอร์ดิน */}
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 print:p-4 print:break-inside-avoid">
                        <h3 className="text-sm font-bold text-slate-700 uppercase tracking-wider mb-4 border-b border-slate-100 pb-3 print:mb-3">พารามิเตอร์การออกแบบดินและน้ำหนัก (Soil & Load Parameters)</h3>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 print:grid-cols-3 gap-x-6 gap-y-2">
                            <InputRow label={<span>&gamma;<Sub text="c"/> (กดทับ)</span>} value={soil.gamma_c} onChange={handleNum(setSoil, 'gamma_c')} unit={<span>กก./ม.&sup3;</span>} />
                            <InputRow label={<span>&gamma;<Sub text="sat"/> (อิ่มตัว)</span>} value={soil.gamma_sat} onChange={handleNum(setSoil, 'gamma_sat')} unit={<span>กก./ม.&sup3;</span>} />
                            <InputRow label={<span>มุมเสียดทาน &phi;</span>} value={soil.phi} onChange={handleNum(setSoil, 'phi')} unit="องศา" warning={(soil.phi < 15 || soil.phi > 45) ? "ค่าแปลก" : null} />
                            <InputRow label="ความยาวคำนวณ (L)" value={designLength} onChange={(e) => setDesignLength(parseFloat(e.target.value)||1)} unit="ม." />
                            
                            <InputRow label="สัมประสิทธิ์ไถล (f)" value={base.f} onChange={handleNum(setBase, 'f')} unit="" />
                            <InputRow label={<span>q<Sub text="allow"/> ดินเดิม</span>} value={base.q_allow} onChange={handleNum(setBase, 'q_allow')} unit={<span>กก./ม.&sup2;</span>} />
                            <InputRow label="Surcharge (จร)" value={surcharge} onChange={(e) => setSurcharge(parseFloat(e.target.value)||0)} unit={<span>กก./ม.&sup2;</span>} bgClass="bg-amber-50 border-amber-100 print:bg-transparent print:border-transparent" />
                        </div>
                    </div>

                    {/* Box 3: ระบบฐานรากเสาเข็ม (Pile Foundation) */}
                    <div className="bg-white rounded-xl shadow-sm border-t-4 border-indigo-500 border-x border-b border-slate-200 p-5 print:p-4 print:break-inside-avoid">
                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-indigo-100 pb-3 mb-4 print:mb-3">
                            <label className="flex items-center space-x-3 cursor-pointer">
                                <input 
                                    type="checkbox" 
                                    className="w-5 h-5 accent-indigo-600 rounded text-indigo-600 focus:ring-indigo-500"
                                    checked={pile.usePiles} 
                                    onChange={(e) => setPile(prev => ({...prev, usePiles: e.target.checked}))} 
                                />
                                <h3 className="text-sm font-bold text-indigo-800 uppercase tracking-wider">ระบบฐานรากเสาเข็ม (Pile Foundation)</h3>
                            </label>
                            {pile.usePiles && <span className="text-xs text-slate-500 mt-2 sm:mt-0 no-print">*วิเคราะห์เสาเข็มแกน X แบบ Dynamic</span>}
                        </div>
                        
                        {pile.usePiles && (
                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 print:gap-6 animate-[fadeIn_0.3s_ease-in-out]">
                                {/* Left Column: Coordinates */}
                                <div className="bg-slate-50 print:bg-transparent p-4 print:p-0 rounded-lg border border-slate-100 print:border-none">
                                    <h4 className="text-sm font-bold text-slate-700 mb-4 print:mb-2 border-b pb-2 print:border-none print:pb-0">1. พิกัดจัดวางเสาเข็ม (Coordinates)</h4>
                                    <div className="space-y-2">
                                        <InputRow label={<span>ระยะห่างตามแนวยาว (S<Sub text="L"/>)</span>} value={pile.spacingL} onChange={handlePileNum('spacingL')} unit="ม." />
                                        
                                        {pileRows.map((x, i) => (
                                            <div key={i} className="flex flex-col sm:flex-row sm:items-center justify-between py-2 px-3 hover:bg-white rounded-md transition-colors border border-transparent hover:border-slate-200 shadow-sm hover:shadow">
                                                <span className="text-slate-700 text-sm mb-1 sm:mb-0 mr-3 flex-1 leading-tight">แถว {i+1} ห่างจาก Toe (x<Sub text={i+1}/>)</span>
                                                <div className="flex items-center flex-shrink-0 self-start sm:self-auto">
                                                    <input type="number" step="0.01" className="w-20 sm:w-24 p-1.5 border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500 text-sm bg-white print:border-slate-300 print:shadow-none" value={x} onChange={(e) => updatePileRow(i, e.target.value)} />
                                                    <span className="text-slate-500 mx-2 text-sm w-4">ม.</span>
                                                    <button onClick={() => removePileRow(i)} className="text-rose-400 hover:text-rose-600 bg-rose-50 hover:bg-rose-100 p-1.5 rounded transition no-print flex-shrink-0" title="ลบแถวนี้">
                                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                        <div className="px-2 pt-3">
                                            <button onClick={addPileRow} className="w-full py-2 border border-dashed border-indigo-300 text-indigo-600 rounded-md hover:bg-indigo-50 transition text-xs font-bold no-print">
                                                + เพิ่มแถวเสาเข็ม (แกน X)
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Right Column: Properties & Assumptions */}
                                <div>
                                    <div className="bg-slate-50 print:bg-transparent p-4 print:p-0 rounded-lg mb-6 border border-slate-100 print:border-none">
                                        <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 border-b border-slate-200 pb-2 print:border-none print:pb-0">
                                            <h4 className="text-sm font-bold text-slate-700">2. กำลังรับน้ำหนักปลอดภัย (Allowable Capacity)</h4>
                                            <select className="mt-2 sm:mt-0 text-xs p-1.5 border border-indigo-200 rounded text-indigo-700 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 no-print" value={pileType} onChange={handlePileTypeChange}>
                                                {Object.entries(pileProfiles).map(([k, v]) => (
                                                    <option key={k} value={k}>{v.name}</option>
                                                ))}
                                            </select>
                                        </div>
                                        
                                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                            <div className="flex flex-col space-y-1 bg-white print:bg-transparent p-2 rounded border border-slate-100 print:border-none">
                                                <span className="text-slate-500 text-xs font-semibold text-center mb-1">แรงกด (Compression)</span>
                                                <div className="flex items-center justify-center"><input type="number" className="w-full sm:w-24 p-1.5 border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500 text-sm shadow-sm print:shadow-none print:border-slate-300" value={pile.allowComp} onChange={handlePileNum('allowComp')} /><span className="text-slate-400 ml-2 text-xs w-4">kg</span></div>
                                            </div>
                                            <div className="flex flex-col space-y-1 bg-white print:bg-transparent p-2 rounded border border-slate-100 print:border-none">
                                                <span className="text-slate-500 text-xs font-semibold text-center mb-1">แรงถอน (Tension)</span>
                                                <div className="flex items-center justify-center"><input type="number" className="w-full sm:w-24 p-1.5 border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500 text-sm shadow-sm print:shadow-none print:border-slate-300" value={pile.allowTen} onChange={handlePileNum('allowTen')} /><span className="text-slate-400 ml-2 text-xs w-4">kg</span></div>
                                            </div>
                                            <div className="flex flex-col space-y-1 bg-white print:bg-transparent p-2 rounded border border-slate-100 print:border-none">
                                                <span className="text-slate-500 text-xs font-semibold text-center mb-1">แรงเฉือน (Shear)</span>
                                                <div className="flex items-center justify-center"><input type="number" className="w-full sm:w-24 p-1.5 border border-slate-300 rounded text-right focus:outline-none focus:ring-1 focus:ring-indigo-500 text-sm shadow-sm print:shadow-none print:border-slate-300" value={pile.allowShear} onChange={handlePileNum('allowShear')} /><span className="text-slate-400 ml-2 text-xs w-4">kg</span></div>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Design Assumption */}
                                    <div className="bg-slate-50 print:bg-transparent p-4 print:p-0 rounded-lg border border-slate-100 print:border-none">
                                        <h4 className="text-sm font-bold text-slate-700 mb-3 border-b border-slate-200 pb-2 print:border-none print:pb-0">3. สมมติฐานการรับแรง (Design Assumption)</h4>
                                        <div className="space-y-2">
                                            <label className="flex items-center space-x-2 text-sm cursor-pointer hover:bg-white p-2 rounded border border-transparent hover:border-slate-200 shadow-sm transition print:shadow-none print:border-none print:p-0">
                                                <input type="radio" name="designMode" value="excess" checked={pile.designMode === 'excess'} onChange={() => setPile(prev => ({...prev, designMode: 'excess'}))} className="accent-indigo-600 w-4 h-4" />
                                                <span className="text-slate-700 font-medium">รับเฉพาะส่วนเกิน (Excess Forces Only)</span>
                                            </label>
                                            <label className="flex items-center space-x-2 text-sm cursor-pointer hover:bg-white p-2 rounded border border-transparent hover:border-slate-200 shadow-sm transition print:shadow-none print:border-none print:p-0">
                                                <input type="radio" name="designMode" value="full" checked={pile.designMode === 'full'} onChange={() => setPile(prev => ({...prev, designMode: 'full'}))} className="accent-indigo-600 w-4 h-4" />
                                                <span className="text-slate-700 font-medium">รับแรงทั้งหมด (Full Load - Elastic Center)</span>
                                            </label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );

            const TabSummary = () => (
                <div className="space-y-6 animate-[fadeIn_0.3s_ease-in-out]">
                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 print:grid-cols-4 gap-6 print:gap-4">
                        <div className="bg-white p-6 print:p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                            <span className="text-slate-500 text-sm mb-3 font-medium">Overturning (F.S.)</span>
                            <div className="text-4xl font-bold text-slate-800 mb-4 print:text-3xl">{calc.FS_ot.toFixed(2)}</div>
                            <Badge condition={calc.FS_ot >= 1.5} textTrue={"\u2265 1.50 ผ่าน"} textFalse={"\u003C 1.50 ไม่ผ่าน"} />
                        </div>
                        <div className="bg-white p-6 print:p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                            <span className="text-slate-500 text-sm mb-3 font-medium">Sliding (F.S.)</span>
                            <div className="text-4xl font-bold text-slate-800 mb-4 print:text-3xl">{calc.FS_slide.toFixed(2)}</div>
                            <Badge condition={calc.FS_slide >= 1.5} textTrue={"\u2265 1.50 ผ่าน"} textFalse={"\u003C 1.50 ไม่ผ่าน"} />
                        </div>
                        <div className="bg-white p-6 print:p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                            <span className="text-slate-500 text-sm mb-3 font-medium">เยื้องศูนย์ e (ม.)</span>
                            <div className="text-4xl font-bold text-slate-800 mb-4 print:text-3xl">{Math.abs(calc.e).toFixed(3)}</div>
                            <Badge condition={calc.isMiddleThird} textTrue={`\u2264 B/6 (${calc.B6.toFixed(2)} ม.)`} textFalse={`\u003E B/6 (${calc.B6.toFixed(2)} ม.)`} />
                        </div>
                        <div className="bg-white p-6 print:p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center">
                            <span className="text-slate-500 text-sm mb-3 font-medium">q<Sub text="max"/> (กก./ม.&sup2;)</span>
                            <div className="text-4xl font-bold text-slate-800 mb-4 print:text-3xl">{calc.q_max.toFixed(0)}</div>
                            <Badge condition={calc.q_max <= base.q_allow} textTrue={"\u2264 q_allow ผ่าน"} textFalse={"\u003E q_allow ไม่ผ่าน"} />
                        </div>
                    </div>
                    {pile.usePiles && (
                        <div className="bg-indigo-50 p-4 rounded-lg border border-indigo-100 text-indigo-800 text-sm text-center font-medium shadow-sm print:break-inside-avoid">
                            * มีการเปิดใช้งาน <strong>ระบบฐานรากเสาเข็ม</strong> โปรดตรวจสอบกำลังรับแรงของเสาเข็มในแท็บ "แรงเสาเข็ม (Piles)" เพื่อพิจารณาเสถียรภาพที่แท้จริง
                        </div>
                    )}
                </div>
            );

            const TabDrawings = () => {
                const scale = Math.min(300 / calc.B, 250 / (geom.H + geom.T1), 120);
                const scaleX = scale; 
                const scaleY = scale;    
                const x0 = (600 - (calc.B * scaleX)) / 2;   
                const y0 = 320; 

                const svgH = geom.H * scaleY;
                const svgT1 = geom.T1 * scaleY;
                const svgC = geom.C * scaleX;
                const svgD = geom.D * scaleX;
                const svgG = geom.G * scaleX;
                const svgF = geom.F * scaleX;
                const svgB = calc.B * scaleX;

                const p1 = `${x0},${y0}`; 
                const p2 = `${x0 + svgB},${y0}`; 
                const p3 = `${x0 + svgB},${y0 - svgT1}`; 
                const p4 = `${x0 + svgC + svgD},${y0 - svgT1}`; 
                const p5 = `${x0 + svgC + svgG},${y0 - svgT1 - svgH}`; 
                const p6 = `${x0 + svgC},${y0 - svgT1 - svgH}`; 
                const p7 = `${x0 + svgC},${y0 - svgT1}`; 
                const p8 = `${x0},${y0 - svgT1}`; 
                const wallPolygon = `${p1} ${p2} ${p3} ${p4} ${p5} ${p6} ${p7} ${p8}`;

                const max_q_value = Math.max(Math.abs(calc.q_max), Math.abs(calc.q_min), 1);
                const q_scale = 80 / max_q_value; 
                const h_max = calc.q_max * q_scale;
                const h_min = calc.q_min * q_scale;

                const x_v = x0 + (calc.X_bar * scaleX);
                const y_bar_P = calc.sumP > 0 ? calc.MO / calc.sumP : 0; 
                const y_p = y0 - (y_bar_P * scaleY);

                // For Pile Plan View
                const planScale = Math.min(300 / calc.B, 120);
                const planW = calc.B * planScale;
                const planH = pile.spacingL * planScale;
                const planX0 = (600 - planW) / 2;
                const planY0 = 50;

                return (
                    <div className="grid grid-cols-1 lg:grid-cols-2 print:grid-cols-2 gap-6 print:gap-4 print:mt-0 animate-[fadeIn_0.3s_ease-in-out]">
                        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-start overflow-visible print:break-inside-avoid">
                            <h4 className="text-lg font-bold text-slate-700 mb-6 w-full text-center border-b pb-2">ไดอะแกรมรูปด้าน (Elevation)</h4>
                            <svg viewBox="0 0 650 450" className="w-full max-w-lg h-auto drop-shadow-sm mx-auto">
                                <defs>
                                    <pattern id="diagonalHatch" patternUnits="userSpaceOnUse" width="8" height="8">
                                        <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#fb7185" strokeWidth="1" />
                                    </pattern>
                                    <pattern id="tensionHatch" patternUnits="userSpaceOnUse" width="8" height="8">
                                        <path d="M-2,2 l4,-4 M0,8 l8,-8 M6,10 l4,-4" stroke="#c084fc" strokeWidth="1" />
                                    </pattern>
                                </defs>

                                <line x1="20" y1={y0 - svgH - svgT1} x2="630" y2={y0 - svgH - svgT1} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                <text x="610" y={y0 - svgH - svgT1 - 8} fill="#64748b" fontSize="12" textAnchor="end">ระดับดิน</text>

                                <polygon points={wallPolygon} fill="#e2e8f0" stroke="#64748b" strokeWidth="2" strokeLinejoin="round" />

                                <line x1={x0} y1={y0} x2={x0 + svgB} y2={y0} stroke="#475569" strokeWidth="2" />
                                
                                {(!pile.usePiles || pile.designMode === 'excess') && (
                                    <g>
                                        <polygon 
                                            points={`${x0},${y0} ${x0 + svgB},${y0} ${x0 + svgB},${y0 + h_min} ${x0},${y0 + h_max}`}
                                            fill={calc.q_min < 0 ? "url(#tensionHatch)" : "url(#diagonalHatch)"}
                                            stroke={calc.q_min < 0 ? "#a855f7" : "#e11d48"} strokeWidth="1.5"
                                        />
                                        <line x1={x0} y1={y0 + h_max} x2={x0 + svgB} y2={y0 + h_min} stroke="#be123c" strokeWidth="2" />
                                        <line x1={x0} y1={y0} x2={x0} y2={y0 + h_max} stroke="#be123c" strokeWidth="2" />
                                        <line x1={x0 + svgB} y1={y0} x2={x0 + svgB} y2={y0 + h_min} stroke="#be123c" strokeWidth="2" />
                                        <text x={x0 - 8} y={y0 + h_max + (calc.q_max > 0 ? 15 : -5)} fill="#be123c" fontSize="14" fontWeight="bold" textAnchor="end">
                                            q_max = {calc.q_max.toFixed(0)}
                                        </text>
                                        <text x={x0 + svgB + 8} y={y0 + h_min + (calc.q_min > 0 ? 15 : -5)} fill={calc.q_min < 0 ? "#7e22ce" : "#be123c"} fontSize="14" fontWeight="bold" textAnchor="start">
                                            q_min = {calc.q_min.toFixed(0)} {calc.q_min < 0 && '(Tension)'}
                                        </text>
                                    </g>
                                )}

                                {pile.usePiles && pileRows.map((x, i) => (
                                    <g key={i}>
                                        <rect x={x0 + x * scaleX - 10} y={y0} width="20" height="60" fill="#cbd5e1" stroke="#475569" strokeWidth="2" />
                                        <path d={`M ${x0 + x * scaleX - 10} ${y0 + 60} L ${x0 + x * scaleX} ${y0 + 80} L ${x0 + x * scaleX + 10} ${y0 + 60} Z`} fill="#cbd5e1" stroke="#475569" strokeWidth="2" />
                                    </g>
                                ))}

                                {/* ลูกศรแรงต้านแนวดิ่ง (V) */}
                                <line x1={x_v} y1={y0 - svgH - svgT1 - 60} x2={x_v} y2={y0 - 35} stroke="#10b981" strokeWidth="4" strokeDasharray="6,4" />
                                <polygon points={`${x_v - 8},${y0 - 36} ${x_v + 8},${y0 - 36} ${x_v},${y0 - 20}`} fill="#10b981" />
                                <circle cx={x_v} cy={y0} r="4" fill="#10b981" />
                                <text x={x_v + 12} y={y0 - svgH - svgT1 - 45} fill="#047857" fontSize="16" fontWeight="bold">
                                    &#931;V = {calc.sumV.toFixed(0)} kg
                                </text>
                                <text x={x_v + 12} y={y0 - svgH - svgT1 - 25} fill="#047857" fontSize="13">
                                    (X&#772; = {calc.X_bar.toFixed(2)}m)
                                </text>

                                {/* ลูกศรแรงผลักด้านข้าง (P) */}
                                <line x1={x0 + svgB + 100} y1={y_p} x2={x0 + svgB + 15} y2={y_p} stroke="#0ea5e9" strokeWidth="4" />
                                <polygon points={`${x0 + svgB + 16},${y_p - 8} ${x0 + svgB + 16},${y_p + 8} ${x0 + svgB},${y_p}`} fill="#0ea5e9" />
                                <text x={x0 + svgB + 55} y={y_p - 12} fill="#0369a1" fontSize="16" fontWeight="bold" textAnchor="middle">
                                    &#931;P = {calc.sumP.toFixed(0)} kg
                                </text>
                                <text x={x0 + svgB + 55} y={y_p + 20} fill="#0369a1" fontSize="13" textAnchor="middle">
                                    (y&#772; = {y_bar_P.toFixed(2)}m)
                                </text>

                                {/* ขีดเส้นประแนวแรง V ลงมาด้านล่าง */}
                                <line x1={x_v} y1={y0} x2={x_v} y2={y0 + 105} stroke="#10b981" strokeWidth="1" strokeDasharray="3,3" opacity="0.6" />
                            </svg>
                        </div>

                        {pile.usePiles ? (
                            <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm flex flex-col items-center justify-start overflow-visible print:break-inside-avoid">
                                <h4 className="text-lg font-bold text-slate-700 mb-6 w-full text-center border-b pb-2">แปลนฐานราก (Plan View)</h4>
                                <svg viewBox="0 0 600 450" className="w-full max-w-sm h-auto drop-shadow-sm mx-auto mt-4">
                                    <defs>
                                        <marker id="arrow-dim" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                                            <polygon points="0 0, 6 3, 0 6" fill="#64748b" />
                                        </marker>
                                    </defs>

                                    {/* พื้นที่ฐานราก */}
                                    <rect x={planX0} y={planY0} width={planW} height={planH} fill="#f1f5f9" stroke="#475569" strokeWidth="2" rx="4" />
                                    
                                    {/* เส้นขอบแนวกำแพง */}
                                    <line x1={planX0 + geom.C * planScale} y1={planY0} x2={planX0 + geom.C * planScale} y2={planY0 + planH} stroke="#94a3b8" strokeWidth="2" strokeDasharray="4,4" />
                                    <line x1={planX0 + (geom.C + geom.D) * planScale} y1={planY0} x2={planX0 + (geom.C + geom.D) * planScale} y2={planY0 + planH} stroke="#94a3b8" strokeWidth="2" strokeDasharray="4,4" />

                                    {/* เสาเข็มแบบ Dynamic */}
                                    {pileRows.map((x, i) => {
                                        const lineY = planY0 - 20 - (i * 20); 
                                        return (
                                            <g key={i}>
                                                <circle cx={planX0 + x * planScale} cy={planY0 + planH / 2} r="12" fill="#818cf8" stroke="#1e3a8a" strokeWidth="2" />
                                                <text x={planX0 + x * planScale} y={planY0 + planH / 2 - 20} fill="#1e3a8a" fontSize="12" fontWeight="bold" textAnchor="middle">Row {i+1}</text>
                                                
                                                <line x1={planX0} y1={lineY} x2={planX0 + x * planScale} y2={lineY} stroke="#64748b" strokeWidth="1" markerStart="url(#arrow-dim)" markerEnd="url(#arrow-dim)" />
                                                <text x={planX0 + (x * planScale) / 2} y={lineY - 5} fill="#475569" fontSize="12" textAnchor="middle">x{i+1}={x}</text>
                                                
                                                <line x1={planX0 + x * planScale} y1={lineY} x2={planX0 + x * planScale} y2={planY0 + planH / 2} stroke="#64748b" strokeWidth="1" strokeDasharray="3,3" />
                                            </g>
                                        );
                                    })}
                                    
                                    {/* เส้นปะโยงจาก Toe ไปแกนเริ่มบอกระยะ */}
                                    {pileRows.length > 0 && <line x1={planX0} y1={planY0 - 20 - ((pileRows.length - 1) * 20)} x2={planX0} y2={planY0} stroke="#64748b" strokeWidth="1" strokeDasharray="3,3" />}

                                    {/* Dimension แนวแกน Y (SL) */}
                                    <line x1={planX0 - 20} y1={planY0} x2={planX0 - 20} y2={planY0 + planH} stroke="#64748b" strokeWidth="1" markerStart="url(#arrow-dim)" markerEnd="url(#arrow-dim)" />
                                    <line x1={planX0 - 30} y1={planY0} x2={planX0 - 10} y2={planY0} stroke="#64748b" strokeWidth="1" />
                                    <line x1={planX0 - 30} y1={planY0 + planH} x2={planX0 - 10} y2={planY0 + planH} stroke="#64748b" strokeWidth="1" />
                                    <text x={planX0 - 35} y={planY0 + planH / 2} fill="#475569" fontSize="14" textAnchor="middle" transform={`rotate(-90, ${planX0 - 35}, ${planY0 + planH / 2})`}>S_L = {pile.spacingL} m</text>

                                    {/* Dimension แนวแกน X (B) */}
                                    <line x1={planX0} y1={planY0 + planH + 20} x2={planX0 + planW} y2={planY0 + planH + 20} stroke="#64748b" strokeWidth="1" markerStart="url(#arrow-dim)" markerEnd="url(#arrow-dim)" />
                                    <line x1={planX0} y1={planY0 + planH + 10} x2={planX0} y2={planY0 + planH + 30} stroke="#64748b" strokeWidth="1" />
                                    <line x1={planX0 + planW} y1={planY0 + planH + 10} x2={planX0 + planW} y2={planY0 + planH + 30} stroke="#64748b" strokeWidth="1" />
                                    <text x={planX0 + planW / 2} y={planY0 + planH + 40} fill="#475569" fontSize="14" textAnchor="middle">B = {calc.B.toFixed(2)} m</text>
                                </svg>
                            </div>
                        ) : (
                            <div className="bg-slate-50 p-6 rounded-xl border border-slate-200 flex flex-col items-center justify-center text-slate-400 print:hidden">
                                <svg className="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 002-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" /></svg>
                                <p>เปิดใช้ "ระบบฐานรากเสาเข็ม" เพื่อแสดงแปลนที่นี่</p>
                            </div>
                        )}
                    </div>
                );
            };

            const TabDriving = () => {
                const scaleY = 280 / calc.H_tot; 
                const maxP = calc.p1 + calc.p2 + calc.p3 + calc.p4;
                const scaleX = maxP > 0 ? 250 / maxP : 1;
                const x0 = 120; 
                const y0 = 60; 

                const svgH = calc.H_tot * scaleY;
                const svgD2 = calc.d2 * scaleY;
                const svgD3_T1 = (calc.d3 + geom.T1) * scaleY;

                const y_WT = y0 + svgD2;
                const y_Base = y0 + svgH;

                const w1 = calc.p1 * scaleX;
                const w2 = calc.p2 * scaleX;
                const w3 = calc.p3 * scaleX;
                const w4 = calc.p4 * scaleX;

                const max_x = x0 + w1 + w2 + w3 + w4;
                const arrow_x = max_x + 20;
                const dim_x = arrow_x + 50; 

                const y_P1 = y0 + svgH / 2;
                const y_P2Tri = y0 + svgD2 * 2 / 3;
                const y_P2Rect = y_WT + svgD3_T1 / 2;
                const y_P3 = y_WT + svgD3_T1 * 2 / 3 - (svgD3_T1 > 40 ? 15 : 0);
                const y_P4 = y_WT + svgD3_T1 * 2 / 3 + (svgD3_T1 > 40 ? 15 : 0);

                return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:space-y-4 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                    <h3 className="font-bold text-lg text-slate-700 border-b pb-2">แรงผลักด้านข้าง (Driving Forces)</h3>
                    
                    <div className="bg-sky-50 print:bg-white text-sky-800 print:text-slate-800 p-4 rounded-lg text-sm font-medium grid grid-cols-2 md:grid-cols-5 print:grid-cols-5 gap-y-3 gap-x-4 border border-sky-100 print:border-slate-300 shadow-sm">
                        <div>K<Sub text="a"/> = {calc.Ka.toFixed(3)}</div>
                        <div>Surcharge = {surcharge} กก./ม.&sup2;</div>
                        <div>&gamma;<Sub text="c"/> = {soil.gamma_c} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="sat"/> = {soil.gamma_sat} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="w"/> = {calc.gamma_w} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="sub"/> = {calc.gamma_sub} กก./ม.&sup3;</div>
                        <div>d<Sub text="2"/> (ดินแห้ง) = {calc.d2.toFixed(2)} ม.</div>
                        <div>d<Sub text="3"/> (ดินเปียก) = {calc.d3.toFixed(2)} ม.</div>
                        <div>T<Sub text="1"/> (ฐานราก) = {geom.T1.toFixed(2)} ม.</div>
                        <div>H + T<Sub text="1"/> = {calc.H_tot.toFixed(2)} ม.</div>
                    </div>

                    <div className="grid lg:grid-cols-5 gap-8 print:gap-4 mt-6 print:mt-4">
                        <div className="lg:col-span-2 flex flex-col items-center justify-start border border-slate-200 p-4 rounded-xl print:border-none print:p-0">
                            <h4 className="text-base font-semibold text-slate-700 mb-6 w-full text-center">แผนภาพแรงผลักด้านข้างและทิศทางของแรง (Driving Pressure Distribution)</h4>
                            <svg viewBox="0 0 800 450" className="w-full max-w-sm h-auto">
                                <defs>
                                    <marker id="arrow-force" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
                                        <polygon points="0 0, 8 4, 0 8" fill="#dc2626" />
                                    </marker>
                                    <marker id="arrow-dim-y" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
                                        <polygon points="0 0, 6 3, 0 6" fill="#64748b" />
                                    </marker>
                                </defs>

                                <line x1="20" y1={y0} x2={dim_x + 20} y2={y0} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                <text x={dim_x + 25} y={y0-8} fill="#64748b" fontSize="14" fontWeight="bold">ผิวดิน</text>
                                
                                {calc.d2 < calc.H_tot && (
                                    <g>
                                        <line x1="20" y1={y_WT} x2={dim_x + 20} y2={y_WT} stroke="#38bdf8" strokeWidth="2" strokeDasharray="5,5" />
                                        <text x={dim_x + 25} y={y_WT+18} fill="#0284c7" fontSize="14" fontWeight="bold">ระดับน้ำ</text>
                                    </g>
                                )}

                                <line x1="20" y1={y_Base} x2={dim_x + 20} y2={y_Base} stroke="#475569" strokeWidth="2" />
                                <text x={dim_x + 25} y={y_Base+4} fill="#475569" fontSize="14" fontWeight="bold">ก้นฐานราก</text>

                                <rect x={x0-40} y={y0} width="40" height={svgH} fill="#cbd5e1" stroke="#475569" strokeWidth="2" />
                                <text x={x0-20} y={y0+svgH/2} fill="#475569" fontSize="13" textAnchor="middle" transform={`rotate(-90, ${x0-20}, ${y0+svgH/2})`}>กำแพงกันดิน (Wall)</text>
                                
                                {showP1 && calc.P1 > 0 && (
                                    <g>
                                        <rect x={x0} y={y0} width={w1} height={svgH} fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" strokeDasharray="4" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P1} x2={x0+10} y2={y_P1} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P1+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P1</text>
                                    </g>
                                )}
                                
                                {showP2Tri && calc.P2_tri > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1},${y0} ${x0+w1+w2},${y_WT} ${x0+w1},${y_WT}`} fill="rgba(250, 204, 21, 0.4)" stroke="#ca8a04" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P2Tri} x2={x0+10} y2={y_P2Tri} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P2Tri+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P2</text>
                                    </g>
                                )}
                                
                                {showP2Rect && calc.P2_rect > 0 && (
                                    <g>
                                        <rect x={x0+w1} y={y_WT} width={w2} height={svgD3_T1} fill="rgba(251, 146, 60, 0.4)" stroke="#ea580c" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P2Rect} x2={x0+10} y2={y_P2Rect} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P2Rect+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P2</text>
                                    </g>
                                )}
                                
                                {showP3 && calc.P3 > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1+w2},${y_WT} ${x0+w1+w2+w3},${y_Base} ${x0+w1+w2},${y_Base}`} fill="rgba(96, 165, 250, 0.4)" stroke="#2563eb" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P3} x2={x0+10} y2={y_P3} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P3+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P3</text>
                                    </g>
                                )}
                                
                                {showP4 && calc.P4 > 0 && (
                                    <g>
                                        <polygon points={`${x0+w1+w2+w3},${y_WT} ${x0+w1+w2+w3+w4},${y_Base} ${x0+w1+w2+w3},${y_Base}`} fill="rgba(30, 58, 138, 0.3)" stroke="#1e3a8a" strokeWidth="1" />
                                        <line x1={arrow_x} y1={y_P4} x2={x0+10} y2={y_P4} stroke="#dc2626" strokeWidth="2" markerEnd="url(#arrow-force)" />
                                        <text x={arrow_x + 10} y={y_P4+4} fill="#b91c1c" fontSize="14" fontWeight="bold">P4</text>
                                    </g>
                                )}

                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={dim_x - 10} y1={y0} x2={dim_x + 10} y2={y0} />
                                    {calc.d2 > 0 && calc.d2 < calc.H_tot && <line x1={dim_x - 10} y1={y_WT} x2={dim_x + 10} y2={y_WT} />}
                                    <line x1={dim_x - 10} y1={y_Base} x2={dim_x + 10} y2={y_Base} />

                                    {calc.d2 > 0 && <line x1={dim_x} y1={y0} x2={dim_x} y2={y_WT} markerStart="url(#arrow-dim-y)" markerEnd="url(#arrow-dim-y)" />}
                                    {calc.d3 + geom.T1 > 0 && <line x1={dim_x} y1={y_WT} x2={dim_x} y2={y_Base} markerStart="url(#arrow-dim-y)" markerEnd="url(#arrow-dim-y)" />}
                                </g>
                                <g fill="#475569" fontSize="14" textAnchor="start" dominantBaseline="middle" fontFamily="sans-serif">
                                    {calc.d2 > 0 && <text x={dim_x + 15} y={y0 + svgD2/2}>d2 (แห้ง)</text>}
                                    {calc.d3 + geom.T1 > 0 && <text x={dim_x + 15} y={y_WT + svgD3_T1/2}>d3+T1 (เปียก)</text>}
                                </g>

                                <circle cx={x0} cy={y_Base} r="5" fill="#dc2626" />
                            </svg>
                        </div>
                        
                        <div className="lg:col-span-3 space-y-4 lg:pl-6 border-l border-slate-100 print:border-none">
                            <h4 className="text-base font-semibold text-slate-700 mb-4 border-b pb-2">เลเยอร์ของแรงดัน (Pressure Layers)</h4>
                            
                            <label className="flex items-start space-x-3 p-3 bg-white border border-slate-100 hover:border-sky-300 rounded-lg cursor-pointer transition shadow-sm">
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-sky-500 no-print" checked={showP1} onChange={e => setShowP1(e.target.checked)} />
                                <div>
                                    <div className="font-bold text-sky-600">P1: Surcharge</div>
                                    <div className="text-xs text-slate-500 mt-1">น้ำหนักกดทับด้านบน (สม่ำเสมอ) จึงเป็น <strong className="text-sky-700">สี่เหลี่ยมผืนผ้า</strong> ตลอดความลึก แขนโมเมนต์ตกกึ่งกลางความสูงทั้งหมด</div>
                                </div>
                            </label>

                            <label className={`flex items-start space-x-3 p-3 bg-white border border-slate-100 rounded-lg cursor-pointer transition shadow-sm ${calc.d2 === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:border-amber-300'}`}>
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-amber-500 no-print" checked={showP2Tri} onChange={e => setShowP2Tri(e.target.checked)} disabled={calc.d2 === 0} />
                                <div>
                                    <div className="font-bold text-amber-600">P2: ดินแห้ง (ส่วนสามเหลี่ยม)</div>
                                    <div className="text-xs text-slate-500 mt-1">น้ำหนักดินเพิ่มตามความลึกถึงระดับน้ำ กราฟเป็น <strong className="text-amber-700">สามเหลี่ยม</strong> แขนตกที่ 2/3 ของ d2</div>
                                </div>
                            </label>

                            <label className={`flex items-start space-x-3 p-3 bg-white border border-slate-100 rounded-lg cursor-pointer transition shadow-sm ${calc.d2 === 0 || (calc.d3 + geom.T1) === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:border-orange-300'}`}>
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-orange-500 no-print" checked={showP2Rect} onChange={e => setShowP2Rect(e.target.checked)} disabled={calc.d2 === 0 || (calc.d3 + geom.T1) === 0} />
                                <div>
                                    <div className="font-bold text-orange-600">P2: ดินแห้ง (ส่วนสี่เหลี่ยม)</div>
                                    <div className="text-xs text-slate-500 mt-1">มวลดินแห้งข้างบนกดทับดินเปียกข้างล่าง ทำตัวเสมือน Surcharge อีกก้อน เป็น <strong className="text-orange-700">สี่เหลี่ยม</strong> ในโซนล่าง</div>
                                </div>
                            </label>

                            <label className={`flex items-start space-x-3 p-3 bg-white border border-slate-100 rounded-lg cursor-pointer transition shadow-sm ${(calc.d3 + geom.T1) === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:border-blue-300'}`}>
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-blue-500 no-print" checked={showP3} onChange={e => setShowP3(e.target.checked)} disabled={(calc.d3 + geom.T1) === 0} />
                                <div>
                                    <div className="font-bold text-blue-600">P3: ดินเปียก/จมน้ำ</div>
                                    <div className="text-xs text-slate-500 mt-1">ดินใต้ระดับน้ำมีแรงลอยตัวพยุง เริ่มจาก 0 ที่ระดับน้ำ เป็น <strong className="text-blue-700">สามเหลี่ยม</strong> แขน 2/3 วัดจากผิวน้ำ</div>
                                </div>
                            </label>

                            <label className={`flex items-start space-x-3 p-3 bg-white border border-slate-100 rounded-lg cursor-pointer transition shadow-sm ${(calc.d3 + geom.T1) === 0 ? 'opacity-40 grayscale bg-slate-50 cursor-not-allowed' : 'hover:border-indigo-300'}`}>
                                <input type="checkbox" className="mt-1 w-5 h-5 accent-indigo-700 no-print" checked={showP4} onChange={e => setShowP4(e.target.checked)} disabled={(calc.d3 + geom.T1) === 0} />
                                <div>
                                    <div className="font-bold text-indigo-800">P4: แรงดันน้ำ (Hydrostatic)</div>
                                    <div className="text-xs text-slate-500 mt-1">น้ำเป็นของไหล ไม่มีแรงเสียดทาน (Ka = 1) ใช้ &gamma;_w คูณตรงๆ เป็น <strong className="text-indigo-700">สามเหลี่ยม</strong></div>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>
                );
            };

            const TabResisting = () => {
                const scale = Math.min(500 / calc.B, 250 / (geom.H + geom.T1), 150);
                const scaleX = scale; 
                const scaleY = scale;    
                const x0 = (750 - (calc.B * scaleX)) / 2;   
                const y0 = 350; 

                const svgH = geom.H * scaleY;
                const svgT1 = geom.T1 * scaleY;
                const svgC = geom.C * scaleX;
                const svgD = geom.D * scaleX;
                const svgG = geom.G * scaleX;
                const svgF = geom.F * scaleX;
                const svgB = calc.B * scaleX;
                const svgm = calc.m * scaleX;
                const svgd2 = calc.d2 * scaleY;
                const svgd3 = calc.d3 * scaleY;

                return (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                    <h3 className="font-bold text-lg text-slate-700 mb-4 border-b pb-2">แรงต้านทานแนวดิ่ง (Resisting Forces)</h3>
                    
                    <div className="bg-emerald-50 print:bg-white text-emerald-800 print:text-slate-800 p-4 rounded-lg mb-6 text-sm font-medium grid grid-cols-2 md:grid-cols-4 lg:grid-cols-5 print:grid-cols-5 gap-y-3 gap-x-4 border border-emerald-100 print:border-slate-300 shadow-sm">
                        <div>C (Toe): {geom.C.toFixed(2)} ม.</div>
                        <div>D (Stem Bot): {geom.D.toFixed(2)} ม.</div>
                        <div>G (Stem Top): {geom.G.toFixed(2)} ม.</div>
                        <div>F (Heel): {geom.F.toFixed(2)} ม.</div>
                        <div>m (ระยะลาด D-G): {calc.m.toFixed(2)} ม.</div>
                        <div>H (Stem): {geom.H.toFixed(2)} ม.</div>
                        <div>T<Sub text="1"/> (Base): {geom.T1.toFixed(2)} ม.</div>
                        <div>d<Sub text="2"/> (ดินแห้ง): {calc.d2.toFixed(2)} ม.</div>
                        <div>d<Sub text="3"/> (ดินเปียก): {calc.d3.toFixed(2)} ม.</div>
                        <div>Surcharge: {surcharge} กก./ม.&sup2;</div>
                        <div>&gamma;<Sub text="compact"/>: {soil.gamma_c} กก./ม.&sup3;</div>
                        <div>&gamma;<Sub text="sat"/>: {soil.gamma_sat} กก./ม.&sup3;</div>
                        <div>น้ำหนักคอนกรีต: 2400 กก./ม.&sup3;</div>
                        <div>W<Sub text="dry"/> (ดินเหนือ Stem): {calc.W5_dry.toFixed(2)} กก.</div>
                        <div>W<Sub text="wet"/> (ดินเหนือ Stem): {calc.W5_wet.toFixed(2)} กก.</div>
                    </div>

                    <div className="flex flex-col gap-6 mt-4">
                        <div className="bg-slate-50 print:bg-transparent rounded-xl flex flex-col items-center justify-center p-6 border border-slate-200 print:border-none overflow-visible">
                            <h4 className="text-base font-semibold text-slate-700 mb-4 w-full text-center">สัดส่วนพื้นที่หน้าตัด และ Dimensions (ไดอะแกรม)</h4>
                            <svg viewBox="0 0 750 450" className="w-full max-w-3xl h-auto drop-shadow-sm mx-auto">
                                <line x1="20" y1={y0 - svgH - svgT1} x2="730" y2={y0 - svgH - svgT1} stroke="#94a3b8" strokeWidth="2" strokeDasharray="5,5" />
                                
                                <rect x={x0} y={y0 - svgT1} width={svgC} height={svgT1} fill="#94a3b8" stroke="#475569" strokeWidth="1" />
                                {geom.C > 0 && <text x={x0 + svgC/2} y={y0 - svgT1/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W1</text>}

                                <rect x={x0 + svgC} y={y0 - svgT1} width={svgD + svgF} height={svgT1} fill="#cbd5e1" stroke="#475569" strokeWidth="1" />
                                <text x={x0 + svgC + (svgD+svgF)/2} y={y0 - svgT1/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W4</text>

                                <rect x={x0 + svgC} y={y0 - svgT1 - svgH} width={svgG} height={svgH} fill="#e2e8f0" stroke="#475569" strokeWidth="1" />
                                {geom.G > 0 && <text x={x0 + svgC + svgG/2} y={y0 - svgT1 - svgH/2 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W2</text>}

                                {calc.m > 0 && (
                                    <g>
                                        <polygon points={`${x0+svgC+svgG},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1} ${x0+svgC+svgG},${y0-svgT1}`} fill="#f1f5f9" stroke="#475569" strokeWidth="1" />
                                        <text x={x0 + svgC + svgG + svgm/3} y={y0 - svgT1 - svgH/3 + 5} fill="#1e293b" fontSize="14" textAnchor="middle" fontWeight="bold">W3</text>
                                    </g>
                                )}

                                {calc.m > 0 && (
                                    <g>
                                        <polygon points={`${x0+svgC+svgG},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1-svgH} ${x0+svgC+svgD},${y0-svgT1}`} fill="#fde68a" stroke="#d97706" strokeWidth="1" />
                                        <text x={x0 + svgC + svgG + svgm*2/3} y={y0 - svgT1 - svgH*2/3 + 5} fill="#92400e" fontSize="14" textAnchor="middle" fontWeight="bold">W5</text>
                                    </g>
                                )}

                                {calc.d2 > 0 && (
                                    <g>
                                        <rect x={x0 + svgC + svgD} y={y0 - svgT1 - svgH} width={svgF} height={svgd2} fill="#fcd34d" stroke="#d97706" strokeWidth="1" />
                                        <text x={x0 + svgC + svgD + svgF/2} y={y0 - svgT1 - svgH + svgd2/2 + 5} fill="#92400e" fontSize="14" textAnchor="middle" fontWeight="bold">W6</text>
                                    </g>
                                )}

                                {calc.d3 > 0 && (
                                    <g>
                                        <rect x={x0 + svgC + svgD} y={y0 - svgT1 - svgH + svgd2} width={svgF} height={svgd3} fill="#93c5fd" stroke="#2563eb" strokeWidth="1" />
                                        <text x={x0 + svgC + svgD + svgF/2} y={y0 - svgT1 - svgH + svgd2 + svgd3/2 + 5} fill="#1e3a8a" fontSize="14" textAnchor="middle" fontWeight="bold">W7</text>
                                    </g>
                                )}

                                {surcharge > 0 && (
                                    <g>
                                        <rect x={x0 + svgC + svgG} y={y0 - svgT1 - svgH - 25} width={svgm + svgF} height={25} fill="rgba(14, 165, 233, 0.1)" stroke="#0ea5e9" strokeDasharray="4" strokeWidth="1" />
                                        <text x={x0 + svgC + svgG + (svgm+svgF)/2} y={y0 - svgT1 - svgH - 7} fill="#0369a1" fontSize="14" textAnchor="middle" fontWeight="bold">W8 (Surcharge)</text>
                                    </g>
                                )}

                                {/* Dimensions Bottom */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0} y1={y0 + 35} x2={x0 + svgB} y2={y0 + 35} />
                                    <line x1={x0} y1={y0 + 30} x2={x0} y2={y0 + 40} />
                                    {geom.C > 0 && <line x1={x0 + svgC} y1={y0 + 30} x2={x0 + svgC} y2={y0 + 40} />}
                                    <line x1={x0 + svgC + svgD} y1={y0 + 30} x2={x0 + svgC + svgD} y2={y0 + 40} />
                                    <line x1={x0 + svgB} y1={y0 + 30} x2={x0 + svgB} y2={y0 + 40} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="middle" fontFamily="sans-serif">
                                    {geom.C > 0 && <text x={x0 + svgC/2} y={y0 + 55}>C={geom.C}</text>}
                                    <text x={x0 + svgC + svgD/2} y={y0 + 55}>D={geom.D}</text>
                                    <text x={x0 + svgC + svgD + svgF/2} y={y0 + 55}>F={geom.F}</text>
                                </g>

                                {/* Dimensions Top */}
                                <g stroke="#64748b" strokeWidth="1">
                                    {geom.G > 0 && <line x1={x0 + svgC} y1={y0 - svgT1 - svgH - 40} x2={x0 + svgC + svgG} y2={y0 - svgT1 - svgH - 40} />}
                                    {calc.m > 0 && <line x1={x0 + svgC + svgG} y1={y0 - svgT1 - svgH - 40} x2={x0 + svgC + svgD} y2={y0 - svgT1 - svgH - 40} />}
                                    
                                    <line x1={x0 + svgC} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC} y2={y0 - svgT1 - svgH - 35} />
                                    {geom.G > 0 && <line x1={x0 + svgC + svgG} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC + svgG} y2={y0 - svgT1 - svgH - 35} />}
                                    {calc.m > 0 && <line x1={x0 + svgC + svgD} y1={y0 - svgT1 - svgH - 45} x2={x0 + svgC + svgD} y2={y0 - svgT1 - svgH - 35} />}
                                </g>
                                <g fill="#475569" fontSize="13" fontFamily="sans-serif">
                                    {geom.G > 0 && <text x={calc.m > 0 ? (x0 + svgC + svgG - 5) : (x0 + svgC + svgG/2)} y={y0 - svgT1 - svgH - 50} textAnchor={calc.m > 0 ? "end" : "middle"}>G={geom.G}</text>}
                                    {calc.m > 0 && <text x={geom.G > 0 ? (x0 + svgC + svgG + 5) : (x0 + svgC + svgD/2)} y={y0 - svgT1 - svgH - 50} textAnchor={geom.G > 0 ? "start" : "middle"}>m={calc.m.toFixed(2)}</text>}
                                </g>

                                {/* Dimensions Left */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0 - 35} y1={y0} x2={x0 - 35} y2={y0 - svgT1 - svgH} />
                                    <line x1={x0 - 40} y1={y0} x2={x0 - 30} y2={y0} />
                                    <line x1={x0 - 40} y1={y0 - svgT1} x2={x0 - 30} y2={y0 - svgT1} />
                                    <line x1={x0 - 40} y1={y0 - svgT1 - svgH} x2={x0 - 30} y2={y0 - svgT1 - svgH} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="end" dominantBaseline="middle" fontFamily="sans-serif">
                                    <text x={x0 - 45} y={y0 - svgT1/2}>T1={geom.T1}</text>
                                    <text x={x0 - 45} y={y0 - svgT1 - svgH/2}>H={geom.H}</text>
                                </g>

                                {/* Dimensions Right */}
                                <g stroke="#64748b" strokeWidth="1">
                                    <line x1={x0 + svgB + 20} y1={y0 - svgT1 - svgH} x2={x0 + svgB + 20} y2={y0 - svgT1} />
                                    <line x1={x0 + svgB + 15} y1={y0 - svgT1 - svgH} x2={x0 + svgB + 25} y2={y0 - svgT1 - svgH} />
                                    {calc.d3 > 0 && calc.d2 > 0 && <line x1={x0 + svgB + 15} y1={y0 - svgT1 - svgH + svgd2} x2={x0 + svgB + 25} y2={y0 - svgT1 - svgH + svgd2} />}
                                    <line x1={x0 + svgB + 15} y1={y0 - svgT1} x2={x0 + svgB + 25} y2={y0 - svgT1} />
                                </g>
                                <g fill="#475569" fontSize="13" textAnchor="start" dominantBaseline="middle" fontFamily="sans-serif">
                                    {calc.d2 > 0 && <text x={x0 + svgB + 30} y={y0 - svgT1 - svgH + svgd2/2}>d2={calc.d2.toFixed(2)}</text>}
                                    {calc.d3 > 0 && <text x={x0 + svgB + 30} y={y0 - svgT1 - svgH + svgd2 + svgd3/2}>d3={calc.d3.toFixed(2)}</text>}
                                </g>

                                <circle cx={x0} cy={y0} r="6" fill="#dc2626" />
                                <text x={x0 - 15} y={y0 + 15} fill="#dc2626" fontSize="14" fontWeight="bold" textAnchor="end">จุดหมุน Toe</text>
                            </svg>
                        </div>
                        
                    </div>
                </div>
                );
            };

            const TabStability = () => (
                <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm space-y-6 print:break-inside-avoid animate-[fadeIn_0.3s_ease-in-out]">
                    <h3 className="font-bold text-lg text-slate-700 border-b pb-2">ตรวจสอบเสถียรภาพ (Stability Checks)</h3>
                    
                    <div className="bg-sky-50 print:bg-white text-sky-800 print:text-slate-800 p-4 rounded-lg mb-6 text-sm font-medium grid grid-cols-2 md:grid-cols-5 print:grid-cols-5 gap-y-3 gap-x-4 border border-sky-100 print:border-slate-300 shadow-sm">
                        <div>&Sigma;M<Sub text="R"/> = {calc.MR.toFixed(2)} กก.-ม.</div>
                        <div>&Sigma;M<Sub text="O"/> = {calc.MO.toFixed(2)} กก.-ม.</div>
                        <div>&Sigma;V = {calc.sumV.toFixed(2)} กก.</div>
                        <div>&Sigma;P = {calc.sumP.toFixed(2)} กก.</div>
                        <div>f (แรงเสียดทาน) = {base.f.toFixed(2)}</div>
                    </div>

                    <StepBox title="1. ตรวจสอบการพลิกคว่ำ (Overturning)">
                        <div className="flex items-center space-x-4 mb-2">
                            <span>F.S.<Sub text="OT"/> = </span>
                            <Fraction top={<span>&Sigma;M<Sub text="R"/></span>} bottom={<span>&Sigma;M<Sub text="O"/></span>} />
                            <span>=</span>
                            <Fraction top={calc.MR.toFixed(2)} bottom={calc.MO.toFixed(2)} />
                            <span className="font-bold text-lg">= {calc.FS_ot.toFixed(2)}</span>
                        </div>
                        <div className="mt-3">
                            สรุป: {calc.FS_ot.toFixed(2)} {calc.FS_ot >= 1.5 ? <span className="text-emerald-600 font-bold">&ge; 1.50 (ผ่านเกณฑ์)</span> : <span className="text-rose-600 font-bold">{"<"} 1.50 (ไม่ผ่านเกณฑ์)</span>}
                        </div>
                        {pile.usePiles && calc.FS_ot < 1.5 && (
                            <div className="mt-2 text-indigo-600 text-sm">
                                *โมเมนต์ส่วนเกินที่ทำให้ไม่ผ่านเกณฑ์ จะถูกนำไปคำนวณในแรงถอน/แรงกดของเสาเข็ม
                            </div>
                        )}
                    </StepBox>

                    <StepBox title="2. ตรวจสอบการลื่นไถล (Sliding)">
                        <div className="flex items-center space-x-4 mb-2">
                            <span>F.S.<Sub text="Slide"/> = </span>
                            <Fraction top={<span>f &times; &Sigma;V</span>} bottom={<span>&Sigma;P</span>} />
                            <span>=</span>
                            <Fraction top={`${base.f} &times; ${calc.sumV.toFixed(2)}`} bottom={calc.sumP.toFixed(2)} />
                            <span className="font-bold text-lg">= {calc.FS_slide.toFixed(2)}</span>
                        </div>
                        <div className="mt-3">
                            สรุป: {calc.FS_slide.toFixed(2)} {calc.FS_slide >= 1.5 ? <span className="text-emerald-600 font-bold">&ge; 1.50 (ผ่านเกณฑ์)</span> : <span className="text-rose-600 font-bold">{"<"} 1.50 (ไม่ผ่านเกณฑ์)</span>}
                        </div>
                        {pile.usePiles && pile.designMode === 'full' && (
                            <div className="mt-2 text-indigo-600 text-sm">
                                *เนื่องจากเลือกสมมติฐาน Full Load แรงผลักด้านข้างทั้งหมดจะถูกรับด้วยแรงเฉือนของเสาเข็ม
                            </div>
                        )}
                    </StepBox>
                </div>
            );

            const TabBearing = () => (
